<!DOCTYPE html>
<html lang="tg" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Китобхона</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-soft: #1e3a8a40;
  --bg: #0b1220;
  --bg-2: #0f172a;
  --card: #131c2e;
  --card-2: #1a2540;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --border: #1e293b;
  --hl-yellow: rgba(255, 220, 40, .55);
  --hl-orange: rgba(255, 140, 40, .85);
}
[data-theme="light"] {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-soft: #eff6ff;
  --bg: #f8fafc;
  --bg-2: #f1f5f9;
  --card: #ffffff;
  --card-2: #f8fafc;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;overscroll-behavior-y:contain;}
body{font-family:'Inter',sans-serif;color:var(--text);font-size:14px;line-height:1.5;}

#app{display:flex;flex-direction:column;height:100dvh;background:var(--bg);}

.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,0) 0 0 0;flex-shrink:0;z-index:50;}
.hdr-row{display:flex;align-items:center;padding:10px 12px;gap:8px;}
.logo-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#60a5fa);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;padding:8px 12px 8px 36px;background:var(--bg-2);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px;outline:none;font-family:inherit;}
.search-wrap input:focus{border-color:var(--primary);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;pointer-events:none;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.icon-btn:active{background:var(--primary-soft);transform:scale(.95);}

.cats-row{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none;}
.cats-row::-webkit-scrollbar{display:none;}
.cat-chip{padding:8px 14px;background:transparent;border:none;color:var(--text-muted);white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;font-family:inherit;}
.cat-chip.on{color:var(--primary);border-bottom-color:var(--primary);}

.subs-row{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none;flex-shrink:0;}
.subs-row::-webkit-scrollbar{display:none;}
.sub-chip{padding:6px 14px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:16px;white-space:nowrap;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;}
.sub-chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}

.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0));overscroll-behavior:contain;}
.scroll-area::-webkit-scrollbar{width:3px;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.last-read{margin-bottom:14px;}
.last-read-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
.last-read-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
.last-read-clear{background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;font-family:inherit;text-decoration:underline;}
.last-read-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.last-read-scroll::-webkit-scrollbar{display:none;}
.lri{flex-shrink:0;width:160px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.lri:active{transform:scale(.98);}
.lri-cover{width:38px;height:50px;border-radius:5px;flex-shrink:0;background:linear-gradient(135deg,var(--c1,#2563eb),var(--c2,#3b82f6));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;overflow:hidden;}
.lri-cover img{width:100%;height:100%;object-fit:cover;}
.lri-info{flex:1;min-width:0;}
.lri-name{font-size:11px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lri-progress{height:3px;background:var(--bg-2);border-radius:2px;margin-top:4px;overflow:hidden;}
.lri-progress-fill{height:100%;background:var(--primary);border-radius:2px;}
.lri-meta{font-size:10px;color:var(--text-muted);margin-top:2px;}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px;}
.section-title{font-size:16px;font-weight:700;color:var(--text);}
.section-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

.books-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(min-width:480px){.books-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:680px){.books-grid{grid-template-columns:repeat(5,1fr);}}
@media(min-width:900px){.books-grid{grid-template-columns:repeat(6,1fr);}}

.book{cursor:pointer;position:relative;}
.book:active{transform:scale(.96);}
.book-cover{position:relative;width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,var(--c1,#2563eb),var(--c2,#3b82f6));border-radius:6px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:8px;}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px;}
.book-cover-text{color:#fff;font-size:10px;font-weight:700;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.book-name{font-size:10px;color:var(--text);margin-top:5px;text-align:center;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;}
.book-actions{display:flex;gap:3px;margin-top:5px;}
.book-btn{flex:1;padding:5px;border-radius:4px;border:none;font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;}
.book-btn.read{background:var(--primary);color:#fff;}
.book-btn.dl{background:var(--bg-2);color:var(--text);border:1px solid var(--border);}

.shimmer{background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite;}
@keyframes sh{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--text-muted);}
.empty-icon{font-size:48px;margin-bottom:10px;opacity:.6;}
.empty-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}
.empty-sub{font-size:12px;}

.bg-prog{height:2px;background:transparent;overflow:hidden;flex-shrink:0;position:relative;}
.bg-prog.on::after{content:'';position:absolute;left:0;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--primary),transparent);animation:bgl 1.2s linear infinite;}
@keyframes bgl{0%{transform:translateX(-100%);}100%{transform:translateX(450%);}}

.dl-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;}
.dl-overlay.on{display:flex;}
.dl-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:340px;padding:22px;text-align:center;}
.dl-icon{font-size:42px;margin-bottom:8px;}
.dl-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text);}
.dl-name{font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.4;}
.dl-bar{width:100%;height:8px;background:var(--bg-2);border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.dl-fill{height:100%;background:linear-gradient(90deg,var(--primary),#60a5fa);border-radius:5px;width:0;transition:width .2s;}
.dl-pct{font-size:13px;font-weight:700;color:var(--primary);margin-top:8px;}
.dl-status{font-size:11px;color:var(--text-muted);margin-top:3px;}
.dl-cancel{margin-top:14px;padding:9px 18px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;}

.reader{position:fixed;inset:0;z-index:100;background:#0a0a0a;display:none;flex-direction:column;}
.reader.on{display:flex;}
.reader-hdr{background:rgba(20,20,28,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);padding:env(safe-area-inset-top,0) 8px 8px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;z-index:5;}
.reader-hdr .r-btn{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.reader-hdr .r-btn:active{background:rgba(255,255,255,.15);}
.reader-title{flex:1;color:#ddd;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reader-area{flex:1;overflow:hidden;background:#1a1a1a;position:relative;touch-action:none;}
.reader-area.light{background:#e8e0d4;}
.slider{position:absolute;inset:0;display:flex;will-change:transform;}
.slide{flex-shrink:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:4px;}
.slide canvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.7);}
.tap-l,.tap-r{position:absolute;top:0;bottom:0;width:25%;z-index:2;cursor:pointer;}
.tap-l{left:0;}.tap-r{right:0;}
.hl-layer{position:absolute;pointer-events:none;z-index:3;}
.hl-box{position:absolute;background:var(--hl-yellow);border-radius:1px;}
.hl-box.curr{background:var(--hl-orange);outline:2px solid #ff8c28;outline-offset:-1px;}
.reader-foot{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:rgba(15,15,20,.92);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:6px 8px;display:flex;align-items:center;gap:4px;z-index:6;transition:opacity .25s,transform .25s;}
.reader-foot.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px);}
.page-info{font-size:12px;color:#fff;padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;font-weight:600;cursor:pointer;min-width:60px;text-align:center;font-family:inherit;}
.z-btn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.find-bar{position:absolute;top:calc(60px + env(safe-area-inset-top,0));left:8px;right:8px;background:rgba(20,20,28,.96);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;display:none;align-items:center;gap:6px;z-index:7;}
.find-bar.on{display:flex;}
.find-bar input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:6px;padding:7px 10px;font-size:13px;outline:none;font-family:inherit;min-width:0;}
.find-count{font-size:11px;color:#bbb;min-width:50px;text-align:center;font-weight:600;}
.find-btn{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.find-btn:disabled{opacity:.3;}

.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.on{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:340px;padding:22px;text-align:center;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text);}
.modal-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.4;}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.modal-btn{flex:1;padding:9px;border-radius:8px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.modal-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.jump-input{width:100%;padding:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:20px;font-weight:700;text-align:center;outline:none;font-family:inherit;}

.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1e40af,#3b82f6,#0ea5e9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
.splash.gone{opacity:0;pointer-events:none;transition:opacity .4s;}
.splash-logo{width:74px;height:74px;background:rgba(255,255,255,.18);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:18px;animation:float 2.5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.splash h1{font-size:24px;letter-spacing:3px;font-weight:800;margin-bottom:4px;}
.splash p{font-size:11px;opacity:.85;letter-spacing:2px;}
.splash-bar{margin-top:22px;width:100px;height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
.splash-fill{height:100%;background:#fff;width:0;animation:fillb 1.4s ease forwards .2s;}
@keyframes fillb{to{width:100%;}}

.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%) translateY(15px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;z-index:300;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);transition:opacity .2s,transform .2s;}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-logo">📚</div>
  <h1>КИТОБХОНА</h1>
  <p>ГАНҶИНАИ ДОНИШ</p>
  <div class="splash-bar"><div class="splash-fill"></div></div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-row">
      <div class="logo-icon">📚</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Ҷустуҷӯ..." inputmode="search">
      </div>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
    <div class="cats-row" id="catsRow"></div>
  </div>
  <div class="subs-row" id="subsRow"></div>
  <div class="bg-prog" id="bgProg"></div>

  <div class="scroll-area" id="scrollArea">
    <div class="last-read" id="lastRead" style="display:none;">
      <div class="last-read-head">
        <div class="last-read-title">🕘 Охирин хонда</div>
        <button class="last-read-clear" onclick="clearLastRead()">Тоза кардан</button>
      </div>
      <div class="last-read-scroll" id="lastReadScroll"></div>
    </div>

    <div class="section-head">
      <div>
        <div class="section-title" id="secTitle">—</div>
        <div class="section-sub" id="secSub"></div>
      </div>
    </div>

    <div class="books-grid" id="grid"></div>
  </div>
</div>

<div class="dl-overlay" id="dlOverlay">
  <div class="dl-modal">
    <div class="dl-icon">📥</div>
    <div class="dl-title" id="dlTitle">Бор кардан</div>
    <div class="dl-name" id="dlName">—</div>
    <div class="dl-bar"><div class="dl-fill" id="dlFill"></div></div>
    <div class="dl-pct" id="dlPct">0%</div>
    <div class="dl-status" id="dlStatus">Пайвастшавӣ...</div>
    <button class="dl-cancel" onclick="cancelDl()">Бекор</button>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-hdr">
    <button class="r-btn" onclick="closeReader()">←</button>
    <div class="reader-title" id="rdrTitle">—</div>
    <button class="r-btn" onclick="toggleFind()">🔍</button>
    <button class="r-btn" id="lightBtn" onclick="toggleLight()">☀️</button>
    <button class="r-btn" onclick="downloadCurrent()">⬇</button>
  </div>
  <div class="reader-area" id="rdrArea">
    <div class="slider" id="slider"></div>
    <div class="hl-layer" id="hlLayer"></div>
    <div class="tap-l" id="tapL"></div>
    <div class="tap-r" id="tapR"></div>
    <div class="find-bar" id="findBar">
      <input type="text" id="findInp" placeholder="Калима..." inputmode="search">
      <span class="find-count" id="findCnt">0/0</span>
      <button class="find-btn" onclick="findStep(-1)">↑</button>
      <button class="find-btn" onclick="findStep(1)">↓</button>
      <button class="find-btn" onclick="closeFind()">✕</button>
    </div>
  </div>
  <div class="reader-foot" id="foot">
    <button class="z-btn" onclick="changeZoom(-0.2)">−</button>
    <button class="page-info" id="pageInfo" onclick="openJump()">— / —</button>
    <button class="z-btn" onclick="changeZoom(0.2)">+</button>
  </div>
</div>

<div class="modal-bg" id="jumpModal">
  <div class="modal">
    <h3>Гузаштан ба саҳифа</h3>
    <div class="modal-sub" id="jumpSub">1 — 100</div>
    <input type="number" class="jump-input" id="jumpInp" placeholder="№" inputmode="numeric" min="1">
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeJump()">Бекор</button>
      <button class="modal-btn primary" onclick="doJump()">Гузаштан</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">—</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'.replace('pdf.min.js','pdf.worker.min.js');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

setTimeout(()=>{const s=document.getElementById('splash');s.classList.add('gone');setTimeout(()=>s.remove(),420);},900);
const T=localStorage.getItem('kk_theme')||'dark';
document.documentElement.setAttribute('data-theme',T);
document.getElementById('themeBtn').textContent=T==='dark'?'🌙':'☀️';
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('kk_theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'🌙':'☀️';}

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,ms=2200){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),ms);}
const DPR=Math.min(window.devicePixelRatio||1,2.5);

// ───── State ─────
let CATS=[],REPO='sharipovip/books',BRANCH='main';
const S={
  cat:null,sub:null,
  books:new Map(),
  blobs:new Map(),
  covers:new Map(),
  pdf:null,page:1,pages:0,zoom:1,key:null,url:null,light:false,
  findQ:'',findHits:[],findCurr:-1,
  abort:null
};

// ───── IndexedDB ─────
const DB='kk_v8';let dbP=null;
function db(){if(dbP)return dbP;dbP=new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{const d=e.target.result;['pdfs','covers','json','lists'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n);});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbP;}
async function idbG(s,k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(s,'readonly');const r=t.objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbS(s,k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

// ───── Load books.json ─────
async function loadBooksJson(){
  let cached=null;
  try{cached=await idbG('json','books');}catch(e){}
  if(cached){parseCats(cached);refreshBooksJson();return true;}
  try{
    const r=await fetch('books.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();
    parseCats(d);
    try{await idbS('json','books',d);}catch(e){}
    return true;
  }catch(e){
    $('grid').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Интернет лозим</div></div>';
    return false;
  }
}
async function refreshBooksJson(){
  try{
    const r=await fetch('books.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    const oldStr=JSON.stringify(CATS);
    parseCats(d);
    if(oldStr!==JSON.stringify(CATS)){
      try{await idbS('json','books',d);}catch(e){}
      renderCats();renderSubs();
      if(S.sub)loadSub(S.sub.id);
    }
  }catch(e){}
}
function parseCats(d){
  REPO=d.repo||'sharipovip/books';
  BRANCH=d.branch||'main';
  const arr=d.categories||d;
  arr.forEach(c=>{
    c.c1=c.color1||'#2563eb';c.c2=c.color2||'#3b82f6';c.subs=c.subs||[];
  });
  CATS=arr;
}

// ⭐ ГЛАВНАЯ ЛОГИКА — читаем manifest.json из папки
async function loadSub(id){
  const sub=S.cat.subs.find(s=>s.id===id);if(!sub)return;

  if(S.books.has(id)){renderBooks(id);return;}
  if(!sub.folder){S.books.set(id,[]);renderBooks(id);return;}

  // IDB cache — мгновенно
  let cachedList=null;
  try{cachedList=await idbG('lists',sub.folder);}catch(e){}
  if(cachedList&&cachedList.books){
    S.books.set(id,cachedList.books);
    renderSubs();renderBooks(id);
    if(navigator.onLine)fetchManifest(sub,id,true);
    return;
  }

  showPlaceholders(6);
  $('bgProg').classList.add('on');
  try{
    await fetchManifest(sub,id,false);
  }catch(e){
    if(S.sub?.id===id){
      $('grid').innerHTML=`<div class="empty"><div class="empty-icon">📡</div><div class="empty-title">Хатогии шабака</div><div class="empty-sub">${esc(e.message||'')}</div><button class="modal-btn primary" style="margin-top:14px;max-width:160px;" onclick="loadSub('${id}')">🔄 Бори дигар</button></div>`;
    }
  }finally{$('bgProg').classList.remove('on');}
}

async function fetchManifest(sub,id,silent){
  const url=`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(sub.folder)}/manifest.json?t=${Date.now()}`;
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok){
    if(r.status===404){
      throw new Error('Айни ҳол китобҳо ёфт нашуданд дар папкаи'+sub.folder);
    }
    throw new Error('HTTP '+r.status);
  }
  const data=await r.json();
  if(!Array.isArray(data.books))throw new Error('Бад формат manifest');
  // Convert relative file -> full URL
  const books=data.books.map(b=>({
    name:b.name||b.file?.replace(/\.pdf$/i,''),
    file:b.file||(b.name+'.pdf'),
    url:`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(sub.folder)}/${encodeURIComponent(b.file||(b.name+'.pdf'))}`,
    size:b.size||0,
    cover:b.cover // optional, can be base64 or URL
  }));
  S.books.set(id,books);
  try{await idbS('lists',sub.folder,{books,ts:Date.now()});}catch(e){}
  if(S.sub?.id===id){
    renderSubs();renderBooks(id);
    if(silent)toast('✓ Навсозӣ шуд',1500);
  }
}

    d.innerHTML='<div class="book-cover shimmer"></div><div class="shimmer" style="height:10px;border-radius:3px;margin-top:6px;width:80%;margin-left:auto;margin-right:auto;"></div>';
    g.appendChild(d);

}

// ───── RENDER BOOKS ─────
function renderBooks(id){
  const g=$('grid');g.innerHTML='';
  const books=S.books.get(id)||[];
  $('secTitle').textContent=S.cat.name;
  $('secSub').textContent=`${S.sub.name} · ${books.length} китоб`;
  if(!books.length){
    g.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Китобе нест</div></div>';
    return;
  }
  books.forEach(b=>{
    const key=id+':'+b.name;
    const d=document.createElement('div');d.className='book';d.dataset.key=key;
    const safe='cv_'+key.replace(/[^a-z0-9]/gi,'_');
    const coverHtml=b.cover?`<img src="${b.cover}" alt="" loading="lazy">`:`<div class="book-cover-text">${esc(b.name)}</div>`;
    d.innerHTML=`
      <div class="book-cover" id="${safe}" style="--c1:${S.cat.c1};--c2:${S.cat.c2};${b.cover?'padding:0;':''}">${coverHtml}</div>
      <div class="book-name">${esc(b.name)}</div>
      <div class="book-actions">
        <button class="book-btn read" data-act="read">📖 Хондан</button>
        <button class="book-btn dl" data-act="dl">⬇</button>
      </div>`;
    d.querySelector('[data-act="read"]').onclick=e=>{e.stopPropagation();openBook(b.url,b.name,key);};
    d.querySelector('[data-act="dl"]').onclick=e=>{e.stopPropagation();downloadBook(b.url,b.name);};
    g.appendChild(d);
    if(!b.cover)setCoverFromCache(b.url,safe);
  });
  renderLastRead();
}

async function setCoverFromCache(url,safe){
  if(S.covers.has(url)){setCv(safe,S.covers.get(url));return;}
  try{
    const c=await idbG('covers',url);
    if(c){S.covers.set(url,c);setCv(safe,c);return;}
  }catch(e){}
  let blob=S.blobs.get(url);
  if(!blob){try{blob=await idbG('pdfs',url);if(blob)S.blobs.set(url,blob);}catch(e){}}
  if(!blob)return;
  generateCover(url,safe,blob);
}
async function generateCover(url,safe,blob){
  try{
    const ab=await blob.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab,disableAutoFetch:true,disableStream:true}).promise;
    const p=await pdf.getPage(1);
    const vp=p.getViewport({scale:0.5});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const dataUrl=cv.toDataURL('image/jpeg',0.7);
    S.covers.set(url,dataUrl);
    try{await idbS('covers',url,dataUrl);}catch(e){}
    setCv(safe,dataUrl);
    try{pdf.destroy();}catch(e){}
  }catch(e){}
}
function setCv(safe,url){
  const el=$(safe);if(!el)return;
  el.innerHTML=`<img src="${url}" alt="" loading="lazy">`;
  el.style.padding='0';
}

async function ensureBlob(url,name){
  let b=S.blobs.get(url);
  if(b)return b;
  try{b=await idbG('pdfs',url);if(b){S.blobs.set(url,b);return b;}}catch(e){}
  showDl(name);
  try{
    b=await fetchPdf(url);
    hideDl();
    S.blobs.set(url,b);
    try{await idbS('pdfs',url,b);}catch(e){}
    return b;
  }catch(e){
    hideDl();
    if(e.name!=='AbortError')toast('Хатогии шабака');
    return null;
  }
}

async function fetchPdf(url){
  const ctrl=new AbortController();S.abort=ctrl;
  const resp=await fetch(url,{signal:ctrl.signal});
  if(!resp.ok)throw new Error('HTTP '+resp.status);
  const total=+resp.headers.get('Content-Length')||0;
  const rdr=resp.body.getReader();const chunks=[];let rcv=0;
  while(true){
    const {done,value}=await rdr.read();if(done)break;
    chunks.push(value);rcv+=value.length;
    if(total){const p=Math.round(rcv/total*99);$('dlFill').style.width=p+'%';$('dlPct').textContent=p+'%';$('dlStatus').textContent=`${(rcv/1048576).toFixed(1)}/${(total/1048576).toFixed(1)} MB`;}
    else $('dlPct').textContent=`${(rcv/1048576).toFixed(1)} MB`;
  }
  const ab=new Uint8Array(rcv);let off=0;for(const c of chunks){ab.set(c,off);off+=c.length;}
  $('dlFill').style.width='100%';$('dlPct').textContent='100%';
  return new Blob([ab],{type:'application/pdf'});
}

async function openBook(url,name,key){
  const blob=await ensureBlob(url,name);
  if(!blob)return;
  $('reader').classList.add('on');
  $('rdrTitle').textContent=name;
  S.key=key||name;S.url=url;S.zoom=1;S.light=false;
  $('rdrArea').classList.remove('light');
  $('lightBtn').textContent='☀️';
  clearFind();
  try{
    if(S.pdf){try{S.pdf.destroy();}catch(e){}S.pdf=null;}
    const ab=await blob.arrayBuffer();
    S.pdf=await pdfjsLib.getDocument({data:ab}).promise;
    S.pages=S.pdf.numPages;
    const sp=getProgress(S.key);
    S.page=sp?Math.min(sp.page,S.pages):1;
    await renderPage(S.page);
    saveProgress();
    showFoot();
    if(!S.covers.has(url)){
      const safe='cv_'+(key||name).replace(/[^a-z0-9]/gi,'_');
      generateCover(url,safe,blob);
    }
  }catch(e){toast('Хатогӣ');closeReader();}
}

function closeReader(){
  saveProgress();
  $('reader').classList.remove('on');
  if(S.pdf){try{S.pdf.destroy();}catch(e){}S.pdf=null;}
  S.key=null;S.url=null;closeFind();renderLastRead();
}

async function downloadBook(url,name){
  const blob=await ensureBlob(url,name);
  if(!blob)return;
  const fn=name+'.pdf';
  const blobUrl=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=blobUrl;a.download=fn;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(blobUrl);},2000);
  toast(`✓ «${fn}» дар Downloads/ сабт шуд`,3500);
}
function downloadCurrent(){if(S.url){const n=$('rdrTitle').textContent;downloadBook(S.url,n);}}

const slider=$('slider');
async function renderPage(n){
  if(!S.pdf)return;
  const area=$('rdrArea');
  const p=await S.pdf.getPage(n);
  const aw=area.clientWidth-8,ah=area.clientHeight-8;
  const nat=p.getViewport({scale:1});
  const fit=Math.min(aw/nat.width,ah/nat.height)*S.zoom;
  const scale=fit*DPR;
  const vp=p.getViewport({scale});
  const cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;
  cv.style.width=(vp.width/DPR)+'px';
  cv.style.height=(vp.height/DPR)+'px';
  const ctx=cv.getContext('2d',{alpha:false});
  if(S.light){ctx.fillStyle='#fff';ctx.fillRect(0,0,vp.width,vp.height);}
  await p.render({canvasContext:ctx,viewport:vp}).promise;
  slider.innerHTML='';
  const sl=document.createElement('div');sl.className='slide';
  sl.appendChild(cv);
  slider.appendChild(sl);
  slider.style.transform='translateX(0)';
  S.page=n;
  $('pageInfo').textContent=`${n} / ${S.pages}`;
  if(S.findQ)renderFindHl(n);
  saveProgress();
}

function turnPage(dir){
  const np=S.page+dir;
  if(np<1||np>S.pages)return;
  animateSlide(dir).then(()=>renderPage(np));
}
async function animateSlide(dir){
  if(!slider.firstChild)return;
  const w=$('rdrArea').clientWidth;
  return new Promise(res=>{
    slider.style.transition='transform .28s ease-out';
    slider.style.transform=`translateX(${-dir*w}px)`;
    setTimeout(()=>{slider.style.transition='';res();},290);
  });
}

(function initGestures(){
  const area=$('rdrArea');
  let sx=0,sy=0,dragging=false,t0=0,moved=false;
  area.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();moved=false;dragging=true;
    slider.style.transition='';
  },{passive:true});
  area.addEventListener('touchmove',e=>{
    if(!dragging||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)>8||Math.abs(dy)>8)moved=true;
    if(Math.abs(dx)>Math.abs(dy)){
      slider.style.transform=`translateX(${dx}px)`;
    }
  },{passive:true});
  area.addEventListener('touchend',e=>{
    if(!dragging)return;dragging=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy;
    const dt=Date.now()-t0;
    const w=area.clientWidth;
    if(!moved && dt<280){
      if(t.clientX<w*0.25)turnPage(-1);
      else if(t.clientX>w*0.75)turnPage(1);
      else toggleFoot();
      slider.style.transform='translateX(0)';return;
    }
    if(Math.abs(dx)>w*0.25 || (Math.abs(dx)>50 && dt<300)){
      if(dx<0 && S.page<S.pages){turnPage(1);return;}
      if(dx>0 && S.page>1){turnPage(-1);return;}
    }
    slider.style.transition='transform .2s ease-out';
    slider.style.transform='translateX(0)';
  },{passive:true});
  let md=false;
  area.addEventListener('mousedown',e=>{md=true;sx=e.clientX;sy=e.clientY;t0=Date.now();moved=false;});
  window.addEventListener('mousemove',e=>{if(!md)return;const dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;slider.style.transform=`translateX(${dx}px)`;});
  window.addEventListener('mouseup',e=>{
    if(!md)return;md=false;
    const dx=e.clientX-sx,dt=Date.now()-t0;const w=area.clientWidth;
    if(!moved&&dt<280){
      if(e.clientX-area.getBoundingClientRect().left<w*0.25)turnPage(-1);
      else if(e.clientX-area.getBoundingClientRect().left>w*0.75)turnPage(1);
      else toggleFoot();
      slider.style.transform='translateX(0)';return;
    }
    if(Math.abs(dx)>w*0.25){
      if(dx<0&&S.page<S.pages)return turnPage(1);
      if(dx>0&&S.page>1)return turnPage(-1);
    }
    slider.style.transition='transform .2s';slider.style.transform='translateX(0)';
  });
  window.addEventListener('resize',()=>{if(S.pdf&&$('reader').classList.contains('on'))renderPage(S.page);});
  document.addEventListener('keydown',e=>{
    if(!$('reader').classList.contains('on'))return;
    if(e.target.tagName==='INPUT')return;
    if(e.key==='ArrowRight')turnPage(1);
    else if(e.key==='ArrowLeft')turnPage(-1);
    else if(e.key==='Escape')closeReader();
  });
})();

let footTimer;
function showFoot(){$('foot').classList.remove('hide');clearTimeout(footTimer);footTimer=setTimeout(()=>$('foot').classList.add('hide'),3500);}
function toggleFoot(){$('foot').classList.toggle('hide');if(!$('foot').classList.contains('hide'))showFoot();}
function changeZoom(d){S.zoom=Math.max(0.5,Math.min(3.5,S.zoom+d));renderPage(S.page);showFoot();}
function toggleLight(){S.light=!S.light;$('rdrArea').classList.toggle('light',S.light);$('lightBtn').textContent=S.light?'🌙':'☀️';renderPage(S.page);}

function openJump(){
  if(!S.pdf||!S.pages){toast('Аввал китобро кушоед');return;}
  $('jumpSub').textContent=`1 — ${S.pages}`;
  $('jumpInp').value=S.page;
  $('jumpInp').max=S.pages;
  $('jumpInp').min=1;
  $('jumpModal').classList.add('on');
  setTimeout(()=>{
    const inp=$('jumpInp');
    inp.focus();inp.select();
    inp.onkeydown=function(e){
      if(e.key==='Enter'){e.preventDefault();doJump();}
      else if(e.key==='Escape'){e.preventDefault();closeJump();}

}
function closeJump(){$('jumpModal').classList.remove('on');}
async function doJump(){
  const v=parseInt($('jumpInp').value,10);
  if(isNaN(v)||v<1||v>S.pages){toast(`Рақамро аз 1 то ${S.pages} ворид кунед`,3000);return;}
  closeJump();
  if(v!==S.page)await renderPage(v);

}

let findT;
function toggleFind(){const b=$('findBar');if(b.classList.contains('on'))closeFind();else openFind();}
function openFind(){$('findBar').classList.add('on');setTimeout(()=>$('findInp').focus(),80);}
function closeFind(){$('findBar').classList.remove('on');}
function clearFind(){S.findQ='';S.findHits=[];S.findCurr=-1;$('findCnt').textContent='0/0';$('findInp').value='';$('hlLayer').innerHTML='';}
$('findInp')?.addEventListener('input',e=>{clearTimeout(findT);findT=setTimeout(()=>runFind(e.target.value.trim()),300);});

async function runFind(q){
  $('hlLayer').innerHTML='';
  if(!q||!S.pdf){clearFind();return;}
  S.findQ=q;$('findCnt').textContent='...';
  const lq=q.toLowerCase();const hits=[];
  for(let p=1;p<=S.pages;p++){
    try{
      const pg=await S.pdf.getPage(p);
      const tc=await pg.getTextContent();
      tc.items.forEach((it,idx)=>{
        if(!it.str)return;
        const s=it.str.toLowerCase();let f=0;
        while((f=s.indexOf(lq,f))!==-1){hits.push({page:p,itemIdx:idx,charStart:f,charEnd:f+lq.length});f+=lq.length;}
      });
      if(p%5===0)$('findCnt').textContent=`…${hits.length}`;
    }catch(e){}
  }
  S.findHits=hits;
  if(!hits.length){$('findCnt').textContent='0/0';toast('Ёфт нашуд');return;}
  let i=hits.findIndex(h=>h.page===S.page);if(i<0)i=0;
  await goHit(i);
}
async function goHit(i){
  if(!S.findHits.length)return;
  i=(i+S.findHits.length)%S.findHits.length;S.findCurr=i;
  const h=S.findHits[i];
  $('findCnt').textContent=`${i+1}/${S.findHits.length}`;
  if(S.page!==h.page)await renderPage(h.page);
  renderFindHl(h.page);
}
async function findStep(d){if(S.findHits.length)await goHit(S.findCurr+d);}
async function renderFindHl(pn){
  const l=$('hlLayer');l.innerHTML='';
  if(!S.findQ)return;
  try{
    const p=await S.pdf.getPage(pn);
    const tc=await p.getTextContent();
    const area=$('rdrArea');
    const cv=slider.querySelector('canvas');if(!cv)return;
    const aw=area.clientWidth-8,ah=area.clientHeight-8;
    const nat=p.getViewport({scale:1});
    const fit=Math.min(aw/nat.width,ah/nat.height)*S.zoom;
    const vp=p.getViewport({scale:fit});
    const r=cv.getBoundingClientRect(),pr=area.getBoundingClientRect();
    l.style.left=(r.left-pr.left)+'px';l.style.top=(r.top-pr.top)+'px';
    l.style.width=r.width+'px';l.style.height=r.height+'px';
    const hits=S.findHits.filter(h=>h.page===pn);
    hits.forEach(h=>{
      const it=tc.items[h.itemIdx];if(!it)return;
      const lq=S.findQ.toLowerCase();const s=it.str.toLowerCase();
      if(s.indexOf(lq,h.charStart)!==h.charStart)return;
      const tx=pdfjsLib.Util.transform(vp.transform,it.transform);
      const fs=Math.hypot(tx[2],tx[3]);
      const tw=it.width*fit,x=tx[4],y=tx[5]-fs;
      const fr=h.charStart/Math.max(1,it.str.length);
      const wfr=(h.charEnd-h.charStart)/Math.max(1,it.str.length);
      const b=document.createElement('div');b.className='hl-box';
      if(S.findHits[S.findCurr]===h)b.classList.add('curr');
      b.style.left=(x+fr*tw)+'px';b.style.top=y+'px';
      b.style.width=(tw*wfr)+'px';b.style.height=(fs*1.18)+'px';
      l.appendChild(b);
    });
  }catch(e){}
}

function getProgress(k){try{const a=JSON.parse(localStorage.getItem('kk_prog')||'{}');return a[k];}catch(e){return null;}}
function saveProgress(){
  if(!S.key||!S.pages)return;
  try{
    const a=JSON.parse(localStorage.getItem('kk_prog')||'{}');
    a[S.key]={page:S.page,pages:S.pages,url:S.url,ts:Date.now()};
    localStorage.setItem('kk_prog',JSON.stringify(a));
    let l=JSON.parse(localStorage.getItem('kk_last')||'[]');
    l=l.filter(x=>x!==S.key);l.unshift(S.key);if(l.length>8)l=l.slice(0,8);
    localStorage.setItem('kk_last',JSON.stringify(l));
  }catch(e){}
}
function renderLastRead(){
  const sec=$('lastRead');const wrap=$('lastReadScroll');
  let l=[];try{l=JSON.parse(localStorage.getItem('kk_last')||'[]');}catch(e){}
  if(!l.length){sec.style.display='none';return;}
  const prog=(()=>{try{return JSON.parse(localStorage.getItem('kk_prog')||'{}');}catch(e){return {};}})();
  wrap.innerHTML='';let vis=0;
  for(const k of l){
    const i=k.indexOf(':');if(i<0)continue;
    const subId=k.slice(0,i),name=k.slice(i+1);
    let cat=null,sub=null;
    for(const c of CATS){const s=c.subs.find(x=>x.id===subId);if(s){cat=c;sub=s;break;}}
    if(!cat)continue;
    const p=prog[k];const pct=(p&&p.pages)?Math.round(p.page/p.pages*100):0;
    const url=p?.url;
    const cov=url?S.covers.get(url):null;
    const d=document.createElement('div');d.className='lri';
    d.innerHTML=`<div class="lri-cover" style="--c1:${cat.c1};--c2:${cat.c2};">${cov?`<img src="${cov}">`:'📖'}</div><div class="lri-info"><div class="lri-name">${esc(name)}</div><div class="lri-progress"><div class="lri-progress-fill" style="width:${pct}%;"></div></div><div class="lri-meta">${p?p.page+'/'+p.pages:'·'}</div></div>`;
    d.onclick=()=>{if(url)openBook(url,name,k);};
    wrap.appendChild(d);vis++;
  }
  sec.style.display=vis?'block':'none';
}
function clearLastRead(){if(confirm('Тоза кардан?')){localStorage.removeItem('kk_last');localStorage.removeItem('kk_prog');renderLastRead();}}

let gST;
$('search').addEventListener('input',e=>{clearTimeout(gST);gST=setTimeout(()=>doSearch(e.target.value.trim().toLowerCase()),200);});
function doSearch(q){
  if(!q){if(S.sub)renderBooks(S.sub.id);return;}
  const hits=[];
  for(const c of CATS)for(const sub of c.subs){
    const bs=S.books.get(sub.id);if(!bs)continue;
    for(const b of bs)if(b.name.toLowerCase().includes(q))hits.push({c,sub,b});
  }
  $('secTitle').textContent='Натиҷаҳо';$('secSub').textContent=`«${q}» · ${hits.length}`;
  const g=$('grid');g.innerHTML='';
  if(!hits.length){g.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Ёфт нашуд</div></div>';return;}
  hits.forEach(({c,sub,b})=>{
    const key=sub.id+':'+b.name;
    const d=document.createElement('div');d.className='book';
    const safe='cv_'+key.replace(/[^a-z0-9]/gi,'_');
    const coverHtml=b.cover?`<img src="${b.cover}" alt="" loading="lazy">`:`<div class="book-cover-text">${esc(b.name)}</div>`;
    d.innerHTML=`<div class="book-cover" id="${safe}" style="--c1:${c.c1};--c2:${c.c2};${b.cover?'padding:0;':''}">${coverHtml}</div><div class="book-name">${esc(b.name)}</div><div class="book-actions"><button class="book-btn read" data-act="read">📖 Хондан</button><button class="book-btn dl" data-act="dl">⬇</button></div>`;
    d.querySelector('[data-act="read"]').onclick=e=>{e.stopPropagation();openBook(b.url,b.name,key);};
    d.querySelector('[data-act="dl"]').onclick=e=>{e.stopPropagation();downloadBook(b.url,b.name);};
    g.appendChild(d);
    if(!b.cover)setCoverFromCache(b.url,safe);
  });
}

function showDl(name){$('dlTitle').textContent='Бор кардан';$('dlName').textContent=name;$('dlFill').style.width='0';$('dlPct').textContent='0%';$('dlStatus').textContent='Пайвастшавӣ...';$('dlOverlay').classList.add('on');}
function hideDl(){$('dlOverlay').classList.remove('on');}
function cancelDl(){if(S.abort)try{S.abort.abort();}catch(e){}hideDl();toast('Бекор шуд');}

(async()=>{
  if(!await loadBooksJson())return;
  S.cat=CATS[0];S.sub=CATS[0].subs[0];
  renderCats();renderSubs();
  $('secTitle').textContent=S.cat.name;$('secSub').textContent=S.sub?.name||'';
  renderLastRead();
  if(S.sub)loadSub(S.sub.id);
})();

window.addEventListener('beforeunload',saveProgress);
</script>
</body>
