<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080F20">
<title>Китобхона — Ғолибон</title>
<script src="config.js"></script><script src="cache.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#040A14;color:#E8E4D9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}.phone{width:100%;max-width:430px;height:100dvh;margin:auto;background:#080F20;display:flex;flex-direction:column;position:relative;overflow:hidden}
.header{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(180deg,#0E1E36,#080F20);border-bottom:1px solid rgba(255,255,255,.06);z-index:5}.head-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.055);color:#E8E4D9;font-size:18px;display:grid;place-items:center;cursor:pointer}.head-btn:active{transform:scale(.92);background:rgba(232,201,109,.12)}.title{flex:1;text-align:center;color:#E8C96D;font-weight:850;font-size:17px;letter-spacing:.45px}.title i{font-style:normal;font-size:13px;margin:0 5px}
.scroll{flex:1;overflow:auto;padding:11px 12px 16px;background:radial-gradient(circle at 50% 0,rgba(201,168,76,.07),transparent 24%),#080F20}.filters{background:#0E1A2E;border:1px solid rgba(201,168,76,.15);border-radius:15px;padding:4px;margin-bottom:9px}.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.periods button{border:0;border-radius:10px;padding:7px 3px;background:transparent;color:#73859A;font-size:11px;font-weight:750;cursor:pointer}.periods button.active{background:linear-gradient(180deg,#1A2F4E,#12233A);color:#E8C96D;box-shadow:inset 0 0 0 1px rgba(201,168,76,.16)}.filter-row{display:flex;gap:6px;margin-top:5px}.select-wrap{flex:1;position:relative}.select-wrap:after{content:'⌄';position:absolute;right:9px;top:50%;transform:translateY(-55%);color:#C9A84C;pointer-events:none}.select-wrap select{appearance:none;width:100%;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:#101D31;color:#A9B5C3;padding:7px 24px 7px 9px;font-size:10px;outline:0}
.user-card{background:linear-gradient(135deg,#11233E,#0E1A2E);border:1px solid rgba(201,168,76,.18);border-radius:18px;padding:13px;position:relative;overflow:hidden;margin:9px 0;cursor:pointer}.user-card:before{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(201,168,76,.15),transparent 70%)}.top-row{display:flex;gap:11px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;border:2.5px solid #E8C96D;position:relative;flex-shrink:0;background:#16293F;display:grid;place-items:center;overflow:visible}.avatar .avatar-inner{position:absolute;inset:2px;border-radius:50%;overflow:hidden;display:grid;place-items:center}.avatar img,.p-avatar img,.av img{width:100%;height:100%;object-fit:cover}.avatar svg,.p-avatar svg,.av svg{width:62%;height:62%}.crown-badge{position:absolute;right:-4px;bottom:-3px;width:22px;height:22px;background:#E8C96D;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid #11233E;z-index:2}.info{flex:1;min-width:0}.info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loc,.motto{font-size:10.5px;color:#71849A;margin-top:3px}.level{width:62px;background:linear-gradient(180deg,#1A2F4E,#12233A);border:1px solid rgba(201,168,76,.25);border-radius:13px;padding:7px 5px;text-align:center;z-index:1}.level .star{color:#E8C96D;font-size:17px}.level span{font-size:9px;color:#C9A84C;display:block}.level b{font-size:13px;color:#E8C96D}.stats{margin-top:11px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.04);border-radius:12px;display:flex;padding:9px 4px}.stat{text-align:center;flex:1;border-right:1px solid rgba(255,255,255,.06)}.stat:last-child{border:0}.stat b{font-size:14px;display:block}.stat span{font-size:9px;color:#71849A}
.section-title{display:flex;align-items:center;justify-content:center;gap:10px;color:#E8C96D;font-weight:750;font-size:13px;margin:15px 0 9px}.section-title:before,.section-title:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,201,109,.28))}.section-title:after{transform:scaleX(-1)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:7px;padding:7px 0 11px}.podium-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;cursor:pointer}.podium-item.first{order:2;flex:1.12}.podium-item.second{order:1}.podium-item.third{order:3}.p-avatar{width:62px;height:62px;border-radius:50%;border:3px solid #C0C0C0;background:#16293F;display:grid;place-items:center;overflow:hidden;z-index:2}.first .p-avatar{width:80px;height:80px;border-color:#E8C96D;box-shadow:0 0 18px rgba(232,201,109,.34)}.third .p-avatar{border-color:#CD7F32}.crown{font-size:20px;position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 2px 4px #000)}.first .crown{font-size:26px;top:-24px}.place{width:27px;height:27px;border-radius:50%;background:#E0E0E0;color:#0A1222;font-weight:850;font-size:13px;display:grid;place-items:center;border:2px solid rgba(0,0,0,.15);margin-top:-8px;z-index:4}.first .place{background:#E8C96D}.third .place{background:#D08A4A;color:#fff}.pedestal{width:100%;height:58px;border-radius:14px 14px 5px 5px;margin-top:-13px;padding:20px 4px 4px;display:flex;flex-direction:column;align-items:center;color:#fff;z-index:1}.second .pedestal{background:linear-gradient(180deg,#3A4A5E,#263448)}.first .pedestal{height:74px;background:linear-gradient(180deg,#5A4A2A,#332817)}.third .pedestal{height:48px;background:linear-gradient(180deg,#4A3520,#302317)}.pedestal b{font-size:11px;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pts{font-size:9.5px;color:#E8C96D;margin-top:2px}.p-city{font-size:8.5px;color:#AAB5C1;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:#0E1A2E;border:1px solid rgba(255,255,255,.055);border-radius:14px;overflow:hidden;margin-bottom:4px}.rank-row{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer}.rank-row:last-child{border:0}.rank-row:active{background:rgba(232,201,109,.06)}.num{width:19px;color:#71849A;font-weight:750;font-size:13px;text-align:center}.av{width:36px;height:36px;border-radius:50%;background:#16293F;display:grid;place-items:center;overflow:hidden;flex-shrink:0}.nm{flex:1;min-width:0}.nm b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm span{font-size:9.5px;color:#71849A}.pt{text-align:right;color:#E8C96D;font-size:11px;font-weight:750}.pt small{display:block;color:#71849A;font-size:8.5px;margin-top:2px}.empty,.loading{padding:42px 18px;text-align:center;color:#71849A}.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(201,168,76,.16);border-top-color:#E8C96D;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}.confetti{position:absolute;inset:58px 0 58px;pointer-events:none;overflow:hidden;z-index:0}.conf{position:absolute;top:-18px;width:7px;height:11px;opacity:.35;animation:fall 8s linear infinite}@keyframes fall{to{transform:translateY(760px) rotate(440deg)}}
.nav{height:58px;flex:0 0 58px;background:rgba(8,15,32,.97);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.07);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom,0)}.nav a{flex:1;text-decoration:none;color:#607288;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px}.nav a .ico{font-size:17px;height:21px}.nav a.active{color:#E8C96D}
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}@media(max-width:350px){.filter-row{display:grid;grid-template-columns:1fr}.p-avatar{width:55px;height:55px}.first .p-avatar{width:70px;height:70px}.pedestal b{font-size:9px}}
</style>
</head><body><div class="phone">
<div class="header"><button class="head-btn" onclick="history.length>1?history.back():location.href='index.html'">←</button><div class="title"><i>🏆</i>Ғолибон<i>🏆</i></div><button class="head-btn" onclick="shareWinners()">↗</button></div>
<div class="confetti"><i class="conf" style="left:7%;background:#E8C96D;animation-delay:.2s"></i><i class="conf" style="left:24%;background:#fff;animation-delay:2s"></i><i class="conf" style="left:48%;background:#CD7F32;animation-delay:1s"></i><i class="conf" style="left:73%;background:#E8C96D;animation-delay:3s"></i><i class="conf" style="left:91%;background:#fff;animation-delay:1.6s"></i></div>
<main class="scroll"><div class="filters"><div class="periods" id="periodSwitch"><button data-period="all" class="active">👑 Ҳама вақт</button><button data-period="month">👑 Моҳ</button><button data-period="week">👑 Ҳафта</button></div><div class="filter-row"><div class="select-wrap"><select id="ageFilter"><option value="all">Синну сол: ҳама</option><option value="7-12">7–12 сола</option><option value="13-17">13–17 сола</option><option value="18-25">18–25 сола</option><option value="26-40">26–40 сола</option><option value="40+">Болои 40</option></select></div><div class="select-wrap"><select id="regionFilter"><option value="all">Вилоят: ҳама</option><option value="Шаҳри Душанбе">Шаҳри Душанбе</option><option value="Вилояти Суғд">Вилояти Суғд</option><option value="Вилояти Хатлон">Вилояти Хатлон</option><option value="ВМКБ">ВМКБ</option><option value="Ноҳияҳои тобеи марказ">Ноҳияҳои тобеи марказ</option></select></div></div></div><div id="winnersContent"><div class="loading"><div class="spinner"></div>Боргирӣ…</div></div></main>
<nav class="nav"><a href="index.html"><span class="ico">⌂</span><span>Асосӣ</span></a><a href="kitobho.html"><span class="ico">▤</span><span>Китобҳо</span></a><a class="active" href="winners.html"><span class="ico">♛</span><span>Ғолибон</span></a><a href="chats.html"><span class="ico">♧</span><span>Чат</span></a><a href="profile.html"><span class="ico">♙</span><span>Профил</span></a></nav>
</div><script>
document.addEventListener('DOMContentLoaded',()=>CacheManager?.init());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ageOf=y=>y?new Date().getFullYear()-Number(y):null;
const hours=v=>Math.round(Number(v)||0)+'с';
const avatar=u=>u?.avatar_url?`<img src="${esc(u.avatar_url)}" alt="">`:`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#E8C96D" stroke-width="1.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="#E8C96D" stroke-width="1.6"/></svg>`;
let allData={top3:[],top100:[]},period='all';
function openUser(id){if(id)location.href='profile.html?user='+encodeURIComponent(id)}
async function shareWinners(){try{const d={title:'Ғолибони Китобхона',text:'Рейтинги беҳтарин китобхонҳо',url:location.href};if(navigator.share)await navigator.share(d);else await navigator.clipboard.writeText(location.href)}catch(e){}}
function userCard(u,rank){if(!u)return'';return `<section class="user-card" onclick="openUser('${esc(u.id)}')"><div class="top-row"><div class="avatar"><div class="avatar-inner">${avatar(u)}</div><div class="crown-badge">👑</div></div><div class="info"><b>${esc(u.display_name||u.username||'Китобхон')}</b><div class="loc">📍 ${esc(u.city||u.region||'Тоҷикистон')}</div><div class="motto">Китобхон · мақоми ${rank}</div></div><div class="level"><div class="star">★</div><span>Ҷой</span><b>${rank}</b></div></div><div class="stats"><div class="stat"><b>📚 ${u.total_books||0}</b><span>Китобҳо</span></div><div class="stat"><b>⏱ ${hours(u.total_hours)}</b><span>Соати хониш</span></div><div class="stat"><b>🏆 ${rank}</b><span>Мақом</span></div></div></section>`}
function podiumItem(u,place,kind){if(!u)return `<div class="podium-item ${kind}"><div class="p-avatar">—</div><div class="place">${place}</div><div class="pedestal"><b>—</b></div></div>`;return `<div class="podium-item ${kind}" onclick="openUser('${esc(u.id)}')">${place===1?'<div class="crown">👑</div>':''}<div class="p-avatar">${avatar(u)}</div><div class="place">${place}</div><div class="pedestal"><b>${esc(u.display_name||u.username||'Китобхон')}</b><div class="p-city">${esc(u.city||'—')}</div><div class="pts">★ ${hours(u.total_hours)} · 📚 ${u.total_books||0}</div></div></div>`}
function render(){const ageVal=document.getElementById('ageFilter').value,region=document.getElementById('regionFilter').value;const list=(allData.top100||[]).filter(u=>{const a=ageOf(u.birth_year);let ok=ageVal==='all'||(ageVal==='40+'?a>40:(()=>{const [x,y]=ageVal.split('-').map(Number);return a>=x&&a<=y})());return ok&&(region==='all'||u.region===region)});const top=allData.top3||[],uid=localStorage.getItem('kk_user_id'),combined=[...top,...(allData.top100||[])],mine=combined.find(u=>String(u.id)===String(uid));let rank='—';const ti=top.findIndex(u=>String(u.id)===String(uid)),li=(allData.top100||[]).findIndex(u=>String(u.id)===String(uid));if(ti>=0)rank=ti+1;else if(li>=0)rank=li+4;let html=userCard(mine,rank)+'<div class="section-title">🏆 Топ 3 ғолибон</div><div class="podium">'+podiumItem(top[1],2,'second')+podiumItem(top[0],1,'first')+podiumItem(top[2],3,'third')+'</div><div class="section-title">Рейтинги пурра</div><div class="list">';if(!list.length)html+='<div class="empty">Натиҷа ёфт нашуд</div>';else list.forEach((u,i)=>html+=`<div class="rank-row" onclick="openUser('${esc(u.id)}')"><div class="num">${i+4}</div><div class="av">${avatar(u)}</div><div class="nm"><b>${esc(u.display_name||u.username||'Китобхон')}</b><span>${esc(u.city||u.region||'—')}</span></div><div class="pt">★ ${hours(u.total_hours)}<small>📚 ${u.total_books||0} китоб</small></div></div>`);document.getElementById('winnersContent').innerHTML=html+'</div>'}
async function loadWinners(p='all'){period=p;const key='kk_winners_'+p,cached=CacheManager?.get(key);if(cached){allData=cached;render()}else document.getElementById('winnersContent').innerHTML='<div class="loading"><div class="spinner"></div>Боргирӣ…</div>';try{const auth=await AutoLogin.autoLogin(false);if(!auth)throw Error('Барои рейтинг ворид шавед');const r=await fetch(KITOB_CONFIG.NEON_API_BASE+'/api/winners?period='+p,{headers:{Authorization:'Bearer '+localStorage.getItem('kk_token')},cache:'no-store'});if(!r.ok)throw Error('Хатогӣ дар боргирӣ');allData=await r.json();CacheManager?.set(key,allData);render()}catch(e){if(!cached)document.getElementById('winnersContent').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
document.getElementById('ageFilter').onchange=render;document.getElementById('regionFilter').onchange=render;document.getElementById('periodSwitch').onclick=e=>{const b=e.target.closest('[data-period]');if(!b||b.dataset.period===period)return;document.querySelectorAll('[data-period]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadWinners(b.dataset.period)};loadWinners();
</script></body></html>
