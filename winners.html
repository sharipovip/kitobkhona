<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Китобхона — Ғолибон</title>
<script src="config.js"></script>
<style>
  /* ===== СТИЛИ (динамические) ===== */
  :root{
    --bg:#0B1726; --bg-2:#0E2034; --card:#152840; --card-2:#1B3150; --card-soft:#10233A;
    --gold:#DCB55E; --gold-deep:#B68B33; --gold-soft:rgba(220,181,94,0.14);
    --green:#4F9D70; --red:#BD5650; --teal:#4C92AE;
    --silver:#C9CDD3; --silver-deep:#8B919B;
    --bronze:#C98F5C; --bronze-deep:#8A5B33;
    --white-mot:#EDE7D6; --cream:#F3ECDD; --cream-dim:#C9C0AC; --muted:#8CA0B8;
    --line:rgba(220,181,94,0.16); --shadow:0 18px 40px -12px rgba(0,0,0,0.55);
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
  }
  [data-theme="light"]{
    --bg:#F3EEE2; --bg-2:#EAE2D2; --card:#FFFFFF; --card-2:#FBF7EE; --card-soft:#F4EEE0;
    --gold:#B6863A; --gold-deep:#8F6A28; --gold-soft:rgba(182,134,58,0.12);
    --green:#3F7E58; --red:#A8463F; --teal:#386E83;
    --white-mot:#FFFFFF; --cream:#23211B; --cream-dim:#5C5749; --muted:#7B7563;
    --line:rgba(182,134,58,0.22); --shadow:0 14px 30px -10px rgba(60,50,30,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans', sans-serif;
    background:radial-gradient(circle at 20% 0%, #16304a 0%, transparent 45%), radial-gradient(circle at 85% 90%, #0c1c2e 0%, transparent 50%), #0a1320;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; color:var(--cream);
  }
  [data-theme="light"] body{background:radial-gradient(circle at 20% 0%, #fbf4e3 0%, transparent 45%), radial-gradient(circle at 85% 90%, #efe3c8 0%, transparent 50%), #f0e8d6;}

  .app{
    width:100%; max-width:430px; background:var(--bg); border-radius:32px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(232,222,199,0.08), 0 40px 80px rgba(0,0,0,0.55);
    display:flex; flex-direction:column; min-height:90vh;
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px;}
  .topbar h2{font-size:20px; color:var(--cream); margin:0;}
  .trophy-ic{font-size:20px;}

  .filters-wrap{padding:0 18px 8px;}
  .segmented{display:flex; background:var(--card-soft); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px; position:relative;}
  .segmented button{
    flex:1; padding:8px 0; border:none; background:transparent; color:var(--muted); font-size:12px; font-weight:600; border-radius:9px; cursor:pointer; font-family:'Noto Sans'; transition:0.15s;
    position:relative;
  }
  .segmented button .crown{font-size:14px; display:block; margin-bottom:2px;}
  .segmented button.active{
    background:var(--card-2); color:var(--gold); box-shadow:inset 0 0 0 1px var(--line);
  }
  .segmented button.active .crown{filter:drop-shadow(0 0 4px var(--gold));}
  .segmented button:not(.active) .crown{opacity:0.5; filter:grayscale(0.5);}
  .segmented button:disabled{opacity:0.4; pointer-events:none; filter:grayscale(0.8);}

  .chip-row{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .select-chip{position:relative; flex:0 0 auto;}
  .select-chip select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background:var(--card-soft); border:1px solid var(--line); border-radius:999px;
    padding:8px 30px 8px 14px; font-size:12px; color:var(--cream); font-family:'Noto Sans'; cursor:pointer;
  }
  .select-chip select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .select-chip::after{content:"⌄"; position:absolute; right:12px; top:50%; transform:translateY(-58%); color:var(--gold); font-size:12px; pointer-events:none;}

  .podium{display:flex; align-items:flex-end; justify-content:center; gap:8px; padding:22px 14px 6px;}
  .podium-col{display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; cursor:pointer;}
  .podium-col:hover .pname{color:var(--gold);}
  .podium-crown{font-size:22px; margin-bottom:2px;}
  .pav-wrap{position:relative;}
  .pav{border-radius:50%; padding:2.5px;}
  .pav.gold{width:72px; height:72px; background:conic-gradient(var(--gold), #fff3cf, var(--gold));}
  .pav.silver{width:56px; height:56px; background:conic-gradient(var(--silver), #fff, var(--silver));}
  .pav.bronze{width:56px; height:56px; background:conic-gradient(var(--bronze), #f0c9a4, var(--bronze));}
  .pav-inner{width:100%; height:100%; border-radius:50%; background:var(--card-2); border:2.5px solid var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .pav-inner img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .pav-inner svg{width:60%; height:60%;}
  .pmedal{position:absolute; bottom:-3px; right:-3px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; border:2px solid var(--bg);}
  .pmedal.m1{background:linear-gradient(180deg,#F3D896,var(--gold-deep)); color:#221a05;}
  .pmedal.m2{background:linear-gradient(180deg,#E9ECEF,var(--silver-deep)); color:#1c1f22;}
  .pmedal.m3{background:linear-gradient(180deg,#E3B084,var(--bronze-deep)); color:#241404;}

  .pname{font-size:12.5px; font-weight:700; color:var(--cream); margin-top:8px; text-align:center; max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pcity{font-size:10.5px; color:var(--muted);}
  .pstats{display:flex; gap:6px; margin-top:4px; font-size:10px; color:var(--cream-dim);}
  .pstats span{display:flex; align-items:center; gap:2px;}

  .step{width:100%; margin-top:10px; border-radius:10px 10px 4px 4px; display:flex; align-items:flex-start; justify-content:center; padding-top:6px; font-family:'Noto Serif'; font-weight:800;}
  .step-1{height:62px; background:linear-gradient(180deg,#F3D896,var(--gold-deep)); color:#241a05; font-size:22px;}
  .step-2{height:44px; background:linear-gradient(180deg,#EDEFF1,var(--silver-deep)); color:#1c1f22; font-size:18px;}
  .step-3{height:34px; background:linear-gradient(180deg,#E9C09A,var(--bronze-deep)); color:#241404; font-size:18px;}

  .list-head{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 6px;}
  .eyebrow{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .top100-badge{font-size:10.5px; font-weight:700; color:var(--gold); background:var(--gold-soft); border:1px solid var(--line); padding:3px 9px; border-radius:999px;}

  .col-labels{display:flex; align-items:center; gap:11px; padding:2px 18px 6px; font-size:10px; color:var(--muted);}
  .col-labels .sp-rank{width:26px;}
  .col-labels .sp-av{width:38px;}
  .col-labels .sp-info{flex:1;}
  .col-labels .sp-age{width:30px; text-align:center;}
  .col-labels .sp-stats{width:70px; text-align:right;}

  .rank-list{padding:0 14px 18px; display:flex; flex-direction:column; gap:1px;}
  .rank-row{display:flex; align-items:center; gap:11px; padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .rank-row:last-child{border-bottom:none;}
  .rank-row[hidden]{display:none;}
  .rank-row:hover .rank-name{color:var(--gold);}
  .rank-num-wrap{width:26px; text-align:center; flex:0 0 auto;}
  .rank-num{font-size:13.5px; font-weight:700; color:var(--muted);}
  .rav{width:38px; height:38px; border-radius:50%; padding:2px; background:var(--line); flex:0 0 auto;}
  .rav-inner{width:100%; height:100%; border-radius:50%; background:var(--card-2); border:2px solid var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .rav-inner img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .rav-inner svg{width:60%; height:60%;}
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-size:12.5px; font-weight:700; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-city{font-size:10.5px; color:var(--muted);}
  .rank-age{width:30px; text-align:center; font-size:11.5px; color:var(--muted); flex:0 0 auto;}
  .rank-stats{width:70px; text-align:right; flex:0 0 auto;}
  .rank-stats .hours{font-size:12px; font-weight:700; color:var(--gold); display:block;}
  .rank-stats .books{font-size:9.5px; color:var(--muted);}

  .empty-msg{padding:30px 18px; text-align:center; font-size:12.5px; color:var(--muted);}
  .empty-msg[hidden]{display:none;}

  .loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:14px; color:var(--muted);}
  .spinner{width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .bottom-nav{
    flex:0 0 auto; display:flex; justify-content:space-around; align-items:center;
    padding:10px 6px 22px; background:var(--card); border-top:1px solid var(--line);
  }
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--muted); width:74px; cursor:pointer;}
  .nav-item .ic{font-size:18px; line-height:1;}
  .nav-item.active{color:var(--gold); font-weight:700;}

  .guest-overlay{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:14px; text-align:center; min-height:60vh;}
  .guest-overlay .btn{margin-top:8px;}

  .btn{padding:11px 20px; border-radius:13px; font-family:'Noto Sans'; font-size:13.5px; font-weight:700; border:none; cursor:pointer;}
  .btn-primary{background:linear-gradient(180deg, #E8C778, var(--gold-deep)); color:#1A1206;}
</style>
</head>
<body data-theme="dark">

<div class="app" id="app">
  <div class="topbar">
    <h2>Ғолибон</h2>
    <span class="trophy-ic">🏆</span>
  </div>

  <!-- ФИЛЬТРЫ -->
  <div class="filters-wrap">
    <div class="segmented" id="periodSwitch">
      <button data-period="all" class="active"><span class="crown">👑</span>Ҳама вақт</button>
      <button data-period="month"><span class="crown">👑</span>Моҳ</button>
      <button data-period="week"><span class="crown">👑</span>Ҳафта</button>
    </div>
    <div class="chip-row">
      <div class="select-chip">
        <select id="ageFilter">
          <option value="all">Синну сол: ҳама</option>
          <option value="7-12">7–12 сола</option>
          <option value="13-17">13–17 сола</option>
          <option value="18-25">18–25 сола</option>
          <option value="26-40">26–40 сола</option>
          <option value="40+">Болои 40</option>
        </select>
      </div>
      <div class="select-chip">
        <select id="regionFilter">
          <option value="all">Вилоят: ҳама</option>
          <option value="Шаҳри Душанбе">Шаҳри Душанбе</option>
          <option value="Вилояти Суғд">Вилояти Суғд</option>
          <option value="Вилояти Хатлон">Вилояти Хатлон</option>
          <option value="ВМКБ">ВМКБ</option>
          <option value="Ноҳияҳои тобеи марказ">Ноҳияҳои тобеи марказ</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <div id="winnersContent">
    <div class="loading-screen"><div class="spinner"></div><div>Боргирӣ...</div></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='Lenta.html'"><div class="ic">📰</div>Лента</div>
    <div class="nav-item active" onclick="location.href='winners.html'"><div class="ic">🏆</div>Ғолибон</div>
    <div class="nav-item" onclick="location.href='profile.html'"><div class="ic">👤</div>Профил</div>
  </div>
</div>

<script>
  // ================================================================
  // ============ ТЕМА ============
  // ================================================================
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', function(){
      const isDark = document.body.dataset.theme === 'dark';
      document.body.dataset.theme = isDark ? 'light' : 'dark';
      themeBtn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('kk_theme', isDark ? 'light' : 'dark');
    });
  }
  const savedTheme = localStorage.getItem('kk_theme') || 'dark';
  document.body.dataset.theme = savedTheme;

  // ================================================================
  // ============ НАВИГАЦИЯ В ПРОФИЛЬ ============
  // ================================================================
  function openUserProfile(userId) {
    if (userId) location.href = `profile.html?user=${userId}`;
  }

  // ================================================================
  // ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
  // ================================================================
  let allData = { top3: [], top100: [] };
  let currentPeriod = 'all';
  let filteredTop100 = [];

  // ================================================================
  // ============ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ============
  // ================================================================
  function getAge(birthYear) {
    if (!birthYear) return null;
    const currentYear = new Date().getFullYear();
    return currentYear - birthYear;
  }

  function getInitials(name) {
    if (!name) return 'К';
    const parts = name.trim().split(/\s+/);
    return parts.slice(0,2).map(p => p[0] || '').join('').toUpperCase() || 'К';
  }

  function getAvatarSvg(gender) {
    if (gender === 'male') {
      return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="var(--gold)" stroke-width="1.6"/></svg>`;
    } else if (gender === 'female') {
      return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="var(--gold)" stroke-width="1.6"/><path d="M12 12v4m-2-2h4" stroke="var(--gold)" stroke-width="1.6"/></svg>`;
    } else {
      return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 19c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    }
  }

  function formatHours(hours) {
    if (hours === undefined || hours === null) return '0с';
    return Math.round(hours) + 'с';
  }

  // ================================================================
  // ============ ЗАГРУЗКА ДАННЫХ С СЕРВЕРА ============
  // ================================================================
  async function loadWinners(period = 'all') {
    const container = document.getElementById('winnersContent');
    container.innerHTML = '<div class="loading-screen"><div class="spinner"></div><div>Боргирӣ...</div></div>';
    try {
      const result = await AutoLogin.autoLogin(false);
      if (!result) {
        container.innerHTML = `
          <div class="guest-overlay">
            <div style="font-size:48px;">🏆</div>
            <h3>Барои дидани рейтинг ворид шавед</h3>
            <p style="color:var(--muted);font-size:13px;">Танҳо корбарони сабтиномшуда метавонанд дар рейтинг ширкат кунанд.</p>
            <button class="btn btn-primary" onclick="location.href='login.html'">Ворид шудан</button>
          </div>
        `;
        return;
      }

      const token = localStorage.getItem('kk_token');
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/winners?period=' + period, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!resp.ok) throw new Error('Хатогӣ дар боргирӣ');
      const data = await resp.json();
      allData = data;
      allData.top3 = allData.top3.map(u => ({ ...u, age: getAge(u.birth_year) }));
      allData.top100 = allData.top100.map(u => ({ ...u, age: getAge(u.birth_year) }));

      applyFilters();
    } catch (e) {
      console.error('Error loading winners:', e);
      container.innerHTML = `<div class="empty-msg" style="color:var(--red);">Хатогӣ: ${e.message}</div>`;
    }
  }

  // ================================================================
  // ============ ОТРИСОВКА ============
  // ================================================================
  function renderWinners(top3, top100) {
    const container = document.getElementById('winnersContent');
    if (!top3 && !top100) {
      container.innerHTML = '<div class="empty-msg">Ҳеҷ маълумоте нест</div>';
      return;
    }

    let html = '';

    // --- ПОДИУМ (топ-3) ---
    html += `<div class="podium">`;
    // Порядок: 2 место (серебро) слева, 1 место (золото) центр, 3 место (бронза) справа
    const podiumOrder = [1, 0, 2];
    const medalClass = ['silver', 'gold', 'bronze'];
    const stepClass = ['step-2', 'step-1', 'step-3'];
    const medalNum = ['2', '1', '3'];

    for (let i = 0; i < 3; i++) {
      const idx = podiumOrder[i];
      const user = top3[idx] || null;
      const isGold = i === 1; // золото в центре
      if (user) {
        const displayName = user.display_name || user.username || 'Китобхон';
        const city = user.city || '—';
        const hours = formatHours(user.total_hours);
        const books = user.total_books || 0;
        const avatar = user.avatar_url ? `<img src="${user.avatar_url}" alt="">` : getAvatarSvg(user.gender);
        html += `
          <div class="podium-col" onclick="openUserProfile('${user.id}')">
            ${isGold ? '<div class="podium-crown">👑</div>' : ''}
            <div class="pav-wrap">
              <div class="pav ${medalClass[i]}"><div class="pav-inner">${avatar}</div></div>
              <div class="pmedal ${i === 0 ? 'm2' : i === 1 ? 'm1' : 'm3'}">${medalNum[i]}</div>
            </div>
            <div class="pname">${esc(displayName)}</div>
            <div class="pcity">${esc(city)}</div>
            <div class="pstats"><span>⏱ ${hours}</span><span>📚 ${books}</span></div>
            <div class="step ${stepClass[i]}">${medalNum[i]}</div>
          </div>
        `;
      } else {
        // пустая колонка
        html += `
          <div class="podium-col">
            <div class="pav-wrap">
              <div class="pav ${medalClass[i]}" style="opacity:0.3;"><div class="pav-inner">—</div></div>
            </div>
            <div class="pname" style="color:var(--muted);">—</div>
          </div>
        `;
      }
    }
    html += `</div>`;

    // --- ТОП-100 ---
    html += `
      <div class="list-head">
        <div class="eyebrow">Рейтинги пурра</div>
        <div class="top100-badge">ТОП ${top100.length}</div>
      </div>
      <div class="col-labels">
        <div class="sp-rank"></div><div class="sp-av"></div>
        <div class="sp-info"></div>
        <div class="sp-age">сол</div>
        <div class="sp-stats">соат / китоб</div>
      </div>
      <div class="rank-list" id="rankList">
    `;

    if (top100.length === 0) {
      html += `<div class="empty-msg">Бо ин филтрҳо натиҷае ёфт нашуд.</div>`;
    } else {
      top100.forEach((user, index) => {
        const rank = index + 4;
        const displayName = user.display_name || user.username || 'Китобхон';
        const city = user.city || '—';
        const age = user.age !== null && user.age !== undefined ? user.age : '—';
        const hours = formatHours(user.total_hours);
        const books = user.total_books || 0;
        const avatar = user.avatar_url ? `<img src="${user.avatar_url}" alt="">` : getAvatarSvg(user.gender);
        html += `
          <div class="rank-row" data-age="${user.age !== null ? user.age : ''}" data-region="${user.region || ''}" onclick="openUserProfile('${user.id}')">
            <div class="rank-num-wrap"><span class="rank-num">${rank}</span></div>
            <div class="rav"><div class="rav-inner">${avatar}</div></div>
            <div class="rank-info"><div class="rank-name">${esc(displayName)}</div><div class="rank-city">${esc(city)}</div></div>
            <div class="rank-age">${age}</div>
            <div class="rank-stats"><span class="hours">${hours}</span><span class="books">${books} китоб</span></div>
          </div>
        `;
      });
    }
    html += `</div>`;

    container.innerHTML = html;
    filteredTop100 = top100;
  }

  // ================================================================
  // ============ ФИЛЬТРАЦИЯ (только топ-100) ============
  // ================================================================
  function applyFilters() {
    const ageVal = document.getElementById('ageFilter').value;
    const regionVal = document.getElementById('regionFilter').value;

    let filtered = allData.top100.filter(user => {
      let ageMatch = true;
      if (ageVal !== 'all') {
        const age = user.age;
        if (age === null || age === undefined) {
          ageMatch = false;
        } else if (ageVal === '40+') {
          ageMatch = age > 40;
        } else {
          const [min, max] = ageVal.split('-').map(Number);
          ageMatch = age >= min && age <= max;
        }
      }
      let regionMatch = true;
      if (regionVal !== 'all') {
        regionMatch = (user.region || '') === regionVal;
      }
      return ageMatch && regionMatch;
    });

    // Топ-3 остаётся без изменений (всегда показывает трёх лучших)
    renderWinners(allData.top3, filtered);
  }

  // ================================================================
  // ============ ОБРАБОТЧИКИ ФИЛЬТРОВ ============
  // ================================================================
  document.getElementById('ageFilter').addEventListener('change', applyFilters);
  document.getElementById('regionFilter').addEventListener('change', applyFilters);

  // Переключатели периода
  document.getElementById('periodSwitch').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-period]');
    if (!btn) return;
    const period = btn.dataset.period;
    if (period === currentPeriod) return;
    document.querySelectorAll('#periodSwitch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = period;
    loadWinners(period);
  });

  // ================================================================
  // ============ ЗАПУСК ============
  // ================================================================
  loadWinners('all');
</script>
</body>
</html>
