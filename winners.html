<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Китобхона — Ғолибон</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">

  <script src="config.js?v=75"></script>
  <script src="cache.js?v=45"></script>
  



  <link rel="stylesheet" href="assets/css/desktop-layout.css">
<link rel="stylesheet" href="assets/css/winners.css?v=clean-1">
</head>
<body>
  <div class="app">

    
    <div class="topbar">
      <h2>🏆 Ғолибон</h2>
      <span class="icon" id="themeToggle" style="display:none">🌙</span>
    </div>

    
    <div class="content-wrapper">

      
      <div class="filters-wrap">
        <div class="segmented" id="periodSwitch">
          <button data-period="all" class="active"><span class="crown">👑</span>Ҳама вақт</button>
          <button data-period="month"><span class="crown">👑</span>Моҳ</button>
          <button data-period="week"><span class="crown">👑</span>Ҳафта</button>
        </div>
        <div class="chip-row">
          <div class="select-chip">
            <select id="ageFilter">
              <option value="all">Синну сол: ҳама</option>
              <option value="7-12">7–12 сола</option>
              <option value="13-17">13–17 сола</option>
              <option value="18-25">18–25 сола</option>
              <option value="26-40">26–40 сола</option>
              <option value="40+">Болои 40</option>
            </select>
          </div>
          <div class="select-chip">
            <select id="regionFilter">
              <option value="all">Вилоят: ҳама</option>
              <option value="Шаҳри Душанбе">Шаҳри Душанбе</option>
              <option value="Вилояти Суғд">Вилояти Суғд</option>
              <option value="Вилояти Хатлон">Вилояти Хатлон</option>
              <option value="ВМКБ">ВМКБ</option>
              <option value="Ноҳияҳои тобеи марказ">Ноҳияҳои тобеи марказ</option>
            </select>
          </div>
        </div>
      </div>

      
      <div id="winnersContent">
        <div class="loading-screen"><div class="spinner"></div><div>Боргирӣ...</div></div>
      </div>

    </div>

    
    <div class="nav-bottom">
    <div class="kh-nav2">
      <a class="nav-item" href="index.html" aria-label="Асосӣ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span>Асосӣ</span>
      </a>
      <a class="nav-item" href="kitobho.html" aria-label="Китобҳо"><div class="person-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg><div class="book-in-hand"></div></div><span>Китобҳо</span></a>
      <a class="nav-item active" href="winners.html" aria-label="Ғолибон"><div class="crown-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg><span class="crown-icon">👑</span></div><span>Ғолибон</span></a>
      
      <!-- ЦЕНТРАЛЬНАЯ КНОПКА АЛИЯ -->
      <a class="nav-item nav-aliya-center" href="aliya/index.html" aria-label="Алия"><div class="aliya-fab-glow">✨</div><span>Алия</span></a>

      <a class="nav-item" href="dovtalab/index.html" aria-label="Довталаб"><div style="width:22px;height:22px;display:flex;align-items:center;justify-content:center"><img src="dovtalab/assets/icon-192.png" alt="" style="width:22px;height:22px;border-radius:6px"></div><span>Довталаб</span></a>
      <a class="nav-item" href="Lenta.html" aria-label="Лента"><div class="person-icon like-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg><span class="like-icon heart1">❤️</span><span class="like-icon heart2">❤️</span><span class="like-icon heart3">❤️</span></div><span>Лента</span></a>
      <a class="nav-item" href="chats.html" aria-label="Чат"><div class="users-wrap"><div class="person p1"></div><div class="person p2"></div><span class="heart-pop">❤️</span></div><span>Чат</span></a>
    </div>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof CacheManager !== 'undefined') {
        CacheManager.init();
      }
    });

    (function() {
      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('kk_theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        if (themeToggle) themeToggle.textContent = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        if (themeToggle) themeToggle.textContent = '🌙';
      }
      if (themeToggle) {
        themeToggle.addEventListener('click', function() {
          const isLight = document.body.classList.toggle('light-theme');
          localStorage.setItem('kk_theme', isLight ? 'light' : 'dark');
          this.textContent = isLight ? '☀️' : '🌙';
        });
      }
    })();

    function openUserProfile(userId) {
      if (userId) location.href = 'profile.html?user=' + userId;
    }

    let allData = { top3: [], top100: [] };
    let currentPeriod = 'all';
    let filteredTop100 = [];

    function getAge(birthYear) {
      if (!birthYear) return null;
      const currentYear = new Date().getFullYear();
      return currentYear - birthYear;
    }

    // v126: аватар танҳо аз https ва бе XSS (пештар avatar_url бевосита ба innerHTML мерафт)
    function safeAvatarUrl(u){ try{ const x=new URL(String(u||''),location.href); return (x.protocol==='https:'||x.protocol==='http:')?x.href:''; }catch(e){ return ''; } }
    function escAttr(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function getAvatarSvg(gender) {
      if (gender === 'male') {
        return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="var(--gold)" stroke-width="1.6"/></svg>`;
      } else if (gender === 'female') {
        return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="var(--gold)" stroke-width="1.6"/><path d="M12 12v4m-2-2h4" stroke="var(--gold)" stroke-width="1.6"/></svg>`;
      } else {
        return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 19c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
      }
    }

    function formatHours(hours) {
      const totalMinutes = Math.max(0, Math.round(Number(hours || 0) * 60));
      if (totalMinutes < 60) return totalMinutes + ' дақ';
      const h = Math.floor(totalMinutes / 60), m = totalMinutes % 60;
      return h + ' соат' + (m ? ' ' + m + ' дақ' : '');
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    async function loadWinners(period = 'all') {
      const container = document.getElementById('winnersContent');
      const cacheKey = 'kk_winners_v2_' + period;
      let cached = (typeof CacheManager !== 'undefined') ? CacheManager.get(cacheKey) : null;
      if (cached && Array.isArray(cached.top100)) {
        allData = cached;
        allData.top3 = (allData.top3 || []).map(u => ({ ...u, age: getAge(u.birth_year) }));
        allData.top100 = (allData.top100 || []).map(u => ({ ...u, age: getAge(u.birth_year) }));
        applyFilters();
      } else {
        container.innerHTML = '<div class="loading-screen"><div class="spinner"></div><div>Боргирӣ...</div></div>';
      }
      try {
        const resp = await edgeApiFetch('/api/winners?period=' + encodeURIComponent(period) + '&_t=' + Date.now(), {}, 8000);
        if (!resp.ok) throw new Error('Хатогӣ дар боргирии рӯйхат');
        const data = await resp.json();
        const top100List = (data.top100 || []).map(u => ({ ...u, age: getAge(u.birth_year) }));
        const top3List = (data.top3 && data.top3.length ? data.top3 : top100List.slice(0, 3)).map(u => ({ ...u, age: getAge(u.birth_year) }));
        allData = { top3: top3List, top100: top100List };
        if (typeof CacheManager !== 'undefined') CacheManager.set(cacheKey, allData);
        applyFilters();
      } catch (e) {
        console.error('Error loading winners:', e);
        if (!cached) container.innerHTML = `<div class="empty-msg" style="color:var(--red)">Хатогӣ: ${esc(e.message)}</div>`;
      }
    }

    function renderWinners(top3, top100) {
      const container = document.getElementById('winnersContent');
      if (!top3 && !top100) {
        container.innerHTML = '<div class="empty-msg">Ҳеҷ маълумоте нест</div>';
        return;
      }

      let html = '';

      html += `<div class="podium">`;
      const podiumOrder = [1, 0, 2];
      const medalClass = ['silver', 'gold', 'bronze'];
      const stepClass = ['step-2', 'step-1', 'step-3'];
      const medalNum = ['2', '1', '3'];

      for (let i = 0; i < 3; i++) {
        const idx = podiumOrder[i];
        const user = top3[idx] || null;
        const isGold = i === 1;
        if (user) {
          const displayName = user.display_name || user.username || 'Китобхон';
          const city = user.city || '—';
          const hours = formatHours(user.total_hours);
          const books = user.total_books || 0;
          const avatar = safeAvatarUrl(user.avatar_url) ? `<img src="${escAttr(safeAvatarUrl(user.avatar_url))}" alt="">` : getAvatarSvg(user.gender);
          html += `
            <div class="podium-col" onclick="openUserProfile('${user.id}')">
              ${isGold ? '<div class="podium-crown">👑</div>' : ''}
              <div class="pav-wrap">
                <div class="pav ${medalClass[i]}"><div class="pav-inner">${avatar}</div></div>
                <div class="pmedal ${i === 0 ? 'm2' : i === 1 ? 'm1' : 'm3'}">${medalNum[i]}</div>
              </div>
              <div class="pname" style="display:flex;align-items:center;justify-content:center">${esc(displayName)}${user.verified ? verifiedBadgeSvg() : ''}</div>
              <div class="pcity">${esc(city)}</div>
              <div class="pstats"><span>⏱ ${hours}</span><span>📚 ${books}</span></div>
              <div class="step ${stepClass[i]}">${medalNum[i]}</div>
            </div>
          `;
        } else {
          html += `
            <div class="podium-col">
              <div class="pav-wrap">
                <div class="pav ${medalClass[i]}" style="opacity:0.3;"><div class="pav-inner">—</div></div>
              </div>
              <div class="pname" style="color:var(--muted);">—</div>
            </div>
          `;
        }
      }
      html += `</div>`;

      html += `
        <div class="list-head">
          <div class="eyebrow">Рейтинги пурра</div>
          <div class="top100-badge">ТОП ${top100.length}</div>
        </div>
        <div class="col-labels">
          <div class="sp-rank"></div><div class="sp-av"></div>
          <div class="sp-info"></div>
          <div class="sp-age">сол</div>
          <div class="sp-stats">соат / китоб</div>
        </div>
        <div class="rank-list" id="rankList">
      `;

      if (top100.length === 0) {
        html += `<div class="empty-msg">Бо ин филтрҳо натиҷае ёфт нашуд.</div>`;
      } else {
        top100.forEach((user, index) => {
          const rank = index + 1;
          const displayName = user.display_name || user.username || 'Китобхон';
          const city = user.city || '—';
          const age = user.age !== null && user.age !== undefined ? user.age : '—';
          const hours = formatHours(user.total_hours);
          const books = user.total_books || 0;
          const avatar = safeAvatarUrl(user.avatar_url) ? `<img src="${escAttr(safeAvatarUrl(user.avatar_url))}" alt="">` : getAvatarSvg(user.gender);
          html += `
            <div class="rank-row" data-age="${user.age !== null ? user.age : ''}" data-region="${user.region || ''}" onclick="openUserProfile('${user.id}')">
              <div class="rank-num-wrap"><span class="rank-num">${rank}</span></div>
              <div class="rav"><div class="rav-inner">${avatar}</div></div>
              <div class="rank-info"><div class="rank-name" style="display:flex;align-items:center">${esc(displayName)}${user.verified ? verifiedBadgeSvg() : ''}</div><div class="rank-city">${esc(city)}</div></div>
              <div class="rank-age">${age}</div>
              <div class="rank-stats"><span class="hours">${hours}</span><span class="books">${books} китоб</span></div>
            </div>
          `;
        });
      }
      html += `</div>`;

      container.innerHTML = html;
      filteredTop100 = top100;
    }

    function applyFilters() {
      const ageVal = document.getElementById('ageFilter').value;
      const regionVal = document.getElementById('regionFilter').value;

      const sourceList = Array.isArray(allData.top100) ? allData.top100 : [];
      let filtered = sourceList.filter(user => {
        let ageMatch = true;
        if (ageVal !== 'all') {
          const age = user.age;
          if (age === null || age === undefined) {
            ageMatch = false;
          } else if (ageVal === '40+') {
            ageMatch = age > 40;
          } else {
            const [min, max] = ageVal.split('-').map(Number);
            ageMatch = age >= min && age <= max;
          }
        }
        let regionMatch = true;
        if (regionVal !== 'all') {
          const uReg = String(user.region || '').toLowerCase();
          const qReg = String(regionVal).toLowerCase();
          regionMatch = uReg === qReg || uReg.includes(qReg) || qReg.includes(uReg);
        }
        return ageMatch && regionMatch;
      });

      const top3ForPodium = (filtered.length >= 3) 
        ? filtered.slice(0, 3) 
        : (filtered.length > 0 ? filtered : (ageVal === 'all' && regionVal === 'all' ? (allData.top3 || []) : []));

      renderWinners(top3ForPodium, filtered);
    }

    document.getElementById('ageFilter').addEventListener('change', applyFilters);
    document.getElementById('regionFilter').addEventListener('change', applyFilters);

    document.getElementById('periodSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-period]');
      if (!btn) return;
      const period = btn.dataset.period;
      if (period === currentPeriod) return;
      document.querySelectorAll('#periodSwitch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriod = period;
      loadWinners(period);
    });

    loadWinners('all');
  </script>
</body>
</html>
