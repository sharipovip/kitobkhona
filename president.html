<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Хабарҳои Президент · Китобхона</title>
<style>
  :root {
    --bg:#0D1B2A; --bg2:#142236; --card:#1A2D44; --card2:#1E3350;
    --text:#F0EAD6; --muted:#A8B8CC; --gold:#C9A84C; --gold2:#E8C96D;
    --line:rgba(201,168,76,.22); --red:#D96B63;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
    overflow-x:hidden;
  }
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:50; max-width:430px; margin:0 auto;
    height:calc(54px + var(--safe-top)); padding:var(--safe-top) 8px 0;
    background:rgba(13,27,42,.98); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }
  .tb-btn {
    width:38px; height:38px; border:0; border-radius:12px; background:transparent;
    color:var(--gold2); font-size:20px; cursor:pointer; flex:0 0 38px;
  }
  .tb-title { flex:1; min-width:0; }
  .tb-title b { display:block; font-size:14.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb-title span { display:block; font-size:10px; color:var(--muted); }
  .page { max-width:430px; margin:0 auto; padding:calc(66px + var(--safe-top)) 12px calc(20px + var(--safe-bottom)); }

  /* чипы категорий */
  .chips {
    display:flex; gap:7px; overflow-x:auto; padding:4px 2px 10px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; border:1px solid var(--line); background:var(--card);
    color:var(--muted); border-radius:99px; padding:7px 12px; font:inherit;
    font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
    transition:background .2s,color .2s,border-color .2s;
  }
  .chip.on {
    background:#0A1522; color:var(--gold2); border-color:rgba(201,168,76,.6);
    font-weight:800; box-shadow:inset 0 0 0 1px rgba(201,168,76,.25);
  }

  .sec-note { font-size:10.5px; color:var(--muted); margin:2px 2px 10px; }
  .loader { text-align:center; color:var(--muted); font-size:12.5px; padding:34px 10px; }

  /* список новостей */
  .item {
    background:var(--card); border:1px solid rgba(255,255,255,.05); border-radius:14px;
    padding:11px 12px; margin-bottom:9px; display:flex; gap:11px; cursor:pointer;
    transition:transform .15s;
  }
  .item:active { transform:scale(.985); }
  .item-thumb {
    flex:0 0 62px; width:62px; height:62px; border-radius:10px; object-fit:cover;
    background:var(--card2); display:none;
  }
  .item-thumb.ok { display:block; }
  .item-thumb-ph {
    flex:0 0 62px; width:62px; height:62px; border-radius:10px; background:var(--card2);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .item-body { flex:1; min-width:0; }
  .item-title {
    font-size:13.5px; font-weight:750; line-height:1.38; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .item-meta { margin-top:6px; display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted); flex-wrap:wrap; }
  .item-cat { color:var(--gold); font-weight:800; }
  .item-photos { background:rgba(201,168,76,.14); color:var(--gold2); border-radius:99px; padding:1.5px 7px; font-weight:750; }

  /* детальный вид */
  .art { background:var(--card); border:1px solid rgba(255,255,255,.05); border-radius:16px; padding:16px 15px 18px; }
  .art-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .art-head .art-cat { margin-bottom:0; }
  .art-cat { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; color:var(--gold2); background:rgba(201,168,76,.12); border:1px solid rgba(201,168,76,.3); border-radius:99px; padding:4px 10px; margin-bottom:10px; }
  .art-share { flex:0 0 auto; border:1px solid rgba(201,168,76,.4); background:rgba(201,168,76,.08); color:var(--gold2); font:inherit; font-weight:800; font-size:11px; border-radius:99px; padding:5px 12px; cursor:pointer; }
  .art-share:active { transform:scale(.95); }
  .art-title { font-size:17px; font-weight:800; line-height:1.42; margin-bottom:8px; }
  .art-date { font-size:11px; color:var(--muted); margin-bottom:12px; }
  .art-photos { display:flex; gap:7px; overflow-x:auto; margin:0 -3px 12px; padding:0 3px 4px; scrollbar-width:none; }
  .art-photos::-webkit-scrollbar { display:none; }
  .art-ph { flex:0 0 auto; height:118px; border-radius:11px; object-fit:cover; cursor:pointer; border:1px solid var(--line); }
  .art-text { font-size:14px; line-height:1.72; color:var(--text); word-wrap:break-word; overflow-wrap:break-word; }
  .art-text p { margin:0 0 11px; }
  .art-text img { max-width:100%; height:auto; border-radius:10px; margin:8px 0; }
  .art-text table { max-width:100%; display:block; overflow-x:auto; border-collapse:collapse; }
  .art-text td,.art-text th { border:1px solid rgba(168,184,204,.35); padding:4px 7px; font-size:13px; }
  .art-text a { color:var(--gold2); }
  .art-text h1,.art-text h2,.art-text h3,.art-text h4 { margin:12px 0 8px; line-height:1.4; }
  .art-text ul,.art-text ol { margin:0 0 11px 18px; }
  .art-text blockquote { border-left:3px solid var(--gold); padding:2px 0 2px 10px; color:var(--muted); margin:0 0 11px; }
  .art-src { margin-top:14px; font-size:10px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .art-site { color:var(--gold2); font-weight:750; font-size:11px; text-decoration:none; border:1px solid rgba(201,168,76,.4); border-radius:99px; padding:5px 11px; background:rgba(201,168,76,.08); }
  button.art-site { font:inherit; font-weight:750; font-size:11px; cursor:pointer; }
  button.art-site:active, .art-site:active { transform:scale(.95); }

  /* просмотр фото на весь экран: без подписи, кнопки ⬇ 📤 сверху слева, ✕ сверху справа */
  .viewer { position:fixed; inset:0; z-index:200; background:rgba(5,8,14,.97); display:none; align-items:center; justify-content:center; flex-direction:column; }
  .viewer.open { display:flex; }
  .viewer img { max-width:96vw; max-height:82vh; border-radius:6px; }
  .viewer-x { position:absolute; top:calc(12px + var(--safe-top)); right:12px; width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:#fff; font-size:19px; cursor:pointer; }
  .viewer-acts { position:absolute; top:calc(12px + var(--safe-top)); left:12px; display:flex; gap:10px; }
  .viewer-act { width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:#fff; font-size:17px; cursor:pointer; }
  .viewer-act:active, .viewer-x:active { transform:scale(.9); }

  /* прогресс скачивания — как у «Рамзҳои давлатӣ» */
  .pdl-ov{position:fixed;inset:0;z-index:99990;background:rgba(4,10,18,.74);display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .pdl-box{width:100%;max-width:340px;background:linear-gradient(165deg,#1A2C46,#12203A);border:1.5px solid rgba(201,168,76,.45);
    border-radius:20px;padding:20px 18px 16px;box-shadow:0 18px 46px rgba(0,0,0,.55);text-align:center}
  .pdl-ic{font-size:30px;margin-bottom:6px}
  .pdl-name{font-size:13px;font-weight:800;color:#F0EAD6;word-break:break-word;margin-bottom:14px}
  .pdl-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .pdl-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#C9A84C,#E8C96D);transition:width .25s ease}
  .pdl-pct{margin-top:9px;font-size:13px;font-weight:900;color:#E8C96D}
  .pdl-ph{font-size:11px;color:#8A9BB0;margin-top:3px;min-height:14px}
  .pdl-cancel{margin-top:12px;width:100%;border:1.5px solid rgba(201,168,76,.5);background:transparent;color:#E8C96D;
    border-radius:13px;padding:10px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
  .pdl-cancel:active{transform:scale(.97);background:rgba(201,168,76,.12)}

  /* мини-браузер внутри приложения: iframe + только ⟳ и ✕ сверху справа */
  .pbr { position:fixed; inset:0; z-index:300; background:#08101A; display:none; flex-direction:column; }
  .pbr.open { display:flex; }
  .pbr-wrap { flex:1; position:relative; background:#FFFFFF; overflow:hidden; }
  .pbr-frame { width:100%; height:100%; border:0; background:#FFFFFF; display:block; }
  .pbr-bar { position:absolute; top:0; left:0; right:0; height:3px; background:rgba(201,168,76,.15); z-index:10; overflow:hidden; }
  .pbr-fill { position:absolute; top:0; bottom:0; left:0; width:45%; background:linear-gradient(90deg,#C9A84C,#E8C96D,#FFFFFF); border-radius:2px; animation:pbrLoad 1.2s infinite ease-in-out; }
  @keyframes pbrLoad { 0%{left:-40%;width:40%} 50%{left:30%;width:60%} 100%{left:100%;width:40%} }
  .pbr-btns { position:absolute; top:calc(68px + var(--safe-top)); right:10px; display:flex; flex-direction:column; gap:8px; z-index:30; }
  .pbr-btn { width:38px; height:38px; border-radius:50%; border:0; background:rgba(10,18,30,.55); color:#fff; font-size:17px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; }
  .pbr-btn:active { transform:scale(.92); }

  /* маленький тост (напр. «матн нусха шуд») */
  .pz-toast { position:fixed; left:50%; bottom:calc(26px + var(--safe-bottom)); transform:translate(-50%,14px);
    background:rgba(20,34,54,.97); border:1.5px solid rgba(201,168,76,.5); color:#F0EAD6;
    border-radius:99px; padding:10px 18px; font-size:12.5px; font-weight:750; z-index:99999;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; max-width:86vw; text-align:center; }
  .pz-toast.on { opacity:1; transform:translate(-50%,0); }

  /* Mobile safe-width guard: avoid a few pixels of horizontal overflow on narrow WebViews. */
  html, body { width:100%; max-width:100%; overflow-x:clip; }
  @supports not (overflow-x:clip) { html, body { overflow-x:hidden; } }
  *, *::before, *::after { box-sizing:border-box; }
  img, video, iframe { max-width:100%; }
  .page { width:100%; max-width:430px; }
  .art, .item, .art-text { min-width:0; max-width:100%; }
  .share-choice-overlay { position:fixed; inset:0; z-index:100000; display:flex; align-items:flex-end; justify-content:center; padding:12px; background:rgba(4,10,18,.72); backdrop-filter:blur(5px); }
  .share-choice-dialog { width:100%; max-width:430px; max-height:85vh; max-height:85dvh; overflow:auto; padding:16px; border:1px solid rgba(201,168,76,.36); border-radius:20px; background:linear-gradient(160deg,#172940,#0D1B2A); box-shadow:0 20px 60px rgba(0,0,0,.46); }
  .share-choice-head { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--gold2); font-size:15px; }
  .share-choice-close { width:36px; height:36px; flex:0 0 36px; border:1px solid var(--line); border-radius:50%; background:rgba(255,255,255,.06); color:var(--text); font-size:15px; cursor:pointer; }
  .share-choice-preview { margin:8px 0 14px; color:var(--muted); font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
  .share-choice-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .share-choice-action { min-height:44px; padding:10px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.055); color:var(--text); font:inherit; font-size:12px; font-weight:750; cursor:pointer; overflow-wrap:anywhere; }
  .share-choice-action:active { transform:scale(.98); }
  .share-choice-action.share-choice-primary { color:#1b1508; background:linear-gradient(145deg,var(--gold2),var(--gold)); border-color:transparent; }
  .share-choice-hint { display:block; margin-top:12px; color:var(--muted); font-size:10px; line-height:1.45; }
  .share-picker-tools { display:flex; gap:7px; margin:0 0 10px; }
  .share-picker-tool { flex:1; min-height:34px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.045); color:var(--text); font:inherit; font-size:10px; font-weight:800; cursor:pointer; }
  .share-picker-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; max-height:42vh; overflow:auto; padding:1px 1px 5px; }
  .share-picker-photo { position:relative; min-width:0; border:1px solid rgba(201,168,76,.2); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.045); cursor:pointer; }
  .share-picker-photo.selected { border-color:var(--gold2); box-shadow:0 0 0 2px rgba(232,201,109,.22); }
  .share-picker-photo img { display:block; width:100%; height:86px; object-fit:cover; background:var(--card2); }
  .share-picker-check { position:absolute; top:6px; left:6px; width:20px; height:20px; accent-color:#D4AF55; cursor:pointer; }
  .share-picker-number { position:absolute; top:6px; right:6px; min-width:21px; height:21px; display:grid; place-items:center; padding:0 5px; border-radius:99px; background:rgba(5,10,17,.78); color:#fff; font-size:9px; font-weight:900; }
  .share-picker-caption { display:block; padding:5px 6px 6px; color:var(--muted); font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .share-picker-status { display:block; min-height:17px; margin:8px 0; color:var(--muted); font-size:10px; line-height:1.4; }
  .share-picker-submit { width:100%; min-height:43px; }
  .share-picker-submit:disabled { opacity:.5; cursor:wait; }
  .empty { text-align:center; color:var(--muted); font-size:12.5px; padding:40px 14px; line-height:1.6; }
  .retry { margin-top:12px; border:0; border-radius:12px; padding:11px 18px; background:linear-gradient(160deg,var(--gold),#A8862E); color:#1C1608; font-weight:800; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="tb-btn" onclick="goBack()" aria-label="Бозгашт">←</button>
    <div class="tb-title"><b id="tbTitle">Хабарҳои Президент</b><span id="tbSub">prezident.tj · сомонаи расмӣ</span></div>
    <button class="tb-btn" onclick="load(true)" aria-label="Навсозӣ">⟳</button>
  </div>

  <div class="page">
    <div class="chips" id="chips"></div>
    <div id="content"><div class="loader">Боркунӣ...</div></div>
  </div>

  <!-- Просмотр фото: ⬇ скачать (как Рамзҳои давлатӣ), 📤 поделиться, ✕ закрыть. Подписи нет. -->
  <div class="viewer" id="viewer" onclick="this.classList.remove('open')">
    <div class="viewer-acts">
      <button class="viewer-act" id="vwDl" onclick="event.stopPropagation();vwDownload()" aria-label="Боркунӣ">⬇️</button>
      <button class="viewer-act" id="vwSh" type="button" aria-label="Пахш кардан">📤</button>
    </div>
    <button class="viewer-x" onclick="event.stopPropagation();document.getElementById('viewer').classList.remove('open')">✕</button>
    <img id="viewerImg" alt="">
  </div>

  <!-- Мини-браузер: только ⟳ и ✕ сверху справа -->
  <div class="pbr" id="pbr">
    <div class="pbr-wrap">
      <div class="pbr-bar" id="pbrBar"><div class="pbr-fill"></div></div>
      <iframe class="pbr-frame" id="pbrFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
    <div class="pbr-btns">
      <button class="pbr-btn" type="button" aria-label="Пӯшидан" onclick="pbrClose()">✕</button>
      <button class="pbr-btn" type="button" aria-label="Навсозӣ" onclick="pbrReload()">⟳</button>
    </div>
  </div>

<script src="config.js?v=71"></script>
<script src="president.js?v=4"></script>
<script>
(function () {
  var P = window.PresidentNews;
  var qs = new URLSearchParams(location.search);
  var articleId = qs.get('id');
  var catKey = qs.get('cat') || (articleId ? '' : 'news');
  var curArt = null;   // текущая новость (для шаринга)
  var curPh = null;    // её фото {thumbs, big}
  var curPhoto = null; // фото, открытое в просмотрщике
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  window.goBack = function () {
    if (articleId && history.length > 1) { history.back(); return; }
    location.href = 'index.html';
  };

  function renderChips(activeKey) {
    var box = document.getElementById('chips');
    box.innerHTML = P.CATS.map(function (c) {
      return '<button class="chip' + (c.key === activeKey ? ' on' : '') + '" data-cat="' + c.key + '">' +
        c.emoji + ' ' + esc(c.label) + '</button>';
    }).join('');
    box.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        location.href = 'president.html?cat=' + b.dataset.cat;
      });
    });
  }

  // ---------- список категории: сначала локальный кэш, затем свежий API ----------
  var listRenderVersion = 0;
  function renderList(key) {
    var version = ++listRenderVersion;
    var cat = P.catByKey(key) || P.CATS[0];
    renderChips(cat.key);
    document.getElementById('tbTitle').textContent = cat.emoji + ' ' + cat.label;
    var content = document.getElementById('content');

    function drawItems(items, fromCache) {
      if (version !== listRenderVersion) return;
      function findByData(attribute, value) {
        var nodes = content.querySelectorAll('[' + attribute + ']');
        for (var i = 0; i < nodes.length; i++) if (nodes[i].getAttribute(attribute) === String(value)) return nodes[i];
        return null;
      }
      if (!items || !items.length) {
        content.innerHTML = '<div class="empty">Дар ин бахш ҳоло хабар нест</div>';
        return;
      }
      content.innerHTML =
        '<div class="sec-note">' + (fromCache ? 'Хабарҳои ҳифзшуда · интернет нест ё маълумоти нав дастрас нест' : 'Хабарҳои нав — аз сомонаи расмии prezident.tj') + '</div>' +
        items.map(function (it) {
          var id = esc(it.id);
          return '<div class="item" data-id="' + id + '" data-cat="' + esc(cat.key) + '">' +
            '<img class="item-thumb" data-thumb-for="' + id + '" alt="">' +
            (it.has_photos ? '<div class="item-thumb-ph" data-ph="' + id + '">🖼</div>' : '<div class="item-thumb-ph">📄</div>') +
            '<div class="item-body">' +
            '<div class="item-title" data-no-translate>' + esc(it.title) + '</div>' +
            '<div class="item-meta"><span class="item-cat">' + esc(cat.label) + '</span><span>·</span><span>' + esc(P.timeAgo(it.publish)) + '</span>' +
            (it.has_photos ? '<span class="item-photos">📷 ' + esc(it.photos_count || '') + '</span>' : '') +
            '</div></div></div>';
        }).join('');
      content.querySelectorAll('.item').forEach(function (el) {
        el.addEventListener('click', function () {
          location.href = 'president.html?cat=' + encodeURIComponent(el.dataset.cat) + '&id=' + encodeURIComponent(el.dataset.id);
        });
      });
      // Тасвирҳоро пешакӣ гирифта, танҳо ҳангоми онлайн будан; матн аз кэш бе расм ҳам дастрас аст.
      items.forEach(function (it) {
        if (it.thumb) {
          var img0 = findByData('data-thumb-for', it.id);
          var ph0 = findByData('data-ph', it.id);
          if (img0) { img0.onerror = function(){ img0.classList.remove('ok'); if(ph0)ph0.style.display='flex'; }; img0.src = it.thumb; img0.classList.add('ok'); }
          if (ph0) ph0.style.display = 'none';
          return;
        }
        if (!it.has_photos || navigator.onLine === false) return;
        P.fetchPhotos(it.id).then(function (ph) {
          if (ph.thumbs && ph.thumbs[0] && version === listRenderVersion) {
            var img = findByData('data-thumb-for', it.id);
            if (img) { img.src = ph.thumbs[0]; img.classList.add('ok'); }
            var phEl = findByData('data-ph', it.id);
            if (phEl) phEl.style.display = 'none';
          }
        }).catch(function () {});
      });
    }

    content.innerHTML = '<div class="loader">Боркунӣ...</div>';
    if (P.loadCategory) {
      P.loadCategory(cat.key, function (cachedItems) { drawItems(cachedItems, true); })
        .then(function (items) { drawItems(items, false); })
        .catch(function () {
          if (version !== listRenderVersion) return;

    submit.addEventListener('click', function () { var selected = chosenPhotos(); dismiss(); shareNewsWithPhotos(selected); });
    dialog.appendChild(head); dialog.appendChild(preview); dialog.appendChild(tools); dialog.appendChild(grid); dialog.appendChild(status); dialog.appendChild(submit);
    var hint = document.createElement('small'); hint.className = 'share-choice-hint'; hint.textContent = 'Барои интихоби акс як ё якчанд расмро қайд кунед. Агар барномаи ирсол файлҳоро қабул накунад, матн ва пайвандҳои акс пешниҳод мешаванд.'; dialog.appendChild(hint);
    overlay.appendChild(dialog); overlay.addEventListener('click', function (event) { if (event.target === overlay) dismiss(); });
    onEscape = function (event) { if (event.key === 'Escape' && document.getElementById('presidentShareOverlay') === overlay) dismiss(); };
    document.addEventListener('keydown', onEscape); document.body.appendChild(overlay); close.focus(); updateSelection();
  }
  function shareCurrentPhoto() {
    if (!curArt || !curPhoto) { pzToast('Аввал акси хабарро кушоед'); return; }
    var photo = articleSharePhoto(curPhoto);
    if (!photo) { pzToast('Акси хабар дастрас нест'); return; }
    shareNewsWithPhotos([photo]);
  }
  window.shareArticle = openArticleSharePicker;
  window.vwShare = function (event) {
    if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
    shareCurrentPhoto();
  };
  var viewerShareButton = document.getElementById('vwSh');
  if (viewerShareButton) viewerShareButton.addEventListener('click', function (event) {
    event.preventDefault(); event.stopPropagation(); shareCurrentPhoto();
  });

  // ---------- скачивание фото — схема «Рамзҳои давлатӣ» ----------
  function pdlShow(name) {
    document.getElementById('pdlOverlay')?.remove();
    var ov = document.createElement('div');
    ov.id = 'pdlOverlay'; ov.className = 'pdl-ov';
    ov.innerHTML = '<div class="pdl-box">' +
      '<div class="pdl-ic">⬇️</div>' +
      '<div class="pdl-name">' + esc(name) + '</div>' +
      '<div class="pdl-bar"><div class="pdl-fill" id="pdlFill"></div></div>' +
      '<div class="pdl-pct" id="pdlPct">0%</div>' +
      '<div class="pdl-ph" id="pdlPh">Интизор шавед, файл боркунӣ мешавад...</div>' +
      '<button type="button" class="pdl-cancel" onclick="pdlCancel()">✕ Бекор кардан</button>' +
      '</div>';
    document.body.appendChild(ov);
  }
  function pdlSet(pct, phase) {
    var p = Math.max(0, Math.min(100, Math.round(pct)));
    var f = document.getElementById('pdlFill'), t = document.getElementById('pdlPct'), ph = document.getElementById('pdlPh');
    if (f) f.style.width = p + '%';
    if (t) t.textContent = p + '%';
    if (ph && phase) ph.textContent = phase;
  }
  function pdlDone(ok) {
    pdlSet(100, ok ? '✓ Боркунӣ шуд' : 'Боркунӣ имконпазир нест');
    setTimeout(function () { document.getElementById('pdlOverlay')?.remove(); }, ok ? 1600 : 2400);
  }
  function blobToB64(blob, onProgress) {
    return new Promise(function (resolve, reject) {
      var CH = 300000; // base64 блоками — для больших файлов
      var parts = Math.max(1, Math.ceil(blob.size / CH));
      var b64s = [], i = 0;
      var readNext = function () {
        if (i >= parts) { resolve(b64s.join('')); return; }
        var fr = new FileReader();
        fr.onload = function () {
          var s = String(fr.result || '');
          b64s.push(s.slice(s.indexOf(',') + 1));
          i++;
          if (onProgress) onProgress(i / parts);
          setTimeout(readNext, 0);
        };
        fr.onerror = reject;
        fr.readAsDataURL(blob.slice(i * CH, Math.min(blob.size, (i + 1) * CH)));
      };
      readNext();
    });
  }
  var pdlAbort = null;
  window.pdlCancel = function () {
    try { if (pdlAbort) pdlAbort.abort(); } catch (e) {}
    document.getElementById('pdlOverlay')?.remove();
    pdlAbort = null;
    pzToast('Боркунӣ бекор шуд');
  };
  window.vwDownload = function () {
    if (!curPhoto) return;
    var url = curPhoto.big, name = curPhoto.name;
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    pdlAbort = ctl;
    pdlShow(name);
    fetch(url, ctl ? { signal: ctl.signal } : {})
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var total = +(r.headers.get('content-length') || 0);
        if (r.body && total) {
          var reader = r.body.getReader(); var chunks = []; var loaded = 0;
          var pump = function () {
            return reader.read().then(function (res) {
              if (res.done) return;
              chunks.push(res.value); loaded += res.value.length;
              pdlSet(70 * loaded / total, 'Пурборшавӣ... ' + Math.min(100, Math.round(100 * loaded / total)) + '%');
              return pump();
            });
          };
          return pump().then(function () { return new Blob(chunks); });
        }
        pdlSet(55, 'Пурборшавӣ...');
        return r.blob();
      })
      .then(function (blob) {
        pdlAbort = null;
        var mime = blob.type || 'image/jpeg';
        // 1) телефон (Kotlin): тот же мостик, что у Парчам/Нишон
        if (typeof AndroidBridge !== 'undefined' && AndroidBridge && typeof AndroidBridge.saveSymbolFile === 'function') {
          return blobToB64(blob, function (p) { pdlSet(70 + 25 * p, 'Омодасозӣ... ' + Math.round(p * 100) + '%'); }).then(function (b64) {
            pdlSet(97, 'Ҳифз шуда истодааст...');
            AndroidBridge.saveSymbolFile(b64, name, mime);
            pdlDone(true);
          });
        }
        if (typeof AndroidBridge !== 'undefined' && AndroidBridge && typeof AndroidBridge.saveFile === 'function') {
          return blobToB64(blob, function (p) { pdlSet(70 + 25 * p, 'Омодасозӣ... ' + Math.round(p * 100) + '%'); }).then(function (b64) {
            pdlSet(97, 'Ҳифз шуда истодааст...');
            AndroidBridge.saveFile(b64, name, mime);
            pdlDone(true);
          });
        }
        // 2) Web Share (мобильный веб)
        if (navigator.canShare && navigator.share) {
          var file = new File([blob], name, { type: mime });
          if (navigator.canShare({ files: [file] })) {
            return navigator.share({ title: name, files: [file] }).then(function () {
              document.getElementById('pdlOverlay')?.remove();
            }).catch(function (e) {
              if (e && e.name === 'AbortError') { document.getElementById('pdlOverlay')?.remove(); return; }
              throw e;
            });
          }
        }
        // 3) браузер: blob + a.download
        var aEl = document.createElement('a');
        aEl.href = URL.createObjectURL(blob); aEl.download = name;
        document.body.appendChild(aEl); aEl.click();
        setTimeout(function () { URL.revokeObjectURL(aEl.href); aEl.remove(); }, 5000);
        pdlDone(true);
      })
      .catch(function (e) {
        pdlAbort = null;
        if (e && e.name === 'AbortError') { document.getElementById('pdlOverlay')?.remove(); return; }
        pdlDone(false);
      });
  };

  // ---------- мини-браузер (только ⟳ и ✕) ----------
  var pbrUrl = '';
  window.pbrOpen = function (url) {
    var safeUrl;
    try { var parsed = new URL(String(url || ''), location.href); if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return; safeUrl = parsed.href; }
    catch (e) { return; }
    pbrUrl = safeUrl;
    var el = document.getElementById('pbr');
    var bar = document.getElementById('pbrBar');
    var fr = document.getElementById('pbrFrame');
    if (!el || !fr) return;
    el.classList.add('open');
    if (bar) bar.style.display = 'block';
    fr.src = safeUrl;
    try { history.pushState({ pbrOpen: true }, ''); } catch (e) {}
  };
  window.pbrClose = function () {
    var el = document.getElementById('pbr');
    var fr = document.getElementById('pbrFrame');
    if (el) el.classList.remove('open');
    if (fr) { try { fr.src = 'about:blank'; } catch (e) {} }
  };
  window.pbrReload = function () {
    var fr = document.getElementById('pbrFrame');
    var bar = document.getElementById('pbrBar');
    if (!fr || !pbrUrl) return;
    if (bar) bar.style.display = 'block';
    fr.src = pbrUrl;
  };
  window.pbrLoaded = function () {
    var bar = document.getElementById('pbrBar');
    if (bar) bar.style.display = 'none';
  };
  // onload вешаем из скрипта: атрибут сработал бы ДО определения функции
  (function () {
    var f = document.getElementById('pbrFrame');
    if (f) f.onload = function () { window.pbrLoaded(); };
  })();
  window.addEventListener('popstate', function () {
    var el = document.getElementById('pbr');
    if (el && el.classList.contains('open')) pbrClose();
  });

  window.load = function (force) {
    if (articleId) renderArticle(articleId, catKey, force);
    else renderList(catKey || 'news');
  };
  load();
})();
</script>
</body>
