name: Download nlt.tj books → sharipovip/books

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов — на случай, если цепочка оборвалась
  workflow_run:
    workflows: ["Download nlt.tj books → sharipovip/books"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340    # < 6 ч (лимит GitHub)

    steps:
      - name: Checkout sharipovip/books
        uses: actions/checkout@v4
        with:
          repository: sharipovip/books
          token: ${{ secrets.BOOKS_REPO_TOKEN }}
          ref: main
          path: books-repo
          fetch-depth: 0

      - name: Checkout kitobkhona
        uses: actions/checkout@v4
        with:
          path: scripts-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts-repo/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run downloader
        working-directory: books-repo
        env:
          NLT_USERNAME: ${{ secrets.NLT_USERNAME }}
          NLT_PASSWORD: ${{ secrets.NLT_PASSWORD }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          cp ../scripts-repo/scripts/download_books.py scripts/
          python scripts/download_books.py

      - name: Check if more work needed
        id: check
        working-directory: books-repo
        run: |
          if [ -f _more_to_do ] && [ "$(cat _more_to_do)" = "yes" ]; then
            echo "more=yes" >> $GITHUB_OUTPUT
          else
            echo "more=no" >> $GITHUB_OUTPUT
          fi

      - name: Trigger next run
        if: steps.check.outputs.more == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔁 Триггерим следующий запуск..."
          sleep 15
          gh workflow run "download-books.yml" --repo ${{ github.repository }} --ref ${{ github.ref_name }}
