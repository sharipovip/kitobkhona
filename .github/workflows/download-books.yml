name: Download nlt.tj books → sharipovip/books

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sharipovip/books
        uses: actions/checkout@v4
        with:
          repository: sharipovip/books
          token: ${{ secrets.BOOKS_REPO_TOKEN }}
          ref: main
          path: books-repo
          fetch-depth: 0

      - name: Checkout kitobkhona
        uses: actions/checkout@v4
        with:
          path: scripts-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts-repo/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run downloader
        working-directory: books-repo
        env:
          NLT_USERNAME: ${{ secrets.NLT_USERNAME }}
          NLT_PASSWORD: ${{ secrets.NLT_PASSWORD }}
        run: |
          mkdir -p scripts
          cp ../scripts-repo/scripts/download_books.py scripts/
          python scripts/download_books.py

      - name: Commit and push
        working-directory: books-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "books/Пешвои Миллат"
          if git diff --staged --quiet; then
            echo "✅ Новых книг нет — коммит не нужен"
            exit 0
          fi
          git commit -m "📚 Auto-download: Пешвои Миллат [$(date +'%Y-%m-%d %H:%M')]"
          git push
