name: Build Kitobkhona Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'aliya/**'
      - 'index.html'
      - 'reader.html'
      - 'config.js'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NSIS and Package App
        shell: pwsh
        run: |
          Write-Host "Creating Kitobkhona Windows Wrapper..."
          New-Item -ItemType Directory -Force -Path "dist-win"

          # Создание манифеста и инсталлятора
          $installerScript = @"
          !include "MUI2.nsh"
          Name "Китобхона"
          OutFile "dist-win\Kitobkhona-Setup.exe"
          InstallDir "`$LOCALAPPDATA\Programs\Kitobkhona"
          RequestExecutionLevel user

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "Russian"

          Section "MainSection" SEC01
            SetOutPath "`$INSTDIR"
            File /r *.*
            CreateShortcut "`$DESKTOP\Китобхона.lnk" "`$INSTDIR\index.html"
            CreateShortcut "`$SMPROGRAMS\Китобхона.lnk" "`$INSTDIR\index.html"
          SectionEnd
          "@
          Set-Content -Path "installer.nsi" -Value $installerScript
          
          # Сборка установщика
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            makensis installer.nsi
          } else {
            Write-Host "Packaging web assets to Kitobkhona-Setup.exe bundle..."
            Compress-Archive -Path * -DestinationPath "dist-win\Kitobkhona-Windows-Portable.zip"
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
