name: Build Kitobkhona Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Initialize & Package Native Electron App
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          npx electron-builder --win --x64 -c.win.target=nsis

      - name: Upload Windows Executable (.exe) Release
        uses: actions/upload-artifact@v4
        with:
          name: Kitobkhona-Setup-Windows-v2.0
          path: dist/*.exe
