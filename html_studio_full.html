<style>
:root{--bg:#08111f;--bg2:#101b2f;--panel:#15243b;--panel2:#1e314f;--text:#eef5ff;--muted:#9eb1ca;--line:#2c4366;--gold:#e7bd4b;--blue:#38bdf8;--yellow:#fbbf24;--red:#ef4444;--green:#22c55e;--violet:#a78bfa;--shadow:0 16px 52px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:60px 1fr}.top{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(180deg,#101d32,#0a1323);border-bottom:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:10}.brand{display:flex;align-items:center;gap:10px;min-width:250px}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#ffdf80);color:#1e1403;font-size:23px;box-shadow:0 8px 22px rgba(231,189,75,.22)}.brand h1{font-size:18px;margin:0;color:var(--gold);letter-spacing:.3px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:1px}.toolbar{display:flex;gap:7px;align-items:center;flex:1;min-width:0;overflow:auto}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:7px 11px;font-size:12px;font-weight:850;white-space:nowrap;line-height:1.1}.en{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:2px;letter-spacing:.2px}.pane-title .en,.brand .en{display:block}.btn.primary .en{color:rgba(30,20,3,.72)}.btn:hover{border-color:var(--gold)}.btn.primary{background:linear-gradient(135deg,var(--gold),#f7d873);border-color:var(--gold);color:#1e1403}.btn.blue{border-color:rgba(56,189,248,.55);color:#bcefff}.btn.danger{border-color:rgba(239,68,68,.65);color:#fecaca}.btn.green{border-color:rgba(34,197,94,.55);color:#bbf7d0}.file{display:none}.status{font-size:12px;color:var(--muted);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspace{min-height:0;display:grid;grid-template-columns:minmax(310px,1.02fr) minmax(360px,.83fr) minmax(390px,.98fr);gap:10px;padding:10px}.pane{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.pane-head{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);gap:8px}.pane-title{font-weight:950;color:var(--gold);font-size:13px;display:flex;align-items:center;gap:7px}.pane-body{min-height:0;flex:1;overflow:auto}.preview-wrap{height:100%;display:grid;place-items:center;padding:12px;background:#030712}.device{width:100%;height:100%;max-width:430px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 22px 64px rgba(0,0,0,.6);transition:.18s}.device.small{max-width:390px}.device.phone{max-width:430px}.device.tablet{max-width:768px}.device.desktop{max-width:none;border-radius:12px}iframe{width:100%;height:100%;border:0;background:#fff}.mini-row{display:flex;gap:5px;align-items:center}.mini{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:800}.tabs{display:flex;gap:6px;padding:10px 10px 0;overflow:auto}.tab{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:900;white-space:nowrap}.tab.on{background:rgba(231,189,75,.13);border-color:rgba(231,189,75,.48);color:var(--gold)}.section{padding:12px;border-bottom:1px solid rgba(255,255,255,.065)}.section h3{margin:0 0 10px;font-size:13px;color:var(--gold);display:flex;align-items:center;gap:7px}.hint{font-size:12px;color:var(--muted);line-height:1.55}.hint b{color:var(--text)}.kv{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin:8px 0}.kv label{font-size:11px;color:var(--muted);font-weight:900}.inp,.sel,.ta{width:100%;border:1px solid var(--line);background:#0b1526;color:var(--text);border-radius:11px;padding:9px;outline:none}.inp:focus,.sel:focus,.ta:focus{border-color:var(--gold)}.ta{min-height:82px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.risk{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:950;border:1px solid}.risk.safe{color:#bcefff;border-color:rgba(56,189,248,.55);background:rgba(56,189,248,.10)}.risk.warn{color:#fde68a;border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.10)}.risk.danger{color:#fecaca;border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.10)}.list{display:flex;flex-direction:column;gap:7px}.item{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:13px;padding:9px;cursor:pointer}.item:hover{border-color:var(--gold)}.item.on{border-color:var(--blue);box-shadow:0 0 0 1px rgba(56,189,248,.25)}.item.danger-row{border-color:rgba(239,68,68,.45)}.item-title{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.swatch{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.25);display:inline-block;vertical-align:middle;margin-right:8px}.code-tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid rgba(255,255,255,.065)}.codearea{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}.codebox{flex:1;min-height:260px;width:100%;background:#070c14;color:#e8f0fb;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;resize:none;tab-size:2}.codepre{flex:1;min-height:260px;overflow:auto;background:#070c14;color:#e8f0fb;border:1px solid var(--line);border-radius:14px;padding:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55}.line{display:grid;grid-template-columns:48px 1fr}.ln{user-select:none;color:#64748b;text-align:right;padding:0 9px;border-right:1px solid rgba(255,255,255,.06)}.lc{padding:0 10px;white-space:pre}.line.hit .lc{background:rgba(56,189,248,.18);outline:1px solid rgba(56,189,248,.4)}.line.warn .lc{background:rgba(251,191,36,.13)}.line.danger .lc{background:rgba(239,68,68,.14)}.linebar{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;flex-wrap:wrap}.explain{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px;padding:10px;font-size:12px;line-height:1.55;color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(18px);opacity:0;background:#0e192b;border:1px solid var(--line);border-radius:999px;padding:10px 16px;z-index:150;color:var(--text);box-shadow:var(--shadow);transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}.dialog h2{margin:0 0 10px;color:var(--gold);font-size:18px}.dialog p{color:var(--muted);line-height:1.55}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.patch{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;background:#070c14;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:340px;overflow:auto;font-size:12px;color:#e8f0fb}.top .toggle{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;white-space:nowrap}.top input[type=checkbox]{accent-color:var(--gold)}@media(max-width:1100px){html,body{overflow:auto}.app{height:auto}.workspace{grid-template-columns:1fr;min-height:1800px}.pane{min-height:540px}.device{max-width:430px}}
</style>

<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">🧩</div><div><h1>HTML Studio Pro</h1><small>Локальный визуальный редактор <span class="en">Local visual editor</span></small></div></div>
  <div class="toolbar">
    <label class="btn primary" for="openFile">📂 Открыть HTML<span class="en">Open HTML</span></label><input id="openFile" class="file" type="file" accept=".html,.htm,text/html">
    <button class="btn" id="sampleBtn">✨ Пример<span class="en">Sample</span></button>
    <button class="btn blue" id="undoBtn">↶ Отмена<span class="en">Undo</span></button><button class="btn blue" id="redoBtn">↷ Повтор<span class="en">Redo</span></button>
    <button class="btn" id="backupBtn">💾 Копия<span class="en">Backup</span></button><button class="btn green" id="patchBtn">📋 Изменения<span class="en">Patch</span></button><button class="btn primary" id="saveBtn">⬇ Сохранить<span class="en">Save HTML</span></button>
    <label class="toggle"><input id="safeMode" type="checkbox" checked > Безопасно</label><label class="toggle"><input id="expertMode" type="checkbox" > Эксперт</label>
    <span class="status" id="status">Выберите HTML-файл</span>
  </div>
</header>
<main class="workspace">
<section class="pane"><div class="pane-head"><div class="pane-title">👁 Предпросмотр <span class="en">Preview</span></div><div class="mini-row"><button class="mini" data-device="small">390</button><button class="mini" data-device="phone">430</button><button class="mini" data-device="tablet">768</button><button class="mini" data-device="desktop">Весь код<span class="en">Full</span></button></div></div><div class="pane-body preview-wrap"><div class="device phone" id="device"><iframe id="preview"></iframe></div></div></section>
<section class="pane"><div class="pane-head"><div class="pane-title">🛠 Редактор <span class="en">Правка<span class="en">Edit</span></span></div><span id="selLabel" class="hint">No element</span></div><div class="tabs"><button class="tab on" data-tab="edit">Правка<span class="en">Edit</span></button><button class="tab" data-tab="find">Поиск<span class="en">Find</span></button><button class="tab" data-tab="blocks">Блоки<span class="en">Blocks</span></button><button class="tab" data-tab="assets">Файлы<span class="en">Assets</span></button><button class="tab" data-tab="learn">Обучение<span class="en">Learn</span></button><button class="tab" data-tab="changes">История<span class="en">Changes</span></button></div><div class="pane-body" id="inspector"></div></section>
<section class="pane"><div class="pane-head"><div class="pane-title">⌨ Код и риск <span class="en">Code + Risk</span></div><span id="riskBadge" class="risk safe">🔵 SAFE</span></div><div class="code-tabs"><button class="tab on" data-code="selected">Выбор<span class="en">Selected</span></button><button class="tab" data-code="full">Весь код<span class="en">Full</span></button><button class="tab" data-code="lines">Строки<span class="en">Lines</span></button><button class="tab" data-code="colors">Цвета<span class="en">Colors</span></button></div><div class="codearea" id="codePanel"></div></section>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="confirmModal"><div class="dialog"><h2 id="confirmTitle">Подтверждение</h2><p id="confirmText"></p><div class="dialog-actions"><button class="btn" id="cancelDanger">Отмена</button><button class="btn danger" id="okDanger">Продолжить</button></div></div></div>
<div class="modal" id="patchModal"><div class="dialog" style="max-width:720px"><h2>Список изменений</h2><div class="patch" id="patchText"></div><div class="dialog-actions"><button class="btn" onclick="document.getElementById('patchModal').classList.remove('on')">Close</button><button class="btn primary" onclick="download(changeLog.join('\n'),'html_studio_changes.txt')">Скачать список</button></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));let htmlDoc=null,sourceName='edited.html',selectedId=null,seq=1,undoStack=[],redoStack=[],changeLog=[],activeTab='edit',activeCode='selected',originalHTML='';const preview=$('#preview');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pushChange(t){changeLog.push(new Date().toLocaleTimeString()+' · '+t)}
function serialize(){if(!htmlDoc)return'';const d=htmlDoc.cloneNode(true);d.querySelectorAll('[data-studio-id],[data-studio-selected]').forEach(e=>{e.removeAttribute('data-studio-id');e.removeAttribute('data-studio-selected')});return '<!DOCTYPE html>\n'+d.documentElement.outerHTML}
function pushHistory(){if(!htmlDoc)return;undoStack.push(serialize());if(undoStack.length>80)undoStack.shift();redoStack=[];updateStatus()}function updateStatus(){const n=htmlDoc?htmlDoc.querySelectorAll('[data-studio-id]').length:0;$('#status').textContent=htmlDoc?`${sourceName} · ${n} элементов · изменений ${changeLog.length}`:'Выберите HTML-файл'}
function parseHTML(text,name='edited.html',keepLog=false){sourceName=name;originalHTML=keepLog?originalHTML:text;htmlDoc=new DOMParser().parseFromString(text,'text/html');if(!htmlDoc.body)htmlDoc.documentElement.appendChild(htmlDoc.createElement('body'));assignIds();selectedId=null;if(!keepLog)changeLog=[];undoStack=[];redoStack=[];pushHistory();renderAll();toast('HTML открыт')}
function assignIds(){htmlDoc.querySelectorAll('[data-studio-id]').forEach(e=>e.removeAttribute('data-studio-id'));seq=1;htmlDoc.body.querySelectorAll('*').forEach(el=>el.setAttribute('data-studio-id','el_'+seq++))}
function clonePreview(){const d=htmlDoc.cloneNode(true);d.querySelectorAll('script').forEach(s=>s.type='text/studio-disabled');const st=d.createElement('style');st.textContent=`[data-studio-id]{outline-offset:2px} [data-studio-selected="true"]{outline:3px solid #38bdf8!important;box-shadow:0 0 0 9999px rgba(56,189,248,.045)!important} [data-studio-hidden="true"]{opacity:.35!important;filter:grayscale(1)!important}`;d.head.appendChild(st);return '<!DOCTYPE html>\n'+d.documentElement.outerHTML}
function renderPreview(){if(!htmlDoc)return;preview.srcdoc=clonePreview();preview.onload=()=>{try{const doc=preview.contentDocument;doc.querySelectorAll('[data-studio-id]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();selectElement(el.getAttribute('data-studio-id'))},true));markPreview()}catch(e){}}}
function markPreview(){try{const doc=preview.contentDocument;doc.querySelectorAll('[data-studio-selected]').forEach(e=>e.removeAttribute('data-studio-selected'));if(selectedId){const el=doc.querySelector(`[data-studio-id="${selectedId}"]`);if(el){el.setAttribute('data-studio-selected','true');el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}}}catch(e){}}
function getEl(){return htmlDoc?.querySelector(`[data-studio-id="${selectedId}"]`)}function selectElement(id){selectedId=id;renderAll(false)}function renderAll(reload=true){if(reload)renderPreview();renderInspector();renderCode();updateStatus();if(!reload)markPreview()}
function directText(el){let t='';el.childNodes.forEach(n=>{if(n.nodeType===3)t+=n.nodeValue});return t.trim()}function setDirectText(el,val){let n=[...el.childNodes].find(x=>x.nodeType===3);if(n)n.nodeValue=val;else el.insertBefore(htmlDoc.createTextNode(val),el.firstChild)}function emojiOf(s){const m=String(s).match(/[\p{Extended_Pictographic}\u2600-\u27BF]/u);return m?m[0]:''}function rgbToHex(v){if(!v)return'#ffffff';if(v.startsWith('#'))return v.length===4?'#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]:v.slice(0,7);const m=v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?'#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#ffffff'}function computed(el,p){try{const pe=preview.contentDocument.querySelector(`[data-studio-id="${el.getAttribute('data-studio-id')}"]`);return preview.contentWindow.getComputedStyle(pe)[p]}catch(e){return el.style[p]||''}}
function breadcrumb(el){let a=[],x=el;while(x&&x!==htmlDoc.body&&a.length<5){let s=x.tagName.toLowerCase();if(x.id)s+='#'+x.id;if(typeof x.className==='string'&&x.className.trim())s+='.'+x.className.trim().split(/\s+/).slice(0,2).join('.');a.unshift(s);x=x.parentElement}return a.join(' › ')}
function riskOf(el,action='select'){if(!el)return{level:'safe',label:'SAFE',why:'Элемент не выбран'};const tag=el.tagName.toLowerCase();let d=[],w=[];if(['script','style'].includes(tag))d.push('script/style');if(el.id)w.push('id');if([...el.attributes].some(a=>a.name.startsWith('on')))d.push('onclick/onload');if(['input','form','select','textarea'].includes(tag))d.push('form/input');if([...el.attributes].some(a=>a.name.startsWith('data-')&&!a.name.startsWith('data-studio')))w.push('data-*');if(action==='delete')d.push('delete');if(['move','class','href','src','full','code'].includes(action))w.push(action);if(d.length)return{level:'danger',label:'DANGER',why:'Опасно: '+d.join(', ')+'. Лучше использовать Hide (скрыть), а не удалять.'};if(w.length)return{level:'warn',label:'CAUTION',why:'Осторожно: '+w.join(', ')+'. Сделайте Backup.'};return{level:'safe',label:'SAFE',why:'Безопасно: текст, emoji, цвет, font-size, padding.'}}
function setRisk(r){$('#riskBadge').className='risk '+(r.level==='danger'?'danger':r.level==='warn'?'warn':'safe');$('#riskBadge').textContent=(r.level==='danger'?'🔴 ':r.level==='warn'?'🟡 ':'🔵 ')+r.label}
function renderInspector(){const root=$('#inspector');if(!htmlDoc){root.innerHTML='<div class="section"><p class="hint">Откройте HTML-файл. <span class="en">Откройте HTML-файл.</span></p></div>';return}if(activeTab==='find')return renderFind(root);if(activeTab==='blocks')return renderBlocks(root);if(activeTab==='assets')return renderAssets(root);if(activeTab==='learn')return renderLearn(root);if(activeTab==='changes')return renderChanges(root);const el=getEl();if(!el){root.innerHTML='<div class="section"><h3>👆 Выберите элемент</h3><p class="hint">Нажмите на элемент в предпросмотре или выберите его через Поиск/Блоки. <span class="en">Click element in preview.</span></p></div>'+quickStats();setRisk({level:'safe',label:'SAFE'});return}const r=riskOf(el);setRisk(r);$('#selLabel').textContent=breadcrumb(el);const txt=directText(el),em=emojiOf(el.textContent);root.innerHTML=`<div class="section"><h3>🎯 Выбранный <span class="en">Selected</span></h3><p class="hint"><b>${el.tagName.toLowerCase()}</b><br>${esc(breadcrumb(el))}<br><span class="risk ${r.level==='danger'?'danger':r.level==='warn'?'warn':'safe'}">${r.level==='danger'?'🔴':r.level==='warn'?'🟡':'🔵'} ${r.label}</span><br>${esc(r.why)}</p></div><div class="section"><h3>🔤 Текст / Иконка <span class="en">Text / Icon</span></h3><div class="kv"><label>Текст<span class="en">Text</span></label><textarea class="ta" id="txtEdit">${esc(txt)}</textarea></div><div class="grid2"><button class="btn primary" onclick="applyText()">Применить текст</button><button class="btn" onclick="clearText()">Очистить</button></div><div class="kv"><label>Emoji</label><input class="inp" id="emojiEdit" value="${esc(em)}" placeholder="🏠"></div><button class="btn" onclick="replaceEmoji()">Заменить emoji</button></div><div class="section"><h3>🎨 Стиль <span class="en">Style</span></h3><div class="grid2"><div><label class="hint">Цвет<span class="en">Color</span></label><input type="color" class="inp" id="colorEdit" value="${rgbToHex(computed(el,'color'))}"></div><div><label class="hint">Фон<span class="en">Background</span></label><input type="color" class="inp" id="bgEdit" value="${rgbToHex(computed(el,'backgroundColor'))}"></div></div><div class="grid2" style="margin-top:8px"><input class="inp" id="fontEdit" placeholder="font-size" value="${el.style.fontSize||''}"><input class="inp" id="radiusEdit" placeholder="radius" value="${el.style.borderRadius||''}"></div><div class="grid2" style="margin-top:8px"><input class="inp" id="padEdit" placeholder="padding" value="${el.style.padding||''}"><input class="inp" id="marEdit" placeholder="margin" value="${el.style.margin||''}"></div><button class="btn primary" style="margin-top:8px" onclick="applyStyle()">Применить стиль</button></div><div class="section"><h3>🔗 Атрибуты <span class="en">Attributes</span></h3><div class="kv"><label>id 🔴</label><input class="inp" id="idEdit" value="${esc(el.id||'')}"></div><div class="kv"><label>class 🟡</label><input class="inp" id="classEdit" value="${esc(el.className||'')}"></div>${el.tagName==='A'?`<div class="kv"><label>href 🟡</label><input class="inp" id="hrefEdit" value="${esc(el.getAttribute('href')||'')}"></div>`:''}${el.tagName==='IMG'?`<div class="kv"><label>src 🟡</label><input class="inp" id="srcEdit" value="${esc(el.getAttribute('src')||'')}"></div><input class="file" id="imgFile" type="file" accept="image/*" onchange="replaceImageFile(event)"><label for="imgFile" class="btn">🖼 Replace image file</label>`:''}<button class="btn" style="margin-top:8px" onclick="applyAttrs()">Применить атрибуты</button></div><div class="section"><h3>🧱 Действия <span class="en">Actions</span></h3><div class="grid2"><button class="btn blue" onclick="hideSelected()">👁 Скрыть безопасно</button><button class="btn" onclick="showSelected()">👁 Показать</button><button class="btn danger" onclick="deleteSelectedSmart()">🗑 Удалить</button><button class="btn" onclick="moveSelected(-1)">⬆ Выше</button><button class="btn" onclick="moveSelected(1)">⬇ Ниже</button><button class="btn" onclick="duplicateSelected()">⧉ Дублировать</button><button class="btn" onclick="insertAfter('button')">+ Кнопка</button><button class="btn" onclick="insertAfter('card')">+ Карточка</button></div></div>`;markPreview()}

function prettyLines(){return serialize().replace(/></g,'>\n<').split('\n')}function signature(el){if(!el)return'';let s='<'+el.tagName.toLowerCase();if(el.id)s+=' id="'+el.id+'"';if(el.className)s+=' class="'+String(el.className).split(/\s+/)[0];return s}function renderLines(){const lines=prettyLines(),sig=signature(getEl());let hit=lines.findIndex(l=>sig&&l.includes(sig));$('#codePanel').innerHTML=`<div class="linebar"><span>Примерная строка: ${hit>=0?hit+1:'not found'}</span><span class="hint">Синяя строка показывает выбранный элемент.</span></div><div class="codepre">${lines.map((l,i)=>`<div class="line ${i===hit?'hit':''}"><div class="ln">${i+1}</div><div class="lc">${esc(l)}</div></div>`).join('')}</div>`}
