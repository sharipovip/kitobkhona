<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0D1B2A">
  <title>Китобхона — бе интернет</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0D1B2A;color:#F0EAD6;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.box{width:min(430px,100%);text-align:center;background:#142236;border:1px solid rgba(201,168,76,.28);border-radius:24px;padding:30px 24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.icon{width:82px;height:82px;border-radius:24px;margin:0 auto 18px;background:#0B2146;border:3px solid #C9A84C;display:flex;align-items:center;justify-content:center;font-size:42px}.title{font-size:22px;font-weight:800;color:#E8C96D;margin-bottom:10px}.text{font-size:15px;line-height:1.6;color:#C8D1DC}.hint{margin-top:18px;font-size:12px;color:#8FA0B5}.button{display:inline-block;margin-top:20px;padding:11px 20px;border-radius:999px;background:#C9A84C;color:#0D1B2A;font-weight:700;text-decoration:none}
  </style>

<style id="app-scrollbar-policy">
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>
<style id="kk-content-protection">body,button,a,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,select,[contenteditable="true"],.allow-select{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}img{-webkit-user-drag:none}</style></head>
<body>
  <main class="box">
    <div class="icon">📚</div>
    <div class="title">Пайвастшавӣ нест</div>
    <div class="text">Шумо ҳоло интернет надоред. Китобҳои ҳифзшуда ва баъзе саҳифаҳои кэшшуда метавонанд дастрас бошанд.</div>
    <div class="hint">Вақте интернет барқарор шуд, саҳифаро нав кунед.</div>
    <a class="button" href="./index.html">Аз нав кӯшидан</a>
  </main>
</body>
</html>
