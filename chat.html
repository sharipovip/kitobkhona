<body data-theme="dark">

<div class="phone-wrapper">

  <main class="main-content">
    <div class="chat-container">
      
      <div class="chat-header">
        <a class="back-btn" href="chats.html" aria-label="Бозгашт">‹</a>
        <a aria-label="Профили ҳамсуҳбат" class="head-avatar" href="#" id="chatAvatar">👤</a>
        <a aria-label="Профили ҳамсуҳбат" class="head-info" href="#">
<div class="head-name"><span id="headNameText">Чат</span><span id="verifiedBadge"></span></div>
<div class="head-status" id="headStatus">
<span class="online-dot"></span>
<span id="friendStatusLabel">Дӯст</span>
<span id="typingIndicator" style="display:none;color:#25D366;font-weight:700">Навишта истодааст...</span>

<span class="chat-closed-badge" id="chatClosedBadge">🔒 Чат баста</span>
</div>
</a>
        <button class="menu-btn" id="menuBtn" aria-label="Менюи суҳбат">⋮</button>
        <div class="popup-menu" id="popupMenu">
          <div class="item" onclick="clearChatLocal()">
            <span class="icon">🧹</span>
            <span>Тоза кардани чат</span>
          </div>
          <div class="divider"></div>
          <div class="item danger" onclick="blockUser()">
            <span class="icon">🚫</span>
            <span>Бастани корбар</span>
          </div>
          <div class="item danger" onclick="reportUser()">
            <span class="icon">⚠️</span>
            <span>Шикоят кардан</span>
          </div>
        </div>
      </div>

      
      <div class="messages" id="messages">
        <div class="loading-msg"><div class="spinner"></div> Боргирӣ...</div>
      </div>

      
      <div class="composer" id="composer">
        <div class="wordcount"><span class="word-badge" id="wordCounter">Шумо метавонед 100 калимаи дигар фиристед</span></div>
        <div id="emojiPanel" class="emoji-panel"></div>
        <div class="input-row">
          <div class="input-pill">
            <button type="button" class="emoji-btn" aria-label="Эмодзи">☺</button>
            <textarea class="msg-input" id="msgInput" aria-label="Паёми нав" placeholder="Паём нависед..." rows="1"></textarea>
          </div>
          <button class="send-btn" id="sendBtn" aria-label="Фиристодани паём"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 19 9-19 9 4-9-4-9ZM7 12h15"/></svg></button>
        </div>
      </div>
    </div>
  </main>

</div>

<script>
  document.querySelectorAll('.head-avatar,.head-info').forEach(link=>link.href='profile.html?user='+encodeURIComponent(new URL(location.href).searchParams.get('to')||''));
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof CacheManager !== 'undefined') {
      CacheManager.init();
    }
    init();
    initLongPressDelete();
  });

  const qs = new URL(location.href).searchParams;
  const peerId = qs.get('to') || '';
  const peerName = qs.get('name') || 'Чат';

  document.getElementById('headNameText').textContent = peerName;

  let currentUserId = null;
  let pendingOutgoingCount = 0;
  let typingTimer = null;
  let typingActiveSent = false;
  let chatIsOpen = true;
  let chatAccessBlocked = false;
  let peerIsBlocked = false;
  let dailyWordsRemaining = null;
  function applyPeerBlock(){
    peerIsBlocked=true;
    clearTimeout(typingTimer);
    if(typingActiveSent){typingActiveSent=false;sendTypingState(false);}
    document.getElementById('msgInput').disabled=true;
    document.getElementById('sendBtn').disabled=true;
    document.getElementById('msgInput').placeholder='Корбар блок карда шуд';
  }

  // ===== Active-chat long polling: bounded cadence, stopped while hidden/offline =====
  let longPollingActive = false;
  let lastMessageTimestamp = Date.now();
  let pollGeneration = 0;      // растёт при каждом старте/остановке — гасит "осиротевшие" цепочки
  let pollDelay = 2000;
  let pollTimer = null;
  let pollAbortController = null; // отменяет реально висящий HTTP-запрос при остановке

  function dedupeMessages(list) {
    // держим первое появление порядка, но последние данные по каждому id (например статус "read")
    const map = new Map();
    for (const m of list) {
      const key = m && m.id != null ? String(m.id) : null;
      if (key === null) continue; // без id доверять нечему — пропускаем, чтобы не размножать мусор
      map.set(key, m);
    }
    return Array.from(map.values()).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  }

  function startLongPolling() {
    if (chatAccessBlocked || document.hidden || navigator.onLine === false) return;
    if (longPollingActive) return;
    longPollingActive = true;
    const myGeneration = ++pollGeneration;
    pollLoop(myGeneration);
  }

  function stopLongPolling() {
    longPollingActive = false;
    clearTimeout(pollTimer);pollTimer=null;
    pollGeneration++; // любая уже летящая цепочка себя узнает как устаревшую и не перезапустится
    if (pollAbortController) {
      pollAbortController.abort();
      pollAbortController = null;
    }
  }

  async function pollLoop(myGeneration) {
    if (chatAccessBlocked || !longPollingActive || myGeneration !== pollGeneration) return;
    if (document.hidden || navigator.onLine === false) {
      pollTimer=setTimeout(() => pollLoop(myGeneration), Math.min(60000, pollDelay=Math.max(5000,pollDelay*2)));
      return;
    }
    try {
      const token = localStorage.getItem('kk_token');
      if (!token || !currentUserId || !peerId) {
        pollTimer=setTimeout(() => pollLoop(myGeneration), Math.min(60000, pollDelay=Math.max(5000,pollDelay*2)));
        return;
      }
      const url = KITOB_CONFIG.NEON_API_BASE +
                  `/api/messages/new?user1=${currentUserId}&user2=${peerId}&since=${lastMessageTimestamp}`;
      pollAbortController = new AbortController();
      const resp = await fetchWithTimeout(url, {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-store',
        signal: pollAbortController.signal
      }, 35000);
      // пока ждали ответ, могла запуститься новая цепочка (или чат закрылся) — эта цепочка больше не актуальна
      if (chatAccessBlocked || myGeneration !== pollGeneration) return;
      if (!resp.ok) {
        pollTimer=setTimeout(() => pollLoop(myGeneration), Math.min(60000, pollDelay=Math.max(5000,pollDelay*2)));
        return;
      }
      const newMessages = await resp.json();
      if (chatAccessBlocked || myGeneration !== pollGeneration) return;
      if (newMessages.length) {
        const last = newMessages[newMessages.length - 1];
        lastMessageTimestamp = new Date(last.created_at).getTime();
        const cached = getChatCache();
        const next = dedupeMessages(cached.concat(newMessages));
        setChatCache(next);
        const container = document.getElementById('messages');
        const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
        renderMessages(next, container);
        if (wasAtBottom) scrollToBottom();
        if (newMessages.some(m => String(m.sender_id) === String(peerId))) {
          ChatAPI.markMessagesRead(peerId).catch(() => {});
        }
      }
      pollDelay=2000;
      pollTimer=setTimeout(() => pollLoop(myGeneration),pollDelay); // bounded request cadence, never a zero-delay loop
    } catch (e) {
      // A timeout may also be AbortError; only an obsolete/stopped generation exits.
      if (!longPollingActive) return;
      if (myGeneration !== pollGeneration) return;
      pollTimer=setTimeout(() => pollLoop(myGeneration), Math.min(60000, pollDelay=Math.max(5000,pollDelay*2)));
    }
  }

  // ----- остальные функции (кэш, рендер, отправка и т.д.) -----
  function getChatCacheScope() {
    const ownerId = String(currentUserId || localStorage.getItem('kk_user_id') || 'guest');
    return [ownerId, String(peerId || '')].sort().join('_');
  }

  function getCacheKey() {
    return 'kk_chat_messages_' + getChatCacheScope();
  }

  function getPersistentChatCacheKey() {
    return 'kk_chat_messages_persist_' + getChatCacheScope();
  }

  function getChatCache() {
    let cached = null;
    if (typeof CacheManager !== 'undefined') cached = CacheManager.get(getCacheKey());
    if (Array.isArray(cached)) return cached;
    try {
      const stored = JSON.parse(localStorage.getItem(getPersistentChatCacheKey()) || 'null');
      if (stored && Array.isArray(stored.messages) && Date.now() - Number(stored.ts || 0) < 7 * 24 * 60 * 60 * 1000) {
        return stored.messages;
      }
    } catch (e) {}
    return [];
  }

  function setChatCache(messages) {
    const safeMessages = Array.isArray(messages) ? messages.slice(-200) : [];
    if (typeof CacheManager !== 'undefined') CacheManager.set(getCacheKey(), safeMessages);
    try {
      localStorage.setItem(getPersistentChatCacheKey(), JSON.stringify({ ts: Date.now(), messages: safeMessages }));
    } catch (e) {}
    return safeMessages;
  }

  function clearChatCache() {
    if (typeof CacheManager !== 'undefined') CacheManager.invalidateKey(getCacheKey());
    try {
      localStorage.removeItem(getPersistentChatCacheKey());
      localStorage.removeItem('kk_chat_messages_persist_' + peerId);
      localStorage.removeItem('kk_cm_kk_chat_messages_' + peerId);
    } catch (e) {}
  }

  function setTypingIndicator(active) {
    const indicator = document.getElementById('typingIndicator');
    const status = document.getElementById('friendStatusLabel');
    if (!indicator || !status) return;
    indicator.style.display = active ? 'inline' : 'none';
    status.style.display = active ? 'none' : 'inline';
  }

  const menuBtn = document.getElementById('menuBtn');
  const popupMenu = document.getElementById('popupMenu');

  function positionMenu() {
    const headerRect = document.querySelector('.chat-header').getBoundingClientRect();
    popupMenu.style.top = (headerRect.height) + 'px';
    popupMenu.style.right = '10px';
  }

  menuBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    positionMenu();
    popupMenu.classList.toggle('open');
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.menu-btn') && !e.target.closest('.popup-menu')) {
      popupMenu.classList.remove('open');
    }
  });

  function showToast(msg) {
    let t = document.getElementById('chatToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'chatToast';
      t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,0.85);color:#fff;border-radius:999px;padding:10px 20px;font-size:13px;z-index:99999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:88%;text-align:center';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2500);
  }

  function showConfirm(message, okText, isDanger) {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML = `
        <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="chatConfirmTitle" aria-describedby="chatConfirmMessage">
          <div class="confirm-title" id="chatConfirmTitle">Чат</div>
          <div class="confirm-msg" id="chatConfirmMessage">${esc(message)}</div>
          <div class="confirm-btns">
            <button class="confirm-cancel" id="cCancel">Не</button>
            <button class="confirm-ok${isDanger ? ' danger' : ''}" id="cOk">${esc(okText || 'Ха')}</button>
          </div>
        </div>`;
      const opener=document.activeElement,background=document.querySelector('.phone-wrapper');
      document.body.appendChild(overlay);
      const wasInert=background?.inert;
      if(background)background.inert=true;
      const cancel=overlay.querySelector('#cCancel'),ok=overlay.querySelector('#cOk');
      const finish=value=>{overlay.remove();if(background)background.inert=wasInert;if(opener?.isConnected)opener.focus({preventScroll:true});resolve(value)};
      ok.onclick=()=>finish(true);cancel.onclick=()=>finish(false);
      overlay.addEventListener('keydown',event=>{
        if(event.key==='Escape'){event.preventDefault();finish(false)}
        else if(event.key==='Tab'){
          if(event.shiftKey&&document.activeElement===cancel){event.preventDefault();ok.focus()}
          else if(!event.shiftKey&&document.activeElement===ok){event.preventDefault();cancel.focus()}
        }
      });
      cancel.focus();
    });
  }

  async function clearChatLocal() {
    popupMenu.classList.remove('open');
    if (!await showConfirm('Оё мехоҳед ҳамаи паёмҳои ин чатро тоза кунед?', 'Тоза кунед', false)) return;
    if (!currentUserId || !peerId) return;
    try {
      const token = localStorage.getItem('kk_token');
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/messages', {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ user1: currentUserId, user2: peerId })
      });
      if (!resp.ok) throw new Error('Очистка не удалась');
      const container = document.getElementById('messages');
      container.innerHTML = '<div class="loading-msg">Паёмҳо нестанд. Якумро фиристед!</div>';
      clearChatCache();
      showToast('Чат тоза карда шуд');
    } catch (e) {
      showToast('Хатогӣ: ' + e.message);
    }
  }

  async function blockUser() {
    popupMenu.classList.remove('open');
    if (!currentUserId || !peerId) return;
    if (!await showConfirm('Корбар дигар ба шумо навишта наметавонад ва дӯстӣ бекор мешавад. Давом диҳем?', 'Бастан', true)) return;
    try {
      const token = localStorage.getItem('kk_token');
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/users/block', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: peerId })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || 'Блокировка не удалась');
      applyPeerBlock();
      if (typeof CacheManager !== 'undefined') CacheManager.invalidateKey(CacheManager.KEYS.FRIENDS);
      showToast('Корбар блок карда шуд');
    } catch (e) {
      showToast('Хатогӣ: ' + e.message);
    }
  }

  async function reportUser() {
    popupMenu.classList.remove('open');
    if (!currentUserId || !peerId) return;
    if (!await showConfirm('Шумо мехоҳед шикоят фиристед?', 'Фиристед', false)) return;
    try {
      await ChatAPI.sendReport(currentUserId, peerId, 'Жалоба от пользователя');
      showToast('Шикоят фиристода шуд!');
    } catch (e) {
      showToast('Хатогӣ: ' + e.message);
    }
  }

  async function fetchChatStatus() {
    try {
      const token = localStorage.getItem('kk_token');
      if (!token) return;
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/admin/chat-status/' + currentUserId, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!resp.ok) return;
      const data = await resp.json();
      chatIsOpen = !!data.is_open;
      const badge = document.getElementById('chatClosedBadge');
      const input = document.getElementById('msgInput');
      const sendBtn = document.getElementById('sendBtn');
      if (chatIsOpen && !peerIsBlocked && !chatAccessBlocked) {
        badge.style.display = 'none';
        input.disabled = false;
        sendBtn.disabled = false;
        void updateWordCounter();
      } else {
        badge.style.display = 'inline-block';
        input.disabled = true;
        sendBtn.disabled = true;
        input.placeholder = peerIsBlocked ? 'Корбар блок карда шуд' : 'Чат баста шудааст';
      }
    } catch (e) {
      console.warn('Не удалось получить статус чата:', e);
    }
  }

  async function markChatRead() {
    if (chatAccessBlocked || !peerId) return;
    try {
      await ChatAPI.markMessagesRead(peerId);
    } catch (e) {}
    if (typeof CacheManager !== 'undefined') {
      const uid = currentUserId || localStorage.getItem('kk_user_id');
      if (uid) {
        const summaryKey = 'kk_cache_chat_summary_' + uid;
        const cached = CacheManager.get(summaryKey);
        if (cached && cached.by_peer && cached.by_peer[String(peerId)]) {
          const prev = Number(cached.by_peer[String(peerId)].unread_count || 0);
          cached.by_peer[String(peerId)].unread_count = 0;
          cached.total_unread = Math.max(0, Number(cached.total_unread || 0) - prev);
          CacheManager.set(summaryKey, cached);
        } else {
          CacheManager.invalidateKey(summaryKey);
        }
      }
    }
  }

  async function refreshMessagesFromServer(keepScroll = true, cachedMsgs = null) {
    const msgContainer = document.getElementById('messages');
    if (chatAccessBlocked || pendingOutgoingCount > 0) return;
    try {
      const msgs = await ChatAPI.getMessages(currentUserId, peerId);
      if (chatAccessBlocked) return;
      void markChatRead();
      if (!msgs || msgs.length === 0) {
        renderMessages([],msgContainer);
        setChatCache([]);
        return;
      }
      setChatCache(msgs);
      if (msgContainer.querySelector('.sending-dots')) return;
      renderMessages(msgs, msgContainer);
      if (!keepScroll) scrollToBottom();
      else {
        const isAtBottom = msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight < 50;
        if (isAtBottom) scrollToBottom();
      }
      updateWordCounter();
    } catch (e) {
      console.error(e);
      void markChatRead();
      const cached = getChatCache();
      if (!cached || cached.length === 0) {
        msgContainer.innerHTML = '<div class="loading-msg">Хатогӣ: ' + esc(e.message) + '</div>';
      }
    }
  }

  async function fetchBlockStatus() {
    if (chatAccessBlocked) return false;
    const token = localStorage.getItem('kk_token');
    if (!token || !peerId) return false;
    try {
      const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/users/block-status/' + encodeURIComponent(peerId), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = r.ok ? await r.json() : { blocked: false };
      if (data.blocked) {
        applyPeerBlock();
      }
      return !!data.blocked;
    } catch (e) { return false; }
  }

  async function loadMessages(keepScroll = true) {
    const msgContainer = document.getElementById('messages');
    if (chatAccessBlocked || pendingOutgoingCount > 0) return;
    try {
      if (!currentUserId) {
        const { data } = await AUTH.getUser();
        if (chatAccessBlocked) return;
        if (!data.user) {
          msgContainer.innerHTML = '<div class="loading-msg">Логин шавед барои чат</div>';
          return;
        }
        currentUserId = data.user.id;
      }

      const cachedMsgs = getChatCache();
      if (cachedMsgs && cachedMsgs.length > 0) {
        renderMessages(cachedMsgs, msgContainer);
        if (!keepScroll) scrollToBottom();
        else {
          const isAtBottom = msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight < 50;
          if (isAtBottom) scrollToBottom();
        }
        void updateWordCounter();
      } else {
        msgContainer.innerHTML = '<div class="loading-msg">Чат кушода мешавад…</div>';
      }

      void refreshMessagesFromServer(keepScroll, cachedMsgs);

    } catch (e) {
      console.error(e);
      const cached = getChatCache();
      if (!cached || cached.length === 0) {
        msgContainer.innerHTML = '<div class="loading-msg">Хатогӣ: ' + esc(e.message) + '</div>';
      }
    }
  }

  function renderMessages(msgs, container) {
    const transientRows=[...container.querySelectorAll('.msg-row')].filter(row=>row.querySelector('.check.pending,.check.failed'));
    if (!msgs || msgs.length === 0) {
      container.innerHTML = transientRows.length?'':'<div class="loading-msg">Паёмҳо нестанд. Якумро фиристед!</div>';
      container.append(...transientRows);
      return;
    }
    let html = '';
    let lastDate = '';
    msgs.forEach(m => {
      const isMine = String(m.sender_id) === String(currentUserId);
      const time = timeLabel(m.created_at);
      const checkClass = m.status === 'read' ? 'read' : 'delivered';
      const checkTitle = m.status === 'read' ? 'Прочитано' : 'Доставлено';
      const checkHtml = `<span class="check ${checkClass}" title="${checkTitle}">✓✓</span>`;
      const dateLabel = formatDate(m.created_at);
      if (dateLabel !== lastDate) {
        html += `<div class="date-sep">${dateLabel}</div>`;
        lastDate = dateLabel;
      }
      if (m.deleted) {
        html += `
        <div class="msg-row ${isMine ? 'out' : 'in'}">
          <div class="bubble ${isMine ? 'out' : 'in'} deleted" data-msg-id="${m.id}">
            <div class="bubble-body"><span class="bubble-text">🚫 Паём нест карда шуд</span><span class="bubble-spacer"></span></div>
            <div class="bubble-meta">${time}</div>
          </div>
        </div>
      `;
        return;
      }
      html += `
        <div class="msg-row ${isMine ? 'out' : 'in'}">
          <div class="bubble ${isMine ? 'out' : 'in'}" data-msg-id="${m.id}" ${isMine ? 'data-deletable="1"' : ''}>
            <div class="bubble-body"><span class="bubble-text">${esc(m.text)}</span><span class="bubble-spacer"></span></div>
            <div class="bubble-meta">
              ${time}
              ${isMine ? checkHtml : ''}
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
    container.append(...transientRows);
  }

  // ===== УДАЛЕНИЕ ПО ДОЛГОМУ НАЖАТИЮ (3 сек), как в WhatsApp — только свои сообщения,
  // удаляется сразу и у себя, и у собеседника =====
  const LONG_PRESS_MS = 3000;
  const LONG_PRESS_MOVE_TOLERANCE = 12; // px — если палец/курсор уехал дальше, значит это скролл, а не удержание
  let longPressTimer = null;
  let longPressStartX = 0, longPressStartY = 0;
  let longPressBubble = null;

  function clearLongPress() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (longPressBubble) { longPressBubble.classList.remove('pressing'); longPressBubble = null; }
  }

  async function handleMessageDeleteRequest(bubbleEl) {
    const messageId = bubbleEl.dataset.msgId;
    if (!messageId) return;
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    bubbleEl.classList.add('selected');
    const ok = await showConfirm('Ин паёмро барои ҳама нест кунам?', 'Нест кардан', true);
    bubbleEl.classList.remove('selected');
    if (!ok) return;
    try {
      await ChatAPI.deleteMessage(messageId);
      // Оптимистично обновляем локально — не ждём следующего long-poll цикла
      const cached = getChatCache();
      const idx = cached.findIndex(m => String(m.id) === String(messageId));
      if (idx !== -1) {
        cached[idx] = { ...cached[idx], deleted: true, text: '' };
        setChatCache(cached);
        renderMessages(cached, document.getElementById('messages'));
      }
    } catch (e) {
      showToast('Хатогӣ: ' + e.message);
    }
  }

  function initLongPressDelete() {
    const container = document.getElementById('messages');
    if (!container) return;

    const onDown = (ev) => {
      const bubble = ev.target.closest('.bubble[data-deletable="1"]');
      if (!bubble) return;
      clearLongPress();
      longPressBubble = bubble;
      longPressStartX = ev.clientX; longPressStartY = ev.clientY;
      bubble.classList.add('pressing');
      longPressTimer = setTimeout(() => {
        clearLongPress();
        handleMessageDeleteRequest(bubble);
      }, LONG_PRESS_MS);
    };
    const onMove = (ev) => {
      if (!longPressTimer || !longPressBubble) return;
      const dx = Math.abs(ev.clientX - longPressStartX), dy = Math.abs(ev.clientY - longPressStartY);
      if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) clearLongPress();
    };
    const onUp = () => clearLongPress();

    container.addEventListener('pointerdown', onDown);
    container.addEventListener('pointermove', onMove);
    container.addEventListener('pointerup', onUp);
    container.addEventListener('pointercancel', onUp);
    container.addEventListener('pointerleave', onUp);
    // На некоторых Android WebView скролл может "съесть" pointer-события —
    // на всякий случай гасим удержание и при обычном touchend/touchcancel тоже.
    container.addEventListener('touchend', onUp, { passive: true });
    container.addEventListener('touchcancel', onUp, { passive: true });
    // Если страница уходит в фон во время удержания (например, пришёл звонок) — не удаляем случайно.
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearLongPress(); });
  }

  function timeLabel(v) {
    try { return new Date(v).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
    catch (_) { return ''; }
  }

  function formatDate(d) {
    const today = new Date(), yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const dd = new Date(d);
    if (dd.toDateString() === today.toDateString()) return 'Имрӯз';
    if (dd.toDateString() === yesterday.toDateString()) return 'Дирӯз';
    return dd.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  }

  function scrollToBottom() {
    setTimeout(() => {
      const msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }, 50);
  }

  async function updateWordCounter() {
    if (chatAccessBlocked) return;
    try {
      const token = localStorage.getItem('kk_token');
      if (!token) return;
      const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/daily-words', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (r.ok) {
        const data = await r.json();
        const remaining = Number(data.remaining);
        if(!Number.isFinite(remaining))return;
        dailyWordsRemaining=remaining;
        const el = document.getElementById('wordCounter');
        el.textContent = 'Шумо метавонед ' + remaining + ' калимаи дигар фиристед';
        if (remaining < 10) el.classList.add('alert');
        else el.classList.remove('alert');
        if (chatIsOpen && !peerIsBlocked && !chatAccessBlocked) {
          document.getElementById('sendBtn').disabled = (remaining <= 0);
        }
      }
    } catch (e) {}
  }

  async function sendTypingState(typing) {
    if (chatAccessBlocked || (typing && peerIsBlocked)) return;
    const token = localStorage.getItem('kk_token');
    if (!token || !peerId) return;
    try {
      await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/typing', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ receiver_id: peerId, typing })
      });
    } catch (e) {}
  }

  async function refreshTypingIndicator() {
    if (chatAccessBlocked) return;
    const token = localStorage.getItem('kk_token');
    const indicator = document.getElementById('typingIndicator');
    const status = document.getElementById('friendStatusLabel');
    if (!token || !indicator || !status || !peerId) return;
    try {
      const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/typing/' + encodeURIComponent(peerId), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = r.ok ? await r.json() : { typing: false };
      indicator.style.display = data.typing ? 'inline' : 'none';
      status.style.display = data.typing ? 'none' : 'inline';
    } catch (e) {}
  }

  async function sendMessage() {
    if (chatAccessBlocked || peerIsBlocked) return;
    if (!chatIsOpen) {
      showToast('Чат баста шудааст');
      return;
    }
    if(dailyWordsRemaining!==null&&dailyWordsRemaining<=0){showToast('Маҳдудияти рӯзонаи калимаҳо ба охир расид');return;}
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !currentUserId || !peerId) return;
    input.value = '';
    input.style.height = '0';
    input.style.height = input.scrollHeight + 'px';

    const tempId = 'temp_' + Date.now();
    const time = timeLabel(new Date().toISOString());
    const msgContainer = document.getElementById('messages');
    const dateLabel = formatDate(new Date().toISOString());
    const lastDateEl = [...msgContainer.querySelectorAll('.date-sep')].at(-1);
    if (!lastDateEl || lastDateEl.textContent !== dateLabel) {
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.textContent = dateLabel;
      msgContainer.appendChild(sep);
    }
    const row = document.createElement('div');
    row.className = 'msg-row out';
    row.dataset.tempId = tempId;
    const bubble = document.createElement('div');
    bubble.className = 'bubble out';
    const textEl = document.createElement('div');
    textEl.className = 'bubble-body';
    textEl.innerHTML = '<span class="bubble-text"></span><span class="bubble-spacer"></span>';
    textEl.querySelector('.bubble-text').textContent = text;
    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    meta.innerHTML = time + ' <span class="check pending" title="Отправляется">✓</span>';
    bubble.appendChild(textEl);
    bubble.appendChild(meta);
    row.appendChild(bubble);
    msgContainer.appendChild(row);
    scrollToBottom();
    pendingOutgoingCount += 1;

    try {
      const sentMsg = await ChatAPI.sendMessage(currentUserId, peerId, text);
      const pendingCheck = meta.querySelector('.check.pending');
      if (pendingCheck) {
        pendingCheck.className = 'check delivered';
        pendingCheck.title = 'Доставлено';
        pendingCheck.textContent = '✓✓';
      }
      // Сразу делаем пузырь доступным для удаления долгим нажатием,
      // не дожидаясь следующего цикла опроса/перерисовки.
      if (sentMsg && sentMsg.id != null) {
        bubble.dataset.msgId = sentMsg.id;
        bubble.dataset.deletable = '1';
      }
      const cached = getChatCache();
      if (Array.isArray(cached)) {
        setChatCache(dedupeMessages(cached.concat([sentMsg])));
      }
      updateWordCounter();
    } catch (e) {
      const pendingCheck = meta.querySelector('.check.pending');
      if (pendingCheck) {
        pendingCheck.className = 'check failed';
        pendingCheck.title = 'Не отправлено';
        pendingCheck.textContent = '⚠';
      }
      const recover=document.createElement('button');recover.type='button';recover.className='recover-message';recover.textContent='Ба таҳрир';recover.setAttribute('aria-label','Баргардонидани паёми норасида ба таҳрир');
      recover.addEventListener('click',()=>{
        if(input.value.trim()){showToast('Аввал паёми ҷории худро нигоҳ доред ё фиристед');return;}
        input.value=text;input.dispatchEvent(new Event('input'));input.focus();row.remove();
      });
      meta.append(recover);
      showToast('Паём фиристода нашуд. Ҳолати расиданро санҷед; матнро ба таҳрир баргардондан мумкин аст.');
      console.error(e);
    } finally {
      pendingOutgoingCount = Math.max(0, pendingOutgoingCount - 1);
    }
  }

  const EMOJIS = [
    '😀','😂','😄','😆','😉','😊','😍','😎','😐','😒',
    '😔','😕','😘','😚','😜','😟','😢','😥','😨','😭',
    '😱','😳','😷','🤔','🤗','🤣','🤩','🥰','🥳','🥺',
    '❤️','💔','💥','💯','🔥','⭐','🌟','💫','✨','🎉',
    '👍','👎','👏','🙏','👋','✌️','🤝','💊','💋','💪',
    '📚','📝','💡','🔔','🌈','🍎','🍕','☕','🎂','🎁'
  ];
  const emojiPanel = document.getElementById('emojiPanel');
  emojiPanel.innerHTML = EMOJIS.map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('');

  function insertEmoji(emoji) {
    const input = document.getElementById('msgInput');
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
    input.selectionStart = input.selectionEnd = start + emoji.length;
    input.focus();
    input.dispatchEvent(new Event('input'));
  }
  window.insertEmoji = insertEmoji;

  document.querySelector('.emoji-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    emojiPanel.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.composer')) emojiPanel.classList.remove('open');
  });

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  document.getElementById('msgInput').addEventListener('input', function() {
    this.style.height = '0';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    clearTimeout(typingTimer);
    if (this.value.trim()) {
      if (!typingActiveSent) {
        typingActiveSent = true;
        sendTypingState(true);
      }
      typingTimer = setTimeout(() => {
        typingActiveSent = false;
        sendTypingState(false);
      }, 1200);
    } else {
      typingActiveSent = false;
      sendTypingState(false);
    }
  });

  function goBack() {
    if (history.length > 1) history.back();
    else location.href = 'chats.html';
  }

  function blockChatForAge(needsLogin = false) {
    chatAccessBlocked = true;
    stopLongPolling();
    clearTimeout(typingTimer);
    const input=document.getElementById('msgInput'),send=document.getElementById('sendBtn');
    const lang=typeof getAppLanguage==='function'?getAppLanguage():'tg';
    const text=lang==='ru'
      ? 'Чат недоступен гостям и пользователям младше 18 лет. Заполните профиль, чтобы пользоваться чатом.'
      : lang==='en'
        ? 'Chat is unavailable to guests and users under 18. Complete your profile to use chat services.'
        : 'Чат барои меҳмонон ва корбарони то 18-сола дастрас нест. Профили худро пурра намуда аз хизматрасониҳои чат истифода намоед.';
    const profile=needsLogin
      ? (lang==='ru'?'Войти':lang==='en'?'Sign in':'Ворид шудан')
      : (lang==='ru'?'Заполнить профиль':lang==='en'?'Complete profile':'Таҳрири профил');
    const profileHref=needsLogin?'login.html':'profile.html?edit=1';
    if(input){input.disabled=true;input.placeholder=lang==='ru'?'Чат недоступен':lang==='en'?'Chat unavailable':'Чат дастрас нест';}
    if(send)send.disabled=true;
    const label=document.getElementById('friendStatusLabel');if(label)label.textContent=lang==='ru'?'🔒 Чат закрыт':lang==='en'?'🔒 Chat locked':'🔒 Чат баста';
    const messages=document.getElementById('messages');
    if(messages)messages.innerHTML=`<div class="loading-msg" style="white-space:normal;line-height:1.6;text-align:center;padding:18px">🔒 ${esc(text)}<br><button class="btn btn-primary" style="margin-top:14px" onclick="location.href='${profileHref}'">${esc(profile)}</button></div>`;
  }

  async function loadPeerAvatar() {
    if (!peerId) return true;
    try {
      const profile = await NEON_API.getProfile(peerId);
      if (profile?.display_name) document.getElementById('headNameText').textContent = profile.display_name;
      document.getElementById('verifiedBadge').innerHTML = profile?.verified ? verifiedBadgeSvg() : '';
      if (profile?.avatar_url) document.getElementById('chatAvatar').innerHTML = `<img src="${esc(profile.avatar_url)}" alt="">`;
      const peerBirthYear=Number(profile?.birth_year||0);
      if (!peerBirthYear || peerBirthYear>new Date().getFullYear()-18) { blockChatForAge(); return false; }
      return true;
    } catch (e) { return true; }
  }

  async function init() {
    const msgsEl = document.getElementById('messages');
    // Показываем цитаты СРАЗУ, ещё до первого ответа сервера — обычно ждём не потому,
    // что запрос провалился, а просто потому, что он медленный (Edge пробует, потом
    // переключается на Render). Раньше в эти секунды был просто пустой спиннер.
    let stopQuoteRotation = typeof renderWisdomLoader === 'function' ? renderWisdomLoader(msgsEl) : null;
    try {
    let { data } = await AUTH.getUser();
    if (!data.user) {
      if (stopQuoteRotation) stopQuoteRotation();
      blockChatForAge(true);
      return;
    }
    if (data.user.profile_unknown) {
      // сервер совсем не ответил (а не просто медленно) — не решаем ничего про возраст,
      // пока не выясним по-настоящему, иначе ложно покажем "танҳо барои 18+"
      if (!stopQuoteRotation) stopQuoteRotation = typeof renderWisdomLoader === 'function' ? renderWisdomLoader(msgsEl) : null;
      let resolved = false;
      for (let attempt = 0; attempt < 5 && !resolved; attempt++) {
        await new Promise(r => setTimeout(r, 2500));
        try {
          const retryRes = await AUTH.getUser();
          if (retryRes.data.user && !retryRes.data.user.profile_unknown) { data = retryRes.data; resolved = true; }
        } catch (e) {}
      }
      if (stopQuoteRotation) stopQuoteRotation();
      if (!resolved) {
        msgsEl.innerHTML = '<div class="loading-msg">Сервер ҳоло дастрас нест. <a href="javascript:location.reload()" style="color:var(--gold2,#E8C96D)">Аз нав кӯшиш кунед</a></div>';
        return;
      }
    }
    if (stopQuoteRotation) stopQuoteRotation();
    currentUserId = data.user.id;
    const birthYear=Number(data.user.birth_year||0);
    const isGuest=data.user.is_temporary===true||String(data.user.username||'').startsWith('guest_');
    if (isGuest||!birthYear||birthYear>new Date().getFullYear()-18) { blockChatForAge(); return; }
    const peerAllowed=await loadPeerAvatar();
    if (!peerAllowed||chatAccessBlocked) return;
    await Promise.all([fetchBlockStatus(),fetchChatStatus()]);
    void markChatRead();
    void loadMessages(false);
    startLongPolling(); // instead of the legacy poller
    } catch(error) {
      stopLongPolling();
      const message=document.createElement('div');message.className='loading-msg';message.setAttribute('role','alert');message.textContent='Хатогӣ: '+error.message;
      const retry=document.createElement('button');retry.type='button';retry.className='chat-retry';retry.textContent='Аз нав кӯшиш кунед';retry.addEventListener('click',()=>location.reload());
      message.append(document.createElement('br'),retry);msgsEl.replaceChildren(message);
    } finally {if(stopQuoteRotation)stopQuoteRotation();}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopLongPolling();
      if (typingActiveSent) {
        typingActiveSent = false;
        sendTypingState(false);
      }
    } else if (!chatAccessBlocked) {
      startLongPolling();
      void markChatRead();
      void loadMessages(true);
    }
  });

  window.addEventListener('focus', () => {
    if (!chatAccessBlocked) void markChatRead();
  });

  window.addEventListener('offline',stopLongPolling);
  window.addEventListener('online',()=>{if(!document.hidden)startLongPolling()});
  window.addEventListener('pagehide',stopLongPolling);
  window.addEventListener('pageshow',()=>{if(!document.hidden)startLongPolling()});

  window.addEventListener('beforeunload', () => {
    stopLongPolling();
    clearTimeout(typingTimer);
    if (typingActiveSent) sendTypingState(false);
  });

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  window.clearChatLocal = clearChatLocal;
  window.blockUser = blockUser;
  window.reportUser = reportUser;
</script>
