<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1729">
  <title>Алия — Китобхона</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <script src="../assets/libs/pdf.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#06101d;color:#F0EAD6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
    button{-webkit-tap-highlight-color:transparent}
    .ra-app{height:100dvh;display:flex;flex-direction:column;min-height:0}
    /* шапка: бозгашт · Алия + китоб · ёддоштҳо */
    .ra-head{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:#0b1729;border-bottom:1px solid rgba(201,168,76,.22);flex:0 0 auto}
    .ra-back{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#E8C96D;font-size:26px;line-height:1;text-decoration:none;flex:0 0 38px;background:none;border:0;cursor:pointer}
    .ra-title{flex:1;min-width:0}
    .ra-title b{display:flex;align-items:center;gap:7px;color:#E8C96D;font-size:16px}
    .ra-title small{display:block;color:#9fb0c6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .ra-notes{height:38px;border-radius:11px;border:1px solid rgba(201,168,76,.28);background:#0D1B2A;color:#E8C96D;display:flex;align-items:center;gap:6px;padding:0 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto}
    /* як прокрутка барои ҳама — бе «экран дар дохили экран» */
    .ra-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .ra-inner{width:min(900px,100%);margin:0 auto;padding:10px 10px calc(24px + env(safe-area-inset-bottom,0px))}
    .ra-load{display:flex;align-items:center;gap:8px;color:#9fb0c6;font-size:12.5px;padding:2px 4px 8px}
    .ra-load[hidden]{display:none}
    .ra-load i{flex:1;height:3px;border-radius:2px;background:rgba(201,168,76,.15);overflow:hidden;position:relative}
    .ra-load i::after{content:"";position:absolute;inset:0;width:var(--p,30%);background:#E8C96D;border-radius:2px;transition:width .2s}
    #raAns{margin-top:10px}
  </style>
<link rel="stylesheet" href="reader-approved.css?v=20261121">
<script>
(function(){function theme(){var t="dark";try{t=localStorage.getItem("kk_theme")||"dark"}catch(e){} document.body.classList.remove("dark","minimal");if(t==="dark")document.body.classList.add("dark");else if(t==="minimal")document.body.classList.add("minimal")}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",theme,{once:true});else theme();window.addEventListener("storage",function(e){if(e.key==="kk_theme")theme()});})();
</script></head>
<body class="at-navy">
<div class="ra-app">
  <header class="ra-head">
    <a class="ra-back" id="raBack" href="../reader.html" aria-label="Бозгашт ба китоб">‹</a>
    <div class="ra-title"><b><span id="raEmb"></span>Алия</b><small id="raLabel">Китоб боргузорӣ мешавад…</small></div>
    <button class="ra-notes" id="raNotesBtn" type="button" title="Ёддоштҳои ин китоб" aria-label="Ёддоштҳо">🔖 <span id="raNotesCount">0</span></button>
  </header>

  <div class="ra-scroll" id="raScroll">
    <div class="ra-inner">
      <div class="ra-load" id="raLoad" hidden><span id="raLoadTxt">Китоб боргузорӣ мешавад</span><i id="raLoadBar"></i></div>
      <nav id="raTasks" aria-label="Амалҳои Алия"></nav>
      <section id="raAns" aria-live="polite"></section>
    </div>
  </div>
</div>

<script src="aliya-bridge.js?v=159"></script>
<script src="aliya-doc-templates.js?v=161"></script>
<script src="aliya-tasks.js?v=161"></script>
<script>
(function () {
  'use strict';
  var AT = window.AliyaTasks;
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  var bookUrl = AT.bookKey(qs.get('url') || '');
  var bookName = qs.get('name') || 'Китоб';
  var curPage = Math.max(1, parseInt(qs.get('page'), 10) || 1);
  var grade = AT.detectGrade(safeDecode(bookUrl), bookName);
  var pdfDoc = null, reader = null, loading = null, totalPages = 0, busy = false, current = null;
  // v159: дар дохили Reader (iframe) кушода шудааст — китоби аллакай кушодаи Reader истифода мешавад
  var host = null;
  try { if (qs.get('embed') === '1' && window.parent !== window && window.parent.__kkCloseAliya) host = window.parent; } catch (e) { host = null; }
  if (host) document.documentElement.classList.add('ra-embed');
  function hostDoc() {
    try {
      var d = host && host.__kkReaderDoc;
      if (d && d.doc && d.doc.numPages && AT.bookKey(d.url) === bookUrl) return d.doc;
    } catch (e) {}
    return null;
  }
  var states = {};

  $('raEmb').innerHTML = AT.emblem(false, 'navy');
  function readerHref(page) {
    return '../reader.html?url=' + encodeURIComponent(bookUrl) + '&name=' + encodeURIComponent(bookName) + '&page=' + (page || curPage);
  }
  if (bookUrl) $('raBack').href = readerHref(curPage);
  $('raBack').addEventListener('click', function (e) {
    if (current) current.abort(false);               // v159: баромадан — кори Алия қатъ мешавад
    if (host) { e.preventDefault(); host.__kkCloseAliya(); return; }
    // агар аз Reader омада бошем — бозгашти таърих (ҳолати Reader нигоҳ дошта мешавад)
    if (document.referrer && /reader\.html/.test(document.referrer) && history.length > 1) { e.preventDefault(); history.back(); }
  });

  function setLabel() {
    $('raLabel').textContent = '«' + bookName + '» · саҳ. ' + curPage + (totalPages ? ' аз ' + totalPages : '');
  }
  function updateCount() { $('raNotesCount').textContent = bookUrl ? AT.notes.count(bookUrl) : 0; }
  setLabel(); updateCount();

  function showEmpty(msg) {
    $('raAns').innerHTML = '<div class="at-ans"><div class="at-empty">' + AT.emblem(false, 'navy') + '<span>' + AT.esc(msg) + '</span></div></div>';
  }
  showEmpty('Амалро интихоб кунед. Алия бо матни ҳамин китоб кор мекунад — ҳам PDF-и матнӣ, ҳам китоби сканшуда.');

  // Китоб дар замина бор мешавад (аз кэши Reader — фавран)
  function ensureBook() {
    if (pdfDoc) return Promise.resolve(pdfDoc);
    if (!bookUrl) return Promise.reject(new Error('Китоб интихоб нашудааст. Китобро аз Китобхона кушоед.'));
    var shared = hostDoc();
    if (shared && !loading) {
      loading = Promise.resolve(shared).then(function (doc) {
        pdfDoc = doc; totalPages = doc.numPages; curPage = Math.min(curPage, totalPages);
        reader = AT.createPageReader(doc, { bookUrl: bookUrl, bookName: bookName });
        setLabel();
        return doc;
      });
    }
    if (!loading) {
      var timer = setTimeout(function () { $('raLoad').hidden = false; }, 400);
      loading = AT.loadPdf(bookUrl, function (loaded, total) {
        if (total) $('raLoadBar').style.setProperty('--p', Math.round(loaded / total * 100) + '%');
        $('raLoadTxt').textContent = (loaded === 1 && total === 1) ? 'Китоб аз хотираи дастгоҳ кушода мешавад…' : 'Китоб боргузорӣ мешавад' + (total ? ' · ' + Math.round(loaded / total * 100) + '%' : '');
      }).then(function (doc) {
        clearTimeout(timer); $('raLoad').hidden = true;
        pdfDoc = doc; totalPages = doc.numPages; curPage = Math.min(curPage, totalPages);
        reader = AT.createPageReader(doc, { bookUrl: bookUrl, bookName: bookName });
        setLabel();
        return doc;
      }, function (err) {
        clearTimeout(timer); $('raLoad').hidden = true; loading = null;
        throw new Error('Китоб боргузорӣ нашуд (' + (err && err.message || err) + '). Интернетро санҷед ва дубора кӯшиш кунед.');
      });
    }
    return loading;
  }
  ensureBook().catch(function (e) { showEmpty(e.message); });

  function setBusy(v) {
    busy = v;
    document.querySelectorAll('#raTasks .at-task').forEach(function (b) { b.disabled = v; });
  }
  function ctx() { return { curPage: curPage, totalPages: totalPages, grade: grade, gradeAuto: true, fixedPage: true }; }

  function start(task, opts) {
    document.querySelectorAll('#raTasks .at-task').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-task') === task); });
    if (current) current.abort();
    current = AT.run({
      box: $('raAns'), task: task, opts: opts, bookName: bookName, bookUrl: bookUrl, scroller: $('raScroll'),
      onBusy: setBusy, onSaved: updateCount,
      getText: function (o, ui) {
        return ensureBook().then(function () { return reader.rangeText(o.from, o.to, ui); });
      }
    });
  }

  function pick(task) {
    if (busy) return;
    if (!bookUrl) { AT.toast('Китоб интихоб нашудааст. Китобро аз Китобхона кушоед.'); return; }
    if (task === 'words') { start('words', { from: curPage, to: curPage }); return; }
    var st = states[task] || (states[task] = AT.newState(curPage));
    var def = AT.TASKS[task];
    function render() {
      var sh = AT.openSheet('<h3>' + def.ic + ' ' + AT.esc(def.label) + '</h3>' + AT.fieldsHTML(task, st, ctx()) +
        '<div class="at-ferr" id="fErr"></div><button type="button" class="at-go" id="fGo">Оғоз</button><button type="button" class="at-cancel" id="fCancel">Бекор</button>');
      AT.bindFields(sh, task, st, ctx(), render);
      $('fCancel').onclick = AT.closeSheet;
      $('fGo').onclick = function () {
        var v = AT.validate(task, st, ctx());
        if (v.error) { $('fErr').textContent = v.error; return; }
        AT.closeSheet();
        start(task, v.opts);
      };
    }
    render();
  }
  AT.renderTaskGrid($('raTasks'), pick, { wide: true });

  // Ёддоштҳои ин китоб — дар варақаи поёнӣ
  $('raNotesBtn').addEventListener('click', function () {
    var sh = AT.openSheet('<h3>🔖 Ёддоштҳо</h3><div id="raNotesList"></div>');
    AT.renderNotesList(sh.querySelector('#raNotesList'), {
      book: bookUrl, onChange: updateCount,
      onGo: function (page) { if (host) { AT.closeSheet(); host.__kkReaderGoPage(page); } else location.href = readerHref(page); }
    });
  });
  window.addEventListener('pageshow', updateCount);
  // v159: ҳангоми баромадан аз саҳифа (ё бастани қабати Алия) кор худкор қатъ мешавад
  window.addEventListener('pagehide', function () { if (current) current.abort(false); });
})();
</script>
</body>
</html>
