<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F12">
  <title>Алия — Ёвари китобхон</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <script src="../assets/libs/pdf.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#06101d;color:#F0EAD6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .ra-app{min-height:100dvh;display:flex;flex-direction:column}
    .ra-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(201,168,76,.22);position:sticky;top:0;background:#0b1729;z-index:2}
    .ra-back{color:#E8C96D;text-decoration:none;font-size:28px;line-height:1;padding:2px 10px}
    .ra-title{font-weight:700;color:#E8C96D;font-size:16px;flex:1;min-width:0}
    .ra-title small{display:block;color:#aebbd0;font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ra-body{width:min(1100px,100%);margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
    .ra-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;background:rgba(7,15,26,.6);border:1px solid rgba(201,168,76,.18);border-radius:12px}
    .ra-settings label{display:flex;flex-direction:column;gap:4px;color:#aebbd0;font-size:11px;font-weight:700}
    .ra-settings input,.ra-settings select{width:100%;height:38px;background:#101e31;color:#f0ead6;border:1px solid rgba(201,168,76,.24);border-radius:8px;padding:0 8px;font:inherit}
    .ra-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .ra-btn{min-height:46px;background:#14263e;color:#F0EAD6;border:1px solid rgba(201,168,76,.25);border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
    .ra-btn:disabled{opacity:.5;cursor:default}
    .ra-row{display:flex;gap:8px}
    .ra-row input{flex:1;min-width:0;background:#0D1B2A;border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:10px 12px;color:#F0EAD6;font:inherit;font-size:14px}
    .ra-send{background:#E8C96D;color:#0D1B2A;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
    .ra-result{min-height:180px;background:#0D1B2A;border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:16px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
    .ra-note{color:#aebbd0;font-size:12px}
    @media(max-width:700px){.ra-grid{grid-template-columns:1fr}.ra-settings{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="ra-app">
  <header class="ra-head">
    <a class="ra-back" id="raBack" href="../reader.html" aria-label="Бозгашт ба китоб">‹</a>
    <div class="ra-title">✨ Алия — Ёвари китобхон<small id="raLabel">Китоб загун мешавад…</small></div>
  </header>

  <main class="ra-body">
    <div class="ra-settings" aria-label="Танзимоти омӯзиш">
      <label>Аз саҳифа <input id="raFrom" type="number" min="1" value="1"></label>
      <label>То саҳифа <input id="raTo" type="number" min="1" value="1"></label>
      <label>Синф <select id="raGrade"><option value="">Муайян накарда</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option></select></label>
      <label>Забони нақша <select id="raLang"><option value="Тоҷикӣ" selected>Тоҷикӣ</option><option value="Русский">Русский</option><option value="English">English</option></select></label>
      <label>Савол <select id="raCount"><option>4</option><option>6</option><option>8</option><option>10</option></select></label>
      <label>Навъи тест <select id="raType"><option value="multiple choice">Вариантҳо</option><option value="open-ended">Кушода</option><option value="mixed">Омехта</option></select></label>
    </div>

    <div class="ra-grid">
      <button class="ra-btn" data-task="summary">📝 Хулосаи саҳифа</button>
      <button class="ra-btn" data-task="words">📖 Калимаҳои мушкил</button>
      <button class="ra-btn" data-task="test">❓ Санҷиш ва тест</button>
      <button class="ra-btn" data-task="lesson">🎓 Нақшаи дарс</button>
      <button class="ra-btn" data-task="translate">🌐 Тарҷума ба русӣ</button>
      <button class="ra-btn" data-task="notes">📌 Сабт дар ёддошт</button>
    </div>

    <form class="ra-row" id="raForm">
      <input id="raPrompt" type="text" placeholder="Саволи худро оид ба ин китоб нависед...">
      <button class="ra-send" type="submit">Ирсол</button>
    </form>

    <div class="ra-result" id="raResult">Барои таҳлил тугмаҳои болоро пахш кунед ё савол нависед.</div>
    <p class="ra-note" id="raNote">Танҳо китобҳои матнии PDF дастрасанд. Барои PDF-и скан ҳоло танҳо матни дастрас таҳлил мешавад.</p>
  </main>
</div>

<script>
(function () {
  'use strict';
  var GATEWAY = 'https://sharipovip-aliya-gateway.hf.space';
  var qs = new URLSearchParams(location.search);
  var bookUrl = qs.get('url') || '';
  var bookName = qs.get('name') || 'Китоб';
  var curPage = Math.max(1, Number(qs.get('page')) || 1);
  var totalPages = 0;
  var pdfDoc = null;

  var $ = function (id) { return document.getElementById(id); };
  var resBox = $('raResult');
  var label = $('raLabel');
  var fromEl = $('raFrom'), toEl = $('raTo');

  // Ссылка «назад» ведёт к той же книге на той же странице
  if (bookUrl) {
    $('raBack').href = '../reader.html?url=' + encodeURIComponent(bookUrl) +
      '&name=' + encodeURIComponent(bookName) + '&page=' + curPage;
  }

  function setLabel(extra) {
    label.textContent = '«' + bookName + '» · саҳифаи ' + curPage + (totalPages ? ' аз ' + totalPages : '') + (extra ? ' · ' + extra : '');
  }

  function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Загрузка книги (PDF) через pdf.js
  async function loadBook() {
    if (!bookUrl) { setLabel('китоб интихоб нашудааст'); resBox.textContent = 'Китоб интихоб нашудааст. Аз Китобхона дубора кушоед.'; return; }
    try {
      if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '../assets/libs/pdf.worker.min.js';
      var resp = await fetch(bookUrl, { cache: 'force-cache' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var buf = await resp.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      totalPages = pdfDoc.numPages;
      fromEl.max = totalPages; toEl.max = totalPages;
      fromEl.value = curPage; toEl.value = curPage;
      setLabel();
    } catch (e) {
      setLabel('хатогии боркунӣ');
      resBox.textContent = 'Китобро боргузорӣ нашуд: ' + (e && e.message || e) + '. Интернетро санҷед ва дубора кӯшиш кунед.';
    }
  }

  // Матни диапазони саҳифаҳо (ё PDF-и скан: ҳоло холӣ)
  async function extractRange(first, last) {
    if (!pdfDoc) throw new Error('Китоб боргузорӣ нашудааст.');
    var parts = [];
    for (var n = first; n <= last; n++) {
      var p = await pdfDoc.getPage(n);
      var c = await p.getTextContent();
      var t = c.items.map(function (it) { return it.str; }).join(' ').trim();
      if (t) parts.push('[САҲИФА ' + n + ']\n' + t);
    }
    var text = parts.join('\n\n').slice(0, 28000);
    return text;
  }

  // PDF-и скан (матн нест): картинкаи як саҳифаро ба /v1/vision мефиристем
  async function renderPageJpeg(n) {
    var p = await pdfDoc.getPage(n);
    var vp = p.getViewport({ scale: 1.4 });
    var c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    return c.toDataURL('image/jpeg', 0.8).replace(/^data:image\/[^;]+;base64,/i, '');
  }

  async function visionPage(n, prompt, signal) {
    var img = await renderPageJpeg(n);
    var r = await fetch(GATEWAY + '/v1/vision', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ image_base64: img, prompt: prompt + ' Китоб: «' + bookName + '», саҳифаи ' + n + '.', system: 'Шумо ёвари таълимии Китобхона ҳастед. Матни намоёни акси саҳифаро дақиқ хонед ва ба савол ҷавоб деҳ.' }), signal: signal, cache: 'no-store' });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok || d.error) throw new Error(String(d.detail || d.error || ('HTTP ' + r.status)));
    return String(d.reply || d.analysis || '').trim();
  }

  // Запрос к шлюзу: 2 попытки при временных сбоях
  async function gatewayChat(payload, signal) {
    var last;
    for (var attempt = 0; attempt < 2; attempt++) {
      try {
        var r = await fetch(GATEWAY + '/v1/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload), signal: signal, cache: 'no-store' });
        var data = await r.json().catch(function () { return {}; });
        if (r.ok && !data.error) return String(data.reply || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '').trim();
        var code = String(data.detail || data.error || ('HTTP ' + r.status));
        last = new Error(code);
        var transient = r.status >= 500 || /chat_providers_unavailable|no_chat_provider_configured/.test(code);
        if (!transient) throw last;
      } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        last = e;
        if (attempt === 1) throw e;
      }
      await new Promise(function (res) { setTimeout(res, 650); });
    }
    throw last || new Error('Дархост муваффақ нашуд.');
  }

  var TASKS = {
    summary: function (f, t, g, l) { return 'Саҳифаҳои ' + f + '–' + t + '-ро ба забони ' + l + ' кӯтоҳ хулоса кун ва фикри асосиро ҷудо намо.' + (g ? ' Барои синфи ' + g + '.' : ''); },
    words: function (f, t, g, l) { return 'Калимаҳои душворфаҳм ва истилоҳоти воқеан дар саҳифаҳои ' + f + '–' + t + ' бударо ҷудо карда, маънояшонро ба забони ' + l + ' шарҳ деҳ.'; },
    test: function (f, t, g, l, cnt, typ) { return 'Аз рӯи матни дақиқи саҳифаҳои ' + f + '–' + t + ' ' + cnt + ' савол соз (навъи ' + typ + ')' + (g ? ' барои синфи ' + g : '') + '; дар охир калиди ҷавобҳоро низ нишон деҳ.'; },
    lesson: function (f, t, g, l) { return 'Аз рӯи мазмуни саҳифаҳои ' + f + '–' + t + ' нақшаи дарси яксоата ба забони ' + l + ' соз' + (g ? ' барои синфи ' + g : '') + '.'; },
    translate: function (f, t) { return 'Матни саҳифаҳои ' + f + '–' + t + '-ро ба забони русӣ тарҷума кун. Сохтор ва мафҳумҳоро нигоҳ дор.'; },
    notes: function (f, t, g, l) { return 'Аз саҳифаҳои интихобшуда танҳо фикрҳои асосӣ ва иқтибосҳои воқеан намоёнро ба забони ' + l + ' ёддошт кун.'; }
  };

  async function run(type, customPrompt) {
    var f = Number(fromEl.value) || curPage, t = Number(toEl.value) || f;
    if (t < f) { var s = f; f = t; t = s; }
    var g = $('raGrade').value, l = $('raLang').value, cnt = $('raCount').value, typ = $('raType').value;
    var prompt = customPrompt || (TASKS[type] ? TASKS[type](f, t, g, l, cnt, typ) : 'Саҳифаҳои интихобшударо таҳлил кун.');
    var buttons = document.querySelectorAll('.ra-btn');
    buttons.forEach(function (b) { b.disabled = true; });
    resBox.textContent = 'Алия китобро мехонад ва ҷавоб омода мекунад… (то 75 сония)';
    var output = '';
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 75000);
    try {
      var text = await extractRange(f, t);
      if (text) {
        var sys = 'Шумо ёвари расмии Китобхона ҳастед. Китоб: «' + bookName + '», саҳифаҳои ' + f + '–' + t + (g ? ', синфи ' + g : '') + '. Ба савол танҳо бо такя ба матни додашуда ҷавоб деҳ.\n\nМАТН:\n' + text;
        output = await gatewayChat({ messages: [{ role: 'system', content: sys }, { role: 'user', content: prompt }], reasoning_mode: 'high', temperature: 0.45, max_tokens: 2200 }, ctrl.signal);
      } else {
        // Скан: ҳоло танҳо саҳифаи аввали диапазон (ё саҳифаи кушода) таҳлил мешавад
        var pg = (f === t) ? f : curPage;
        output = await visionPage(pg, prompt, ctrl.signal);
        if (f !== t) output = 'Ин PDF скан аст: ҳоло танҳо саҳифаи ' + pg + ' таҳлил шуд.\n\n' + output;
      }
      if (!output) throw new Error('Сервер ҷавоби холӣ баргардонд.');
    } catch (err) {
      var msg = (err && err.name === 'AbortError') ? 'Ҷавоби сервер дер шуд.' : String(err && err.message || 'Хатои пайвастшавӣ.');
      if (/chat_providers_unavailable|no_chat_provider_configured/.test(msg)) msg = 'Шлюзи Алия фаъол аст, аммо провайдери модели ҷавоб надод. Матни китоб гум нашудааст; баъдтар дубора кӯшиш кунед.';
      output = 'Алия ҳоло ин саҳифаҳоро таҳлил карда натавонист. ' + msg;
    } finally {
      clearTimeout(timer);
      buttons.forEach(function (b) { b.disabled = false; });
    }
    resBox.textContent = output;
    setLabel(f + '–' + t);
  }

  document.querySelectorAll('.ra-btn').forEach(function (b) {
    b.addEventListener('click', function () { run(b.getAttribute('data-task')); });
  });
  $('raForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('raPrompt').value.trim();
    if (q) run('custom', q);
  });

  loadBook();
})();
</script>
</body>
</html>
