<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Китобхона — Китобҳо</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{--bg:#0D1B2A;--bg2:#142236;--card:#1A2D44;--card2:#1E3350;--gold:#C9A84C;--gold2:#E8C96D;--text:#F0EAD6;--muted:#A8B8CC;--dim:#6B7F96;--border:rgba(201,168,76,.18);--shadow:rgba(0,0,0,.4);--glass:rgba(13,27,42,.92);--sidebar-w:72px;--safe-bottom:env(safe-area-inset-bottom,0px)}
  .light-theme{--bg:#F5F0E8;--bg2:#EDE6D6;--card:#fff;--card2:#FAF7F0;--text:#1A2D44;--muted:#4A5D73;--dim:#8A9AAD;--shadow:rgba(0,0,0,.12);--glass:rgba(245,240,232,.92)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;overflow:hidden}.phone-wrapper{max-width:430px;margin:0 auto;height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}.top-header{flex:0 0 auto;position:relative;z-index:50;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.header-title{font-size:18px;font-weight:900}.header-subtitle{font-size:11px;color:var(--muted);margin-top:2px}.header-search{grid-column:1 / -1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:9px 11px}.header-search input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:13px}.header-filter-btn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer}.main-layout{flex:1;min-height:0;display:grid;grid-template-columns:var(--sidebar-w) 1fr;gap:8px;padding:8px 8px calc(8px + var(--safe-bottom));overflow:hidden}.sidebar{overflow-y:auto;background:rgba(26,45,68,.58);border:1px solid var(--border);border-radius:22px;padding:8px 5px;scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}.sidebar-item{border:0;background:transparent;color:var(--muted);width:100%;min-height:70px;border-radius:18px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}.sidebar-item.active{background:rgba(201,168,76,.14);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(201,168,76,.22)}.sidebar-icon{font-size:22px}.sidebar-label{font-size:9px;font-weight:800;line-height:1.08;text-align:center;max-width:62px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sidebar-count{font-size:9px;color:var(--dim)}.content-area{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}.subcategories-wrap{flex:0 0 auto;background:rgba(26,45,68,.42);border:1px solid var(--border);border-radius:20px;padding:8px;margin-bottom:8px}.subcategories-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.subcategories-scroll::-webkit-scrollbar{display:none}.subcategory-tab{white-space:nowrap;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);color:var(--text);padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer}.subcategory-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202;border-color:var(--gold)}.sub-count{display:inline-flex;margin-left:6px;background:rgba(27,18,2,.18);border-radius:999px;padding:2px 6px;font-size:10px;font-weight:950}.content-scroll{flex:1;overflow-y:auto;padding-right:2px;scrollbar-width:none}.content-scroll::-webkit-scrollbar{display:none}.section-title-line{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.category-title{font-size:18px;font-weight:950}.book-count{font-size:11px;color:var(--muted)}.books-grid{display:grid;grid-template-columns:repeat(2,minmax(0,140px));justify-content:center;gap:10px;padding-bottom:88px}.book-card{min-width:0;cursor:pointer;perspective:900px;position:relative;transition:transform .16s ease}.book-card:active{transform:scale(.98)}.book-cover-wrap{position:relative;aspect-ratio:.72;z-index:1;overflow:visible;border-radius:7px 14px 14px 7px;background:linear-gradient(135deg,var(--card2),var(--bg2));box-shadow:0 12px 24px rgba(0,0,0,.34);display:grid;place-items:center;text-align:center;color:#fff;font-weight:900;font-size:11px;transform:rotateY(-5deg);transform-origin:left center;transition:transform .18s ease,box-shadow .18s ease}.book-cover-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;z-index:1;background:var(--card2)}.book-cover-wrap:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:7px 0 0 7px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.08),rgba(0,0,0,.08));z-index:3;pointer-events:none}.book-cover-wrap:after{content:'';position:absolute;right:-3px;top:8px;bottom:8px;width:4px;border-radius:0 8px 8px 0;background:linear-gradient(90deg,#fff8e6,#d8ccb0);box-shadow:3px 5px 10px rgba(0,0,0,.25);z-index:0;pointer-events:none}.book-cover-wrap:active{transform:rotateY(0deg) translateY(-3px) scale(1.018);box-shadow:0 16px 30px rgba(0,0,0,.42)}.cover-fallback{display:block;position:relative;z-index:2;background:rgba(0,0,0,.30);border-radius:8px;padding:4px;max-width:92%;line-height:1.2}.book-cover-wrap.no-cover .cover-fallback{display:block}.book-title{font-size:12px;font-weight:900;line-height:1.25;margin-top:7px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-meta{text-align:center;color:var(--muted);font-size:10px;margin-top:2px}.book-actions{display:flex;gap:5px;margin-top:6px}.book-btn{flex:1;border:0;border-radius:10px;padding:5px 4px;font-size:10px;font-weight:900;background:var(--card);color:var(--text);border:1px solid var(--border)}.book-btn.read{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:8px 12px calc(8px + var(--safe-bottom));background:linear-gradient(transparent,var(--bg) 22%)}.bottom-nav-inner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:7px;backdrop-filter:blur(18px);box-shadow:0 -10px 28px var(--shadow)}.nav-item{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px 2px;border-radius:16px;cursor:pointer}.nav-icon{font-size:20px}.nav-item.active{color:var(--gold2);background:rgba(201,168,76,.11)}.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--border);border-radius:18px;background:rgba(255,255,255,.03);grid-column:1/-1}.loader{width:36px;height:36px;border-radius:50%;border:3px solid rgba(201,168,76,.18);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:30px auto;grid-column:1/-1}@keyframes spin{to{transform:rotate(360deg)}}
.book-lock{position:absolute;right:7px;top:7px;width:25px;height:25px;border-radius:50%;background:rgba(0,0,0,.68);display:grid;place-items:center;z-index:4;border:1px solid rgba(255,255,255,.2)}.book-cached{position:absolute;left:7px;top:7px;background:rgba(16,185,129,.9);color:#052e1b;border-radius:99px;padding:3px 6px;font-size:10px;font-weight:900;z-index:4}.book-cover-wrap.locked img{filter:grayscale(.65) brightness(.72)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:200;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:10px 14px;max-width:88%;text-align:center;font-size:12px;box-shadow:0 12px 30px var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bottom-nav{padding:5px 12px calc(5px + var(--safe-bottom));pointer-events:none}.bottom-nav-inner{border-radius:20px;padding:5px;background:rgba(13,27,42,.72);pointer-events:auto}.nav-item{font-size:9px;padding:2px}.nav-icon{font-size:17px}.books-grid{padding-bottom:112px}.main-layout{padding-bottom:calc(18px + var(--safe-bottom))}.cached-tools{display:flex;gap:6px;margin-bottom:10px}.cached-tools .book-btn{padding:9px}

/* ============ МОДАЛКА ДЛЯ КНИГИ ============ */
.modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.modal-overlay.open{display:flex;}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:24px;width:90%;max-width:360px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,0.6);}
.modal-card .book-cover-preview{width:100%;aspect-ratio:0.72;border-radius:12px;overflow:hidden;background:var(--card2);margin-bottom:12px;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff;}
.modal-card .book-cover-preview img{width:100%;height:100%;object-fit:cover;}
.modal-card h3{font-size:16px;font-weight:900;text-align:center;margin-bottom:4px;color:var(--gold2);}
.modal-card .book-author-modal{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px;}
.modal-card .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal-card .btn-grid .btn{width:100%;padding:10px 0;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;text-align:center;transition:transform .12s ease;}
.modal-card .btn-grid .btn:active{transform:scale(.96);}
.modal-card .btn-grid .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202;}
.modal-card .btn-grid .btn-ghost{background:var(--card2);border:1px solid var(--border);color:var(--text);}
.modal-card .btn-grid .btn-success{background:#2D7D4A;color:#fff;}
.modal-card .btn-grid .btn-danger{background:#B33A3A;color:#fff;}
.modal-card .btn-close-modal{position:absolute;top:10px;right:14px;font-size:20px;color:var(--muted);cursor:pointer;background:none;border:none;}
</style>
</head>
<body>
<div class="phone-wrapper">
<header class="top-header"><div><div class="header-title">📚 <span>Китобҳо</span></div><div class="header-subtitle" id="hint">Боркунӣ...</div></div><div class="header-filter-btn" id="themeBtn">🌙</div><form class="header-search" id="searchForm"><span>🔍</span><input id="search" type="search" placeholder="Ҷустуҷӯи китоб..."></form></header>
<div class="main-layout"><aside class="sidebar" id="sidebar"><div class="loader"></div></aside><main class="content-area"><div class="subcategories-wrap"><div class="subcategories-scroll" id="subcats"></div></div><section class="content-scroll"><div class="section-title-line"><div class="category-title" id="catTitle">Китобҳо</div><div class="book-count" id="bookCount">—</div></div><div class="books-grid" id="booksGrid"><div class="loader"></div></div></section></main></div>
<nav class="bottom-nav"><div class="bottom-nav-inner"><div class="nav-item" onclick="location.href='index.html'"><div class="nav-icon">🏠</div><div>Асосӣ</div></div><div class="nav-item active"><div class="nav-icon">📚</div><div>Китобҳо</div></div><div class="nav-item" onclick="location.href='winners.html'"><div class="nav-icon">🏆</div><div>Ғолибон</div></div><div class="nav-item" onclick="location.href='Lenta.html'"><div class="nav-icon">📰</div><div>Лента</div></div><div class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon">👤</div><div>Профил</div></div></div></nav>
</div>

<!-- ============ МОДАЛКА КНИГИ ============ -->
<div class="modal-overlay" id="bookModal">
  <div class="modal-card" style="position:relative;">
    <button class="btn-close-modal" onclick="closeBookModal()">✕</button>
    <div class="book-cover-preview" id="modalCover"><span>📖</span></div>
    <h3 id="modalTitle">Китоб</h3>
    <div class="book-author-modal" id="modalAuthor"></div>
    <div class="btn-grid">
      <button class="btn btn-primary" id="modalReadBtn">📖 Хондан</button>
      <button class="btn btn-ghost" id="modalFavoriteBtn">⭐ Закладка</button>
      <button class="btn btn-success" id="modalCompleteBtn">✅ Хатм кардам</button>
      <button class="btn btn-ghost" id="modalDownloadBtn">⬇ Боргирӣ</button>
      <button class="btn btn-ghost" style="grid-column:span 2;" id="modalShareBtn">↗ Мубодила</button>
    </div>
  </div>
</div>

<script>
const BOOKS_JSON_URLS=['books.json?t='+Date.now(),'https://raw.githubusercontent.com/sharipovip/books/main/books.json?t='+Date.now()];
const $=id=>document.getElementById(id);const enc=p=>String(p||'').split('/').map(encodeURIComponent).join('/');
let DATA=null, CATS=[], cat=null, sub=null, books=[], manifestCache=new Map();
let modalData = null; // {url, name, cover, folder, book}

function theme(t){document.body.classList.toggle('light-theme',t==='light');localStorage.setItem('kk_theme',t);$('themeBtn').textContent=t==='light'?'☀️':'🌙'}$('themeBtn').onclick=()=>theme(localStorage.getItem('kk_theme')==='light'?'dark':'light');theme(localStorage.getItem('kk_theme')||'dark');
async function fetchJsonFast(u,ms=4500){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);try{const r=await fetch(u,{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}async function loadBooksJson(){for(const u of BOOKS_JSON_URLS){try{DATA=await fetchJsonFast(u);try{localStorage.setItem('kk_booksjson_cache',JSON.stringify(DATA))}catch(_){ }return DATA}catch(e){}}try{DATA=JSON.parse(localStorage.getItem('kk_booksjson_cache')||'null');if(DATA)return DATA}catch(e){}throw new Error('Пайвастшавӣ дастрас нест. Интернетро санҷед.')}
function rawUrl(folder,file){return `https://raw.githubusercontent.com/${DATA.repo||'sharipovip/books'}/${DATA.branch||'main'}/${enc(folder)}/${encodeURIComponent(file)}`}
function coverCandidates(folder,file){const jpg=encodeURIComponent(file.replace(/\.pdf$/i,'.jpg'));const clean=String(folder).replace(/^books\//,'');const base=`https://raw.githubusercontent.com/${DATA.repo||'sharipovip/books'}/${DATA.branch||'main'}`;return [`${base}/covers/${enc(clean)}/${jpg}`,`${base}/covers/books/${enc(clean)}/${jpg}`,`${base}/covers/${enc(folder)}/${jpg}`]}
async function fetchManifest(su){const key=su.folder;if(manifestCache.has(key))return manifestCache.get(key);let list=[];try{const r=await fetch(`https://raw.githubusercontent.com/${DATA.repo}/${DATA.branch}/${enc(su.folder)}/manifest.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok){const j=await r.json();list=Array.isArray(j.books)?j.books:[]}}catch(e){}if(!list.length){try{const api=`https://api.github.com/repos/${DATA.repo}/contents/${enc(su.folder)}?ref=${encodeURIComponent(DATA.branch)}`;const arr=await fetch(api).then(r=>r.ok?r.json():[]);list=(Array.isArray(arr)?arr:[]).filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)).map(x=>({name:x.name.replace(/\.pdf$/i,''),file:x.name,size:x.size||0}))}catch(e){}}
manifestCache.set(key,list);return list}
const PDF_CACHE='kitobkhona-pdf-cache-v1';
function toast(msg,d=2400){const t=$('toast');if(!t){alert(msg);return}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d)}
function cachedMap(){try{return JSON.parse(localStorage.getItem('kk_cached_books')||'{}')}catch(e){return {}}}
function setCachedMap(o){try{localStorage.setItem('kk_cached_books',JSON.stringify(o))}catch(e){}}
function isCached(url){return !!cachedMap()[url]}
function saveCachedMeta(book){const m=cachedMap();if(!book.cover&&book.url)book.cover=coverFromUrl(book.url);m[book.url]=book;setCachedMap(m)}
async function deleteCached(url){try{if('caches' in window){const c=await caches.open(PDF_CACHE);await c.delete(url);const alt=cdnPdfUrl(url);if(alt!==url)await c.delete(alt)}}catch(e){}const m=cachedMap();delete m[url];setCachedMap(m)}
function cdnPdfUrl(u){try{const x=new URL(u);if(x.hostname==='raw.githubusercontent.com'){const p=x.pathname.split('/').filter(Boolean);if(p.length>=4)return `https://cdn.jsdelivr.net/gh/${p[0]}/${p[1]}@${p[2]}/${p.slice(3).map(encodeURIComponent).join('/')}`}}catch(e){}return u}
function coverFromUrl(u){try{const x=new URL(u);const p=x.pathname.split('/').filter(Boolean).map(decodeURIComponent);if(p.length<5)return'';const owner=p[0],repo=p[1],branch=p[2],arr=p.slice(3);const file=(arr.pop()||'').replace(/\.pdf$/i,'.jpg');const folder=arr.join('/').replace(/^books\//,'');return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/covers/${folder.split('/').map(encodeURIComponent).join('/')}/${encodeURIComponent(file)}`}catch(e){return''}}
function renderCats(){const m=cachedMap(),cnt=Object.keys(m).length;$('sidebar').innerHTML=`<button class="sidebar-item ${cat&&cat.id==='__cached'?'active':''}" onclick="showCachedBooks()"><div class="sidebar-icon">📥</div><div class="sidebar-label">Ҳифзшуда</div><div class="sidebar-count">${cnt}</div></button>`+CATS.map(c=>`<button class="sidebar-item ${cat&&cat.id===c.id?'active':''}" onclick="selectCat('${String(c.id).replace(/'/g,'')}')"><div class="sidebar-icon">${esc(c.emoji||'📚')}</div><div class="sidebar-label">${esc(c.name||'Категория')}</div><div class="sidebar-count">${(c.subs||[]).length}</div></button>`).join('')}
function renderSubs(){if(cat?.id==='__cached'){const cnt=Object.keys(cachedMap()).length;$('subcats').innerHTML=`<button class="subcategory-tab active">📥 Ҳамаи китобҳои ҳифзшуда <span class="sub-count">${cnt} китоб</span></button>`;return}const arr=cat?.subs||[];$('subcats').innerHTML=arr.map(s=>`<button class="subcategory-tab ${sub&&sub.id===s.id?'active':''}" onclick="selectSub('${String(s.id).replace(/'/g,'')}')">${esc(s.emoji||'📁')} ${esc(s.name||s.folder)}</button>`).join('')||'<span class="subcategory-tab active">Бахше нест</span>'}
async function selectCat(id,subId){cat=CATS.find(c=>c.id===id)||CATS[0];sub=(subId?cat.subs?.find(s=>s.id===subId):null)||cat.subs?.[0]||null;try{localStorage.setItem('kk_last_cat',cat.id);if(sub)localStorage.setItem('kk_last_sub',sub.id)}catch(e){}renderCats();renderSubs();$('catTitle').textContent=cat?.name||'Китобҳо';$('hint').textContent=cat?.name||'';if(sub)await loadSub(sub);else $('booksGrid').innerHTML='<div class="empty">Бахше нест</div>'}
async function selectSub(id){sub=cat.subs.find(s=>s.id===id)||sub;try{localStorage.setItem('kk_last_sub',sub.id)}catch(e){}renderSubs();await loadSub(sub)}
async function loadSub(su){$('booksGrid').innerHTML='<div class="loader"></div>';books=await fetchManifest(su);renderBooks(books);setTimeout(()=>{try{const sc=+localStorage.getItem('kk_last_scroll')||0;if(sc)document.querySelector('.content-scroll').scrollTop=sc}catch(e){}},80)}
function showCachedBooks(){cat={id:'__cached',name:'Китобҳои ҳифзшуда',subs:[]};sub=null;renderCats();renderSubs();$('catTitle').textContent='';$('hint').textContent='Офлайн дастрас';const arr=Object.values(cachedMap()).sort((a,b)=>(b.ts||0)-(a.ts||0));renderBooks(arr,true)}
function renderBooks(list,cachedView=false){$('bookCount').textContent=cachedView?'':((list?.length||0)+' китоб');if(!list?.length){$('booksGrid').innerHTML=cachedView?'<div class="empty">Ҳоло китобе ҳифз нашудааст</div>':'<div class="empty">Дар ин бахш ҳоло китоб дастрас нест</div>';return}let tools=cachedView?`<div class="cached-tools" style="grid-column:1/-1"><button class="book-btn" onclick="deleteAllCached()">🗑 Ҳамаро нест кардан</button></div>`:'';$('booksGrid').innerHTML=tools+list.map(b=>{const file=b.file||((b.name||'book')+'.pdf'),name=b.name||file.replace(/\.pdf$/i,''),url=b.url||rawUrl(sub.folder,file),baseC=coverCandidates(sub?.folder||b.folder||'',file),fromUrl=coverFromUrl(url),c=b.cover?[b.cover,b.cover,b.cover]:(sub?.folder||b.folder?baseC:(fromUrl?[fromUrl,fromUrl,fromUrl]:baseC)),cached=isCached(url),locked=!navigator.onLine&&!cached;return `<article class="book-card"><div class="book-cover-wrap ${locked?'locked':''}" onclick="openBookModal('${encodeURIComponent(url)}','${encodeURIComponent(name)}','${encodeURIComponent(c[0])}','${encodeURIComponent(sub?.folder||b.folder||'')}','${encodeURIComponent(JSON.stringify(b))}')"><img loading="lazy" data-i="0" data-covers="${encodeURIComponent(JSON.stringify(c))}" src="${c[0]}" onload="this.nextElementSibling.style.display='none'" onerror="let a=JSON.parse(decodeURIComponent(this.dataset.covers));let i=(+this.dataset.i)+1;this.dataset.i=i;if(a[i]){this.src=a[i]}else{this.style.display='none';this.nextElementSibling.style.display='block'}" alt=""><span class="cover-fallback">${esc(name)}</span>${cached?'<div class="book-cached">✓</div>':''}${locked?'<div class="book-lock">🔒</div>':''}</div><div class="book-title">${esc(name)}</div><div class="book-meta">${cached?'Ҳифзшуда':(b.size?Math.round(b.size/1024/1024*10)/10+' MB':'PDF')}</div><div class="book-actions"><button class="book-btn read" onclick="event.stopPropagation();openBookModal('${encodeURIComponent(url)}','${encodeURIComponent(name)}','${encodeURIComponent(c[0])}','${encodeURIComponent(sub?.folder||b.folder||'')}','${encodeURIComponent(JSON.stringify(b))}')">Хондан</button><button class="book-btn" onclick="event.stopPropagation();downloadBook('${encodeURIComponent(url)}','${encodeURIComponent(name)}','${encodeURIComponent(c[0])}')">${cached?'🗑':'⬇'}</button></div></article>`}).join('')}
function openReader(url,name,cover=''){url=decodeURIComponent(url);name=decodeURIComponent(name);cover=decodeURIComponent(cover||'');if(!navigator.onLine&&!isCached(url)){toast('Ин китоб ҳоло дастрас нест, зеро интернет нест ва китоб ҳифз нашудааст.');return}try{localStorage.setItem('kk_last_scroll',document.querySelector('.content-scroll')?.scrollTop||0)}catch(e){}location.href=`reader.html?url=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}&cover=${encodeURIComponent(cover)}`}
async function downloadBook(url,name,cover=''){url=decodeURIComponent(url);name=decodeURIComponent(name);cover=decodeURIComponent(cover||'');if(isCached(url)){await deleteCached(url);toast('Китоб аз ҳифзшудаҳо нест шуд');if(cat?.id==='__cached')showCachedBooks();else renderBooks(books);renderCats();return}if(!navigator.onLine){toast('Барои ҳифз кардан интернет лозим аст');return}try{toast('Ҳифз шуда истодааст...');const r=await fetch(cdnPdfUrl(url),{cache:'no-store'}).catch(()=>fetch(url,{cache:'no-store'}));if(!r.ok)throw new Error('HTTP '+r.status);if('caches' in window){const c=await caches.open(PDF_CACHE);await c.put(url,r.clone());const alt=cdnPdfUrl(url);if(alt!==url)await c.put(alt,r.clone())}const blob=await r.clone().blob();saveCachedMeta({url,name,cover,ts:Date.now(),size:blob.size});toast('✓ Китоб ҳифз шуд');renderBooks(books);renderCats()}catch(e){toast('Ҳифз нашуд: '+(e.message||''),3000)}}
async function deleteAllCached(){if(!confirm('Ҳамаи китобҳои ҳифзшуда нест шаванд?'))return;const m=cachedMap();for(const u of Object.keys(m))await deleteCached(u);toast('Ҳама нест шуд');showCachedBooks()}
$('searchForm').onsubmit=e=>{e.preventDefault();const q=$('search').value.trim().toLowerCase();if(!q)return renderBooks(books);const res=books.filter(b=>(b.name||b.file||'').toLowerCase().includes(q));renderBooks(res)};$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();if(!q)renderBooks(books)});

// ============ МОДАЛЬНОЕ ОКНО ============
let modalDataStore = null;

function openBookModal(url, name, cover, folder, bookJson){
  url = decodeURIComponent(url);
  name = decodeURIComponent(name);
  cover = decodeURIComponent(cover || '');
  folder = decodeURIComponent(folder || '');
  let book = {};
  try { book = JSON.parse(decodeURIComponent(bookJson)); } catch(e) {}
  modalDataStore = { url, name, cover, folder, book };
  const modal = document.getElementById('bookModal');
  const title = document.getElementById('modalTitle');
  const author = document.getElementById('modalAuthor');
  const coverEl = document.getElementById('modalCover');
  title.textContent = name;
  author.textContent = book.author || '';
  if (cover) {
    coverEl.innerHTML = `<img src="${cover}" alt="Обложка" onerror="this.style.display='none';this.parentNode.textContent='📖'">`;
  } else {
    coverEl.textContent = '📖';
  }
  modal.classList.add('open');
}

function closeBookModal(){
  document.getElementById('bookModal').classList.remove('open');
  modalDataStore = null;
}

// Обработчики кнопок в модалке
document.getElementById('modalReadBtn').addEventListener('click', function(){
  if (!modalDataStore) return;
  openReader(modalDataStore.url, modalDataStore.name, modalDataStore.cover);
  closeBookModal();
});
document.getElementById('modalFavoriteBtn').addEventListener('click', async function(){
  if (!modalDataStore) return;
  const token = localStorage.getItem('kk_token');
  if (!token) { alert('Лутфан ворид шавед'); return; }
  try {
    const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/favorites', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        book_id: modalDataStore.book.file || modalDataStore.name,
        book_title: modalDataStore.name,
        book_author: modalDataStore.book.author || ''
      })
    });
    if (r.ok) { toast('⭐ Ба закладка илова шуд'); } else { toast('Хатогӣ'); }
  } catch(e) { toast('Хатогӣ'); }
  closeBookModal();
});
document.getElementById('modalCompleteBtn').addEventListener('click', async function(){
  if (!modalDataStore) return;
  const token = localStorage.getItem('kk_token');
  if (!token) { alert('Лутфан ворид шавед'); return; }
  try {
    const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/reading-sessions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        book_id: modalDataStore.book.file || modalDataStore.name,
        book_title: modalDataStore.name,
        book_author: modalDataStore.book.author || '',
        duration: 0,
        status: 'completed',
        pages_read: 0
      })
    });
    if (r.ok) { toast('✅ Хатм карда шуд'); } else { toast('Хатогӣ'); }
  } catch(e) { toast('Хатогӣ'); }
  closeBookModal();
});
document.getElementById('modalDownloadBtn').addEventListener('click', function(){
  if (!modalDataStore) return;
  downloadBook(modalDataStore.url, modalDataStore.name, modalDataStore.cover);
  closeBookModal();
});
document.getElementById('modalShareBtn').addEventListener('click', function(){
  if (!modalDataStore) return;
  if (navigator.share) {
    navigator.share({ title: modalDataStore.name, url: modalDataStore.url });
  } else {
    navigator.clipboard.writeText(modalDataStore.url).then(() => toast('Линк нусха бардошта шуд'));
  }
  closeBookModal();
});
// Закрытие по клику вне карточки
document.getElementById('bookModal').addEventListener('click', function(e){
  if (e.target === this) closeBookModal();
});

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Инициализация
(async function init(){try{await loadBooksJson();CATS=DATA.categories||[];if(!CATS.length)throw new Error('Категория нест');const qs=new URL(location.href).searchParams;const q=qs.get('q')||'';if(q)$('search').value=q;const cid=qs.get('cat')||localStorage.getItem('kk_last_cat')||CATS[0].id;const sid=qs.get('sub')||localStorage.getItem('kk_last_sub');await selectCat(cid,sid);if(q){setTimeout(()=>$('searchForm').dispatchEvent(new Event('submit')),250)}}catch(e){$('booksGrid').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'; $('sidebar').innerHTML=''}})();
</script>
