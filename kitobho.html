(function () {
  try {
    if (!window.KitobkhonaNative || typeof window.KitobkhonaNative.postMessage !== 'function') return;
    var bridge = window.AndroidBridge || {};
    var map = { saveBase64File: 'saveFile', saveFile: 'saveFile', saveSymbolFile: 'saveFile', openFile: 'openFile', shareFile: 'shareFile',
      shareText: 'shareText', shareTextWithWhatsAppChooser: 'shareTextWithWhatsAppChooser', shareImageWithText: 'shareImageWithText',
      shareRemoteImage: 'shareRemoteImage', shareRemoteImages: 'shareRemoteImages', saveUserId: 'saveUserId', saveAuthToken: 'saveAuthToken',
      openExternalUrl: 'openExternalUrl', openOfficialSite: 'openOfficialSite' };
    Object.keys(map).forEach(function (name) {
      if (typeof bridge[name] === 'function') return;
      bridge[name] = function () {
        try { window.KitobkhonaNative.postMessage(JSON.stringify({ method: map[name], args: Array.prototype.slice.call(arguments) })); }
        catch (e) { console.warn('Native feature is unavailable', e); }
      };
    });
    window.AndroidBridge = bridge;
  } catch (e) {}
})();

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof CacheManager !== 'undefined') {
      CacheManager.init();
    }
  });

  (function initTheme() {
    const saved = localStorage.getItem('kk_theme') || 'dark';
    if (saved === 'light') document.body.classList.add('light-theme');
  })();

  const BOOKS_REPO = 'sharipovip/books';
  const BOOKS_BRANCH = 'main';
  const BOOKS_JSON_TTL_MS = 5 * 60 * 1000;
  const BOOKS_JSON_CACHE_KEY = 'kk_booksjson_cache_v3';
  const BOOKS_JSON_URLS = [
    'https://raw.githubusercontent.com/' + BOOKS_REPO + '/' + BOOKS_BRANCH + '/books.json?t=' + Date.now(),
    'https://cdn.jsdelivr.net/gh/' + BOOKS_REPO + '@' + BOOKS_BRANCH + '/books.json?t=' + Date.now(),
    'books.json?t=' + Date.now()
  ];
  const $ = id => document.getElementById(id);
  const enc = p => String(p || '').split('/').map(encodeURIComponent).join('/');
  let DATA = null, CATS = [], cat = null, sub = null, books = [], manifestCache = new Map();
  let booksJsonLoadedAt = 0;
  let activeBookElement = null;

  function getCoverCacheMap() {
    try {
      const map1 = JSON.parse(localStorage.getItem('kk_cover_cache') || '{}');
      const map2 = JSON.parse(localStorage.getItem('kk_cache_covers') || '{}');
      return Object.assign({}, map1, map2);
    } catch(e) { return {}; }
  }
  function setCoverCacheMap(map) {
    try { localStorage.setItem('kk_cover_cache', JSON.stringify(map)); } catch(e) {}
  }
  function getCachedCoverDataUrl(url) {
    if (!url) return '';
    const map = getCoverCacheMap();
    const item = map[url];
    if (item && item.dataUrl && (Date.now() - (item.ts || 0) < 7 * 24 * 60 * 60 * 1000)) return item.dataUrl;
    return '';
  }
  function setCachedCoverDataUrl(url, dataUrl) {
    if (!url || !dataUrl) return;
    const map = getCoverCacheMap();
    map[url] = { dataUrl, ts: Date.now() };
    setCoverCacheMap(map);
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result || '');
      reader.readAsDataURL(blob);
    });
  }
  async function ensureCoverDataUrl(url, imgEl) {
    if (!url) return '';
    const cached = getCachedCoverDataUrl(url);
    if (cached) {
      if (imgEl && imgEl.getAttribute('src') !== cached) imgEl.setAttribute('src', cached);
      return cached;
    }
    try {
      const r = await fetch(url); // Используем стандартный кэш браузера для обложек
      if (!r.ok) return '';
      const blob = await r.blob();
      const dataUrl = await blobToDataUrl(blob);
      setCachedCoverDataUrl(url, dataUrl);
      if (imgEl) imgEl.setAttribute('src', dataUrl);
      return dataUrl;
    } catch(e) {
      return '';
    }
  }
  function getBookAccessState(url) {
    const cached = isCached(url);
    const online = navigator.onLine;
    if (!online) {
        return cached
        ? { show: false, icon: '', bg: '', dim: false }
        : { show: true, icon: '🔒', bg: 'rgba(220,80,80,0.9)', dim: true };
    }
    return { show: false, icon: '', bg: '', dim: false };
  }
  function hydrateBookCardCovers(root = document) {
    const nodes = root.querySelectorAll('img[data-cover-url]');
    nodes.forEach(img => {
      const cover = img.getAttribute('data-cover-url') || '';
      const bookUrl = img.getAttribute('data-book-url') || '';
      const state = getBookAccessState(bookUrl);
      const coverSrc = getCachedCoverDataUrl(cover) || cover;
      if (coverSrc && img.getAttribute('src') !== coverSrc) img.setAttribute('src', coverSrc);
      if (state.show) {
        const badge = img.parentElement?.querySelector('[data-book-badge]');
        if (badge) {
          badge.style.display = 'flex';
          badge.textContent = state.icon;
          badge.style.background = state.bg;
        }
        if (state.dim && img.style.filter !== 'brightness(0.72)') img.style.filter = 'brightness(0.72)';
      } else {
        const badge = img.parentElement?.querySelector('[data-book-badge]');
        if (badge) badge.style.display = 'none';
        img.style.filter = '';
      }
      // v99: ensureCoverDataUrl (загрузка каждой обложки в localStorage) УДАЛЁН —
      // он подвешивал большие категории. Обложку грузит сам <img loading="lazy">
      // с CDN; при ошибке onerror перебирает зеркала. Из кэша подставляем выше.
    });
  }

  async function fetchJsonFast(u, ms = 4500) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try {
      const r = await fetch(u, { cache: 'no-store', signal: ctrl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }
  function validBooksCatalog(value) {
    return !!value && Array.isArray(value.categories);
  }
  function readBooksCatalogCache() {
    try {
      const saved = JSON.parse(localStorage.getItem(BOOKS_JSON_CACHE_KEY) || 'null');
      if (saved && validBooksCatalog(saved.data)) return { data: saved.data, ts: Number(saved.ts) || 0 };
    } catch(e) {}
    // Existing installs stored books.json directly. Keep it as an offline fallback,
    // but never treat this legacy entry as fresh: remote categories must be rechecked.
    try {
      const legacy = JSON.parse(localStorage.getItem('kk_booksjson_cache_v2') || 'null');
      if (validBooksCatalog(legacy)) return { data: legacy, ts: 0 };
    } catch(e) {}
    return null;
  }
  function writeBooksCatalogCache(data) {
    try { localStorage.setItem(BOOKS_JSON_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
  }
  async function loadBooksJson(force = false) {
    const now = Date.now();
    if (!force && validBooksCatalog(DATA) && now - booksJsonLoadedAt < BOOKS_JSON_TTL_MS) return DATA;
    const cached = readBooksCatalogCache();
    if (!force && cached && ((cached.ts && now - cached.ts < BOOKS_JSON_TTL_MS) || navigator.onLine === false)) {
      DATA = cached.data;
      booksJsonLoadedAt = cached.ts || now;
      return DATA;
    }
    for (const u of BOOKS_JSON_URLS) {
      try {
        const data = await fetchJsonFast(u, 6500);
        if (!validBooksCatalog(data)) continue;
        DATA = data;
        booksJsonLoadedAt = Date.now();
        writeBooksCatalogCache(DATA);
        return DATA;
      } catch(e) {}
    }
    if (cached && validBooksCatalog(cached.data)) {
      DATA = cached.data;
      booksJsonLoadedAt = cached.ts || now;
      return DATA;
    }
    throw new Error('Пайвастшавӣ дастрас нест. Интернетро санҷед.');
  }

  function rawUrl(folder, file) {
    return `https://raw.githubusercontent.com/${DATA.repo || 'sharipovip/books'}/${DATA.branch || 'main'}/${enc(folder)}/${encodeURIComponent(file)}`;
  }

  function coverCandidates(folder, file) {
    // ВАЖНО: обложка строится по имени ФАЙЛА книги (робот сохраняет covers/<папка>/<файл>.jpg).
    // Пешвакӣ танҳо .pdf иваз мешуд — барои epub/fb2 URL бо «.epub» мемонад ва обложка 404 мешавад.
    const jpg = encodeURIComponent(file.replace(/\.(pdf|epub|fb2|docx?|mp4|m4v|webm|txt|zip)$/i, '.jpg'));
    const clean = String(folder).replace(/^books\//, '');
    const repo = DATA.repo || 'sharipovip/books', branch = DATA.branch || 'main';
    // v99: ЯКУМ манбаъ — CDN jsdelivr (барои телефонҳо хеле тезтар, чун raw.githubusercontent
    // дар Тоҷикистон суст аст); агар 404/хато шуд — img ба зеркали оянда мегузарад (onerror).
    return [
      `https://cdn.jsdelivr.net/gh/${repo}@${branch}/covers/${enc(clean)}/${jpg}`,
      `https://fastly.jsdelivr.net/gh/${repo}@${branch}/covers/${enc(clean)}/${jpg}`,
      `https://raw.githubusercontent.com/${repo}/${branch}/covers/${enc(clean)}/${jpg}`,
      `https://raw.githubusercontent.com/${repo}/${branch}/covers/books/${enc(clean)}/${jpg}`,
      `https://raw.githubusercontent.com/${repo}/${branch}/covers/${enc(folder)}/${jpg}`
    ];
  }

  const MANIFEST_CACHE_TTL_MS = 3 * 60 * 1000;
  const EMPTY_MANIFEST_CACHE_TTL_MS = 60 * 1000;
  const SUPPORTED_BOOK_FILE = /\.(pdf|epub|fb2|docx?|mp4|m4v|webm|txt|zip)$/i;
  function readManifestCacheEntry(key) {
    try {
      const parsed = JSON.parse(localStorage.getItem('kk_manifest_cache_v3') || 'null');
      const saved = parsed && parsed[key];
      if (saved && Array.isArray(saved.items)) return { items: saved.items, ts: Number(saved.ts) || 0 };
    } catch(e) {}
    // Legacy cache values were plain arrays and had no timestamp; regard them as stale.
    try {
      const parsed = JSON.parse(localStorage.getItem('kk_manifest_cache_v2') || 'null');
      if (parsed && Array.isArray(parsed[key])) return { items: parsed[key], ts: 0 };
    } catch(e) {}
    return null;
  }
  function isManifestEntryFresh(entry, now = Date.now()) {
    if (!entry || !entry.ts) return false;
    const ttl = entry.items.length ? MANIFEST_CACHE_TTL_MS : EMPTY_MANIFEST_CACHE_TTL_MS;
    return now - entry.ts < ttl;
  }
  function writeManifestCacheEntry(key, items) {
    const entry = { ts: Date.now(), items };
    manifestCache.set(key, entry);
    try {
      const parsed = JSON.parse(localStorage.getItem('kk_manifest_cache_v3') || '{}');
      parsed[key] = entry;
      localStorage.setItem('kk_manifest_cache_v3', JSON.stringify(parsed));
    } catch(e) {}
    return entry;
  }
  async function fetchJsonWithTimeout(url, timeoutMs = 7000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return await response.json();
    } finally { clearTimeout(timer); }
  }
  async function fetchManifest(su, force = false) {
    const key = String(su && su.folder || '');
    if (!key) return [];
    const now = Date.now();
    let cached = manifestCache.get(key);
    if (Array.isArray(cached)) cached = { items: cached, ts: 0 };
    if (!cached) cached = readManifestCacheEntry(key);
    if (!force && isManifestEntryFresh(cached, now)) {
      manifestCache.set(key, cached);
      return cached.items;
    }
    if (!cached) cached = readManifestCacheEntry(key);
    if (navigator.onLine === false && cached && Array.isArray(cached.items)) {
      manifestCache.set(key, cached);
      return cached.items;
    }

    const repo = DATA?.repo || BOOKS_REPO;
    const branch = DATA?.branch || BOOKS_BRANCH;
    const base = `https://raw.githubusercontent.com/${repo}/${branch}/${enc(key)}/manifest.json`;
    const cdn = `https://cdn.jsdelivr.net/gh/${repo}@${branch}/${enc(key)}/manifest.json`;
    let list = [];
    let manifestLoaded = false;
    for (const url of [base + '?t=' + Date.now(), cdn + '?t=' + Date.now()]) {
      try {
        const json = await fetchJsonWithTimeout(url, 8000);
        if (Array.isArray(json.books)) {
          list = json.books;
          manifestLoaded = true;
          break;
        }
      } catch(e) {}
    }
    // GitHub's anonymous Contents API is only a last-resort fallback (it is rate limited).
    // A current generated manifest is the authoritative, cache-friendly source.
    if (!manifestLoaded || !list.length) {
      try {
        const api = `https://api.github.com/repos/${repo}/contents/${enc(key)}?ref=${encodeURIComponent(branch)}`;
        const arr = await fetchJsonWithTimeout(api, 6000);
        if (Array.isArray(arr)) {
          const fromApi = arr.filter(x => x.type === 'file' && SUPPORTED_BOOK_FILE.test(x.name))
            .map(x => ({ name: x.name.replace(SUPPORTED_BOOK_FILE, ''), file: x.name, size: x.size || 0 }));
          if (fromApi.length || !manifestLoaded) { list = fromApi; manifestLoaded = true; }
        }
      } catch(e) {}
    }
    if (!manifestLoaded && cached && Array.isArray(cached.items)) {
      manifestCache.set(key, cached);
      return cached.items;
    }
    return writeManifestCacheEntry(key, list).items;
  }

  async function getBookStats(bookId) {
    if (!bookId) return null;
    // v104: через общий 30-минутный кэш статистики (см. config.js)
    try {
      const m = await cachedBookStatsBatch([bookId]);
      return m[bookId] || null;
    } catch(e) { return null; }
  }

  async function getBookStatsBatch(bookIds) {
    if (!bookIds.length) return {};
    // v104: через общий 30-минутный кэш статистики (см. config.js)
    try {
      return await cachedBookStatsBatch(bookIds);
    } catch(e) { return {}; }
  }

  function toast(msg, d = 2400) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), d);
  }

  function cachedMap() {
    try { return JSON.parse(localStorage.getItem('kk_cached_books') || '{}'); } catch(e) { return {}; }
  }
  function isCached(url) { const wanted=canonicalBookUrl(url),map=cachedMap();return Object.keys(map).some(key=>canonicalBookUrl(key)===wanted); }
  function setCachedMap(o) { try { localStorage.setItem('kk_cached_books', JSON.stringify(o)); } catch(e) {} }
  async function deleteCached(url) {
    const canonical=canonicalBookUrl(url);
    try { if ('caches' in window) { const c = await caches.open('kitobkhona-pdf-cache-v1'); for(const req of await c.keys())if(canonicalBookUrl(req.url)===canonical)await c.delete(req); } } catch(e) {}
    const m = cachedMap(); for(const key of Object.keys(m))if(canonicalBookUrl(key)===canonical)delete m[key]; setCachedMap(m);
  }

  function cleanCatalogBookTitle(value) {
    let title = String(value ?? '').replace(/\s+/g, ' ').trim();
    if (!title) return '';
    title = title.replace(/^(?:subject|title|book\s*title|document\s*title|name|тема|название)\s*[:：]\s*/iu, '').trim();
    if (!title || /^(?:subject|title|book\s*title|document\s*title|name|тема|название|untitled|unknown|n\/a|na|none|null|undefined|no\s+title|not\s+available)[\s:：.!?_-]*$/iu.test(title)) return '';
    return title;
  }
  function catalogBookTitle(book, file) {
    const candidates = [book?.name, book?.title, book?.book_title, book?.bookTitle, book?.display_name, book?.displayName];
    for (const candidate of candidates) { const title = cleanCatalogBookTitle(candidate); if (title) return title; }
    let fileName = String(file || book?.filename || book?.file_name || '').split(/[\\/]/).pop() || '';
    try { fileName = decodeURIComponent(fileName); } catch (e) {}
    return cleanCatalogBookTitle(fileName.replace(/\.pdf$/i, '')) || 'Китоб';
  }

  function renderBooks(list) {
    const grid = document.getElementById('booksGrid');
    if (!list || !list.length) {
      grid.innerHTML = '<div class="empty">Дар ин бахш ҳоло китоб дастрас нест</div>';
      return;
    }
    closeActiveActions();
    if (window.__bookRenderObserver) { try { window.__bookRenderObserver.disconnect(); } catch(e) {} window.__bookRenderObserver = null; }
    grid.innerHTML = '';
    const renderList = list;
    let renderStart = 0;
    let renderingBatch = false;
    const RENDER_BATCH = 48;

    function appendBatch() {
      if (renderingBatch) return;
      renderingBatch = true;
      try {
        const sentinel = document.getElementById('renderMore');
        if (sentinel) sentinel.remove();
        // Порционный рендер: 48 корт дар як бор — саҳифа не ҳанг мекунад (гузоришҳои калон 700+ китоб)
        const html = renderList.slice(renderStart, renderStart + RENDER_BATCH).map((b) => {
      const file = b.file || ((b.name || 'book') + '.pdf');
      const name = catalogBookTitle(b, file);
      const folderFull = b.folder || sub?.folder || '';
      const url = rawUrl(folderFull, file);
      const coverList = coverCandidates(folderFull, file);
      const cover = coverList[0] || '';
      const coverSrc = getCachedCoverDataUrl(cover) || cover;
      const state = getBookAccessState(url);
      const rawBookId = folderFull ? (folderFull.replace(/\/+$/, '') + '/' + file) : (b.file || file);
      const bookId = rawBookId.replace(/^books\//i, '');
      const bgColor = randomColor();
      const sizeMB = b.size ? (b.size / (1024*1024)).toFixed(1) : null;
      const fmt = (String(file).match(/\.([a-z0-9]+)$/i) || [])[1] || 'pdf';

      return `<div class="bk" data-url="${encodeURIComponent(url)}" data-name="${encodeURIComponent(name)}" data-cover="${encodeURIComponent(cover)}" data-folder="${encodeURIComponent(b.folder || sub?.folder || '')}" data-bookid="${encodeURIComponent(bookId)}" data-bookjson="${encodeURIComponent(JSON.stringify(b))}">
        <div class="bk-cover" onclick="toggleBookActions(this.closest('.bk'))" style="background:${bgColor};position:relative;">
          <img src="${coverSrc}" alt="${esc(name)}" data-no-translate loading="lazy" data-i="0" data-covers='${esc(JSON.stringify(coverList))}' data-cover-url="${esc(cover)}" data-book-url="${esc(url)}" onerror="let a=JSON.parse(this.dataset.covers||'[]'),i=(+this.dataset.i||0)+1;this.dataset.i=i;if(a[i])this.src=a[i];else{this.style.display='none'}">

    function normalizeBookKey(val) {
    if (!val) return '';
    var s = String(val).trim().toLowerCase();
    try { s = decodeURIComponent(s); } catch(e) {}
    s = s.replace(/^books\//i, '');
    if (s.indexOf('/') !== -1) {
      var parts = s.split('/');
      s = parts[parts.length - 1] || s;
    }
    s = s.replace(/\.pdf$/i, '').trim();
    return s;
  }

  function matchesBook(bookObj, queryVal) {
    if (!bookObj || !queryVal) return false;
    var targetKey = typeof queryVal === 'object'
      ? (normalizeBookKey(queryVal.id) || normalizeBookKey(queryVal.bookId) || normalizeBookKey(queryVal.file) || normalizeBookKey(queryVal.name) || normalizeBookKey(queryVal.title))
      : normalizeBookKey(queryVal);
    if (!targetKey) return false;

    var k1 = normalizeBookKey(bookObj.id);
    var k2 = normalizeBookKey(bookObj.bookId);
    var k3 = normalizeBookKey(bookObj.file);
    var k4 = normalizeBookKey(bookObj.name);
    var k5 = normalizeBookKey(bookObj.title);

    return k1 === targetKey || k2 === targetKey || k3 === targetKey || k4 === targetKey || k5 === targetKey;
  }

  function isMyBook(queryVal) {
    try {
      const raw = localStorage.getItem('kk_my_books_v1');
      const list = raw ? JSON.parse(raw) : [];
      return list.some(b => matchesBook(b, queryVal));
    } catch(e) {
      return false;
    }
  }

  function handleToggleMyBook(bookId, book, name, folder, file, cover, btn) {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('kk_my_books_v1') || '[]'); } catch(e) {}
    const bookTitle = name || book.name || book.title || 'Китоб';
    const bookFolder = folder || book.folder || (sub && sub.folder) || '';
    const bookFile = file || book.file || (bookTitle + '.pdf');
    const targetUrl = book.url || rawUrl(bookFolder, bookFile);
    const cleanId = normalizeBookKey(bookId || bookFile || bookTitle);

    const existsIndex = list.findIndex(b => matchesBook(b, cleanId));

    if (existsIndex >= 0) {
      list.splice(existsIndex, 1);
      localStorage.setItem('kk_my_books_v1', JSON.stringify(list));
      btn.textContent = '➕ Ба бахши ман';
      btn.classList.remove('btn-success');
      btn.classList.add('btn-ghost');
      toast('Аз «Китобҳои ман» хориҷ шуд');
    } else {
      list.unshift({
        id: cleanId,
        bookId: cleanId,
        name: bookTitle,
        title: bookTitle,
        author: book.author || '',
        folder: bookFolder,
        file: bookFile,
        cover: cover || '',
        url: targetUrl,
        added_at: Date.now()
      });
      localStorage.setItem('kk_my_books_v1', JSON.stringify(list));
      btn.textContent = '✓ Дар бахши ман';
      btn.classList.remove('btn-ghost');
      btn.classList.add('btn-success');
      toast('Ба «Китобҳои ман» илова шуд ⭐');
    }
  }

  function handleFavorite(bookId, book, name, btn) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('Лутфан ворид шавед'); return; }
    const isFaved = btn.textContent.includes('✔');
    (async () => {
      try {
        if (isFaved) {
          const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/favorites/' + encodeURIComponent(bookId || book.file), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (resp.ok) { btn.textContent = '❤️ Дӯстдошта'; toast('Аз дӯстдошта хориҷ шуд'); }
          else toast('Хатогӣ');
        } else {
          const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/favorites', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ book_id: bookId || book.file, book_title: name, book_author: book.author || '' })
          });
          if (resp.ok) { btn.textContent = '❤️ Дӯстдошта (✔)'; toast('Ба дӯстдошта илова шуд'); }
          else toast('Хатогӣ');
        }
        const uid = (typeof AUTH !== 'undefined' && AUTH.getUser) ? AUTH.getUser()?.data?.user?.id : null;
        if (uid && typeof CacheManager !== 'undefined') {
          CacheManager.invalidateKey('kk_cache_favorites');
          CacheManager.invalidateKey('kk_cache_sessions');
        }
      } catch(e) { toast('Хатогӣ'); }
    })();
  }
  function handleComplete(bookId, book, name, url) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('Лутфан ворид шавед'); return; }
    (async () => {
      try {
        const allProgress = JSON.parse(localStorage.getItem('kk_reader_progress') || '{}');
        const progress = allProgress[url] || Object.values(allProgress).find(p => p && p.name && String(p.name).trim().toLowerCase() === String(name).trim().toLowerCase()) || null;
        if (!progress || !progress.pages) {
          toast('Аввал китобро хонед. Пешрафти саҳифа ёфт нашуд.');
          return;
        }
        const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/reading-sessions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            book_id: bookId || book.file,
            book_title: name,
            book_author: book.author || '',
            duration: 0,
            status: 'completed',
            pages_read: Number(progress.page || 0),
            total_pages: Number(progress.pages || 0)
          })
        });
        const result = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(result.error || 'Сервер қабул накард');
        const uid = localStorage.getItem('kk_user_id');
        if (typeof CacheManager !== 'undefined') {
          CacheManager.invalidateKey('kk_cache_sessions');
          if (uid) CacheManager.invalidateKey('kk_cache_sessions_' + encodeURIComponent(uid));
        }
        if (result.completed) {
          toast('✅ Китоб пурра хонда шуд ва ҳамчун хатмшуда сабт шуд');
          if (uid) localStorage.removeItem('kk_avatar_eligibility_' + uid);
        } else {
          const hours = (Number(result.total_reading_seconds || 0) / 3600).toFixed(1);
          const pct = Math.round(Number(result.progress_percent || 0));
          toast(`Ҳоло хатм нашуд: ${hours}/1 соат · ${pct}/95%`);
        }
      } catch(e) { toast('Хатогӣ: ' + e.message); }
    })();
  }

  let globalBooksIndex = null;
  let globalBooksIndexLoadedAt = 0;
  let globalBooksIndexPromise = null;
  const GLOBAL_BOOK_INDEX_TTL_MS = 5 * 60 * 1000;
  async function fetchRepositorySearchIndex() {
    const repo = DATA?.repo || BOOKS_REPO;
    const branch = DATA?.branch || BOOKS_BRANCH;
    const urls = [
      `https://raw.githubusercontent.com/${repo}/${branch}/search-index.json?t=${Date.now()}`,
      `https://cdn.jsdelivr.net/gh/${repo}@${branch}/search-index.json?t=${Date.now()}`
    ];
    for (const url of urls) {
      try {
        const data = await fetchJsonWithTimeout(url, 8000);
        if (data && Array.isArray(data.items)) return data.items;
      } catch(e) {}
    }
    return null;
  }
  async function getGlobalBooksIndex(force = false) {
    const now = Date.now();
    if (!force && Array.isArray(globalBooksIndex) && now - globalBooksIndexLoadedAt < GLOBAL_BOOK_INDEX_TTL_MS) return globalBooksIndex;
    if (globalBooksIndexPromise) return globalBooksIndexPromise;
    const cacheKey = 'kk_global_books_search_v3';
    let cached = null;
    try {
      cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      if (!cached || !Array.isArray(cached.items)) cached = JSON.parse(localStorage.getItem('kk_global_books_search_v2') || 'null');
    } catch (e) { cached = null; }
    if (!force && cached && Array.isArray(cached.items) && cached.ts && now - cached.ts < GLOBAL_BOOK_INDEX_TTL_MS) {
      globalBooksIndex = cached.items;
      globalBooksIndexLoadedAt = cached.ts;
      return globalBooksIndex;
    }
    if (navigator.onLine === false && cached && Array.isArray(cached.items)) {
      globalBooksIndex = cached.items;
      globalBooksIndexLoadedAt = cached.ts || now;
      return globalBooksIndex;
    }
    globalBooksIndexPromise = (async () => {
      const remoteItems = await fetchRepositorySearchIndex();
      if (remoteItems) {
        globalBooksIndex = remoteItems;
      } else {
        const subcategories = (DATA?.categories || []).flatMap(category => category.subs || []);
        const groups = await Promise.all(subcategories.map(async categorySub => {
          try {
            const list = await fetchManifest(categorySub);
            return (list || []).map(book => ({ ...book, folder: categorySub.folder || book.folder || '', category: categorySub.name || '' }));
          } catch (e) { return []; }
        }));
        const seen = new Set();
        globalBooksIndex = groups.flat().filter(book => {
          const key = String(book.folder || '') + '/' + String(book.file || book.name || '');
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }
      globalBooksIndexLoadedAt = Date.now();
      try { localStorage.setItem(cacheKey, JSON.stringify({ ts: globalBooksIndexLoadedAt, items: globalBooksIndex })); } catch (e) {}
      return globalBooksIndex;
    })().catch(() => {
      if (cached && Array.isArray(cached.items)) {
        globalBooksIndex = cached.items;
        globalBooksIndexLoadedAt = cached.ts || Date.now();
        return globalBooksIndex;
      }
      return [];
    }).finally(() => { globalBooksIndexPromise = null; });
    return globalBooksIndexPromise;
  }

  async function searchAllBooks(query) {
    const q = query.toLowerCase();
    const allBooks = await getGlobalBooksIndex();
    return allBooks.filter(book => {
      const haystack = [book.name, book.file, book.author, book.book_author, book.category]
        .filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }

  const searchInput = document.getElementById('searchInput');
  let searchDebounceTimer = null;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(async () => {
      const q = this.value.trim().toLowerCase();
      if (!q) {
        renderBooks(books);
        return;
      }
      const grid = document.getElementById('booksGrid');
      grid.innerHTML = '<div class="loader" style="grid-column:1/-1"></div>';
      const filtered = await searchAllBooks(q);
      renderBooks(filtered);
    }, 180);
  });

  (async function init() {
    try {
      await loadBooksJson();
      CATS = DATA.categories || [];
      if (!CATS.length) throw new Error('Категория нест');
      renderCategories(CATS);
    } catch(e) {
      document.getElementById('booksGrid').innerHTML = '<div class="empty">'+esc(e.message)+'</div>';
    }
  })();

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
</script>
