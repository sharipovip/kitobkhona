<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Китобхона — Китобҳо</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0D1B2A;--bg2:#142236;--card:#1A2D44;--card2:#1E3350;--gold:#C9A84C;--gold2:#E8C96D;--text:#F0EAD6;--muted:#A8B8CC;--dim:#6B7F96;--border:rgba(201,168,76,.18);--shadow:rgba(0,0,0,.4);--glass:rgba(13,27,42,.92);--sidebar-w:72px;--safe-bottom:env(safe-area-inset-bottom,0px)}
.light-theme{--bg:#F5F0E8;--bg2:#EDE6D6;--card:#fff;--card2:#FAF7F0;--text:#1A2D44;--muted:#4A5D73;--dim:#8A9AAD;--shadow:rgba(0,0,0,.12);--glass:rgba(245,240,232,.92)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;overflow:hidden}.phone-wrapper{max-width:430px;margin:0 auto;height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}.top-header{flex:0 0 auto;position:relative;z-index:50;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.header-title{font-size:18px;font-weight:900}.header-subtitle{font-size:11px;color:var(--muted);margin-top:2px}.header-search{grid-column:1 / -1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:9px 11px}.header-search input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:13px}.header-filter-btn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer}.main-layout{flex:1;min-height:0;display:grid;grid-template-columns:var(--sidebar-w) 1fr;gap:8px;padding:8px 8px calc(8px + var(--safe-bottom));overflow:hidden}.sidebar{overflow-y:auto;background:rgba(26,45,68,.58);border:1px solid var(--border);border-radius:22px;padding:8px 5px;scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}.sidebar-item{border:0;background:transparent;color:var(--muted);width:100%;min-height:70px;border-radius:18px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}.sidebar-item.active{background:rgba(201,168,76,.14);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(201,168,76,.22)}.sidebar-icon{font-size:22px}.sidebar-label{font-size:9px;font-weight:800;line-height:1.08;text-align:center;max-width:62px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sidebar-count{font-size:9px;color:var(--dim)}.content-area{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}.subcategories-wrap{flex:0 0 auto;background:rgba(26,45,68,.42);border:1px solid var(--border);border-radius:20px;padding:8px;margin-bottom:8px}.subcategories-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.subcategories-scroll::-webkit-scrollbar{display:none}.subcategory-tab{white-space:nowrap;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);color:var(--text);padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer}.subcategory-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202;border-color:var(--gold)}.content-scroll{flex:1;overflow-y:auto;padding-right:2px;scrollbar-width:none}.content-scroll::-webkit-scrollbar{display:none}.section-title-line{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.category-title{font-size:18px;font-weight:950}.book-count{font-size:11px;color:var(--muted)}.books-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:88px}.book-card{min-width:0;cursor:pointer}.book-cover-wrap{position:relative;aspect-ratio:0.72;border-radius:15px;background:linear-gradient(135deg,var(--card2),var(--bg2));border:1px solid var(--border);overflow:hidden;box-shadow:0 12px 26px var(--shadow);display:grid;place-items:center;text-align:center;padding:8px;color:#fff;font-weight:900;font-size:11px}.book-cover-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.book-cover-wrap:after{content:"";position:absolute;inset:0;box-shadow:inset 10px 0 18px rgba(0,0,0,.22);pointer-events:none}.book-title{font-size:12px;font-weight:900;line-height:1.25;margin-top:7px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-meta{text-align:center;color:var(--muted);font-size:10px;margin-top:2px}.book-actions{display:flex;gap:6px;margin-top:7px}.book-btn{flex:1;border:0;border-radius:11px;padding:7px 4px;font-size:11px;font-weight:900;background:var(--card);color:var(--text);border:1px solid var(--border)}.book-btn.read{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:8px 12px calc(8px + var(--safe-bottom));background:linear-gradient(transparent,var(--bg) 22%)}.bottom-nav-inner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:7px;backdrop-filter:blur(18px);box-shadow:0 -10px 28px var(--shadow)}.nav-item{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px 2px;border-radius:16px;cursor:pointer}.nav-icon{font-size:20px}.nav-item.active{color:var(--gold2);background:rgba(201,168,76,.11)}.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--border);border-radius:18px;background:rgba(255,255,255,.03);grid-column:1/-1}.loader{width:36px;height:36px;border-radius:50%;border:3px solid rgba(201,168,76,.18);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:30px auto;grid-column:1/-1}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="phone-wrapper">
<header class="top-header"><div><div class="header-title">📚 <span>Китобҳо</span></div><div class="header-subtitle" id="hint">Боркунӣ...</div></div><div class="header-filter-btn" id="themeBtn">🌙</div><form class="header-search" id="searchForm"><span>🔍</span><input id="search" type="search" placeholder="Ҷустуҷӯи китоб..."></form></header>
<div class="main-layout"><aside class="sidebar" id="sidebar"><div class="loader"></div></aside><main class="content-area"><div class="subcategories-wrap"><div class="subcategories-scroll" id="subcats"></div></div><section class="content-scroll"><div class="section-title-line"><div class="category-title" id="catTitle">Китобҳо</div><div class="book-count" id="bookCount">—</div></div><div class="books-grid" id="booksGrid"><div class="loader"></div></div></section></main></div>
<nav class="bottom-nav"><div class="bottom-nav-inner"><div class="nav-item" onclick="location.href='index.html'"><div class="nav-icon">🏠</div><div>Асосӣ</div></div><div class="nav-item active"><div class="nav-icon">📚</div><div>Китобҳо</div></div><div class="nav-item" onclick="location.href='honandagon.html#gholibon'"><div class="nav-icon">🏆</div><div>Ғолибон</div></div><div class="nav-item" onclick="location.href='honandagon.html'"><div class="nav-icon">👥</div><div>Хонандагон</div></div><div class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon">👤</div><div>Профил</div></div></div></nav>
</div>
<script>
const BOOKS_JSON_URLS=['https://raw.githubusercontent.com/sharipovip/books/main/books.json?t='+Date.now(),'books.json?t='+Date.now()];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const enc=p=>String(p||'').split('/').map(encodeURIComponent).join('/');
let DATA=null,CATS=[],cat=null,sub=null,books=[],manifestCache=new Map();
function theme(t){document.body.classList.toggle('light-theme',t==='light');localStorage.setItem('kk_theme',t);$('themeBtn').textContent=t==='light'?'☀️':'🌙'}$('themeBtn').onclick=()=>theme(localStorage.getItem('kk_theme')==='light'?'dark':'light');theme(localStorage.getItem('kk_theme')||'dark');
async function loadBooksJson(){for(const u of BOOKS_JSON_URLS){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){DATA=await r.json();return DATA}}catch(e){}}throw new Error('Пайвастшавӣ дастрас нест. Интернетро санҷед.')}
function rawUrl(folder,file){return `https://raw.githubusercontent.com/${DATA.repo||'sharipovip/books'}/${DATA.branch||'main'}/${enc(folder)}/${encodeURIComponent(file)}`}
function coverCandidates(folder,file){const jpg=encodeURIComponent(file.replace(/\.pdf$/i,'.jpg'));const clean=String(folder).replace(/^books\//,'');const base=`https://raw.githubusercontent.com/${DATA.repo||'sharipovip/books'}/${DATA.branch||'main'}`;return [`${base}/covers/${enc(clean)}/${jpg}`,`${base}/covers/books/${enc(clean)}/${jpg}`,`${base}/covers/${enc(folder)}/${jpg}`]}
async function fetchManifest(su){const key=su.folder;if(manifestCache.has(key))return manifestCache.get(key);let list=[];try{const r=await fetch(`https://raw.githubusercontent.com/${DATA.repo}/${DATA.branch}/${enc(su.folder)}/manifest.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok){const j=await r.json();list=Array.isArray(j.books)?j.books:[]}}catch(e){}if(!list.length){try{const api=`https://api.github.com/repos/${DATA.repo}/contents/${enc(su.folder)}?ref=${encodeURIComponent(DATA.branch)}`;const arr=await fetch(api).then(r=>r.ok?r.json():[]);list=(Array.isArray(arr)?arr:[]).filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)).map(x=>({name:x.name.replace(/\.pdf$/i,''),file:x.name,size:x.size||0}))}catch(e){}}
manifestCache.set(key,list);return list}
function renderCats(){ $('sidebar').innerHTML=CATS.map(c=>`<button class="sidebar-item ${cat&&cat.id===c.id?'active':''}" onclick="selectCat('${String(c.id).replace(/'/g,'')}')"><div class="sidebar-icon">${esc(c.emoji||'📚')}</div><div class="sidebar-label">${esc(c.name||'Категория')}</div><div class="sidebar-count">${(c.subs||[]).length}</div></button>`).join('') }
function renderSubs(){const arr=cat?.subs||[];$('subcats').innerHTML=arr.map(s=>`<button class="subcategory-tab ${sub&&sub.id===s.id?'active':''}" onclick="selectSub('${String(s.id).replace(/'/g,'')}')">${esc(s.emoji||'📁')} ${esc(s.name||s.folder)}</button>`).join('')||'<span class="subcategory-tab active">Бахше нест</span>'}
async function selectCat(id,subId){cat=CATS.find(c=>c.id===id)||CATS[0];sub=(subId?cat.subs?.find(s=>s.id===subId):null)||cat.subs?.[0]||null;renderCats();renderSubs();$('catTitle').textContent=cat?.name||'Китобҳо';$('hint').textContent=cat?.name||'';if(sub)await loadSub(sub);else $('booksGrid').innerHTML='<div class="empty">Бахше нест</div>'}
async function selectSub(id){sub=cat.subs.find(s=>s.id===id)||sub;renderSubs();await loadSub(sub)}
async function loadSub(su){$('booksGrid').innerHTML='<div class="loader"></div>';books=await fetchManifest(su);renderBooks(books)}
function renderBooks(list){$('bookCount').textContent=(list?.length||0)+' китоб';if(!list?.length){$('booksGrid').innerHTML='<div class="empty">Дар ин бахш ҳоло китоб дастрас нест</div>';return}$('booksGrid').innerHTML=list.map(b=>{const file=b.file||((b.name||'book')+'.pdf'),name=b.name||file.replace(/\.pdf$/i,''),url=rawUrl(sub.folder,file),c=coverCandidates(sub.folder,file);return `<article class="book-card"><div class="book-cover-wrap" onclick="openReader('${encodeURIComponent(url)}','${encodeURIComponent(name)}')"><img loading="lazy" src="${c[0]}" onerror="this.onerror=function(){this.onerror=null;this.src='${c[2]}'};this.src='${c[1]}'" alt=""><span>${esc(name)}</span></div><div class="book-title">${esc(name)}</div><div class="book-meta">${b.size?Math.round(b.size/1024/1024*10)/10+' MB':'PDF'}</div><div class="book-actions"><button class="book-btn read" onclick="openReader('${encodeURIComponent(url)}','${encodeURIComponent(name)}')">📖 Хондан</button><button class="book-btn" onclick="downloadBook('${encodeURIComponent(url)}','${encodeURIComponent(name)}')">⬇</button></div></article>`}).join('')}
function openReader(url,name){location.href=`reader.html?url=${url}&name=${name}`}
function downloadBook(url,name){const a=document.createElement('a');a.href=decodeURIComponent(url);a.download=decodeURIComponent(name)+'.pdf';a.click()}
$('searchForm').onsubmit=e=>{e.preventDefault();const q=$('search').value.trim().toLowerCase();if(!q)return renderBooks(books);const res=books.filter(b=>(b.name||b.file||'').toLowerCase().includes(q));renderBooks(res)};$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();if(!q)renderBooks(books)});
(async function init(){try{await loadBooksJson();CATS=DATA.categories||[];if(!CATS.length)throw new Error('Категория нест');const qs=new URL(location.href).searchParams;const q=qs.get('q')||'';if(q)$('search').value=q;await selectCat(qs.get('cat')||CATS[0].id,qs.get('sub'));if(q){setTimeout(()=>$('searchForm').dispatchEvent(new Event('submit')),250)}}catch(e){$('booksGrid').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'; $('sidebar').innerHTML=''}})();
</script>
</body>
</html>
