function escHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function timeSince(d) {
  const diff = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (diff < 60) return 'ҳозир';
  if (diff < 3600) return Math.floor(diff/60) + ' дақ. пеш';
  if (diff < 86400) return Math.floor(diff/3600) + ' соат пеш';
  if (diff < 604800) return Math.floor(diff/86400) + ' рӯз пеш';
  return new Date(d).toLocaleDateString('tg-TJ');
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

function showConfirmDialog(msg, title, okLabel) {
  return new Promise(resolve => {
    $('confirmTitle').textContent = title || 'Тасдиқ';
    $('confirmMsg').textContent = msg;
    $('confirmOk').textContent = okLabel || 'Тасдиқ';
    $('confirmOverlay').classList.add('open');
    const ok = () => { $('confirmOverlay').classList.remove('open'); resolve(true); cleanup(); };
    const cancel = () => { $('confirmOverlay').classList.remove('open'); resolve(false); cleanup(); };
    function cleanup() {
      $('confirmOk').removeEventListener('click', ok);
      $('confirmCancel').removeEventListener('click', cancel);
    }
    $('confirmOk').addEventListener('click', ok);
    $('confirmCancel').addEventListener('click', cancel);
  });
}

function enc(p) {
  if (!p) return '';
  return String(p).split('/').map(encodeURIComponent).join('/');
}
function rawUrl(folder, file) {
  const repo = 'sharipovip/books', branch = 'main';
  let fileName = file;
  if (!fileName.includes('.')) fileName += '.pdf';
  let cleanFolder = String(folder).replace(/^main\//,'').replace(/^books\//,'');
  if (!cleanFolder || cleanFolder === 'books') cleanFolder = '';
  const encodedParts = cleanFolder ? enc(cleanFolder) : '';
  const base = `https://raw.githubusercontent.com/${repo}/${branch}/books`;
  const decodedFile = decodeURIComponent(fileName);
  return encodedParts
    ? `${base}/${encodedParts}/${encodeURIComponent(decodedFile)}`
    : `${base}/${encodeURIComponent(decodedFile)}`;
}
function coverListFromPdfUrl(pdfUrl) {
  try {
    const x = new URL(pdfUrl);
    if (!x.hostname.includes('githubusercontent.com')) return [];
    const parts = x.pathname.split('/').filter(Boolean);
    if (parts.length < 5) return [];
    const [owner, repo, branch, ...rest] = parts;
    const path = [...rest];
    const file = decodeURIComponent(path.pop() || '').replace(/\.pdf$/i, '.jpg');
    let folder = path.join('/');
    let clean = folder.replace(/^books\//, '');
    const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}`;
    return [
      `${base}/covers/${enc(clean)}/${encodeURIComponent(file)}`,
      `${base}/covers/books/${enc(clean)}/${encodeURIComponent(file)}`,
      `${base}/covers/${enc(folder)}/${encodeURIComponent(file)}`
    ];
  } catch(e) { return []; }
}
function getCoverForBook(book) {
  const folder = book.folder || 'books';
  const file = book.file || book.book_id;
  if (!file) return '';
  const url = rawUrl(folder, file);
  const covers = coverListFromPdfUrl(url);
  return covers[0] || '';
}
function getCoverFromPost(post) {
  if (post.cover_url) return post.cover_url;
  const b = {
    folder: post.book_folder || 'books',
    file: post.book_file || post.book_id,
    book_id: post.book_id
  };
  return getCoverForBook(b) || '';
}

function openBookFromPost(bookId, bookTitle, pdfUrl, coverUrl) {
  if (!bookId) return;
  const cleanBookId = String(bookId).replace(/^books\//i, '');
  const safePdfUrl = String(pdfUrl || '').replace(/&amp;/g, '&');
  let folder = 'books', file = cleanBookId;
  if (cleanBookId.includes('/')) {
    const parts = cleanBookId.split('/');
    file = parts.pop();
    folder = parts.join('/');
    if (!folder.startsWith('books/')) folder = 'books/' + folder;
  }
  const url = safePdfUrl || rawUrl(folder, file);
  const name = bookTitle || file.replace(/\.pdf$/i, '') || 'Китоб';
  const cover = coverUrl || getCoverForBook({ folder, file, book_id: cleanBookId });
  const coverValue = String(cover || '').trim();
  const coverParam = coverValue && !/^data:/i.test(coverValue)
    ? `&cover=${encodeURIComponent(coverValue)}`
    : '';
  location.href = `reader.html?url=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}${coverParam}`;
}

function parsePostContent(raw) {
  if (!raw) return { text: '', style: {} };
  const SEP = '|||STYLE|||';
  const idx = raw.indexOf(SEP);
  if (idx === -1) return { text: raw, style: {} };
  const text = raw.slice(0, idx);
  try {
    const style = JSON.parse(raw.slice(idx + SEP.length));
    return { text, style };
  } catch {
    return { text: raw, style: {} };
  }
}
function buildPostContent(text, style) {
  const SEP = '|||STYLE|||';
  const s = {
    font: style.font || 'Roboto',
    size: style.size || 14,
    color: style.color || '#FFFFFF',
    animation: style.animation || 'word',
    hashtags: style.hashtags || [],
  };
  return text + SEP + JSON.stringify(s);
}

function animateTextOverlay(el, text, style) {
  if (!el) return;
  const font = style.font || 'Roboto';
  const size = style.size || 14;
  const color = style.color || '#FFFFFF';
  const anim = style.animation || 'fade';

  el.style.fontFamily = `'${font}', sans-serif`;
  el.style.fontSize = size + 'px';
  el.style.color = color;
  el.innerHTML = '';

  if (!text) return;

  switch (anim) {
    case 'fade': {
      el.textContent = text;
      el.style.opacity = '0';
      el.style.animation = 'textFade 0.9s 0.1s forwards';
      break;
    }
    case 'letter': {
      el.style.opacity = '1';
      [...text].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        sp.style.cssText = `display:inline-block;opacity:0;animation:letterPop 0.25s ${(i*0.045).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'word': {
      el.style.opacity = '1';
      text.split(' ').forEach((w, i) => {
        const sp = document.createElement('span');
        sp.textContent = w + ' ';
        sp.style.cssText = `display:inline-block;opacity:0;animation:wordSlide 0.4s ${(i*0.13).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'line': {
      el.style.opacity = '1';
      const lines = text.split('\n');
      lines.forEach((line, i) => {
        const div = document.createElement('div');
        div.textContent = line || '\u00A0';
        div.style.cssText = `opacity:0;animation:lineSlide 0.45s ${(i*0.22).toFixed(2)}s forwards`;
        el.appendChild(div);
      });
      break;
    }
    case 'wave': {
      el.style.opacity = '1';
      [...text].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        sp.style.cssText = `display:inline-block;animation:waveLetter 1.2s ${(i*0.06).toFixed(2)}s infinite ease-in-out`;
        el.appendChild(sp);
      });
      break;
    }
    case 'typewriter': {
      el.style.opacity = '1';
      const chars = [...text];
      chars.forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch;
        sp.style.cssText = `opacity:0;animation:typeChar 0.01s ${(i*0.065).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'bounce': {
      el.style.opacity = '1';
      text.split(' ').forEach((w, i) => {
        const sp = document.createElement('span');
        sp.textContent = w + ' ';
        sp.style.cssText = `display:inline-block;opacity:0;animation:wordBounce 0.5s ${(i*0.14).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'glow': {
      el.style.opacity = '1';
      text.split(' ').forEach((w, i) => {
        const sp = document.createElement('span');
        sp.textContent = w + ' ';
        sp.style.cssText = `display:inline-block;opacity:0;animation:wordGlow 0.6s ${(i*0.18).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'cinematic': {
      el.textContent = text;
      el.style.opacity = '0';
      el.style.animation = 'cinematic 1.8s 0.3s forwards';
      break;
    }
    case 'slideup': {
      el.style.opacity = '1';
      text.split('\n').forEach((line, i) => {
        const div = document.createElement('div');
        div.textContent = line || '\u00A0';
        div.style.cssText = `opacity:0;animation:slideFromBottom 0.5s ${(i*0.2).toFixed(2)}s forwards`;
        el.appendChild(div);
      });
      break;
    }
    default:
      el.textContent = text;
  }
}

async function loadReadingSessions() {
  const token = getToken();
  if (!token) return;
  const cacheKey = 'kk_reading_progress';
  let map = CacheManager ? CacheManager.get(cacheKey) : null;
  if (map) {
    bookProgressMap = map;
    return;
  }
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/reading-sessions', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const sessions = await resp.json();
    map = {};
    sessions.forEach(s => {
      if (!s.book_id) return;
      const key = s.book_id;
      if (!map[key]) map[key] = { totalDuration: 0, status: s.status || 'active' };
      map[key].totalDuration += s.duration || 0;
      if (s.status === 'completed') map[key].status = 'completed';
    });
    Object.keys(map).forEach(key => {
      const item = map[key];
      if (item.status === 'completed') {
        item.progress = 100;
        item.statusText = 'finished';
      } else {
        let prog = Math.min(95, Math.round((item.totalDuration / 60) * 100));
        if (prog < 1 && item.totalDuration > 0) prog = 1;
        item.progress = prog;
        item.statusText = 'reading';
      }
    });
    bookProgressMap = map;
    if (CacheManager) CacheManager.set(cacheKey, map);
  } catch(e) { console.warn('Failed to load reading sessions', e); }
}

async function loadBookRatings(bookIds) {
  if (!bookIds || bookIds.length === 0) return;
  const token = getToken();
  const cacheKey = 'kk_book_reactions';
  let cached = CacheManager ? CacheManager.get(cacheKey) : null;
  if (cached) {
    bookReactions = cached;
    return;
  }
  try {
    const resp = await edgeApiFetch('/api/book-stats-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ book_ids: bookIds })
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    bookIds.forEach(id => {
      if (!bookReactions[id]) bookReactions[id] = { stats: {}, user: {} };
      bookReactions[id].stats = data[id] || { likes:0, loves:0, dislikes:0, avg_rating:null, ratings_count:0 };
      bookReactions[id].user = { reaction: null, rating: null };
    });
    if (token) {
      const userResp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions/batch', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_ids: bookIds })
      });
      if (userResp.ok) {
        const userData = await userResp.json();
        bookIds.forEach(id => {
          if (userData.user_reactions[id]) {
            bookReactions[id].user = userData.user_reactions[id];
          }
        });
      }
    }
    if (CacheManager) CacheManager.set(cacheKey, bookReactions);
  } catch(e) {
    console.warn('Failed to load ratings', e);
  }
}

const FEED_SEEN_KEY = 'kk_seen_feed_posts';

function getSeenFeedPosts() {
  try { return JSON.parse(localStorage.getItem(FEED_SEEN_KEY) || '{}'); }
  catch (e) { return {}; }
}

function markFeedPostSeen(postId) {
  if (!postId) return;
  const seen = getSeenFeedPosts();
  seen[String(postId)] = Date.now();
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  Object.keys(seen).forEach(id => { if (!seen[id] || seen[id] < cutoff) delete seen[id]; });
  const ids = Object.keys(seen);
  if (ids.length > 500) {
    ids.sort((a, b) => seen[a] - seen[b]).slice(0, ids.length - 500).forEach(id => delete seen[id]);
  }
  try { localStorage.setItem(FEED_SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}

function weightedRandomPosts(posts) {
  const pool = Array.isArray(posts) ? posts.slice() : [];
  const result = [];
  while (pool.length) {
    const weights = pool.map(post => 1 + Math.pow(Math.max(0, Number(post.likes_count) || 0), 0.75));
    const total = weights.reduce((sum, weight) => sum + weight, 0);
    let point = Math.random() * total;
    let index = 0;
    for (; index < pool.length - 1; index++) {
      point -= weights[index];
      if (point <= 0) break;
    }
    result.push(pool.splice(index, 1)[0]);
  }
  return result;
}

function orderFeedPosts(posts) {
  const list = Array.isArray(posts) ? posts.filter(Boolean) : [];
  const seen = getSeenFeedPosts();
  const unseen = list.filter(post => !seen[String(post.id)]);
  const alreadySeen = list.filter(post => seen[String(post.id)]);
  unseen.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  return unseen.concat(weightedRandomPosts(alreadySeen));
}

async function loadPosts() {
  if (_loadingPosts) return;
  _loadingPosts = true;

  const container = $('shortsContainer');
  if (!container) {
    console.error('shortsContainer not found');
    _loadingPosts = false;
    return;
  }

  container.innerHTML = `
    <div class="short-slide" style="display:flex;align-items:center;justify-content:center;">
      <div class="shorts-loader"><div class="spinner"></div></div>
    </div>
  `;

  try {
    const cachedPosts = CacheManager ? CacheManager.get(CacheManager.KEYS.POSTS) : null;
    if (cachedPosts && Array.isArray(cachedPosts) && cachedPosts.length) {
      postsData = orderFeedPosts(cachedPosts);
      currentUserId = localStorage.getItem('kk_user_id') || null;
      await loadReadingSessions();
      const bookIds = [...new Set(postsData.map(p => p.book_id).filter(Boolean))];
      if (bookIds.length > 0) await loadBookRatings(bookIds);
      renderShorts();
      void loadPostsFromServer(true);
    } else {
      await loadPostsFromServer(false);
    }
  } catch (e) {
    console.error('loadPosts error:', e);
    container.innerHTML = `
      <div class="short-slide">
        <div class="shorts-empty">
          <h3>Хатогӣ</h3>
          <p>${escHtml(e.message)}</p>
        </div>
      </div>
    `;
  } finally {
    _loadingPosts = false;
  }

  if (unsubscribePosts) unsubscribePosts();
  unsubscribePosts = CacheManager.subscribe(CacheManager.KEYS.POSTS, (newPosts) => {
    if (!newPosts || !Array.isArray(newPosts)) {
      loadPostsFromServer();
      return;
    }
    const currentStr = JSON.stringify(postsData);
    const newStr = JSON.stringify(newPosts);
    if (currentStr === newStr) return;

    postsData = orderFeedPosts(newPosts);
    currentUserId = localStorage.getItem('kk_user_id') || null;
    loadReadingSessions().then(() => {
      const bookIds2 = [...new Set(postsData.map(p => p.book_id).filter(Boolean))];
      if (bookIds2.length > 0) loadBookRatings(bookIds2);
    });
    renderShorts();
    renderGrid();
  });
}

async function loadPostsFromServer(silent) {
  const container = $('shortsContainer');
  if (!container) return;

  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts');
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const posts = await resp.json();
    postsData = orderFeedPosts(Array.isArray(posts) ? posts : (posts.posts || []));
    currentUserId = localStorage.getItem('kk_user_id') || null;

    const bookIds = [...new Set(postsData.map(p => p.book_id).filter(Boolean))];
    if (bookIds.length > 0) await loadBookRatings(bookIds);
    await loadReadingSessions();

    if (CacheManager) CacheManager.set(CacheManager.KEYS.POSTS, postsData);
    renderShorts();
  } catch(e) {
    console.error('loadPostsFromServer error:', e);
    if (!silent) {
      container.innerHTML = `
        <div class="short-slide">
          <div class="shorts-empty">
            <h3>Хатогӣ дар боргирӣ</h3>
            <p>${escHtml(e.message)}</p>
          </div>
        </div>
      `;
    }
  }
}

function renderShorts() {
  const container = $('shortsContainer');
  if (!container) return;
  if (!postsData.length) {
    renderShortsEmpty('Постҳо нестанд');
    return;
  }
  container.innerHTML = '';
  postsData.forEach((post, idx) => {
    const slide = buildSlide(post, idx);
    container.appendChild(slide);
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      const slide = e.target;
      const postId = slide.dataset.postId;
      const post = postsData.find(p => String(p.id) === String(postId));
      if (!post) return;
      if (e.isIntersecting && e.intersectionRatio > 0.6) {
        markFeedPostSeen(postId);
        const textEl = slide.querySelector('.slide-text-overlay');
        if (!textEl) return;
        const { text, style } = parsePostContent(post.content);
        animateTextOverlay(textEl, text, style);
      }
    });
  }, { threshold: 0.6 });

  container.querySelectorAll('.short-slide').forEach(s => io.observe(s));
}

function renderGrid(filter, query) {
  const cells = $('gridCells');
  let posts = [...postsData];
  if (query && query.trim()) {
    const q = query.trim().toLowerCase();
    posts = posts.filter(p => {
      if (filter === 'user') return (p.display_name||p.username||'').toLowerCase().includes(q);
      if (filter === 'book') return (p.book_title||'').toLowerCase().includes(q);
      if (filter === 'author') return (p.book_author||'').toLowerCase().includes(q);
      if (filter === 'hashtag') {
        const { style } = parsePostContent(p.content);
        return (style.hashtags||[]).some(h => h.toLowerCase().includes(q.replace(/^#/,'')));
      }
      return (p.display_name||p.username||'').toLowerCase().includes(q)
        || (p.book_title||'').toLowerCase().includes(q)
        || (p.book_author||'').toLowerCase().includes(q)
        || (p.content||'').toLowerCase().includes(q);
    });
  }

  cells.innerHTML = '';
  if (!posts.length) {
    cells.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--dim);font-size:14px">Натиҷае нест</div>`;
    return;
  }
  posts.forEach(post => {
    const cover = getCoverFromPost(post);
    const liked = post.likes_count || 0;
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    cell.dataset.postId = post.id;
    if (cover) {
      const cached = CacheManager?.getCachedCover(cover) || cover;
      cell.innerHTML = `
        <img src="${escHtml(cached)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=grid-cell-no-cover>📚</div>'">
        <div class="grid-cell-overlay"><span class="grid-cell-likes">❤️ ${liked}</span></div>`;
    } else {
      cell.innerHTML = `<div class="grid-cell-no-cover">📚</div>
        <div class="grid-cell-overlay"><span class="grid-cell-likes">❤️ ${liked}</span></div>`;
    }
    cell.addEventListener('click', () => {
      openShortAtPost(post.id);
    });
    cells.appendChild(cell);
  });
}

async function handleLike(postId) {
  const token = getToken();
  if (!token) { showToast('Лутфан ворид шавед'); return; }
  const post = postsData.find(p => String(p.id) === String(postId));
  if (!post) return;
  const wasLiked = post.liked;
  post.liked = !wasLiked;
  post.likes_count = (post.likes_count || 0) + (wasLiked ? -1 : 1);
  updateLikeUI(postId, post.liked, post.likes_count);
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts/' + postId + '/like', {
      method: wasLiked ? 'DELETE' : 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    showToast(wasLiked ? 'Лайк гирифта шуд' : '❤️ Лайк гузошта шуд');
  } catch (e) {
    post.liked = wasLiked;
    post.likes_count = (post.likes_count || 0) + (wasLiked ? 1 : -1);
    updateLikeUI(postId, post.liked, post.likes_count);
  }
}
function updateLikeUI(postId, liked, count) {
  const icon = $('likeIcon_' + postId);
  const cnt = $('likeCnt_' + postId);
  if (icon) { icon.textContent = liked ? '❤️' : '🤍'; icon.classList.toggle('liked', liked); }
  if (cnt) cnt.textContent = count;
}

function openComments(postId) {
  activePostId = postId;
  const overlay = $('commentsSheet');
  overlay.classList.add('open');
  $('commentInput').value = '';
  $('commentsListInner').innerHTML = '<div class="comment-empty">Боргузорӣ...</div>';
  loadComments(postId);
}
$('commentsSheetClose').addEventListener('click', () => $('commentsSheet').classList.remove('open'));
$('commentsSheet').addEventListener('click', e => {
  if (e.target === $('commentsSheet')) $('commentsSheet').classList.remove('open');
});

async function loadComments(postId) {
  const token = getToken(); if (!token) return;
  const list = $('commentsListInner');
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts/' + postId + '/comments', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error();
    const comments = await resp.json();
    list.innerHTML = '';
    if (!comments.length) { list.innerHTML = '<div class="comment-empty">Шарҳе нест</div>'; return; }
    comments.forEach(c => {
      const author = c.display_name || c.username || 'Корбар';
      const isMine = currentUserId && String(c.user_id) === String(currentUserId);
      const div = document.createElement('div');
      div.className = 'comment-item';
      div.innerHTML = `
        <div class="comment-av">${(author[0]||'?').toUpperCase()}</div>
        <div class="comment-body">
          <div class="comment-author">${escHtml(author)}</div>
          <div class="comment-text">${escHtml(c.text)}</div>
        </div>
        ${isMine ? `<button class="comment-del" data-cid="${c.id}">🗑</button>` : ''}
      `;
      if (isMine) {
        div.querySelector('.comment-del').addEventListener('click', () => deleteComment(c.id, postId, div));
      }
      list.appendChild(div);
    });
  } catch { list.innerHTML = '<div class="comment-empty">Хатогӣ</div>'; }
}

async function deleteComment(cid, postId, el) {
  if (!await showConfirmDialog('Шарҳи худро нест кунед?', 'Нест кардан', 'Нест кунед')) return;
  const token = getToken(); if (!token) return;
  try {
    const r = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts/' + postId + '/comments/' + cid, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!r.ok) throw new Error();
    el.remove(); showToast('Шарҳ нест карда шуд');
  } catch { showToast('Хатогӣ'); }
}

$('commentSend').addEventListener('click', async () => {
  const text = $('commentInput').value.trim();
  if (!text || !activePostId) return;
  const token = getToken(); if (!token) { showToast('Ворид шавед'); return; }
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts/' + activePostId + '/comment', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!resp.ok) throw new Error();
    const newC = await resp.json();
    const author = newC.display_name || newC.username || 'Шумо';
    const div = document.createElement('div');
    div.className = 'comment-item';
    div.innerHTML = `
      <div class="comment-av">${(author[0]||'?').toUpperCase()}</div>
      <div class="comment-body">
        <div class="comment-author">${escHtml(author)}</div>
        <div class="comment-text">${escHtml(text)}</div>
      </div>
    `;
    const list = $('commentsListInner');
    if (list.querySelector('.comment-empty')) list.innerHTML = '';
    list.appendChild(div);
    $('commentInput').value = '';
    showToast('Шарҳ илова шуд');
    const post = postsData.find(p => String(p.id) === String(activePostId));
    if (post) post.comments_count = (post.comments_count || 0) + 1;
  } catch { showToast('Хатогӣ'); }
});

function openRating(postId, bookId) {
  if (!bookId) { showToast('Китоб мавҷуд нест'); return; }
  activePostId = postId;
  activeBookId = bookId;
  currentRating = 0;
  $('ratingStarsRow').querySelectorAll('.r-star').forEach(s => s.classList.remove('on'));
  $('ratingLabelBig').textContent = 'Баҳо интихоб кунед (1–10)';
  $('ratingSheet').classList.add('open');
}
$('ratingSheetClose').addEventListener('click', () => $('ratingSheet').classList.remove('open'));
$('ratingSheet').addEventListener('click', e => {
  if (e.target === $('ratingSheet')) $('ratingSheet').classList.remove('open');
});

$('ratingStarsRow').querySelectorAll('.r-star').forEach(star => {
  star.addEventListener('click', () => {
    currentRating = parseInt(star.dataset.v);
    $('ratingStarsRow').querySelectorAll('.r-star').forEach(s => {
      s.classList.toggle('on', parseInt(s.dataset.v) <= currentRating);
    });
    $('ratingLabelBig').textContent = `Шумо: ⭐ ${currentRating} / 10`;
  });
});

$('ratingSubmit').addEventListener('click', async () => {
  if (!currentRating) { showToast('Баҳо интихоб кунед'); return; }
  if (!activeBookId) { showToast('Китоб мавҷуд нест'); return; }
  const token = getToken(); if (!token) { showToast('Ворид шавед'); return; }
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ book_id: activeBookId, rating: currentRating })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const stats = await resp.json();
    const avg = stats.avg_rating ? parseFloat(stats.avg_rating).toFixed(1) : currentRating;
    const cnt = $('ratingCnt_' + activePostId);
    if (cnt) cnt.textContent = avg;
    showToast('Баҳо сабт шуд ⭐ ' + currentRating + '/10');
    $('ratingSheet').classList.remove('open');
  } catch (e) { showToast('Хатогӣ: ' + e.message); }
});

async function deletePost(postId) {
  if (!await showConfirmDialog('Шумо воқеан мехоҳед ин постро нест кунед?', 'Нест кардани пост', 'Нест кунед')) return;
  const token = getToken();
  if (!token) { showToast('Лутфан ворид шавед'); return; }
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts/' + postId, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    showToast('Пост нест карда шуд');
    if (CacheManager) CacheManager.invalidateKey(CacheManager.KEYS.POSTS);
    loadPosts();
  } catch(e) { showToast('Хатогӣ: ' + e.message); }
}

function goStep(n) {
  if (n === 2) {
    const book_id = $('postBookSelect').value;
    const author = ($('postBookAuthor').value || '').trim();
    if (!book_id || !author) {
      showToast('Лутфан китоб ва муаллифро пур кунед');
      return;
    }
  }

  currentStep = n;
  document.querySelectorAll('.step-tab').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.step) === n);
  });
  document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
  $('step' + n).classList.add('active');
  if (n === 3) updatePreview();
  updateSubmitButton();
}

function updateSubmitButton() {
  const submitBtn = $('submitPostBtn');
  const nextBtn = $('step1Next');
  const text = ($('postContent').value || '').trim();
  const book_id = $('postBookSelect').value;
  const author = ($('postBookAuthor').value || '').trim();
  const bookReady = !!book_id && !!author;

  if (nextBtn) nextBtn.disabled = !bookReady;
  if (submitBtn) submitBtn.disabled = !(bookReady && (text || book_id));
}

document.addEventListener('DOMContentLoaded', function() {
  const content = $('postContent');
  const select = $('postBookSelect');
  const author = $('postBookAuthor');
  if (content) content.addEventListener('input', updateSubmitButton);
  if (select) select.addEventListener('change', updateSubmitButton);
  if (author) author.addEventListener('input', updateSubmitButton);
});

function buildFontGrid() {
  const grid = $('fontGrid');
  grid.innerHTML = '';
  FONTS.forEach(f => {
    const card = document.createElement('div');
    card.className = 'font-card' + (f.name === postStyle.font ? ' selected' : '');
    card.innerHTML = `
      <div class="font-card-preview" style="font-family:'${f.name}',sans-serif">${f.preview}</div>
      <div class="font-card-name">${f.label}</div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.font-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      postStyle.font = f.name;
    });
    grid.appendChild(card);
  });
}

function buildColorRow() {
  const row = $('colorRow');
  row.innerHTML = '';
  TEXT_COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c === postStyle.color ? ' selected' : '');
    dot.style.background = c;
    if (c === '#FFFFFF') dot.style.border = '2px solid rgba(255,255,255,0.3)';
    if (c === '#000000') dot.style.border = '2px solid rgba(255,255,255,0.15)';
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      postStyle.color = c;
      $('customColor').value = c;
    });
    row.appendChild(dot);
  });
}

function buildAnimGrid() {
  const grid = $('animGrid');
  grid.innerHTML = '';
  ANIMATIONS.forEach(a => {
    const card = document.createElement('div');
    card.className = 'anim-card' + (a.id === postStyle.animation ? ' selected' : '');
    card.innerHTML = `
      <div class="anim-icon">${a.icon}</div>
      <div><div class="anim-label">${a.label}</div><div class="anim-desc">${a.desc}</div></div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.anim-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      postStyle.animation = a.id;
    });
    grid.appendChild(card);
  });
}

function buildSizePicker() {
  document.querySelectorAll('.size-chip').forEach(chip => {
    chip.classList.toggle('selected', parseInt(chip.dataset.size) === postStyle.size);
    chip.addEventListener('click', () => {
      document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      postStyle.size = parseInt(chip.dataset.size);
    });
  });
}

function buildHashtagSection() {
  const suggestions = $('hashtagSuggestions');
  suggestions.innerHTML = '';
  HASHTAG_SUGGESTIONS.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'h-suggest';
    btn.textContent = '#' + h;
    btn.addEventListener('click', () => addHashtag(h));
    suggestions.appendChild(btn);
  });
  renderHashtags();
}

function addHashtag(raw) {
  const h = raw.replace(/^#+/, '').trim().toLowerCase();
  if (!h || postStyle.hashtags.includes(h)) return;
  postStyle.hashtags.push(h);
  renderHashtags();
}

function renderHashtags() {
  const chips = $('hashtagChips');
  chips.innerHTML = '';
  postStyle.hashtags.forEach(h => {
    const chip = document.createElement('div');
    chip.className = 'hashtag-chip';
    chip.innerHTML = `#${escHtml(h)} <span class="rm">✕</span>`;
    chip.querySelector('.rm').addEventListener('click', () => {
      postStyle.hashtags = postStyle.hashtags.filter(x => x !== h);
      renderHashtags();
    });
    chips.appendChild(chip);
  });
}

$('hashtagAdd').addEventListener('click', () => {
  const val = $('hashtagInput').value.trim();
  if (val) { addHashtag(val); $('hashtagInput').value = ''; }
});
$('hashtagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = $('hashtagInput').value.trim();
    if (val) { addHashtag(val); $('hashtagInput').value = ''; }
  }
});

$('customColor').addEventListener('input', e => {
  postStyle.color = e.target.value;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
});

function updatePreview() {
  const text = ($('postContent').value || '').trim();
  const textEl = $('previewTextEl');
  const sel = $('postBookSelect');
  const selectedOpt = sel.options[sel.selectedIndex];
  const bgImg = $('previewBgImg');
  const bookImgEl = $('previewBookImgEl');
  if (previewCoverUrl) {
    bgImg.src = previewCoverUrl;
    bookImgEl.src = previewCoverUrl;
    $('previewBookImg').style.display = 'block';
  } else {
    bgImg.src = '';
    $('previewBookImg').style.display = 'none';
  }
  animateTextOverlay(textEl, text, postStyle);
}

async function canPublishPost() {
  const token = getToken();
  const userId = localStorage.getItem('kk_user_id');
  if (!token || !userId) {
    showToast('Меҳмон метавонад постҳоро бинад, аммо барои нашр бояд ворид шавад.');
    return false;
  }
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/profiles/' + encodeURIComponent(userId), {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const profile = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(profile.error || 'Профил дастрас нест');
    const complete = String(profile.first_name || '').trim()
      && String(profile.last_name || '').trim()
      && String(profile.gender || '').trim()
      && profile.birth_year;
    if (!complete) {
      showToast('Барои нашри пост аввал ном, насаб, соли таваллуд ва ҷинсро дар профил пур кунед.');
      setTimeout(() => { location.href = 'profile.html'; }, 1200);
      return false;
    }
    return true;
  } catch (e) {
    showToast('Профилро санҷидан муяссар нашуд.');
    return false;
  }
}

async function openPostModal(bookId) {
  if (!await canPublishPost()) return;
  $('modalTitle').textContent = '📝 Эҷоди пост';
  postStyle = { font: 'Roboto', size: 14, color: '#FFFFFF', animation: 'word', hashtags: [] };
  previewCoverUrl = '';
  goStep(1);
  buildFontGrid();
  buildColorRow();
  buildAnimGrid();
  buildSizePicker();
  buildHashtagSection();
  $('postContent').value = '';
  $('postBookAuthor').value = '';
  $('postBookSelect').value = '';
  await loadBooksForSelect();
  $('postModal').classList.add('open');
  updateSubmitButton();
}

async function loadBooksForSelect() {
  const select = $('postBookSelect');
  const token = getToken();
  if (!token) return;
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/reading-sessions', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const sessions = await resp.json();
    const bookMap = {};
    sessions.forEach(s => {
      if (s.book_id && s.book_title && !bookMap[s.book_id])
        bookMap[s.book_id] = { id: s.book_id, title: s.book_title, author: s.book_author || '', folder: s.folder, file: s.file };
    });
    const books = Object.values(bookMap);
    select.innerHTML = '<option value="">Интихоб кунед</option>';
    books.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.title + (b.author ? ' — ' + b.author : '');
      opt.dataset.author = b.author;
      opt.dataset.folder = b.folder || '';
      opt.dataset.file = b.file || b.id;
      select.appendChild(opt);
    });
    select.onchange = function() {
      const o = this.options[this.selectedIndex];
      if (o?.value) {
        $('postBookAuthor').value = o.dataset.author || '';
        previewCoverUrl = getCoverForBook({ folder: o.dataset.folder, file: o.dataset.file || o.value });
      } else {
        previewCoverUrl = '';
      }
    };
    select.onchange();
  } catch(e) { console.warn('Failed to load books for modal', e); }
}

function closePostModal() {
  $('postModal').classList.remove('open');
}

$('postModalClose').addEventListener('click', closePostModal);
$('postModalCancel').addEventListener('click', closePostModal);
$('postModal').addEventListener('click', e => { if (e.target === $('postModal')) closePostModal(); });

$('submitPostBtn').addEventListener('click', async function() {
  const text = ($('postContent').value || '').trim();
  const book_id = $('postBookSelect').value;
  const book_author = ($('postBookAuthor').value || '').trim();
  const sel = $('postBookSelect');
  const selOpt = sel.options[sel.selectedIndex];
  const book_title = selOpt?.value ? selOpt.text.split(' — ')[0].trim() : '';

  if (!book_id || !book_author) {
    showToast('Лутфан аввал китоб ва муаллифро пур кунед');
    goStep(1);
    return;
  }
  if (!text && !book_id) {
    showToast('Лутфан матн ё китоб интихоб кунед');
    return;
  }
  const token = getToken();
  if (!token) { showToast('Лутфан ворид шавед'); return; }

  const content = buildPostContent(text, postStyle);
  const payload = { content, book_id, book_title, book_author, visibility: 'public' };

  this.disabled = true; this.textContent = '...';
  try {
    const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/posts', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(result.error || ('HTTP ' + resp.status));
    showToast('✅ Пост нашр шуд!');
    closePostModal();
    if (CacheManager) CacheManager.invalidateKey(CacheManager.KEYS.POSTS);
    loadPosts();
  } catch (e) {
    showToast('Хатогӣ: ' + e.message);
  } finally {
    this.disabled = false; this.textContent = '📤 Интишор';
  }
});

document.querySelectorAll('.step-tab').forEach(tab => {
  tab.addEventListener('click', () => goStep(parseInt(tab.dataset.step)));
});

document.addEventListener('DOMContentLoaded', () => {
  if (typeof CacheManager !== 'undefined') CacheManager.init?.();

  const params = new URLSearchParams(window.location.search);
  if (params.get('action') === 'post') {
    const bid = localStorage.getItem('kk_publish_book');
    if (bid) { localStorage.removeItem('kk_publish_book'); setTimeout(() => openPostModal(bid), 400); }
    else setTimeout(openPostModal, 400);
  }

  loadPosts();
});

window.addEventListener('pageshow', e => { if (e.persisted) loadPosts(); });
</script>
