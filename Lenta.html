<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold: #C9A84C;
  --gold2: #E8C96D;
  --bg: #0D1B2A;
  --card: #1A2D44;
  --border: rgba(201,168,76,0.18);
  --text: #F0EAD6;
  --muted: #A8B8CC;
  --dim: #6B7F96;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Roboto', sans-serif;
  display: flex; justify-content: center; align-items: center;
}

.app {
  width: 430px; height: 100vh;
  position: relative;
  overflow: hidden;
  background: #000;
}

.toast {
  position: absolute; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30,50,80,0.95);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 99px;
  border: 1px solid var(--border);
  font-size: 13px; font-weight: 600;
  z-index: 999; opacity: 0;
  transition: 0.25s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }


#shortsView {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
}
#shortsView.hidden { display: none; }

.shorts-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
  background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%);
}
.shorts-logo {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
}
.shorts-logo svg { width: 26px; height: 26px; }
.shorts-logo span {
  font-family: 'Noto Serif', serif;
  font-size: 19px; font-weight: 700;
  color: var(--gold);
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.shorts-logo:hover span { text-decoration: underline; }

.top-right-btns {
  display: flex;
  gap: 8px;
  align-items: center;
}

.top-icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.13);
  border: 1px solid rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: 0.15s;
  color: #fff;
}
.top-icon-btn:hover { background: rgba(255,255,255,0.22); }

.shorts-container {
  width: 100%; height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.shorts-container::-webkit-scrollbar { display: none; }

.short-slide {
  width: 100%; height: 100vh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

.slide-bg {
  position: absolute; inset: 0;
  background: #0d1b2a;
}
.slide-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: blur(8px) brightness(0.35);
  transform: scale(1.08);
}
/* ===== OPEN BOOK SPREAD (ТАРҲИ КИТОБИ КУШОДА) ===== */
.open-book-spread {
  position: absolute;
  top: 70px;
  bottom: 120px;
  left: 12px;
  right: 68px; /* озод мондани тугмаҳои лайк, шарҳ ва рейтинг дар тарафи рост */
  display: flex;
  flex-direction: row;
  border-radius: 14px;
  overflow: hidden;
  background: #0B1624;
  /* Hardcover & stacked pages 3D shadow */
  box-shadow: 
    0 20px 50px rgba(0, 0, 0, 0.85),
    0 2px 0 1px #1a283c,
    0 4px 0 2px #101c2b,
    0 6px 0 3px #080f18,
    inset 0 0 0 1.5px rgba(220, 181, 94, 0.4);
  z-index: 10;
}

/* Саҳифаи чапи китоб: матни корбар */
.book-page-left {
  flex: 1.15;
  min-width: 0;
  height: 100%;
  background: linear-gradient(90deg, #16263b 0%, #192c45 78%, #0f1c2d 96%, #0b1522 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  padding: 16px 14px;
  overflow: hidden;
  border-right: 1px solid rgba(0,0,0,0.6);
}
.page-corner-ornament {
  position: absolute;
  top: 8px;
  left: 10px;
  font-size: 15px;
  color: rgba(220, 181, 94, 0.45);
  pointer-events: none;
  user-select: none;
}
.book-page-left .slide-text-overlay {
  max-height: 100%;
  overflow-y: auto;
  scrollbar-width: none;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  padding: 0 !important;
  line-height: 1.6;
  word-break: break-word;
  text-shadow: 0 1px 4px rgba(0,0,0,0.85);
}
.book-page-left .slide-text-overlay::-webkit-scrollbar { display: none; }

/* Кӯзаки китоб ва лентаи закладка */
.book-spine-divider {
  width: 12px;
  flex: 0 0 12px;
  background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(15,25,38,0.9) 30%, rgba(220,181,94,0.4) 50%, rgba(15,25,38,0.9) 70%, rgba(0,0,0,0.75) 100%);
  box-shadow: inset 0 0 6px rgba(0,0,0,0.95);
  position: relative;
  z-index: 2;
}
.book-spine-ribbon {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 7px;
  height: 38px;
  background: linear-gradient(180deg, #E5C368, #AA771C);
  border-radius: 0 0 2px 2px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.6);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
  pointer-events: none;
}

/* Саҳифаи рости китоб: муқоваи китоб */
.book-page-right {
  flex: 0.95;
  min-width: 0;
  height: 100%;
  background: linear-gradient(90deg, #0b1522 0%, #0f1c2d 4%, #192c45 22%, #16263b 100%);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  transition: transform 0.2s ease;
  border-left: 1px solid rgba(0,0,0,0.6);
}
.book-page-right:active {
  transform: scale(0.98);
}
.book-page-right img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.55), 0 0 0 1px rgba(220, 181, 94, 0.25);
}
.no-cover-book-page {
  text-align: center;
  font-size: 32px;
  padding: 16px 10px;
  color: var(--text);
}
.page-read-badge {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: linear-gradient(135deg, rgba(201, 168, 76, 0.95), rgba(160, 120, 30, 0.95));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #0A111A;
  font-size: 10.5px;
  font-weight: 850;
  padding: 4px 10px;
  border-radius: 99px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  pointer-events: none;
}
