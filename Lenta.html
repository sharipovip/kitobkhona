<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Китобхона — Шортс</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">

<script src="config.js?v=35"></script>
<script src="cache.js?v=35"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Exo+2:wght@400;700&family=Montserrat:wght@400;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Raleway:wght@400;700&family=Roboto:wght@400;700&family=Russo+One&family=Ubuntu:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold: #C9A84C;
  --gold2: #E8C96D;
  --bg: #0D1B2A;
  --card: #1A2D44;
  --border: rgba(201,168,76,0.18);
  --text: #F0EAD6;
  --muted: #A8B8CC;
  --dim: #6B7F96;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Roboto', sans-serif;
  display: flex; justify-content: center; align-items: center;
}

.app {
  width: 430px; height: 100vh;
  position: relative;
  overflow: hidden;
  background: #000;
}

.toast {
  position: absolute; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30,50,80,0.95);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 99px;
  border: 1px solid var(--border);
  font-size: 13px; font-weight: 600;
  z-index: 999; opacity: 0;
  transition: 0.25s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }


#shortsView {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
}
#shortsView.hidden { display: none; }

.shorts-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
  background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%);
}
.shorts-logo {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
}
.shorts-logo svg { width: 26px; height: 26px; }
.shorts-logo span {
  font-family: 'Noto Serif', serif;
  font-size: 19px; font-weight: 700;
  color: var(--gold);
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.shorts-logo:hover span { text-decoration: underline; }

.top-right-btns {
  display: flex;
  gap: 8px;
  align-items: center;
}

.top-icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.13);
  border: 1px solid rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: 0.15s;
  color: #fff;
}
.top-icon-btn:hover { background: rgba(255,255,255,0.22); }

.shorts-container {
  width: 100%; height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.shorts-container::-webkit-scrollbar { display: none; }

.short-slide {
  width: 100%; height: 100vh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

.slide-bg {
  position: absolute; inset: 0;
  background: #0d1b2a;
}
.slide-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: blur(8px) brightness(0.35);
  transform: scale(1.08);
}
.slide-cover-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 65%;
  max-width: 260px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  border-radius: 8px;
  overflow: hidden;
  z-index: 2;
}
.slide-cover-center img {
  width: 100%; display: block;
}


.slide-text-layer {
  position: absolute;
  top: 10%;
  bottom: 130px;
  left: 24px;
  right: 80px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-y: auto;
  scrollbar-width: none;
}
.slide-text-layer::-webkit-scrollbar { display: none; }
.slide-text-overlay {
  line-height: 1.55;
  word-break: break-word;
  text-shadow: 0 3px 16px rgba(0,0,0,0.98), 0 1px 4px rgba(0,0,0,1);
  max-height: 100%;
  overflow-y: auto;
}
.slide-text-overlay::-webkit-scrollbar { display: none; }


.slide-bottom-row {
  position: absolute;
  bottom: 80px;
  left: 24px;
  right: 24px;
  z-index: 12;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.slide-bottom-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  max-width: 70%;
}
.slide-bottom-info .info-line {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.slide-bottom-info .info-line .gold { color: var(--gold); }
.slide-bottom-info .info-line:hover .gold { text-decoration: underline; }
.slide-bottom-info .info-line .book-title { font-size: 18px; }
.slide-bottom-info .info-line .book-title:hover { text-decoration: underline; }


.post-owner-actions {
  display: flex;
  gap: 6px;
  align-self: flex-end;
  padding-bottom: 2px;
}
.post-owner-actions .act-btn {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  cursor: pointer;
  color: #fff;
  transition: 0.15s;
}
.post-owner-actions .act-btn:hover {
  background: rgba(255,255,255,0.15);
}
.post-owner-actions .act-btn.danger:hover {
  background: rgba(200,50,50,0.4);
}


.slide-hashtags {
  position: absolute;
  bottom: 52px;
  left: 24px;
  z-index: 12;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  max-width: 70%;
}
.slide-hashtag {
  font-size: 12px;
  color: #7EC8E3;
  font-weight: 600;
  cursor: pointer;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}
.slide-hashtag:hover { text-decoration: underline; }

.slide-bottom-grad {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 200px;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.86) 100%);
  z-index: 5; pointer-events: none;
}

.slide-sidebar {
  position: absolute; right: 12px; bottom: 120px;
  z-index: 20;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.sidebar-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer;
}
.sidebar-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  transition: 0.15s;
}
.sidebar-icon:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
.sidebar-icon.liked { background: rgba(189,86,80,0.35); border-color: rgba(189,86,80,0.5); }
.sidebar-count {
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.shorts-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 40px;
  color: var(--text);
}
.shorts-empty svg { width: 64px; height: 64px; opacity: 0.4; }
.shorts-empty h3 { font-size: 18px; }
.shorts-empty p { font-size: 13px; color: var(--muted); line-height: 1.55; }


.shorts-loader {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }


#gridView {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: #0d1b2a;
}
#gridView.hidden { display: none; }

.grid-topbar {
  flex: 0 0 auto;
  background: #0d1b2a;
  border-bottom: 1px solid var(--border);
  padding: 12px 14px 8px;
}
.grid-header-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.grid-back-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; color: var(--gold);
  flex: 0 0 auto;
}
.grid-header-row h2 {
  flex: 1;
  font-family: 'Noto Serif', serif;
  font-size: 18px; font-weight: 700;
  color: var(--gold);
}
.grid-add-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 13px;
  margin-bottom: 8px;
}
.search-bar svg { width: 15px; height: 15px; color: var(--dim); flex: 0 0 auto; }
.search-input {
  flex: 1; background: none; border: none; outline: none;
  font-size: 13px; color: var(--text);
  font-family: inherit;
}
.search-input::placeholder { color: var(--dim); }

.search-filters {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
}
.search-filters::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: 0 0 auto;
  padding: 4px 12px; border-radius: 99px;
  font-size: 11.5px; font-weight: 600;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--muted); cursor: pointer;
  transition: 0.15s;
}
.filter-chip.active {
  background: var(--gold); color: #1A1206; border-color: var(--gold);
}

.grid-scroll {
  flex: 1; overflow-y: auto; scrollbar-width: thin;
  scrollbar-color: rgba(201,168,76,0.2) transparent;
}
.grid-cells {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 2px; padding: 2px;
}
.grid-cell {
  aspect-ratio: 2/3;
  position: relative; overflow: hidden;
  background: var(--card);
  cursor: pointer;
}
.grid-cell img {
  width: 100%; height: 100%; object-fit: cover;
  transition: 0.2s;
}
.grid-cell:hover img { transform: scale(1.04); }
.grid-cell-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  padding: 20px 6px 5px;
  display: flex; align-items: center; gap: 4px;
}
.grid-cell-likes {
  font-size: 10px; color: rgba(255,255,255,0.85);
  font-weight: 600;
}
.grid-cell-no-cover {
  width: 100%; height: 100%;
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; opacity: 0.5;
}


.comments-sheet-overlay {
  position: absolute; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.comments-sheet-overlay.open {
  opacity: 1; pointer-events: auto;
}
.comments-sheet {
  width: 100%; max-height: 70%;
  background: #142236;
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(.32,.72,0,1);
}
.comments-sheet-overlay.open .comments-sheet {
  transform: translateY(0);
}
.sheet-handle {
  width: 38px; height: 4px; border-radius: 3px;
  background: var(--border); margin: 10px auto 6px;
}
.sheet-title {
  font-size: 15px; font-weight: 700;
  color: var(--text); padding: 0 18px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sheet-close {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer;
}
.comments-list-inner {
  flex: 1; overflow-y: auto;
  padding: 10px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.comment-item {
  display: flex; align-items: flex-start; gap: 8px;
}
.comment-av {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--card); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex: 0 0 auto; color: var(--gold);
  font-weight: 700;
}
.comment-body { flex: 1; }
.comment-author {
  font-size: 12px; font-weight: 700;
  color: var(--text); margin-bottom: 2px;
}
.comment-text { font-size: 13px; color: var(--muted); line-height: 1.4; }
.comment-del {
  background: none; border: none;
  color: #BD5650; font-size: 14px; cursor: pointer;
  padding: 2px 4px; flex: 0 0 auto;
}
.comment-empty {
  text-align: center; color: var(--dim);
  font-size: 13px; padding: 20px 0;
}
.comment-input-wrap {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px 16px;
  border-top: 1px solid var(--border);
}
.comment-inp {
  flex: 1;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 9px 14px; font-size: 13px;
  color: var(--text); outline: none;
  font-family: inherit;
}
.comment-inp:focus { border-color: var(--gold); }
.comment-send {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--gold); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
}


.rating-sheet-overlay {
  position: absolute; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.rating-sheet-overlay.open { opacity: 1; pointer-events: auto; }
.rating-sheet {
  width: 100%;
  background: #142236;
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  padding: 0 0 24px;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(.32,.72,0,1);
}
.rating-sheet-overlay.open .rating-sheet { transform: translateY(0); }
.rating-stars-row {
  display: flex; justify-content: center; gap: 6px;
  padding: 24px 20px 10px;
}
.r-star {
  font-size: 32px; cursor: pointer;
  transition: transform 0.15s;
  color: var(--dim);
}
.r-star:hover { transform: scale(1.25); }
.r-star.on { color: var(--gold); }
.rating-label-big {
  text-align: center; font-size: 13px; color: var(--muted);
  padding: 4px 20px 16px;
}
.rating-submit {
  display: block; margin: 0 auto;
  padding: 11px 32px; border-radius: 13px;
  background: linear-gradient(180deg, var(--gold2), var(--gold));
  border: none; font-size: 14px; font-weight: 700;
  color: #1A1206; cursor: pointer;
}


.modal-overlay {
  position: absolute; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  width: 100%; max-height: 94%;
  background: #0d1b2a;
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(.32,.72,0,1);
  overflow: hidden;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

.modal-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.modal-topbar h3 { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-x {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,0.07); border: none;
  color: var(--muted); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.modal-steps {
  display: flex; gap: 4px; padding: 10px 18px;
  border-bottom: 1px solid var(--border); flex: 0 0 auto;
}
.step-tab {
  flex: 1; padding: 6px; border-radius: 8px;
  border: none; background: rgba(255,255,255,0.05);
  color: var(--dim); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: 0.15s;
}
.step-tab.active {
  background: var(--gold); color: #1A1206;
}

.modal-body {
  flex: 1; overflow-y: auto; padding: 14px 18px;
  scrollbar-width: thin; scrollbar-color: rgba(201,168,76,0.2) transparent;
}

.step-panel { display: none; }
.step-panel.active { display: block; }

.form-label {
  font-size: 11.5px; font-weight: 700; color: var(--muted);
  margin-bottom: 5px; display: block;
}
.form-textarea {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 12px;
  font-size: 14px; color: var(--text);
  font-family: inherit; resize: none;
  min-height: 90px; outline: none;
  line-height: 1.5;
}
.form-textarea:focus { border-color: var(--gold); }

.form-select, .form-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 11px; padding: 10px 12px;
  font-size: 13px; color: var(--text);
  font-family: inherit; outline: none;
  margin-bottom: 10px;
}
.form-select:focus, .form-input:focus { border-color: var(--gold); }
.form-select option { background: #1A2D44; }

.style-section { margin-bottom: 18px; }
.style-section-title {
  font-size: 12px; font-weight: 700;
  color: var(--muted); margin-bottom: 8px;
}

.font-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
}
.font-card {
  padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.04);
  cursor: pointer; transition: 0.15s;
  text-align: left;
}
.font-card:hover { border-color: var(--gold); background: rgba(201,168,76,0.08); }
.font-card.selected { border-color: var(--gold); background: rgba(201,168,76,0.14); }
.font-card-preview {
  font-size: 16px; color: var(--text); line-height: 1.2; margin-bottom: 2px;
}
.font-card-name { font-size: 10px; color: var(--dim); }

.size-row { display: flex; gap: 6px; }
.size-chip {
  flex: 1; padding: 8px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--muted); text-align: center;
  cursor: pointer; transition: 0.15s;
}
.size-chip.selected { border-color: var(--gold); background: rgba(201,168,76,0.14); color: var(--text); }
.size-chip span { display: block; font-weight: 700; color: var(--text); }
.size-chip small { font-size: 9px; color: var(--dim); }

.color-row { display: flex; flex-wrap: wrap; gap: 8px; }
.color-dot {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: 0.15s; flex: 0 0 auto;
}
.color-dot.selected { border-color: var(--gold); transform: scale(1.15); }
.color-custom-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.color-custom-label { font-size: 11px; color: var(--dim); }
input[type="color"] {
  width: 36px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  cursor: pointer; padding: 2px;
}

.anim-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
}
.anim-card {
  padding: 9px 12px; border-radius: 10px;
  border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.04);

.preview-book-img {

}

.preview-text-wrap {

@keyframes textFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes letterPop {
  from { opacity: 0; transform: translateY(8px) scale(0.8); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes wordSlide {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes lineSlide {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes waveLetter {
  0%   { transform: translateY(0); }
  30%  { transform: translateY(-10px); }
  60%  { transform: translateY(4px); }
  100% { transform: translateY(0); }
}
@keyframes typeChar {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes wordBounce {
  0%   { opacity: 0; transform: scale(0.3) translateY(20px); }
  70%  { transform: scale(1.1) translateY(-4px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes wordGlow {
  from { opacity: 0; text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
  to   { opacity: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
}
@keyframes cinematic {
  0%   { opacity: 0; letter-spacing: 0.4em; }
  100% { opacity: 1; letter-spacing: normal; }
}
@keyframes slideFromBottom {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes slideEnter {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}

function escHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function timeSince(d) {
  const diff = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (diff < 60) return 'ҳозир';
  if (diff < 3600) return Math.floor(diff/60) + ' дақ. пеш';
  if (diff < 86400) return Math.floor(diff/3600) + ' соат пеш';
  if (diff < 604800) return Math.floor(diff/86400) + ' рӯз пеш';
  return new Date(d).toLocaleDateString('tg-TJ');
}

function getToken() { return localStorage.getItem('kk_token'); }

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

function showConfirmDialog(msg, title, okLabel) {

    $('confirmTitle').textContent = title || 'Тасдиқ';

    $('confirmOk').textContent = okLabel || 'Тасдиқ';
    $('confirmOverlay').classList.add('open');
    const ok = () => { $('confirmOverlay').classList.remove('open'); resolve(true); cleanup(); };
    const cancel = () => { $('confirmOverlay').classList.remove('open'); resolve(false); cleanup(); };
    function cleanup() {
      $('confirmOk').removeEventListener('click', ok);
      $('confirmCancel').removeEventListener('click', cancel);
    }
    $('confirmOk').addEventListener('click', ok);
    $('confirmCancel').addEventListener('click', cancel);
  });
}

function enc(p) {
  if (!p) return '';
  return String(p).split('/').map(encodeURIComponent).join('/');
}
function rawUrl(folder, file) {
  const repo = 'sharipovip/books', branch = 'main';
  let fileName = file;
  if (!fileName.includes('.')) fileName += '.pdf';
  let cleanFolder = String(folder).replace(/^main\//,'').replace(/^books\//,'');
  if (!cleanFolder || cleanFolder === 'books') cleanFolder = '';
  const encodedParts = cleanFolder ? enc(cleanFolder) : '';
  const base = `https://raw.githubusercontent.com/${repo}/${branch}/books`;
  const decodedFile = decodeURIComponent(fileName);
  return encodedParts
    ? `${base}/${encodedParts}/${encodeURIComponent(decodedFile)}`
    : `${base}/${encodeURIComponent(decodedFile)}`;
}
function coverListFromPdfUrl(pdfUrl) {
  try {
    const x = new URL(pdfUrl);
    if (!x.hostname.includes('githubusercontent.com')) return [];
    const parts = x.pathname.split('/').filter(Boolean);
    if (parts.length < 5) return [];
    const [owner, repo, branch, ...rest] = parts;
    const path = [...rest];
    const file = decodeURIComponent(path.pop() || '').replace(/\.pdf$/i, '.jpg');
    let folder = path.join('/');
    let clean = folder.replace(/^books\//, '');
    const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}`;
    return [
      `${base}/covers/${enc(clean)}/${encodeURIComponent(file)}`,
      `${base}/covers/books/${enc(clean)}/${encodeURIComponent(file)}`,
      `${base}/covers/${enc(folder)}/${encodeURIComponent(file)}`
    ];
  } catch(e) { return []; }
}
function getCoverForBook(book) {
  const folder = book.folder || 'books';
  const file = book.file || book.book_id;
  if (!file) return '';
  const url = rawUrl(folder, file);
  const covers = coverListFromPdfUrl(url);
  return covers[0] || '';
}
function getCoverFromPost(post) {
  if (post.cover_url) return post.cover_url;
  const b = {
    folder: post.book_folder || 'books',
    file: post.book_file || post.book_id,
    book_id: post.book_id
  };
  return getCoverForBook(b) || '';
}

function openBookFromPost(bookId, bookTitle, pdfUrl, coverUrl) {
  if (!bookId) return;
  const cleanBookId = String(bookId).replace(/^books\//i, '');
  const safePdfUrl = String(pdfUrl || '').replace(/&amp;/g, '&');
  let folder = 'books', file = cleanBookId;
  if (cleanBookId.includes('/')) {
    const parts = cleanBookId.split('/');
    file = parts.pop();
    folder = parts.join('/');
    if (!folder.startsWith('books/')) folder = 'books/' + folder;
  }
  const url = safePdfUrl || rawUrl(folder, file);
  const name = bookTitle || file.replace(/\.pdf$/i, '') || 'Китоб';
  const cover = coverUrl || getCoverForBook({ folder, file, book_id: cleanBookId });
  const coverValue = String(cover || '').trim();
  const coverParam = coverValue && !/^data:/i.test(coverValue)
    ? `&cover=${encodeURIComponent(coverValue)}`
    : '';
  location.href = `reader.html?url=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}${coverParam}`;
}

function parsePostContent(raw) {
  if (!raw) return { text: '', style: {} };
  const SEP = '|||STYLE|||';
  const idx = raw.indexOf(SEP);
  if (idx === -1) return { text: raw, style: {} };
  const text = raw.slice(0, idx);
  try {
    const style = JSON.parse(raw.slice(idx + SEP.length));
    return { text, style };
  } catch {
    return { text: raw, style: {} };
  }
}
function buildPostContent(text, style) {
  const SEP = '|||STYLE|||';
  const s = {
    font: style.font || 'Roboto',
    size: style.size || 14,
    color: style.color || '#FFFFFF',
    animation: style.animation || 'word',
    hashtags: style.hashtags || [],
  };
  return text + SEP + JSON.stringify(s);
}

function animateTextOverlay(el, text, style) {
  if (!el) return;
  const font = style.font || 'Roboto';
  const size = style.size || 14;
  const color = style.color || '#FFFFFF';
  const anim = style.animation || 'fade';

  el.style.fontFamily = `'${font}', sans-serif`;
  el.style.fontSize = size + 'px';
  el.style.color = color;
  el.innerHTML = '';

  if (!text) return;

  switch (anim) {
    case 'fade': {
      el.textContent = text;
      el.style.opacity = '0';
      el.style.animation = 'textFade 0.9s 0.1s forwards';
      break;
    }
    case 'letter': {
      el.style.opacity = '1';
      [...text].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        sp.style.cssText = `display:inline-block;opacity:0;animation:letterPop 0.25s ${(i*0.045).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'word': {
      el.style.opacity = '1';
      text.split(' ').forEach((w, i) => {
        const sp = document.createElement('span');
        sp.textContent = w + ' ';
        sp.style.cssText = `display:inline-block;opacity:0;animation:wordSlide 0.4s ${(i*0.13).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'line': {
      el.style.opacity = '1';
      const lines = text.split('\n');
      lines.forEach((line, i) => {
        const div = document.createElement('div');
        div.textContent = line || '\u00A0';
        div.style.cssText = `opacity:0;animation:lineSlide 0.45s ${(i*0.22).toFixed(2)}s forwards`;
        el.appendChild(div);
      });
      break;
    }
    case 'wave': {
      el.style.opacity = '1';
      [...text].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        sp.style.cssText = `display:inline-block;animation:waveLetter 1.2s ${(i*0.06).toFixed(2)}s infinite ease-in-out`;
        el.appendChild(sp);
      });
      break;
    }
    case 'typewriter': {
      el.style.opacity = '1';
      const chars = [...text];
      chars.forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch;
        sp.style.cssText = `opacity:0;animation:typeChar 0.01s ${(i*0.065).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'bounce': {
      el.style.opacity = '1';
      text.split(' ').forEach((w, i) => {
        const sp = document.createElement('span');
        sp.textContent = w + ' ';
        sp.style.cssText = `display:inline-block;opacity:0;animation:wordBounce 0.5s ${(i*0.14).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'glow': {
      el.style.opacity = '1';
      text.split(' ').forEach((w, i) => {
        const sp = document.createElement('span');
        sp.textContent = w + ' ';
        sp.style.cssText = `display:inline-block;opacity:0;animation:wordGlow 0.6s ${(i*0.18).toFixed(2)}s forwards`;
        el.appendChild(sp);
      });
      break;
    }
    case 'cinematic': {
      el.textContent = text;
      el.style.opacity = '0';
      el.style.animation = 'cinematic 1.8s 0.3s forwards';
      break;
    }
    case 'slideup': {
      el.style.opacity = '1';
      text.split('\n').forEach((line, i) => {
        const div = document.createElement('div');
        div.textContent = line || '\u00A0';
        div.style.cssText = `opacity:0;animation:slideFromBottom 0.5s ${(i*0.2).toFixed(2)}s forwards`;
        el.appendChild(div);
      });
      break;
    }
    default:
      el.textContent = text;
  }
}

async function loadReadingSessions() {
  const token = getToken();
  if (!token) return;
  const cacheKey = 'kk_reading_progress';
  let map = CacheManager ? CacheManager.get(cacheKey) : null;
  if (map) {
    bookProgressMap = map;
    return;
  }
  try {
    const resp = await fetch(API_BASE + '/api/reading-sessions', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const sessions = await resp.json();
    map = {};
    sessions.forEach(s => {
      if (!s.book_id) return;
      const key = s.book_id;
      if (!map[key]) map[key] = { totalDuration: 0, status: s.status || 'active' };
      map[key].totalDuration += s.duration || 0;
      if (s.status === 'completed') map[key].status = 'completed';
    });
    Object.keys(map).forEach(key => {
      const item = map[key];
      if (item.status === 'completed') {
        item.progress = 100;
        item.statusText = 'finished';
      } else {
        let prog = Math.min(95, Math.round((item.totalDuration / 60) * 100));
        if (prog < 1 && item.totalDuration > 0) prog = 1;
        item.progress = prog;
        item.statusText = 'reading';
      }
    });
    bookProgressMap = map;
    if (CacheManager) CacheManager.set(cacheKey, map);
  } catch(e) { console.warn('Failed to load reading sessions', e); }
}

async function loadBookRatings(bookIds) {
  if (!bookIds || bookIds.length === 0) return;
  const token = getToken();
  const cacheKey = 'kk_book_reactions';
  let cached = CacheManager ? CacheManager.get(cacheKey) : null;
  if (cached) {
    bookReactions = cached;
    return;
  }
  try {
    const resp = await fetch(API_BASE + '/api/book-stats-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ book_ids: bookIds })
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    bookIds.forEach(id => {
      if (!bookReactions[id]) bookReactions[id] = { stats: {}, user: {} };
      bookReactions[id].stats = data[id] || { likes:0, loves:0, dislikes:0, avg_rating:null, ratings_count:0 };
      bookReactions[id].user = { reaction: null, rating: null };
    });
    if (token) {
      const userResp = await fetch(API_BASE + '/api/book-reactions/batch', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_ids: bookIds })
      });
      if (userResp.ok) {
        const userData = await userResp.json();
        bookIds.forEach(id => {
          if (userData.user_reactions[id]) {
            bookReactions[id].user = userData.user_reactions[id];
          }
        });
      }
    }
    if (CacheManager) CacheManager.set(cacheKey, bookReactions);
  } catch(e) {
    console.warn('Failed to load ratings', e);
  }
}

const FEED_SEEN_KEY = 'kk_seen_feed_posts';

function getSeenFeedPosts() {
  try { return JSON.parse(localStorage.getItem(FEED_SEEN_KEY) || '{}'); }
  catch (e) { return {}; }
}

function markFeedPostSeen(postId) {
  if (!postId) return;
  const seen = getSeenFeedPosts();
  seen[String(postId)] = Date.now();
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  Object.keys(seen).forEach(id => { if (!seen[id] || seen[id] < cutoff) delete seen[id]; });
  const ids = Object.keys(seen);
  if (ids.length > 500) {
    ids.sort((a, b) => seen[a] - seen[b]).slice(0, ids.length - 500).forEach(id => delete seen[id]);
  }
  try { localStorage.setItem(FEED_SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}

function weightedRandomPosts(posts) {
  const pool = Array.isArray(posts) ? posts.slice() : [];
  const result = [];
  while (pool.length) {
    const weights = pool.map(post => 1 + Math.pow(Math.max(0, Number(post.likes_count) || 0), 0.75));
    const total = weights.reduce((sum, weight) => sum + weight, 0);
    let point = Math.random() * total;
    let index = 0;
    for (; index < pool.length - 1; index++) {
      point -= weights[index];
      if (point <= 0) break;
    }
    result.push(pool.splice(index, 1)[0]);
  }
  return result;
}

function orderFeedPosts(posts) {
  const list = Array.isArray(posts) ? posts.filter(Boolean) : [];
  const seen = getSeenFeedPosts();
  const unseen = list.filter(post => !seen[String(post.id)]);
  const alreadySeen = list.filter(post => seen[String(post.id)]);
  unseen.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  return unseen.concat(weightedRandomPosts(alreadySeen));
}

async function loadPosts() {
  if (_loadingPosts) return;
  _loadingPosts = true;

  const container = $('shortsContainer');
  if (!container) {
    console.error('shortsContainer not found');
    _loadingPosts = false;
    return;
  }

  container.innerHTML = `
    <div class="short-slide" style="display:flex;align-items:center;justify-content:center;">
      <div class="shorts-loader"><div class="spinner"></div></div>
    </div>
  `;

  try {
    const cachedPosts = CacheManager ? CacheManager.get(CacheManager.KEYS.POSTS) : null;
    if (cachedPosts && Array.isArray(cachedPosts) && cachedPosts.length) {
      postsData = orderFeedPosts(cachedPosts);
      currentUserId = localStorage.getItem('kk_user_id') || null;
      await loadReadingSessions();
      const bookIds = [...new Set(postsData.map(p => p.book_id).filter(Boolean))];
      if (bookIds.length > 0) await loadBookRatings(bookIds);
      renderShorts();
      void loadPostsFromServer(true);
    } else {
      await loadPostsFromServer(false);
    }
  } catch (e) {
    console.error('loadPosts error:', e);
    container.innerHTML = `
      <div class="short-slide">
        <div class="shorts-empty">
          <h3>Хатогӣ</h3>
          <p>${escHtml(e.message)}</p>
        </div>
      </div>
    `;
  } finally {
    _loadingPosts = false;
  }

  if (unsubscribePosts) unsubscribePosts();
  unsubscribePosts = CacheManager.subscribe(CacheManager.KEYS.POSTS, (newPosts) => {
    if (!newPosts || !Array.isArray(newPosts)) {
      loadPostsFromServer();
      return;
    }
    const currentStr = JSON.stringify(postsData);
    const newStr = JSON.stringify(newPosts);
    if (currentStr === newStr) return;

    postsData = orderFeedPosts(newPosts);
    currentUserId = localStorage.getItem('kk_user_id') || null;
    loadReadingSessions().then(() => {
      const bookIds2 = [...new Set(postsData.map(p => p.book_id).filter(Boolean))];
      if (bookIds2.length > 0) loadBookRatings(bookIds2);
    });
    renderShorts();
    renderGrid();
  });
}

async function loadPostsFromServer(silent) {
  const container = $('shortsContainer');
  if (!container) return;

  try {
    const resp = await fetch(API_BASE + '/api/posts');
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const posts = await resp.json();
    postsData = orderFeedPosts(Array.isArray(posts) ? posts : (posts.posts || []));
    currentUserId = localStorage.getItem('kk_user_id') || null;

    const bookIds = [...new Set(postsData.map(p => p.book_id).filter(Boolean))];
    if (bookIds.length > 0) await loadBookRatings(bookIds);
    await loadReadingSessions();

    if (CacheManager) CacheManager.set(CacheManager.KEYS.POSTS, postsData);
    renderShorts();
  } catch(e) {
    console.error('loadPostsFromServer error:', e);
    if (!silent) {
      container.innerHTML = `
        <div class="short-slide">
          <div class="shorts-empty">
            <h3>Хатогӣ дар боргирӣ</h3>
            <p>${escHtml(e.message)}</p>
          </div>
        </div>
      `;
    }
  }
}

function renderShorts() {
  const container = $('shortsContainer');
  if (!container) return;
  if (!postsData.length) {
    renderShortsEmpty('Постҳо нестанд');
    return;
  }
  container.innerHTML = '';
  postsData.forEach((post, idx) => {
    const slide = buildSlide(post, idx);
    container.appendChild(slide);
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      const slide = e.target;
      const postId = slide.dataset.postId;
      const post = postsData.find(p => String(p.id) === String(postId));
      if (!post) return;
      if (e.isIntersecting && e.intersectionRatio > 0.6) {
        markFeedPostSeen(postId);
        const textEl = slide.querySelector('.slide-text-overlay');
        if (!textEl) return;
        const { text, style } = parsePostContent(post.content);
        animateTextOverlay(textEl, text, style);
      }
    });
  }, { threshold: 0.6 });

  container.querySelectorAll('.short-slide').forEach(s => io.observe(s));
}

function renderGrid(filter, query) {
  const cells = $('gridCells');
  let posts = [...postsData];
  if (query && query.trim()) {
    const q = query.trim().toLowerCase();
    posts = posts.filter(p => {
      if (filter === 'user') return (p.display_name||p.username||'').toLowerCase().includes(q);
      if (filter === 'book') return (p.book_title||'').toLowerCase().includes(q);
      if (filter === 'author') return (p.book_author||'').toLowerCase().includes(q);
      if (filter === 'hashtag') {
        const { style } = parsePostContent(p.content);
        return (style.hashtags||[]).some(h => h.toLowerCase().includes(q.replace(/^#/,'')));
      }
      return (p.display_name||p.username||'').toLowerCase().includes(q)
        || (p.book_title||'').toLowerCase().includes(q)
        || (p.book_author||'').toLowerCase().includes(q)
        || (p.content||'').toLowerCase().includes(q);
    });
  }

  cells.innerHTML = '';
  if (!posts.length) {
    cells.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--dim);font-size:14px">Натиҷае нест</div>`;
    return;
  }
  posts.forEach(post => {
    const cover = getCoverFromPost(post);
    const liked = post.likes_count || 0;
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    cell.dataset.postId = post.id;
    if (cover) {
      const cached = CacheManager?.getCachedCover(cover) || cover;
      cell.innerHTML = `
        <img src="${escHtml(cached)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=grid-cell-no-cover>📚</div>'">
        <div class="grid-cell-overlay"><span class="grid-cell-likes">❤️ ${liked}</span></div>`;
    } else {
      cell.innerHTML = `<div class="grid-cell-no-cover">📚</div>
        <div class="grid-cell-overlay"><span class="grid-cell-likes">❤️ ${liked}</span></div>`;
    }
    cell.addEventListener('click', () => {
      openShortAtPost(post.id);
    });
    cells.appendChild(cell);
  });
}

async function handleLike(postId) {
  const token = getToken();
  if (!token) { showToast('Лутфан ворид шавед'); return; }
  const post = postsData.find(p => String(p.id) === String(postId));
  if (!post) return;
  const wasLiked = post.liked;
  post.liked = !wasLiked;
  post.likes_count = (post.likes_count || 0) + (wasLiked ? -1 : 1);
  updateLikeUI(postId, post.liked, post.likes_count);
  try {
    const resp = await fetch(API_BASE + '/api/posts/' + postId + '/like', {
      method: wasLiked ? 'DELETE' : 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    showToast(wasLiked ? 'Лайк гирифта шуд' : '❤️ Лайк гузошта шуд');
  } catch (e) {
    post.liked = wasLiked;
    post.likes_count = (post.likes_count || 0) + (wasLiked ? 1 : -1);
    updateLikeUI(postId, post.liked, post.likes_count);
  }
}
function updateLikeUI(postId, liked, count) {
  const icon = $('likeIcon_' + postId);
  const cnt = $('likeCnt_' + postId);
  if (icon) { icon.textContent = liked ? '❤️' : '🤍'; icon.classList.toggle('liked', liked); }
  if (cnt) cnt.textContent = count;
}

async function loadBooksForSelect() {
  const select = $('postBookSelect');
  const token = getToken();
  if (!token) return;
  try {
    const resp = await fetch(API_BASE + '/api/reading-sessions', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const sessions = await resp.json();
    const bookMap = {};
    sessions.forEach(s => {
      if (s.book_id && s.book_title && !bookMap[s.book_id])
        bookMap[s.book_id] = { id: s.book_id, title: s.book_title, author: s.book_author || '', folder: s.folder, file: s.file };
    });
    const books = Object.values(bookMap);
    select.innerHTML = '<option value="">Интихоб кунед</option>';
    books.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.title + (b.author ? ' — ' + b.author : '');
      opt.dataset.author = b.author;
      opt.dataset.folder = b.folder || '';
      opt.dataset.file = b.file || b.id;
      select.appendChild(opt);
    });
    select.onchange = function() {
      const o = this.options[this.selectedIndex];
      if (o?.value) {
        $('postBookAuthor').value = o.dataset.author || '';
        previewCoverUrl = getCoverForBook({ folder: o.dataset.folder, file: o.dataset.file || o.value });
      } else {
        previewCoverUrl = '';
      }
    };
    select.onchange();
  } catch(e) { console.warn('Failed to load books for modal', e); }
}

  const sel = $('postBookSelect');

    return;
  }
  const token = getToken();
  if (!token) { showToast('Лутфан ворид шавед'); return; }

  const content = buildPostContent(text, postStyle);
  const payload = { content, book_id, book_title, book_author, visibility: 'public' };

  this.disabled = true; this.textContent = '...';
  try {
    const resp = await fetch(API_BASE + '/api/posts', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!resp.ok) throw new Error(result.error || ('HTTP ' + resp.status));
    showToast('✅ Пост нашр шуд!');
    closePostModal();
    if (CacheManager) CacheManager.invalidateKey(CacheManager.KEYS.POSTS);
    loadPosts();
  } catch (e) {
    showToast('Хатогӣ: ' + e.message);
  } finally {
    this.disabled = false; this.textContent = '📤 Интишор';
  }
});

  if (params.get('action') === 'post') {
    const bid = localStorage.getItem('kk_publish_book');
    if (bid) { localStorage.removeItem('kk_publish_book'); setTimeout(() => openPostModal(bid), 400); }
    else setTimeout(openPostModal, 400);
  }

  loadPosts();
});

window.addEventListener('pageshow', e => { if (e.persisted) loadPosts(); });
</script>
</body>
</html>
