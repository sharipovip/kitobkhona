<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Китобхона — Хонандагон</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0D1B2A;--bg2:#142236;--card:#1A2D44;--card2:#1E3350;--gold:#C9A84C;--gold2:#E8C96D;--text:#F0EAD6;--muted:#A8B8CC;--dim:#6B7F96;--green:#27AE60;--red:#E74C3C;--border:rgba(201,168,76,.20);--soft:rgba(201,168,76,.10);--glass:rgba(13,27,42,.92);--shadow:rgba(0,0,0,.42);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:#05070a;color:var(--text);font-family:'Segoe UI',Arial,sans-serif;overflow-x:hidden}button,input{font:inherit}.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:92px;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 55px rgba(0,0,0,.55)}.phone:before{content:"";position:fixed;inset:0;max-width:430px;margin:auto;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.06),transparent 55%);pointer-events:none}.top{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:12px 14px}.head{display:none;align-items:center;justify-content:space-between;gap:10px}.head.active{display:flex}.brand{font-family:Georgia,serif;font-size:20px;font-weight:900;color:var(--gold2);letter-spacing:1px}.head-title{font-size:18px;font-weight:950}.head-actions{display:flex;gap:8px}.iconbtn{width:38px;height:38px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);display:grid;place-items:center;cursor:pointer;position:relative}.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;font-size:10px;font-weight:900;border:2px solid var(--bg)}.tab{display:none}.tab.active{display:block}.stories{padding:14px 0 8px;border-bottom:1px solid rgba(255,255,255,.06)}.stories-row{display:flex;gap:12px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.stories-row::-webkit-scrollbar{display:none}.story{width:66px;flex:0 0 66px;text-align:center;cursor:pointer}.story-ring{width:62px;height:62px;border-radius:50%;padding:2px;background:conic-gradient(var(--gold),var(--green),var(--gold));position:relative;margin:0 auto 6px}.story.viewed .story-ring{background:var(--dim)}.story-avatar{width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--bg);display:grid;place-items:center;font-size:25px;overflow:hidden}.story-add{position:absolute;right:0;bottom:0;width:21px;height:21px;border-radius:50%;background:var(--gold);color:#1b1202;border:2px solid var(--bg);font-weight:900;display:grid;place-items:center}.story-name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{padding:14px}.empty{padding:28px 18px;text-align:center;border:1px dashed var(--border);border-radius:22px;background:rgba(255,255,255,.035);color:var(--muted);line-height:1.55}.empty-icon{font-size:36px;margin-bottom:8px}.post{background:var(--card);border:1px solid var(--border);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 12px 26px var(--shadow)}.post-head{display:flex;align-items:center;gap:10px;padding:12px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:22px;flex-shrink:0}.post-user{font-weight:900}.post-time{font-size:11px;color:var(--muted);margin-top:2px}.post-menu{margin-left:auto;color:var(--muted)}.book-tile{margin:0 12px 10px;border-radius:20px;background:linear-gradient(135deg,var(--card2),#263b5a);min-height:190px;display:grid;place-items:center;text-align:center;padding:18px;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}.book-tile:before{content:"";position:absolute;left:22px;top:20px;bottom:20px;width:8px;border-radius:8px;background:rgba(0,0,0,.28)}.book-emoji{font-size:46px}.book-name{font-size:18px;font-weight:950;margin-top:8px}.book-sub{font-size:12px;color:var(--muted);margin-top:4px}.status{display:inline-flex;margin:0 12px 12px;padding:6px 10px;border-radius:99px;background:rgba(39,174,96,.12);color:#86efac;font-size:12px;font-weight:900}.post-actions{display:flex;align-items:center;gap:16px;padding:0 12px 10px}.action{cursor:pointer;font-weight:900;color:var(--text);display:flex;align-items:center;gap:4px}.spacer{flex:1}.likes,.caption,.comments{padding:0 12px 9px;font-size:13px}.caption b{margin-right:5px}.comments{color:var(--muted)}.comment-row{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.06)}.comment-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:var(--text);border-radius:99px;padding:9px 12px;outline:none}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);border-radius:99px;padding:8px 12px;font-weight:900;font-size:12px;cursor:pointer}.filter.active{background:var(--gold);color:#1b1202}.searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px 12px;margin-bottom:12px}.searchbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text)}.user-card,.rank-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:12px;margin-bottom:10px}.user-info,.rank-info{flex:1;min-width:0}.user-name,.rank-name{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-meta,.rank-meta{font-size:11px;color:var(--muted);margin-top:3px}.mini-stats{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}.mini{font-size:11px;color:var(--muted);background:rgba(255,255,255,.05);border-radius:99px;padding:4px 7px}.user-btn{border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202;padding:9px 10px;font-weight:900;cursor:pointer}.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;margin:10px 0 16px}.pod{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:12px 8px;text-align:center;min-height:150px}.pod.one{min-height:176px;border-color:rgba(201,168,76,.55);box-shadow:0 12px 26px rgba(201,168,76,.10)}.pod-medal{font-size:24px}.pod-avatar{font-size:34px;margin:6px 0}.pod-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pod-score{font-size:18px;color:var(--gold2);font-weight:950;margin-top:6px}.rank-num{width:32px;height:32px;border-radius:50%;background:rgba(201,168,76,.13);color:var(--gold2);display:grid;place-items:center;font-weight:950}.profile-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:16px;margin-bottom:14px}.profile-top{display:flex;align-items:center;gap:14px}.profile-avatar{width:82px;height:82px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:42px;border:2px solid var(--gold)}.profile-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.pnum{font-weight:950;color:var(--gold2);font-size:17px}.plab{font-size:10px;color:var(--muted);margin-top:2px}.profile-name{font-size:18px;font-weight:950;margin:12px 0 4px}.profile-bio{color:var(--muted);line-height:1.45}.profile-actions{display:flex;gap:8px;margin-top:12px}.profile-actions button{flex:1;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.05);color:var(--text);padding:10px;font-weight:900}.profile-actions button.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202}.profile-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.profile-tab{border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.04);padding:10px;text-align:center;font-size:20px;cursor:pointer}.profile-tab.active{background:rgba(201,168,76,.13);color:var(--gold2)}.grid-books{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-book{aspect-ratio:.72;border-radius:12px;background:linear-gradient(135deg,#7c2d12,#f97316);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 18px var(--shadow)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:8px 12px calc(8px + var(--safe-bottom));background:linear-gradient(transparent,var(--bg) 22%)}.bottom-inner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:7px;backdrop-filter:blur(18px);box-shadow:0 -10px 28px var(--shadow)}.nav{border:0;background:transparent;color:var(--muted);border-radius:16px;padding:5px 2px;font-size:10px;font-weight:900;cursor:pointer}.nav span{display:block;font-size:21px}.nav.active{background:rgba(201,168,76,.12);color:var(--gold2)}.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:430px;max-height:82vh;background:var(--bg2);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:14px;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.close{width:34px;height:34px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text)}.book-choice{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}.choice-cover{width:38px;height:50px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:#1b1202}</style>
</head>
<body>
<div class="phone">
<header class="top">
  <div class="head active" data-head="feed"><div class="brand">Китобхона</div><div class="head-actions"><button class="iconbtn" id="likesBtn">❤️<span class="badge" id="likesBadge">0</span></button><button class="iconbtn" onclick="location.href='pages/chat.html'">💬</button></div></div>
  <div class="head" data-head="readers"><div class="head-title">👥 Хонандагон</div><div class="head-actions"><button class="iconbtn" onclick="focusReaderSearch()">🔍</button></div></div>
  <div class="head" data-head="winners"><div class="head-title">🏆 Ғолибон</div></div>
  <div class="head" data-head="profile"><div class="head-title" id="profileHeader">Профил</div><div class="head-actions"><button class="iconbtn" onclick="location.href='profile.html'">✏️</button><button class="iconbtn" onclick="location.href='pages/chat.html'">💬</button></div></div>
</header>
<section class="tab active" id="tab-feed"><div class="stories"><div class="stories-row" id="storiesRow"><div class="story" onclick="openStoryPicker()"><div class="story-ring"><div class="story-avatar">👤</div><div class="story-add">+</div></div><div class="story-name">Шумо</div></div></div></div><div class="content" id="feedList"><div class="empty"><div class="empty-icon">📭</div><b>Лента ҳоло холӣ аст</b><br>Вақте китоб хонда мешавад ё хонандагон фаъол мешаванд, ин ҷо нишон дода мешавад.</div></div></section>
<section class="tab" id="tab-readers"><div class="content"><div class="searchbox"><span>🔍</span><input id="readerSearch" placeholder="Ҷустуҷӯи хонанда..."></div><div class="filters"><button class="filter active" data-filter="all">Ҳама</button><button class="filter" data-filter="active">Фаъолон</button><button class="filter" data-filter="city">Шаҳри ман</button></div><div id="readersList"><div class="empty"><div class="empty-icon">👥</div>Хонандагон ҳоло нестанд</div></div></div></section>
<section class="tab" id="tab-winners"><div class="content"><div class="filters"><button class="filter active" data-wfilter="all">Ҳамаи вақт</button><button class="filter" data-wfilter="age">Синну сол</button><button class="filter" data-wfilter="region">Вилоят</button><button class="filter" data-wfilter="active">Фаъолон</button></div><div id="podium" class="podium"></div><div id="rankingList"></div></div></section>
<section class="tab" id="tab-profile"><div class="content"><div id="profileBox"></div></div></section>
<nav class="bottom"><div class="bottom-inner"><button class="nav active" data-tab="feed"><span>🏠</span>Лента</button><button class="nav" data-tab="readers"><span>👥</span>Хонандагон</button><button class="nav" data-tab="winners"><span>🏆</span>Ғолибон</button><button class="nav" data-tab="profile"><span>👤</span>Профил</button></div></nav>
</div>
<div class="modal" id="storyModal"><div class="sheet"><div class="sheet-head"><b>Китобро барои story интихоб кунед</b><button class="close" onclick="closeStoryPicker()">✕</button></div><div class="searchbox"><span>🔍</span><input id="storySearch" placeholder="Ҷустуҷӯи китоб..."></div><div id="storyBooks"></div></div></div>
<script>
const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';
const supa=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let WINNERS=[],SESSION=null,PROFILE=null,winnerFilter='all',readerFilter='all';
function getJson(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function setJson(k,v){localStorage.setItem(k,JSON.stringify(v))}
function localBooks(){const p=getJson('kk_reader_progress',{});return Object.entries(p).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).map(([url,o])=>({url,name:o.name||'Китоб',page:o.page||1,pages:o.pages||0,ts:o.ts||Date.now()}))}
function localBookmarks(){const b=getJson('kk_bookmarks',{});return Object.values(b).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function switchTab(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id==='tab-'+tab));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.head').forEach(x=>x.classList.toggle('active',x.dataset.head===tab));if(tab==='profile')renderProfile();}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function focusReaderSearch(){switchTab('readers');setTimeout(()=>$('readerSearch').focus(),100)}
function renderStories(){const row=$('storiesRow');const mine=localStorage.getItem('kk_my_story_book');const dynamic=activeWinners().slice(0,8).map(u=>`<div class="story viewed"><div class="story-ring"><div class="story-avatar">${u.avatar_emoji||'👤'}</div></div><div class="story-name">${esc((u.display_name||'').split(' ')[0]||'Хонанда')}</div></div>`).join('');row.innerHTML=`<div class="story" onclick="openStoryPicker()"><div class="story-ring"><div class="story-avatar">👤</div><div class="story-add">+</div></div><div class="story-name">${mine?'Шумо · '+esc(mine).slice(0,9):'Шумо'}</div></div>`+dynamic}
function makePost({id,user,avatar,book,status,caption,time}){const likes=getJson('kk_social_likes',{}),comments=getJson('kk_social_comments',{}),saved=getJson('kk_social_saved',{});const liked=!!likes[id],count=liked?1:0;return `<article class="post" data-id="${esc(id)}"><div class="post-head"><div class="avatar">${avatar||'👤'}</div><div><div class="post-user">${esc(user||'Китобхон')}</div><div class="post-time">${esc(time||'ҳозир')}</div></div><div class="post-menu">⋮</div></div><div class="book-tile"><div><div class="book-emoji">📚</div><div class="book-name">${esc(book||'Китоб')}</div><div class="book-sub">Китобхона</div></div></div><div class="status">${esc(status||'📖 Хонда истодааст')}</div><div class="post-actions"><div class="action like" onclick="toggleLike('${esc(id)}')">${liked?'❤️':'🤍'} <span>${count}</span></div><div class="action" onclick="focusComment('${esc(id)}')">💬 <span>${(comments[id]||[]).length}</span></div><div class="action" onclick="sharePost('${esc(book||'Китоб')}')">✉️</div><div class="spacer"></div><div class="action" onclick="toggleSave('${esc(id)}',this)">${saved[id]?'⭐':'🔖'}</div></div><div class="likes"><b>${count}</b> писанд</div><div class="caption"><b>${esc(user||'Китобхон')}</b>${esc(caption||'')}</div><div class="comments" id="comments_${esc(id)}">${(comments[id]||[]).map(c=>`<div><b>Шумо</b> ${esc(c)}</div>`).join('')}</div><div class="comment-row"><div class="avatar" style="width:32px;height:32px;font-size:16px">👤</div><input id="comment_${esc(id)}" placeholder="Шарҳ гузоред..." onkeydown="commentKey(event,'${esc(id)}')"></div></article>`}
function renderFeed(){const posts=[];localBooks().forEach((b,i)=>posts.push({id:'local_'+i,user:'Шумо',avatar:'👤',book:b.name,status:b.pages?`📖 Саҳ. ${b.page}/${b.pages}`:'📖 Хонда истодааст',caption:'Китоби хондаистодаи ман 📚',time:new Date(b.ts).toLocaleDateString()}));activeWinners().slice(0,8).forEach((u,i)=>posts.push({id:'win_'+(u.user_id||i),user:u.display_name,avatar:u.avatar_emoji,book:(u.books_read||0)+' китоб',status:'🏆 '+Number(u.valid_hours||0).toFixed(1)+' соат',caption:'дар Китобхона фаъолона мутолиа мекунад.',time:'аз омори хондан'}));$('feedList').innerHTML=posts.length?posts.map(makePost).join(''):'<div class="empty"><div class="empty-icon">📭</div><b>Лента ҳоло холӣ аст</b><br>Аввал китоб хонед ё интизор шавед, ки хонандагон фаъол шаванд.</div>';updateLikesBadge()}
window.toggleLike=function(id){const l=getJson('kk_social_likes',{});l[id]=!l[id];setJson('kk_social_likes',l);renderFeed()};window.toggleSave=function(id,el){const s=getJson('kk_social_saved',{});s[id]=!s[id];setJson('kk_social_saved',s);el.textContent=s[id]?'⭐':'🔖'};window.focusComment=id=>$('comment_'+id)?.focus();window.commentKey=function(e,id){if(e.key==='Enter'&&e.target.value.trim()){const c=getJson('kk_social_comments',{});c[id]=c[id]||[];c[id].push(e.target.value.trim());setJson('kk_social_comments',c);e.target.value='';renderFeed()}};window.sharePost=async t=>{try{if(navigator.share)await navigator.share({title:t,text:'Аз Китобхона: '+t,url:location.href});else alert('Мубодила дастрас нест')}catch(e){}};
function updateLikesBadge(){const n=Object.values(getJson('kk_social_likes',{})).filter(Boolean).length;$('likesBadge').textContent=n}$('likesBtn').onclick=()=>alert('Писандҳо: '+$('likesBadge').textContent);
function activeWinners(){return WINNERS.filter(u=>Number(u.valid_hours||0)>0 || Number(u.books_read||0)>0)}
function renderReaders(){const q=($('readerSearch').value||'').toLowerCase();let arr=activeWinners();if(readerFilter==='active')arr=arr.filter(u=>Number(u.valid_hours||0)>=1);if(readerFilter==='city'&&PROFILE?.city)arr=arr.filter(u=>String(u.city||'').toLowerCase()===String(PROFILE.city||'').toLowerCase());arr=arr.filter(u=>(u.display_name||'').toLowerCase().includes(q)||[u.city,u.region].filter(Boolean).join(' ').toLowerCase().includes(q));$('readersList').innerHTML=arr.length?arr.map(u=>`<div class="user-card"><div class="avatar">${u.avatar_emoji||'👤'}</div><div class="user-info"><div class="user-name">${esc(u.display_name||'Китобхон')}</div><div class="user-meta">📍 ${esc([u.city,u.region].filter(Boolean).join(' · ')||'Тоҷикистон')} · ${esc(u.age_group||'')}</div><div class="mini-stats"><span class="mini">⏱ ${Number(u.valid_hours||0).toFixed(1)}с</span><span class="mini">📚 ${u.books_read||0}</span></div></div><button class="user-btn" onclick="openUserProfile('${esc(u.user_id)}')">👤</button></div>`).join(''):'<div class="empty"><div class="empty-icon">👥</div>Хонандагон ҳоло нестанд</div>'}
$('readerSearch').oninput=renderReaders;function openUserProfile(id){const u=WINNERS.find(x=>String(x.user_id)===String(id));renderProfile(u);switchTab('profile')}
function filteredWinners(){let arr=activeWinners();if(winnerFilter==='active')arr=arr.filter(u=>Number(u.valid_hours||0)>=1);if(winnerFilter==='age'){const a=prompt('Гурӯҳи синну сол (масалан 19-24):','');if(a)arr=arr.filter(u=>String(u.age_group||'').includes(a));winnerFilter='all'}if(winnerFilter==='region'){const r=prompt('Вилоят ё шаҳр:','');if(r)arr=arr.filter(u=>[u.city,u.region].filter(Boolean).join(' ').toLowerCase().includes(r.toLowerCase()));winnerFilter='all'}return arr}
function renderWinners(){const listData=filteredWinners();const top=listData.slice(0,3);$('podium').innerHTML=top.length?`<div class="pod"><div class="pod-medal">🥈</div><div class="pod-avatar">${top[1]?.avatar_emoji||'👤'}</div><div class="pod-name">${esc(top[1]?.display_name||'—')}</div><div class="pod-score">${Number(top[1]?.valid_hours||0).toFixed(1)}с</div></div><div class="pod one"><div class="pod-medal">🥇</div><div class="pod-avatar">${top[0]?.avatar_emoji||'👤'}</div><div class="pod-name">${esc(top[0]?.display_name||'—')}</div><div class="pod-score">${Number(top[0]?.valid_hours||0).toFixed(1)}с</div></div><div class="pod"><div class="pod-medal">🥉</div><div class="pod-avatar">${top[2]?.avatar_emoji||'👤'}</div><div class="pod-name">${esc(top[2]?.display_name||'—')}</div><div class="pod-score">${Number(top[2]?.valid_hours||0).toFixed(1)}с</div></div>`:'';$('rankingList').innerHTML=listData.slice(3).map((u,i)=>`<div class="rank-card"><div class="rank-num">${i+4}</div><div class="avatar">${u.avatar_emoji||'👤'}</div><div class="rank-info"><div class="rank-name">${esc(u.display_name||'Китобхон')}</div><div class="rank-meta">${Number(u.valid_hours||0).toFixed(1)} соат · ${u.books_read||0} китоб</div></div></div>`).join('')||'<div class="empty">Ғолибон ҳоло нестанд</div>'}
function renderProfile(u=null){const mine=!u;const lsBooks=localBooks(),lsBms=localBookmarks();const name=u?.display_name||PROFILE?.display_name||PROFILE?.full_name||'Профили шумо';const avatar=u?.avatar_emoji||PROFILE?.avatar_emoji||'👤';const books=u?.books_read??lsBooks.length;const hours=u?.valid_hours??0;const loc=[u?.city||PROFILE?.city,u?.region||PROFILE?.region].filter(Boolean).join(', ')||'Тоҷикистон';$('profileHeader').textContent=mine?'Профил':name;$('profileBox').innerHTML=`<div class="profile-card"><div class="profile-top"><div class="profile-avatar">${avatar}</div><div class="profile-stats"><div><div class="pnum">${books}</div><div class="plab">китобҳо</div></div><div><div class="pnum">0</div><div class="plab">дӯстон</div></div><div><div class="pnum">${lsBms}</div><div class="plab">хатбарак</div></div></div></div><div class="profile-name">${esc(name)}</div><div class="profile-bio">Китобхон 📚<br>📍 ${esc(loc)}</div><div class="profile-actions"><button class="primary" onclick="location.href='pages/chat.html'">💬 Чат</button><button onclick="location.href='profile.html'">${mine?'✏️ Таҳрири профил':'👥 Дӯстӣ'}</button></div></div><div class="profile-tabs"><div class="profile-tab active" onclick="showProfileGrid('books')">📚</div><div class="profile-tab" onclick="showProfileGrid('bookmarks')">🔖</div><div class="profile-tab" onclick="showProfileGrid('ach')">🏆</div></div><div id="profileGrid"></div>`;showProfileGrid('books')}
window.showProfileGrid=function(kind){document.querySelectorAll('.profile-tab').forEach((x,i)=>x.classList.toggle('active',(kind==='books'&&i===0)||(kind==='bookmarks'&&i===1)||(kind==='ach'&&i===2)));if(kind==='books'){const b=localBooks();$('profileGrid').innerHTML=b.length?`<div class="grid-books">${b.slice(0,12).map(x=>`<div class="mini-book" title="${esc(x.name)}">📘</div>`).join('')}</div>`:'<div class="empty">Китобҳо ҳоло нестанд</div>'}else if(kind==='bookmarks')$('profileGrid').innerHTML=localBookmarks()?'<div class="empty">Хатбаракҳо дар reader нигоҳ дошта шудаанд.</div>':'<div class="empty">Хатбарак нест</div>';else $('profileGrid').innerHTML='<div class="empty">Дастовардҳо баъди хониши воқеӣ пайдо мешаванд.</div>'}
let STORY_BOOKS=[];async function loadStoryBooks(){const local=localBooks();if(local.length)return local;if(STORY_BOOKS.length)return STORY_BOOKS;try{const r=await fetch('https://raw.githubusercontent.com/sharipovip/books/main/books.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();const out=[];for(const c of (d.categories||[]).slice(0,8)){for(const sub of (c.subs||[]).slice(0,4)){try{const mf=await fetch(`https://raw.githubusercontent.com/${d.repo||'sharipovip/books'}/${d.branch||'main'}/${String(sub.folder).split('/').map(encodeURIComponent).join('/')}/manifest.json`).then(x=>x.ok?x.json():null);for(const b of (mf?.books||[]).slice(0,10)){out.push({name:b.name||String(b.file||'').replace(/\.pdf$/i,''),page:0,pages:0})}}catch(e){}}}STORY_BOOKS=out;return out}catch(e){return []}}async function openStoryPicker(){$('storyModal').classList.add('open');$('storyBooks').innerHTML='<div class="empty">Рӯйхати китобҳо бор мешавад...</div>';STORY_BOOKS=await loadStoryBooks();renderStoryBooks(STORY_BOOKS)}function closeStoryPicker(){$('storyModal').classList.remove('open')}function renderStoryBooks(list){const q=($('storySearch').value||'').toLowerCase();const arr=(list||STORY_BOOKS).filter(b=>b.name.toLowerCase().includes(q));$('storyBooks').innerHTML=arr.length?arr.map(b=>`<div class="book-choice" onclick="chooseStory('${esc(b.name).replace(/'/g,'&#39;')}')"><div class="choice-cover">📖</div><div><b>${esc(b.name)}</b><div style="font-size:11px;color:var(--muted)">${b.page?'Саҳ. '+b.page+(b.pages?' / '+b.pages:''):'Китоб аз китобхона'}</div></div></div>`).join(''):'<div class="empty">Китоб ёфт нашуд</div>'}window.chooseStory=function(n){localStorage.setItem('kk_my_story_book',n);closeStoryPicker();renderStories();renderFeed()};$('storySearch').oninput=()=>renderStoryBooks(STORY_BOOKS.length?STORY_BOOKS:localBooks());

document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');readerFilter=b.dataset.filter;renderReaders()});
document.querySelectorAll('[data-wfilter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-wfilter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');winnerFilter=b.dataset.wfilter;renderWinners()});
async function load(){if(supa){try{const {data:{session}}=await supa.auth.getSession();SESSION=session; if(session){const {data:p}=await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle();PROFILE=p||null}const {data}=await supa.from('v_winners').select('*').order('valid_seconds',{ascending:false}).limit(100);WINNERS=(data||[]).filter(u=>Number(u.valid_hours||0)>0 || Number(u.books_read||0)>0)}catch(e){WINNERS=[]}}renderStories();renderFeed();renderReaders();renderWinners();renderProfile()}load();if(location.hash.toLowerCase().includes('ghol')||location.hash.toLowerCase().includes('golib'))switchTab('winners');
</script>
