<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Китобхона — Хондан</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="cache.js"></script>
<style>
  
  :root {
    --bg: #0d1b2a;
    --panel: rgba(13, 27, 42, 0.92);
    --page-bg: #f5f0e8;
    --gold: #c9a84c;
    --gold2: #e8c96d;
    --text: #f0ead6;
    --muted: #a8b8cc;
    --border: rgba(201, 168, 76, 0.2);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  .light-reading {
    --bg: #e8e2d5;
    --panel: rgba(245, 240, 232, 0.96);
    --page-bg: #fffef7;
    --text: #1a2d44;
    --muted: #4a5d73;
    --border: rgba(201, 168, 76, 0.25);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    position: fixed;
    inset: 0;
  }

  .reader-wrapper {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 0 60px rgba(0, 0, 0, 0.55);
  }

  
  .reader-top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: calc(8px + var(--safe-top)) 12px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.3s ease;
  }
  .reader-top-bar.hidden { transform: translateY(-110%); }

  .btn-back, .top-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .btn-back:hover, .top-btn:hover { background: rgba(201, 168, 76, 0.15); }
  .btn-back:active, .top-btn:active { transform: scale(0.92); }

  .book-title-block {
    flex: 1;
    min-width: 0;
  }
  .reading-book-title {
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reading-book-author {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .top-actions { display: flex; gap: 6px; }

  
  .reader-main {
    flex: 1;
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, rgba(201, 168, 76, 0.08), transparent 40%), var(--bg);
  }

  .page-stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(58px + var(--safe-top)) 5px calc(100px + var(--safe-bottom));
    touch-action: pan-y;
    overflow: hidden;
  }

  .page-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }

  .page-slot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform, opacity;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.35s ease;
    backface-visibility: hidden;
    border-radius: 6px;
    background: var(--page-bg);
    box-shadow: var(--shadow);
  }

  .page-slot canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .page-slot.current {
    z-index: 2;
    opacity: 1;
    transform: translateX(0) scale(1);
  }

  .page-slot.prev {
    z-index: 1;
    opacity: 0.5;
    transform: translateX(-25%) scale(0.95);
  }

  .page-slot.next {
    z-index: 1;
    opacity: 0.5;
    transform: translateX(25%) scale(0.95);
  }

  .page-slot.hidden {
    opacity: 0;
    transform: translateX(0) scale(0.9);
    pointer-events: none;
  }

  
  .page-nav-area {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28%;
    z-index: 20;
    cursor: pointer;
  }
  .page-nav-left { left: 0; }
  .page-nav-right { right: 0; }

  
  .reader-bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--border);
    padding: 8px 14px calc(10px + var(--safe-bottom));
    transition: transform 0.3s ease;
  }
  .reader-bottom-bar.hidden { transform: translateY(110%); }

  .reading-progress {
    height: 3px;
    background: rgba(255, 255, 255, 0.13);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .reading-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    width: 0;
    transition: width 0.3s ease;
  }

  .reaction-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-top: 2px;
  }
  .reaction-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .reaction-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s, color 0.2s;
    color: var(--muted);
    padding: 2px 4px;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .reaction-btn:hover { transform: scale(1.15); }
  .reaction-btn.active { color: var(--gold); }
  .reaction-btn .cnt {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .reaction-btn.active .cnt { color: var(--gold); }

  .rating-stars {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .rating-stars .star {
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.15s, color 0.2s;
  }
  .rating-stars .star.on { color: var(--gold); }
  .rating-stars .star:hover { transform: scale(1.2); }
  .rating-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-right: 4px;
  }

  .page-info {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: 0.3px;
    min-width: 60px;
    margin: 0 8px;
  }

  
  .panel {
    position: absolute;
    z-index: 160;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.5);
    display: none;
    border-radius: 20px;
    padding: 14px;
    overflow: auto;
    backdrop-filter: blur(18px);
  }
  .panel.open { display: block; }

  .settings-panel {
    top: calc(60px + var(--safe-top));
    right: 10px;
    bottom: calc(80px + var(--safe-bottom));
    width: min(320px, calc(100% - 20px));
  }
  .search-panel {
    left: 10px;
    right: 10px;
    top: calc(64px + var(--safe-top));
    bottom: calc(80px + var(--safe-bottom));
  }

  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .panel-title { font-weight: 900; color: var(--gold2); }
  .close-panel {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .settings-group {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 8px 0;
  }
  .settings-group-title {
    font-size: 11px;
    color: var(--gold2);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 13px;
    padding: 8px;
    margin-bottom: 6px;
  }
  .setting-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--border);
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    padding: 6px 12px;
    font-weight: 800;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.2s, color 0.2s;
  }
  .pill.active { background: var(--gold); color: #1b1202; }
  .pill:hover { background: rgba(201, 168, 76, 0.15); }

  .range { width: 100%; margin: 3px 0; }

  .find-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .find-count {
    flex: 1;
    text-align: center;
    color: var(--gold2);
    font-weight: 900;
    font-size: 12px;
  }
  .find-results {
    margin-top: 10px;
    max-height: 48vh;
    overflow: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .find-item {
    padding: 9px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    cursor: pointer;
  }
  .find-item.on { background: rgba(201, 168, 76, 0.12); border-radius: 10px; }
  .find-page { font-weight: 900; color: var(--gold2); font-size: 12px; }
  .find-snippet { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    z-index: 300;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 10px 15px;
    color: var(--text);
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    max-width: 90%;
    text-align: center;
    backdrop-filter: blur(18px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .error {
    padding: 20px;
    text-align: center;
    color: #fca5a5;
    max-width: 320px;
  }

  .loading {
    position: absolute;
    inset: 0;
    z-index: 90;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, 0.20);
  }
  .loading.on { display: grid; }
  .progress-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(201, 168, 76, 0.16) 0);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
    position: relative;
  }
  .progress-ring::before {
    content: "";
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .progress-ring span {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-weight: 900;
    color: var(--gold2);
  }

  @media (max-width: 430px) {
    .reader-wrapper { max-width: 100%; }
  }
</style>

<style id="app-scrollbar-policy">
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>

<body>
<div class="reader-wrapper">
  
  <div class="reader-top-bar" id="topBar">
    <button class="btn-back" onclick="goBack()" aria-label="Бозгашт">←</button>
    <div class="top-rating rating-stars" id="ratingStars" aria-label="Баҳодиҳӣ"><span class="rating-label">⭐</span><span class="star" data-rating="1">☆</span><span class="star" data-rating="2">☆</span><span class="star" data-rating="3">☆</span><span class="star" data-rating="4">☆</span><span class="star" data-rating="5">☆</span><span class="star" data-rating="6">☆</span><span class="star" data-rating="7">☆</span><span class="star" data-rating="8">☆</span><span class="star" data-rating="9">☆</span><span class="star" data-rating="10">☆</span></div>
    <button class="top-btn" onclick="toggleSearch()" aria-label="Ҷустуҷӯ">⌕</button>
    <button class="top-btn reader-favorite-btn" data-reader-favorite onclick="toggleReaderFavorite()" aria-label="Дӯстдошта">♡</button>
    <div class="size-control" aria-label="Андоза"><button onclick="adjustZoom(-10)">−</button><span>А</span><button onclick="adjustZoom(10)">＋</button></div>
  </div>

  <div class="reader-progress-wrap" id="readerProgressWrap">
    <div class="reader-progress-track"><div class="reader-progress-fill-top" id="topProgressFill"></div><div class="reader-progress-knob" id="topProgressKnob"></div></div>
    <div class="reader-progress-numbers"><span id="topPageInfo">— / —</span><span id="topProgressPct">0%</span></div>
  </div>

  <main class="reader-main" id="readerMain">
    <div class="page-stage" id="stage">
      <div class="page-container" id="pageContainer">
        <div class="page-slot current" id="currentSlot"></div>
        <div class="page-slot hidden" id="nextSlot"></div>
      </div>
    </div>
    <div class="page-nav-area page-nav-left" onclick="turnPage(-1)"></div>
    <div class="page-nav-area page-nav-right" onclick="turnPage(1)"></div>
    <div class="loading on" id="loading">
      <div class="progress-ring" id="progressRing" style="--p:0">
        <span id="loadPct">0%</span>
      </div>
    </div>
  </main>

  
  <div class="reader-bottom-bar" id="bottomBar">
    <div class="reader-action-nav">
      <button class="reader-nav-item" type="button" onclick="jumpToPagePrompt()"><span class="ico">☰</span><small>Саҳифа</small></button>
      <button class="reader-nav-item" type="button" onclick="toggleReaderTheme()"><span class="ico" id="readerThemeIcon">☀</span><small>Мавзӯъ</small></button>
      <button class="reader-nav-item center brightness-dial" id="brightnessDial" type="button" aria-label="Дурахшонӣ"><span class="ico" id="brightnessDialValue">100%</span><small>Дурахшонӣ</small></button>
      <button class="reader-nav-item" type="button" onclick="shareCurrent()"><span class="ico">↗</span><small>Мубодила</small></button>
      <button class="reader-nav-item" type="button" onclick="downloadCurrent()"><span class="ico">⇩</span><small>Зеркашӣ</small></button>
    </div>
    <details class="reader-social-tray">
      <summary><span>Баҳодиҳӣ ва вокуниш</span><span id="pageInfo">— / —</span></summary>
      <div class="reaction-bar">
        <div class="reaction-group">
          <button class="reaction-btn" data-reaction="like" title="Лайк">👍<span class="cnt" id="likeCount">0</span></button>
          <button class="reaction-btn" data-reaction="love" title="Муҳаббат">❤️<span class="cnt" id="loveCount">0</span></button>
          <button class="reaction-btn" data-reaction="dislike" title="Нописанд">👎<span class="cnt" id="dislikeCount">0</span></button>
        </div>
      </div>
    </details>
  </div>

  <div class="panel settings-panel" id="settingsPanel">
    <div class="settings-header">
      <div class="panel-title">⚙️ Танзимот</div>
      <button class="close-panel" onclick="toggleSettings(false)">✕</button>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Намуди хондан</div>
      <div class="setting-item">
        <div class="setting-label">🌓 Мавзӯъ</div>
        <div class="row">
          <button class="pill" onclick="setTheme('light')">☀️ Рӯз</button>
          <button class="pill active" onclick="setTheme('dark')">🌙 Шаб</button>
        </div>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Дурахшонӣ</div>
      <div class="setting-item" style="display:block">
        <div class="setting-label">💡 Танзими дурахшонӣ</div>
        <input class="range" id="brightnessRange" type="range" min="45" max="120" value="100" oninput="setBrightness(this.value)">
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Андоза</div>
      <div class="setting-item" style="display:block">
        <div class="setting-label">🔍 Калонсозӣ</div>
        <input class="range" type="range" min="70" max="150" value="100" oninput="setZoom(this.value)">
        <div id="zoomText" style="text-align:center;color:var(--gold2);font-weight:900">100%</div>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Имконот</div>
      <div class="setting-item" onclick="downloadCurrent()">
        <div class="setting-label">⬇ Зеркашӣ кардан</div>
        <div>📥</div>
      </div>
    </div>
  </div>

  
  <div class="panel search-panel" id="searchPanel">
    <div class="settings-header">
      <div class="panel-title">🔍 Ҷустуҷӯ</div>
      <button class="close-panel" onclick="toggleSearch(false)">✕</button>
    </div>
    <form onsubmit="event.preventDefault();findText()" class="row">
      <input id="findInput" style="flex:1;min-width:170px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);border-radius:12px;padding:10px;outline:none" placeholder="Калима...">
      <button class="pill">Ёфтан</button>
    </form>
    <div class="find-nav">
      <button class="pill" onclick="prevFind()">↑ Пешина</button>
      <div class="find-count" id="findCount">0 / 0</div>
      <button class="pill" onclick="nextFind()">↓ Баъдӣ</button>
    </div>
    <div id="findResult" class="find-results"></div>
  </div>

  
  <div class="toast" id="toast"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const $ = id => document.getElementById(id);
  const qs = new URL(location.href).searchParams;
  const safeDecode = s => { try { return decodeURIComponent(s) } catch(e) { return s } };

  let url = qs.get('url') || qs.get('open') || '';
  let name = qs.get('name') || 'Китоб';
  let cover = qs.get('cover') || '';
  let pdf = null, page = 1, pages = 0, rendering = false, bars = true, zoom = 1;

  url = safeDecode(url);
  name = safeDecode(name);
  cover = safeDecode(cover);
  if (/^data:/i.test(String(cover).trim())) cover = '';
  const titleEl=$('bookTitle');if(titleEl)titleEl.textContent=name;

  function getBookId() {
    try {
      const u = new URL(url);
      const path = u.pathname.split('/').filter(Boolean);
      const contentPath = path.slice(3).join('/');
      let clean = contentPath.replace(/^books\//, '');
      if (!clean) {
        const fileName = path.slice(3).pop() || '';
        return fileName;
      }
      return clean;
    } catch(e) {
      return name;
    }
  }

  let sessionInterval = null;
  let pendingFlushTimer = null;
  let pendingFlushRunning = false;
  let totalSeconds = 0;
  const SESSION_INTERVAL = 30;
  const MIN_READ_TIME = 10 * 60;
  const PENDING_READING_KEY = 'kk_pending_reading_sessions';
  let sessionStarted = false;

  function readPendingSessions() {
    try {
      const value = JSON.parse(localStorage.getItem(PENDING_READING_KEY) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (e) {
      return [];
    }
  }

  function writePendingSessions(items) {
    try {
      localStorage.setItem(PENDING_READING_KEY, JSON.stringify(items.slice(-50)));
    } catch (e) {}
  }

  function schedulePendingFlush() {
    if (pendingFlushTimer) clearTimeout(pendingFlushTimer);
    const next = readPendingSessions().sort((a, b) => (a.readyAt || 0) - (b.readyAt || 0))[0];
    if (!next) return;
    const delay = Math.max(1000, (next.readyAt || Date.now()) - Date.now());
    pendingFlushTimer = setTimeout(flushPendingSessions, Math.min(delay, 24 * 60 * 60 * 1000));
  }

  function queuePendingSession(payload) {
    if (!payload || !payload.book_id || !payload.duration) return;
    const items = readPendingSessions();
    const existing = items.find(item => item.book_id === payload.book_id);
    if (existing) {
      existing.duration = Math.max(0, Number(existing.duration || 0)) + Math.max(0, Number(payload.duration || 0));
      existing.pages_read = Math.max(Number(existing.pages_read || 0), Number(payload.pages_read || 0));
      existing.readyAt = Math.min(Number(existing.readyAt || Date.now()), Number(payload.readyAt || Date.now()));
      existing.status = payload.status || existing.status || 'completed';
      existing.book_title = payload.book_title || existing.book_title;
    } else {
      items.push(payload);
    }
    writePendingSessions(items);
    schedulePendingFlush();
  }

  async function sendReadingSession(duration, status, pagesRead = page, meta = {}) {
    const token = localStorage.getItem('kk_token');
    if (!token) return null;
    const bookId = meta.book_id || getBookId();
    if (!bookId || bookId === 'undefined' || bookId === 'null') return null;
    const payload = {
      book_id: bookId,
      book_title: meta.book_title || name,
      duration: Math.max(0, Math.round(Number(duration) || 0)),
      status: status || 'viewed',
      pages_read: Math.max(0, Number(pagesRead) || 0)
    };
    try {
      const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/reading-sessions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      });
      if (!r.ok) console.error('[Reader] Session error:', r.status);
      return r;
    } catch(e) {
      console.error('[Reader] Session network error:', e);
      return null;
    }
  }

  async function flushPendingSessions() {
    if (pendingFlushRunning || !localStorage.getItem('kk_token')) return;
    pendingFlushRunning = true;
    try {
      const now = Date.now();
      const items = readPendingSessions();
      const waiting = [];
      for (const item of items) {
        if (Number(item.readyAt || 0) > now) {
          waiting.push(item);
          continue;
        }
        const response = await sendReadingSession(item.duration, item.status || 'completed', item.pages_read || 0, item);
        if (!response || !response.ok) {
          waiting.push({ ...item, readyAt: Date.now() + 60 * 1000 });
        }
      }
      writePendingSessions(waiting);
    } finally {
      pendingFlushRunning = false;
      schedulePendingFlush();
    }
  }

  function startReadingSession() {
    if (sessionStarted) return;
    sessionStarted = true;
    totalSeconds = 0;
    flushPendingSessions();
    sessionInterval = setInterval(() => {
      totalSeconds += SESSION_INTERVAL;
    }, SESSION_INTERVAL * 1000);
  }

  function stopReadingSession() {
    if (!sessionStarted) return;
    if (sessionInterval) clearInterval(sessionInterval);
    sessionInterval = null;
    const duration = totalSeconds;
    const pagesRead = page;
    totalSeconds = 0;
    sessionStarted = false;
    if (duration <= 0) return;

    const payload = {
      book_id: getBookId(),
      book_title: name,
      duration,
      pages_read: pagesRead,
      status: 'completed',
      readyAt: Date.now() + 10 * 60 * 1000
    };
    if (duration >= MIN_READ_TIME) {
      sendReadingSession(duration, 'completed', pagesRead).then((response) => {
        if (response?.ok) {
          const uid = (typeof AUTH !== 'undefined' && AUTH.getUser) ? AUTH.getUser()?.data?.user?.id : null;
          if (uid && typeof CacheManager !== 'undefined') CacheManager.invalidateKey('kk_cache_sessions');
        } else {
          queuePendingSession(payload);
        }
      }).catch(() => queuePendingSession(payload));
    } else {
      queuePendingSession(payload);
    }
  }

  window.addEventListener('load', function() {
    flushPendingSessions();
    setTimeout(startReadingSession, 1000);
    loadReactions();
    loadReaderFavorite();
  });
  window.addEventListener('online', flushPendingSessions);
  window.addEventListener('beforeunload', stopReadingSession);
  window.addEventListener('pagehide', stopReadingSession);
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) stopReadingSession();
    else startReadingSession();
  });

  window.goBack = function() {
    stopReadingSession();
    if (history.length > 1) history.back();
    else location.href = 'kitobho.html';
  };

  let currentReaction = null;
  let currentRating = 0;

  async function loadReactions() {
    const token = localStorage.getItem('kk_token');
    if (!token) return;
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/book-reactions/' + encodeURIComponent(bookId), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const data = await resp.json();
      if (data.reaction) {
        currentReaction = data.reaction;
        document.querySelectorAll('.reaction-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.reaction === data.reaction);
        });
      }
      if (data.rating) {
        currentRating = data.rating;
        updateStarsUI(data.rating);
      }
      const statsResp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/book-stats/' + encodeURIComponent(bookId));
      if (!statsResp.ok) throw new Error('HTTP '+statsResp.status);
      const stats = await statsResp.json();
      $('likeCount').textContent = stats.likes || 0;
      $('loveCount').textContent = stats.loves || 0;
      $('dislikeCount').textContent = stats.dislikes || 0;
    } catch(e) {
      console.warn('Failed to load reactions:', e);
    }
  }

  async function saveReaction(reaction) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('Ворид шавед'); return; }
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/book-reactions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_id: bookId, reaction })
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const stats = await resp.json();
      $('likeCount').textContent = stats.likes || 0;
      $('loveCount').textContent = stats.loves || 0;
      $('dislikeCount').textContent = stats.dislikes || 0;
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.reaction === reaction);
      });
      currentReaction = reaction;
      toast('Реакция сабт шуд');
    } catch(e) {
      console.error('Save reaction error:', e);
      toast('Хатогӣ: ' + e.message);
    }
  }

  async function saveRating(rating) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('Ворид шавед'); return; }
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/book-reactions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_id: bookId, rating })
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      currentRating = rating;
      updateStarsUI(rating);
      toast('Баҳо сабт шуд (⭐ ' + rating + '/10)');
    } catch(e) {
      console.error('Save rating error:', e);
      toast('Хатогӣ: ' + e.message);
    }
  }

  function updateStarsUI(rating) {
    document.querySelectorAll('.rating-stars .star').forEach(el => {
      const val = parseInt(el.dataset.rating);
      el.classList.toggle('on', val <= rating);
      el.textContent = val <= rating ? '★' : '☆';
    });
  }

  document.querySelectorAll('.reaction-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const reaction = this.dataset.reaction;
      if (this.classList.contains('active')) {
        saveReaction(null);
        this.classList.remove('active');
        currentReaction = null;
      } else {
        saveReaction(reaction);
      }
    });
  });

  document.querySelectorAll('.rating-stars .star').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const rating = parseInt(this.dataset.rating);
      if (currentRating === rating) {
        saveRating(0);
      } else {
        saveRating(rating);
      }
    });
  });

  function toast(msg, d = 2200) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), d);
  }

  function setLoadProgress(p) {
    p = Math.max(0, Math.min(100, Math.round(p || 0)));
    $('progressRing')?.style.setProperty('--p', p);
    if ($('loadPct')) $('loadPct').textContent = p + '%';
  }

  function cdnPdfUrl(u) {
    try {
      const x = new URL(u);
      if (x.hostname === 'raw.githubusercontent.com') {
        const parts = x.pathname.split('/').filter(Boolean);
        if (parts.length >= 4) {
          const owner = parts[0], repo = parts[1], branch = parts[2];
          const pathParts = parts.slice(3).map(p => encodeURIComponent(decodeURIComponent(p)));
          const path = pathParts.join('/');
          return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}`;
        }
      }
      return u;
    } catch(e) { return u; }
  }

  function cachedMap() {
    try { return JSON.parse(localStorage.getItem('kk_cached_books') || '{}') } catch(e) { return {} }
  }
  function saveCachedMeta(pdfUrl, bytes = 0) {
    try {
      const m = cachedMap();
      const meta = { url, name, cover, ts: Date.now(), size: bytes };
      m[url] = meta;
      m[pdfUrl] = { ...meta, url: pdfUrl };
      localStorage.setItem('kk_cached_books', JSON.stringify(m));
    } catch(e) {}
  }
  async function cachedPdfData(pdfUrl) {
    try {
      if (!('caches' in window)) return null;
      const c = await caches.open('kitobkhona-pdf-cache-v1');
      let hit = await c.match(pdfUrl) || await c.match(url) || await c.match(cdnPdfUrl(url));
      if (!hit) return null;
      setLoadProgress(100);
      const ab = await hit.arrayBuffer();
      saveCachedMeta(pdfUrl, ab.byteLength);
      return ab;
    } catch(e) { return null; }
  }
  function cachePdfBackground(pdfUrl) {
    try {
      if (!('caches' in window)) return;
      setTimeout(async () => {
        try {
          const c = await caches.open('kitobkhona-pdf-cache-v1');
          if (await c.match(pdfUrl)) return;
          const r = await fetch(pdfUrl, { cache: 'no-store' });
          if (r.ok) {
            const clone = r.clone();
            await c.put(pdfUrl, r.clone());
            if (pdfUrl !== url) await c.put(url, clone.clone());
            const b = await clone.blob();
            saveCachedMeta(pdfUrl, b.size);
          }
        } catch(e) {}
      }, 1200);
    } catch(e) {}
  }

  async function loadPdfFrom(pdfUrl) {
    setLoadProgress(0);
    const cached = await cachedPdfData(pdfUrl);
    if (cached) {
      setLoadProgress(100);
      return await pdfjsLib.getDocument({ data: cached }).promise;
    }
    const loadingTask = pdfjsLib.getDocument(pdfUrl);
    loadingTask.onProgress = (progressData) => {
      if (progressData.total) {
        setLoadProgress(progressData.loaded / progressData.total * 100);
      } else {
        setLoadProgress(30);
      }
    };
    const doc = await loadingTask.promise;
    setLoadProgress(100);
    cachePdfBackground(pdfUrl);
    return doc;
  }

  async function openPdf() {
    if (!url) {
      $('currentSlot').innerHTML = '<div class="error">URL-и китоб нест</div>';
      $('loading').classList.remove('on');
      return;
    }
    if (!url.includes('raw.githubusercontent.com') && !url.includes('cdn.jsdelivr.net')) {
      $('currentSlot').innerHTML = '<div class="error">URL-и китоб нодуруст аст</div>';
      $('loading').classList.remove('on');
      return;
    }
    const urls = [cdnPdfUrl(url), url].filter((v, i, a) => v && a.indexOf(v) === i);
    try {
      let lastErr = null;
      for (const u of urls) {
        try { pdf = await loadPdfFrom(u); break; } catch(e) { lastErr = e; }
      }
      if (!pdf) throw lastErr || new Error('PDF дастрас нест');
      pages = pdf.numPages;
      const pr = getProgress();
      page = pr ? Math.min(pr.page, pages) : 1;
      await renderPage(page);
    } catch(e) {
      console.error('[Reader] Error:', e);
      $('currentSlot').innerHTML = '<div class="error">Хатогӣ ҳангоми кушодани PDF<br>' + String(e.message || e) + '</div>';
    } finally {
      $('loading').classList.remove('on');
    }
  }

  function getProgress() {
    try { return JSON.parse(localStorage.getItem('kk_reader_progress') || '{}')[url] } catch(e) { return null }
  }
  function saveProgress() {
    try {
      const o = JSON.parse(localStorage.getItem('kk_reader_progress') || '{}');
      o[url] = { name, page, pages, cover, ts: Date.now() };
      localStorage.setItem('kk_reader_progress', JSON.stringify(o));
    } catch(e) {}
  }

  async function renderPage(n, direction) {
    if (!pdf || rendering) return;
    rendering = true;
    try {
      const p = await pdf.getPage(n);
      const st = $('stage');
      const nat = p.getViewport({ scale: 1 });
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const fit = Math.min((st.clientWidth - 10) / nat.width, (st.clientHeight - 10) / nat.height) * zoom;
      const vp = p.getViewport({ scale: fit * dpr });

      const cv = document.createElement('canvas');
      cv.width = vp.width;
      cv.height = vp.height;
      cv.style.width = (vp.width / dpr) + 'px';
      cv.style.height = (vp.height / dpr) + 'px';
      const ctx = cv.getContext('2d', { alpha: false });
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--page-bg') || '#f5f0e8';
      ctx.fillRect(0, 0, cv.width, cv.height);
      await p.render({ canvasContext: ctx, viewport: vp }).promise;

      const currentSlot = $('currentSlot');
      const nextSlot = $('nextSlot');

      const oldCanvas = currentSlot.querySelector('canvas');
      if (oldCanvas) {
        nextSlot.innerHTML = '';
        nextSlot.appendChild(oldCanvas.cloneNode(true));
        nextSlot.className = 'page-slot next';
        requestAnimationFrame(() => {
          nextSlot.style.transition = 'transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.4s ease';
          nextSlot.style.transform = direction === 1 ? 'translateX(-30%) scale(0.92)' : 'translateX(30%) scale(0.92)';
          nextSlot.style.opacity = '0.3';
        });
        setTimeout(() => {
          nextSlot.className = 'page-slot hidden';
          nextSlot.style.transform = '';
          nextSlot.style.opacity = '';
          nextSlot.style.transition = '';
        }, 500);
      }

      currentSlot.innerHTML = '';
      currentSlot.appendChild(cv);
      currentSlot.className = 'page-slot current';
      currentSlot.style.transition = 'none';
      currentSlot.style.transform = direction === 1 ? 'translateX(20%) scale(0.95)' : 'translateX(-20%) scale(0.95)';
      currentSlot.style.opacity = '0.5';
      requestAnimationFrame(() => {
        currentSlot.style.transition = 'transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.4s ease';
        currentSlot.style.transform = 'translateX(0) scale(1)';
        currentSlot.style.opacity = '1';
      });

      page = n;
      const pct=pages?Math.round(page/pages*100):0;
      $('pageInfo').textContent=page+' / '+pages;
      $('topPageInfo').textContent=page+' / '+pages;
      $('topProgressPct').textContent=pct+'%';
      $('topProgressFill').style.width=pct+'%';
      $('topProgressKnob').style.left=pct+'%';
      if($('bookSub'))$('bookSub').textContent='PDF · '+pages+' саҳифа';
      saveProgress();
    } catch(e) {
      toast('Хатогӣ: ' + (e.message || e), 3000);
    } finally {
      rendering = false;
    }
  }

  function turnPage(d) {
    if (rendering) return;
    const n = page + d;
    if (n < 1 || n > pages) return;
    renderPage(n, d);
  }

  $('readerMain').addEventListener('click', e => {
    if (e.target.closest('.page-nav-area')) return;
    bars = !bars;
    $('topBar').classList.toggle('hidden', !bars);
    $('bottomBar').classList.toggle('hidden', !bars);
  });

  let sx = 0, sy = 0, drag = false, startTime = 0;
  const stageEl = $('stage');
  stageEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    startTime = Date.now();
    drag = true;
  }, { passive: true });

  stageEl.addEventListener('touchmove', e => {
    if (!drag || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      const currentSlot = $('currentSlot');
      const pct = Math.min(1, Math.abs(dx) / 200);
      const offset = dx < 0 ? -pct * 40 : pct * 40;
      currentSlot.style.transition = 'none';
      currentSlot.style.transform = `translateX(${offset}px) scale(${1 - pct * 0.05})`;
      currentSlot.style.opacity = 1 - pct * 0.3;
    }
  }, { passive: true });

  stageEl.addEventListener('touchend', e => {
    if (!drag) return;
    drag = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dt = Date.now() - startTime;
    const currentSlot = $('currentSlot');
    currentSlot.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    currentSlot.style.transform = 'translateX(0) scale(1)';
    currentSlot.style.opacity = '1';
    setTimeout(() => {
      currentSlot.style.transition = '';
    }, 350);
    if (Math.abs(dx) > 50 || (Math.abs(dx) > 25 && dt < 250)) {
      turnPage(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  function setTheme(t) {
    document.body.classList.toggle('light-reading', t === 'light');
    localStorage.setItem('kk_reader_theme', t);
    if (pdf) renderPage(page);
  }
  const initialReaderTheme=localStorage.getItem('kk_reader_theme')||'dark';
  setTheme(initialReaderTheme);
  if($('readerThemeIcon')) $('readerThemeIcon').textContent=initialReaderTheme==='light'?'🌙':'☀';

  function setZoom(v) {
    zoom = Number(v) / 100;
    if ($('zoomText')) $('zoomText').textContent = v + '%';
    if (pdf) renderPage(page);
  }

  function setBrightness(v) {
    $('pageContainer').style.filter = 'brightness(' + (Number(v) / 100) + ')';
    localStorage.setItem('kk_reader_brightness', v);
    if ($('brightnessRange')) $('brightnessRange').value = v;
    if ($('brightnessDialValue')) $('brightnessDialValue').textContent = Math.round(Number(v)) + '%';
  }
  setBrightness(localStorage.getItem('kk_reader_brightness') || 100);

  function toggleSettings(force) {
    $('settingsPanel').classList.toggle('open', force === undefined ? !$('settingsPanel').classList.contains('open') : !!force);
    $('searchPanel').classList.remove('open');
  }

  function toggleSearch(force) {
    $('searchPanel').classList.toggle('open', force === undefined ? !$('searchPanel').classList.contains('open') : !!force);
    $('settingsPanel').classList.remove('open');
    setTimeout(() => $('findInput').focus(), 80);
  }

  function adjustZoom(delta){const next=Math.max(70,Math.min(170,Math.round(zoom*100)+delta));setZoom(next);toast('Андоза: '+next+'%')}
  let brightnessValue=Number(localStorage.getItem('kk_reader_brightness')||100),dialStartX=0,dialStartValue=100,dialDragging=false;
  function applyDialBrightness(value){brightnessValue=Math.max(45,Math.min(120,Math.round(value)));setBrightness(brightnessValue);if($('brightnessDialValue'))$('brightnessDialValue').textContent=brightnessValue+'%'}
  function initBrightnessDial(){const dial=$('brightnessDial');if(!dial)return;applyDialBrightness(brightnessValue);dial.addEventListener('pointerdown',e=>{dialDragging=true;dialStartX=e.clientX;dialStartValue=brightnessValue;dial.setPointerCapture?.(e.pointerId)});dial.addEventListener('pointermove',e=>{if(dialDragging)applyDialBrightness(dialStartValue+(e.clientX-dialStartX)/1.5)});const stop=()=>dialDragging=false;dial.addEventListener('pointerup',stop);dial.addEventListener('pointercancel',stop);dial.addEventListener('wheel',e=>{e.preventDefault();applyDialBrightness(brightnessValue+(e.deltaY<0?5:-5))},{passive:false});dial.addEventListener('dblclick',()=>applyDialBrightness(100))}
  function jumpToPagePrompt(){
    if(!pages)return;const value=prompt('Рақами саҳифа (1–'+pages+')',String(page));if(value===null)return;const n=Math.max(1,Math.min(pages,parseInt(value,10)||page));renderPage(n,n>=page?1:-1)
  }
  function toggleReaderTheme(){
    const next=document.body.classList.contains('light-reading')?'dark':'light';setTheme(next);const icon=$('readerThemeIcon');if(icon)icon.textContent=next==='light'?'🌙':'☀'
  }
  let readerFavorite=false;
  function canonicalFavoriteId(){try{return decodeURIComponent(getBookId()).replace(/^books\//i,'')}catch(e){return getBookId().replace(/^books\//i,'')}}
  function paintReaderFavorite(){document.querySelectorAll('[data-reader-favorite]').forEach(btn=>{btn.classList.toggle('active',readerFavorite);const ico=btn.querySelector('.ico');if(ico)ico.textContent=readerFavorite?'♥':'♡';else btn.textContent=readerFavorite?'♥':'♡'})}
  async function loadReaderFavorite(){const token=localStorage.getItem('kk_token');if(!token)return;try{const r=await fetch(KITOB_CONFIG.NEON_API_BASE+'/api/favorites',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)return;const id=canonicalFavoriteId();readerFavorite=(await r.json()).some(x=>String(x.book_id).replace(/^books\//i,'')===id);paintReaderFavorite()}catch(e){}}
  async function toggleReaderFavorite(){const token=localStorage.getItem('kk_token');if(!token){toast('Барои дӯстдошта ворид шавед');return}const id=canonicalFavoriteId();try{const r=await fetch(KITOB_CONFIG.NEON_API_BASE+'/api/favorites'+(readerFavorite?'/'+encodeURIComponent(id):''),{method:readerFavorite?'DELETE':'POST',headers:{Authorization:'Bearer '+token,...(!readerFavorite?{'Content-Type':'application/json'}:{})},body:readerFavorite?undefined:JSON.stringify({book_id:id,book_title:name,book_author:''})});if(!r.ok)throw Error('HTTP '+r.status);readerFavorite=!readerFavorite;paintReaderFavorite();toast(readerFavorite?'Ба дӯстдошта илова шуд':'Аз дӯстдошта хориҷ шуд')}catch(e){toast('Дӯстдошта нигоҳ дошта нашуд')}}

  async function downloadCurrent() {
    await downloadFile(url, name);
  }
  async function shareCurrent() {
    await shareFile(url, name);
  }

  let findHits = [], findIndex = -1;
  async function findText() {
    const q = $('findInput').value.trim();
    if (!q || !pdf) return;
    $('findCount').textContent = 'Ҷустуҷӯ...';
    $('findResult').innerHTML = '<div class="find-item"><div class="find-page">Ҷустуҷӯ...</div><div class="find-snippet">Лутфан интизор шавед</div></div>';
    findHits = []; findIndex = -1;
    const lo = q.toLowerCase();
    for (let i = 1; i <= pages; i++) {
      try {
        const pg = await pdf.getPage(i);
        const tc = await pg.getTextContent();
        const text = tc.items.map(x => x.str).join(' ');
        const pos = text.toLowerCase().indexOf(lo);
        if (pos >= 0) {
          const snip = (pos > 35 ? '…' : '') + text.slice(Math.max(0, pos - 35), Math.min(text.length, pos + q.length + 55)) + (pos + q.length + 55 < text.length ? '…' : '');
          findHits.push({ page: i, snippet: snip });
        }
      } catch(e) {}
      if (i % 8 === 0) await new Promise(r => setTimeout(r, 1));
    }
    renderFindResults();
    if (findHits.length) { findIndex = 0; goFind(0); }
  }
  function renderFindResults() {
    $('findCount').textContent = findHits.length ? `${Math.max(findIndex+1, 1)} / ${findHits.length}` : '0 / 0';
    $('findResult').innerHTML = findHits.length ? findHits.map((h,i) =>
      `<div class="find-item ${i===findIndex?'on':''}" onclick="goFind(${i})">
        <div class="find-page">Саҳифаи ${h.page}</div>
        <div class="find-snippet">${escapeHtml(h.snippet)}</div>
      </div>`
    ).join('') : '<div class="find-item"><div class="find-page">Ёфт нашуд</div><div class="find-snippet">Калимаи дигар нависед</div></div>';
  }
  function goFind(i) {
    if (!findHits.length) return;
    findIndex = (i + findHits.length) % findHits.length;
    const hit = findHits[findIndex];
    renderPage(hit.page);
    renderFindResults();
  }
  function nextFind() { if (findHits.length) goFind(findIndex + 1); }
  function prevFind() { if (findHits.length) goFind(findIndex - 1); }
  function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

  initBrightnessDial();
  openPdf();
</script>
</body>
</html>
