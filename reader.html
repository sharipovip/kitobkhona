<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Китобхона — Хондан</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  
  :root {
    --bg: #0d1b2a;
    --panel: rgba(13, 27, 42, 0.92);
    --page-bg: #f5f0e8;
    --gold: #c9a84c;
    --gold2: #e8c96d;
    --text: #f0ead6;
    --muted: #a8b8cc;
    --border: rgba(201, 168, 76, 0.2);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  .light-reading {
    --bg: #e8e2d5;
    --panel: rgba(245, 240, 232, 0.96);
    --page-bg: #fffef7;
    --text: #1a2d44;
    --muted: #4a5d73;
    --border: rgba(201, 168, 76, 0.25);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    position: fixed;
    inset: 0;
  }

  .reader-wrapper {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 0 60px rgba(0, 0, 0, 0.55);
  }

  
  .reader-top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: calc(8px + var(--safe-top)) 12px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.3s ease;
  }
  .reader-top-bar.hidden { transform: translateY(-110%); }

  .btn-back, .top-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .btn-back:hover, .top-btn:hover { background: rgba(201, 168, 76, 0.15); }
  .btn-back:active, .top-btn:active { transform: scale(0.92); }

  .book-title-block {
    flex: 1;
    min-width: 0;
  }
  .reading-book-title {
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reading-book-author {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .top-actions { display: flex; gap: 6px; }

  
  .reader-main {
    flex: 1;
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, rgba(201, 168, 76, 0.08), transparent 40%), var(--bg);
  }

  .page-stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(58px + var(--safe-top)) 5px calc(100px + var(--safe-bottom));
    touch-action: pan-y;
    overflow: hidden;
  }

  .page-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }

  .page-slot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform, opacity;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.35s ease;
    backface-visibility: hidden;
    border-radius: 6px;
    background: var(--page-bg);
    box-shadow: var(--shadow);
  }

  .page-slot canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .page-slot.current {
    z-index: 2;
    opacity: 1;
    transform: translateX(0) scale(1);
  }

  .page-slot.prev {
    z-index: 1;
    opacity: 0.5;
    transform: translateX(-25%) scale(0.95);
  }

  .page-slot.next {
    z-index: 1;
    opacity: 0.5;
    transform: translateX(25%) scale(0.95);
  }

  .page-slot.hidden {
    opacity: 0;
    transform: translateX(0) scale(0.9);
    pointer-events: none;
  }

  
  .page-nav-area {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28%;
    z-index: 20;
    cursor: pointer;
  }
  .page-nav-left { left: 0; }
  .page-nav-right { right: 0; }

  
  .reader-bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--border);
    padding: 8px 14px calc(10px + var(--safe-bottom));
    transition: transform 0.3s ease;
  }
  .reader-bottom-bar.hidden { transform: translateY(110%); }

  .reading-progress {
    height: 3px;
    background: rgba(255, 255, 255, 0.13);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .reading-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    width: 0;
    transition: width 0.3s ease;
  }

  .reaction-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-top: 2px;
  }
  .reaction-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .reaction-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s, color 0.2s;
    color: var(--muted);
    padding: 2px 4px;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .reaction-btn:hover { transform: scale(1.15); }
  .reaction-btn.active { color: var(--gold); }
  .reaction-btn .cnt {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .reaction-btn.active .cnt { color: var(--gold); }

  .rating-stars {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .rating-stars .star {
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.15s, color 0.2s;
  }
  .rating-stars .star.on { color: var(--gold); }
  .rating-stars .star:hover { transform: scale(1.2); }
  .rating-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-right: 4px;
  }

  .page-info {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: 0.3px;
    min-width: 60px;
    margin: 0 8px;
  }

  
  .panel {
    position: absolute;
    z-index: 160;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.5);
    display: none;
    border-radius: 20px;
    padding: 14px;
    overflow: auto;
    backdrop-filter: blur(18px);
  }
  .panel.open { display: block; }

  .settings-panel {
    top: calc(60px + var(--safe-top));
    right: 10px;
    bottom: calc(80px + var(--safe-bottom));
    width: min(320px, calc(100% - 20px));
  }
  .search-panel {
    left: 10px;
    right: 10px;
    top: calc(64px + var(--safe-top));
    bottom: calc(80px + var(--safe-bottom));
  }

  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .panel-title { font-weight: 900; color: var(--gold2); }
  .close-panel {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .settings-group {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 8px 0;
  }
  .settings-group-title {
    font-size: 11px;
    color: var(--gold2);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 13px;
    padding: 8px;
    margin-bottom: 6px;
  }
  .setting-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--border);
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    padding: 6px 12px;
    font-weight: 800;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.2s, color 0.2s;
  }
  .pill.active { background: var(--gold); color: #1b1202; }
  .pill:hover { background: rgba(201, 168, 76, 0.15); }

  .range { width: 100%; margin: 3px 0; }

  .find-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .find-count {
    flex: 1;
    text-align: center;
    color: var(--gold2);
    font-weight: 900;
    font-size: 12px;
  }
  .find-results {
    margin-top: 10px;
    max-height: 48vh;
    overflow: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .find-item {
    padding: 9px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    cursor: pointer;
  }
  .find-item.on { background: rgba(201, 168, 76, 0.12); border-radius: 10px; }
  .find-page { font-weight: 900; color: var(--gold2); font-size: 12px; }
  .find-snippet { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    z-index: 300;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 10px 15px;
    color: var(--text);
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    max-width: 90%;
    text-align: center;
    backdrop-filter: blur(18px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .error {
    padding: 20px;
    text-align: center;
    color: #fca5a5;
    max-width: 320px;
  }

  .loading {
    position: absolute;
    inset: 0;
    z-index: 90;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, 0.20);
  }
  .loading.on { display: grid; }
  .progress-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(201, 168, 76, 0.16) 0);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
    position: relative;
  }
  .progress-ring::before {
    content: "";
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .progress-ring span {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-weight: 900;
    color: var(--gold2);
  }

  @media (max-width: 430px) {
    .reader-wrapper { max-width: 100%; }
  }
</style>

<style id="app-scrollbar-policy">
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>

  const safeDecode = s => { try { return decodeURIComponent(s) } catch(e) { return s } };

  let url = qs.get('url') || qs.get('open') || '';
  let name = qs.get('name') || 'Китоб';
  let cover = qs.get('cover') || '';
  let pdf = null, page = 1, pages = 0, rendering = false, bars = true, zoom = 1;

  url = canonicalBookUrl(safeDecode(url));
  name = safeDecode(name);
  cover = safeDecode(cover);
  if (/^data:/i.test(String(cover).trim())) cover = '';
  const titleEl=$('bookTitle');if(titleEl)titleEl.textContent=name;

  function getBookId() {
    try {
      const u = new URL(url);
      const path = u.pathname.split('/').filter(Boolean);
      const contentPath = path.slice(3).join('/');
      let clean = contentPath.replace(/^books\//, '');
      if (!clean) {
        const fileName = path.slice(3).pop() || '';
        return fileName;
      }
      return clean;
    } catch(e) {
      return name;
    }
  }

  function checkpointReading(force=false){

  async function loadReactions() {
    const bookId = getBookId();
    if (!bookId) return;

    // 1. Мгновенный показ из локального кэша (0 мс, 0 запросов к серверу)
    try {
      const cached = JSON.parse(localStorage.getItem('kk_stats_' + bookId) || 'null');
      if (cached) {
        if ($('likeCount')) $('likeCount').textContent = cached.likes || 0;
        if ($('loveCount')) $('loveCount').textContent = cached.loves || 0;
        if ($('dislikeCount')) $('dislikeCount').textContent = cached.dislikes || 0;
        if (cached.myReaction) {
          currentReaction = cached.myReaction;
          document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.reaction === cached.myReaction);
          });
        }
        if (cached.myRating) {
          currentRating = cached.myRating;
          updateStarsUI(cached.myRating);
        }
      }
    } catch(e) {}

    // 2. Фоновый запрос к Edge KV (кэшируется на границе Cloudflare, не нагружает базу Neon)
    try {
      const token = localStorage.getItem('kk_token');
      const reqs = [
        fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-stats/' + encodeURIComponent(bookId))
      ];
      if (token) {
        reqs.push(
          fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions/' + encodeURIComponent(bookId), {
            headers: { 'Authorization': 'Bearer ' + token }
          })
        );
      }

      const results = await Promise.allSettled(reqs);
      const statsRes = results[0];
      const userRes = results[1];

      let likes = parseInt($('likeCount')?.textContent) || 0;
      let loves = parseInt($('loveCount')?.textContent) || 0;
      let dislikes = parseInt($('dislikeCount')?.textContent) || 0;

      if (statsRes && statsRes.status === 'fulfilled' && statsRes.value.ok) {
        const stats = await statsRes.value.json();
        likes = stats.likes || 0;
        loves = stats.loves || 0;
        dislikes = stats.dislikes || 0;
        if ($('likeCount')) $('likeCount').textContent = likes;
        if ($('loveCount')) $('loveCount').textContent = loves;
        if ($('dislikeCount')) $('dislikeCount').textContent = dislikes;
      }

      if (userRes && userRes.status === 'fulfilled' && userRes.value.ok) {
        const data = await userRes.value.json();
        if (data.reaction) {
          currentReaction = data.reaction;
          document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.reaction === data.reaction);
          });
        }
        if (data.rating) {
          currentRating = data.rating;
          updateStarsUI(data.rating);
        }
      }

      // Сохраняем актуальные данные в локальный кэш
      try {
        localStorage.setItem('kk_stats_' + bookId, JSON.stringify({
          likes, loves, dislikes,
          myReaction: currentReaction,
          myRating: currentRating,
          ts: Date.now()
        }));
      } catch(e) {}

    } catch(e) {
      console.warn('Failed to load reactions:', e);
    }
  }

  function cdnPdfUrl(u) {
    try {
      const x = new URL(u);
      if (x.hostname === 'raw.githubusercontent.com') {
        const parts = x.pathname.split('/').filter(Boolean);
        if (parts.length >= 4) {
          const owner = parts[0], repo = parts[1], branch = parts[2];
          const pathParts = parts.slice(3).map(p => encodeURIComponent(decodeURIComponent(p)));
          const path = pathParts.join('/');
          return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}`;
        }
      }
      return u;
    } catch(e) { return u; }
  }

  async function findFallbackBookUrl(bookName, origUrl) {
    try {
      const res = await fetch('search-index.json');
      if (!res.ok) return null;
      const data = await res.json();
      const items = data.items || [];
      const clean = (bookName || '').replace(/\.pdf$/i, '').toLowerCase().trim();
      const found = items.find(it => {
        const n = (it.name || '').replace(/\.pdf$/i, '').toLowerCase().trim();
        const f = (it.file || '').replace(/\.pdf$/i, '').toLowerCase().trim();
        return n === clean || f === clean || (clean && (n.includes(clean) || clean.includes(n)));
      });
      if (found) {
        const encP = p => String(p||'').split('/').map(encodeURIComponent).join('/');
        return `https://raw.githubusercontent.com/sharipovip/books/main/${encP(found.folder)}/${encodeURIComponent(found.file)}`;
      }
    } catch(e) {}
    return null;
  }

  async function renderPage(n, direction) {
    if (!pdf || rendering) return;
    rendering = true;
    try {
      const p = await pdf.getPage(n);
      const st = $('stage');
      const nat = p.getViewport({ scale: 1 });
      const dpr = Math.min(devicePixelRatio || 1, 2);
      // Responsive smartphone fit: always keep the complete PDF page visible.
      const availableWidth = Math.max(1, st.clientWidth);
      const availableHeight = Math.max(1, st.clientHeight);
      const fit = Math.min(availableWidth / nat.width, availableHeight / nat.height) * zoom;
      const vp = p.getViewport({ scale: fit * dpr });

      const cv = document.createElement('canvas');
      cv.width = vp.width;
      cv.height = vp.height;
      cv.style.width = (vp.width / dpr) + 'px';
      cv.style.height = (vp.height / dpr) + 'px';
      const ctx = cv.getContext('2d', { alpha: false });
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--page-bg') || '#f5f0e8';
      ctx.fillRect(0, 0, cv.width, cv.height);
      await p.render({ canvasContext: ctx, viewport: vp }).promise;

      const currentSlot = $('currentSlot');
      const nextSlot = $('nextSlot');

      const oldCanvas = currentSlot.querySelector('canvas');
      if (oldCanvas) {
        nextSlot.innerHTML = '';
        nextSlot.appendChild(oldCanvas.cloneNode(true));
        nextSlot.className = 'page-slot next';
        requestAnimationFrame(() => {
          nextSlot.style.transition = 'transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.4s ease';
          nextSlot.style.transformOrigin=direction===1?'left center':'right center';nextSlot.style.transform=direction===1?'translateX(-12%) rotateY(-22deg) scale(.96)':'translateX(12%) rotateY(22deg) scale(.96)';
          nextSlot.style.opacity = '0.3';
        });
        setTimeout(() => {
          nextSlot.className = 'page-slot hidden';
          nextSlot.style.transform = '';
          nextSlot.style.opacity = '';
          nextSlot.style.transition = '';
        }, 500);
      }

      currentSlot.innerHTML = '';
      currentSlot.appendChild(cv);
      currentSlot.className = 'page-slot current';
      currentSlot.style.transition = 'none';
      currentSlot.style.transformOrigin=direction===1?'right center':'left center';currentSlot.style.transform=direction===1?'translateX(8%) rotateY(13deg) scale(.97)':'translateX(-8%) rotateY(-13deg) scale(.97)';
      currentSlot.style.opacity = '0.5';
      requestAnimationFrame(() => {
        currentSlot.style.transition = 'transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.4s ease';
        currentSlot.style.transform = 'translateX(0) scale(1)';
        currentSlot.style.opacity = '1';
      });

      page = n;
      const pct=pages?Math.round(page/pages*100):0;
      if($('pageInfo'))$('pageInfo').textContent=page+' / '+pages;
      if($('quickPageInput')){$('quickPageInput').max=pages;$('quickPageInput').placeholder=page+'/'+pages}
      if($('quickPagePct'))$('quickPagePct').textContent=pct+'%';
      if($('bookSub'))$('bookSub').textContent='PDF · '+pages+' саҳифа';
      saveProgress();
    } catch(e) {
      toast('Хатогӣ: ' + (e.message || e), 3000);
    } finally {
      rendering = false;
    }
  }

  function turnPage(d) {

  // v99: ОДИН тап по книге = чистый экран (спрятать/показать панели) — как в PDF.

      let sx = 0, sy = 0, drag = false, startTime = 0;
  let isPinching = false, pinchStartDist = 0, pinchStartZoom = 1;
  const stageEl = $('stage');

  function getTouchDist(e) {
    if (!e.touches || e.touches.length < 2) return 0;
    return Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }

  stageEl.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      drag = false;
      isPinching = true;
      pinchStartDist = getTouchDist(e);
      // v99: для скролл-книг (FB2/TXT/DOCX) пинч меняет РАЗМЕР ШРИФТА, как в PDF
      pinchStartZoom = window.__kkTextMode === 'scroll' ? (window.__kkScrollZoomPct || 100) / 100 : zoom;
      return;
    }
    if (e.touches.length !== 1 || isPinching) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    startTime = Date.now();
    drag = true;
  }, { passive: true });

  stageEl.addEventListener('touchmove', e => {
    if (isPinching && e.touches.length === 2) {
      const dist = getTouchDist(e);
      if (pinchStartDist > 0 && dist > 0) {
        const factor = dist / pinchStartDist;
        const targetPct = Math.max(70, Math.min(220, Math.round(pinchStartZoom * factor * 100)));
        // v99: FB2/TXT/DOCX — зум шрифта (матн перетекает), НЕ transform-scale
        if (window.__kkTextMode === 'scroll') {
          setScrollZoom(targetPct, false);
          return;
        }
        zoom = targetPct / 100;
        const container = $('pageContainer');
        if (container) {
          container.classList.toggle('zoomed', zoom > 1.001);
          container.style.transform = 'scale(' + zoom + ')';
          container.style.transformOrigin = 'center center';
        }
        if ($('zoomText')) $('zoomText').textContent = targetPct + '%';
        const slider = document.querySelector('input[type="range"][oninput*="setZoom"]');
        if (slider) slider.value = targetPct;
      }
      return;
    }
    if (!drag || e.touches.length !== 1 || isPinching) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      const currentSlot = $('currentSlot');
      const pct = Math.min(1, Math.abs(dx) / 200);
      const offset = dx < 0 ? -pct * 40 : pct * 40;
      currentSlot.style.transition = 'none';
      currentSlot.style.transformOrigin = dx < 0 ? 'left center' : 'right center';
      currentSlot.style.transform = 'translateX(' + (offset * 0.35) + 'px) rotateY(' + (dx < 0 ? -pct * 16 : pct * 16) + 'deg) scale(' + (1 - pct * 0.025) + ')';
      currentSlot.style.opacity = 1 - pct * 0.3;
    }
  }, { passive: true });

  stageEl.addEventListener('touchend', e => {
    if (isPinching) {
      if (!e.touches || e.touches.length < 2) {
        isPinching = false;
        pinchStartDist = 0;
        const container = $('pageContainer');
        if (container) {
          container.style.transform = '';
        }
        if (pdf && !rendering) {
          renderPage(page);
        }
      }
      return;
    }
    if (!drag) return;
    drag = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dt = Date.now() - startTime;
    const currentSlot = $('currentSlot');
    currentSlot.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    currentSlot.style.transform = 'translateX(0) scale(1)';
    currentSlot.style.opacity = '1';
    setTimeout(() => {
      currentSlot.style.transition = '';
    }, 350);
    if (Math.abs(dx) > 50 || (Math.abs(dx) > 25 && dt < 250)) {
      turnPage(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  function setTheme(t) {
    document.body.classList.toggle('light-reading', t === 'light');
    localStorage.setItem('kk_reader_theme', t);
    if (pdf) renderPage(page);

  const initialReaderTheme=localStorage.getItem('kk_reader_theme')||'light';
  setTheme(initialReaderTheme);
  if($('readerThemeIcon')) $('readerThemeIcon').textContent=initialReaderTheme==='light'?'🌙':'☀';

  function setZoom(v) {
    zoom = Number(v) / 100;
    const container = $('pageContainer');
    if (container) container.classList.toggle('zoomed', zoom > 1.001);
    if ($('zoomText')) $('zoomText').textContent = v + '%';
    if (pdf) {
      if (rendering) setTimeout(() => { if (!rendering) renderPage(page); }, 180);
      else renderPage(page);

  }

  // ================== v99: АНДОЗАИ ҲАРФ барои EPUB / FB2 / TXT / DOCX ==================
  // PDF пешакӣ зум дошт (пинч + A±). Акнун ҳама форматҳо ҳамон тавр кор мекунанд:
  // EPUB → андозаи ҳарф тавассути rendition.themes.fontSize (матн аз нав ҷой мегирад),
  // FB2/TXT/DOCX (скролл-р андоза) → CSS zoom (дар Android WebView = Chromium, кор мекунад).
  function clampTxt(v) { return Math.max(70, Math.min(220, Math.round(v))); }

  window.__kkEpubFontPct = clampTxt(parseInt(localStorage.getItem('kk_epub_font_pct') || '100', 10) || 100);
  window.__kkEpubFont = function (pct, notify) {
    window.__kkEpubFontPct = clampTxt(pct);
    try { if (window.__kkEpubRendition) window.__kkEpubRendition.themes.fontSize(window.__kkEpubFontPct + '%'); } catch (e) {}
    if (notify !== false) toast('Андозаи ҳарф: ' + window.__kkEpubFontPct + '%');

  async function fetchBookAnyCandidate() {
    const cands = mirrorBookUrls(url);
    // 0) кэш — китоби аллакай боркардашуда фавран аз кэши браузер
    for (const cu of cands) {
      try {
        const hit = await getCachedBookResponse(cu);
        if (hit) { setLoadProgress(100); return await hit.clone().arrayBuffer(); }
      } catch (e) {}
    }
    if (cands.length === 1) return fetchBookArrayBuffer(cands[0]);
    // v99 ГОНКАИ НАВ: ҳамаи манбаъҳо ҲАМЗАМОНА сар мешаванд. Ғолиб он аст, ки
    // АВВАЛ якум порчаи файлро медиҳад — боқимонда фавран бекор карда мешаванд
    // (пеш: raw танҳо баъди 1.5с медаромад ва манбаъҳо баъди ҳам мегаштанд).
    return new Promise((resolve, reject) => {
      let winner = null, failed = 0, firstErr = null, done = false;
      const ctrls = cands.map(() => new AbortController());
      const settle = (fn, v) => { if (!done) { done = true; fn(v); } };
      cands.forEach((cu, i) => {
        const ctrl = ctrls[i];
        (async () => {
          const r = await fetch(cu, { cache: 'no-store', signal: ctrl.signal });
          if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + new URL(cu).hostname);
          const total = Number(r.headers.get('content-length') || 0);
          if (!r.body || !r.body.getReader) {
            const buf = await r.arrayBuffer();
            if (winner && winner !== cu) return;
            winner = cu;
            ctrls.forEach((c, j) => { if (j !== i) { try { c.abort(); } catch (e) {} } });
            try { saveCachedMeta(cu, buf.byteLength); } catch (e) {}
            storeBookCache(cu, buf);
            settle(resolve, buf);
            return;
          }
          const rd = r.body.getReader();
          const chunks = []; let loaded = 0;
          while (true) {
            const { done: streamDone, value } = await rd.read();
            if (streamDone) break;
            chunks.push(value); loaded += value.byteLength;
            if (!winner) {
              // ЯКУМ ПОРЧА — ин манбаъ ғолиб аст, дигаронро мебандем
              winner = cu;
              ctrls.forEach((c, j) => { if (j !== i) { try { c.abort(); } catch (e) {} } });
            } else if (winner !== cu) { try { rd.cancel(); } catch (e) {} return; }
            setLoadProgress(total ? loaded / total * 100 : Math.min(90, 8 + loaded / 50000));
          }
          if (winner !== cu) return;
          const buf = await new Blob(chunks).arrayBuffer();
          try { saveCachedMeta(cu, buf.byteLength); } catch (e) {}
          storeBookCache(cu, buf);
          settle(resolve, buf);
        })().catch(e => {
          if (done) return;
          if (winner === cu) {
            // ғолиб миёнароҳ канда шуд — такрор аз ҳамон манбаъ (бе гона, бо кэш)
            fetchBookArrayBuffer(cu).then(b => settle(resolve, b), e2 => settle(reject, e2));
            return;
          }
          if (winner) return; // бекоршудагон ҳисоб намешаванд
          failed++;
          if (!firstErr) firstErr = e;
          if (failed >= cands.length) settle(reject, firstErr || new Error('Файл ёфт нашуд'));
        });
      });
    });
  }

        const till = Math.min(idx + CHUNK, total);
        let html = '';

  function renderFb2Content(text) {

    const binaries = {};

      binaries['#' + (b.getAttribute('id') || '')] = 'data:' + (b.getAttribute('content-type') || 'image/jpeg') + ';base64,' + (b.textContent || '').replace(/\s+/g, '');

      node.childNodes.forEach(ch => {

          else if (t === 'strikethrough') s += '<s>' + inline(ch) + '</s>';
          else if (t === 'sub') s += '<sub>' + inline(ch) + '</sub>';
          else if (t === 'sup') s += '<sup>' + inline(ch) + '</sup>';

        if (node.nodeType !== 1) return;
        const t = node.nodeName.replace(/^.*:/, '').toLowerCase();
        if (t === 'section') { out.push('<section class="bsec">'); blocks(node, out, depth + 1); out.push('</section>'); }
        else if (t === 'title') { const lv = Math.min(4, Math.max(2, depth + 1)); out.push('<h' + lv + ' class="bhead">' + inline(node) + '</h' + lv + '>'); }

        else if (t === 'p') out.push('<p>' + inline(node) + '</p>');

          const href = node.getAttribute('l:href') || node.getAttributeNS('http://www.w3.org/1999/xlink', 'href') || '';
          const src = binaries[href];
          if (src) out.push('<img class="bimg" loading="lazy" src="' + src + '" alt="">');
        }
        else if (t === 'poem') { out.push('<div class="bpoem">'); blocks(node, out, depth); out.push('</div>'); }
        else if (t === 'stanza') { out.push('<div class="bstanza">'); blocks(node, out, depth); out.push('</div>'); }
        else if (t === 'v') out.push('<div class="bv">' + inline(node) + '</div>');
        else if (t === 'text-author') out.push('<div class="bta">— ' + inline(node) + '</div>');
        else if (t === 'cite') { out.push('<blockquote class="bcite">'); blocks(node, out, depth); out.push('</blockquote>'); }
        else if (t === 'epigraph') { out.push('<div class="bepi">'); blocks(node, out, depth); out.push('</div>'); }
        else blocks(node, out, depth);

    const out = [];
    Array.from(doc.querySelectorAll('body')).forEach((b, i) => { if (i > 0) out.push('<hr class="bhr">'); blocks(b, out, 0); });
    if (!out.length) throw new Error('FB2: матн ёфт нашуд');
    return { title: bookTitle, parts: out };
  }
  // ---------- DOCX ----------
  async function renderDocxContent(buf) {
    await loadScriptOnce('assets/libs/mammoth.browser.min.js');
    if (!window.mammoth) throw new Error('Китобхонаи DOCX бор нашуд');
    const result = await window.mammoth.convertToHtml({ arrayBuffer: buf });
    const html = (result && result.value) ? result.value : '<p>(матн нест)</p>';
    // Порционный рендер: делим по открытии блочных тегов (теги не разрезаются)
    const wrapped = '<div class="bdocx">' + html + '</div>';
    return wrapped.split(/(?=<(?:p|h\d|table|img|ul|ol|blockquote)\b)/i);
  }
  // ---------- EPUB ----------
  async function renderEpub(buf) {
    setLoadText('Омодасозии хонандаи EPUB...');
    await loadScriptOnce('assets/libs/jszip.min.js');
    await loadScriptOnce('assets/libs/epub.min.js');
    if (typeof JSZip === 'undefined') throw new Error('JSZip бор нашуд');
    if (typeof ePub !== 'function') throw new Error('Китобхонаи EPUB бор нашуд');
    $('loading').classList.remove('on');
    setLoadText('');
    // Тап-зонаҳо НЕ пинҳон: варақгардонии EPUB бо тап ва свайп (turnPage → __altPager)
    const slot = $('currentSlot');
    slot.innerHTML = '';
    slot.style.transform = 'none';
    const area = document.createElement('div');
    area.className = 'book-scroll epub-host';
    slot.appendChild(area);
    const book = ePub(buf);
    const rendition = book.renderTo(area, { width: '100%', height: '100%', spread: 'none' });
    await rendition.display();
    // v99: EPUB мисли PDF кор мекунад:
    //   ТАП      → экрани тоза (пинҳон/намоиши панелҳо) — НА варақгардонӣ

    window.__kkTextMode = 'epub';

    window.__altPager = d => { if (d > 0) rendition.next(); else rendition.prev(); };

    // зонаҳои берунӣ намерасанд. Обработчикро ДОХИЛИ ҳуҷҷати iframe мегузорем
    // баъди ҳар рендери баб (ҳар баб — ҳуҷҷати нав).

        try { doc = ifr.contentDocument; } catch (e) { return; }

        doc.addEventListener('click', ev => {
          try { window.parent.__kkToggleBars(); } catch (e) {}
        });

        doc.addEventListener('touchstart', ev => {
          if (ev.touches && ev.touches.length === 2) {

              ev.touches[0].clientX - ev.touches[1].clientX,
              ev.touches[0].clientY - ev.touches[1].clientY

            return;
          }
          ifrPinchMoved = false;
          if (ev.touches && ev.touches[0]) { ifrLastX = ev.touches[0].clientX; ifrLastY = ev.touches[0].clientY; ifrLastT = Date.now(); }

        doc.addEventListener('touchmove', ev => {
          if (ev.touches && ev.touches.length === 2 && ifrPinchD0 > 0) {

              ev.touches[0].clientX - ev.touches[1].clientX,
              ev.touches[0].clientY - ev.touches[1].clientY

  // ---------- DOC (word 97-2003): намоиши дохилӣ (docx/txt нусха) ё пурсиш ----------
  // Робот (build.py v99) дар repo барои ҳар .doc нусхаи .docx (ягон формат)
  // ё .txt (матн) мегузорад. Ридер онро меҷӯяд → китоб ДОХИЛИ барнома намоиш
  // мешавад. Агар нусха набошад — савол медиҳад пеш аз боркунӣ.
  function docAltCandidates() {
    const path = String(url).split('?')[0];
    // папку держим ПЕРЕКОДИРОВАННОЙ (ASCII): URLSearchParams даёт раскодированную
    // кириллицу, а заголовки Cache API принимают только ISO-8859-1.
    // Кодируем ТОЛЬКО сегменты пути (не трогаем scheme/host).
    let encFolder = '';
    try {
      const x = new URL(path);
      const dir = x.pathname.slice(0, x.pathname.lastIndexOf('/') + 1);
      const encDir = dir.split('/')
        .map(seg => { try { return encodeURIComponent(decodeURIComponent(seg)); } catch (e) { return seg; } })
        .join('/');
      encFolder = x.origin + encDir;
    } catch (e) {
      encFolder = path.slice(0, path.lastIndexOf('/') + 1);
    }
    const stem = decodeURIComponent(path.slice(path.lastIndexOf('/') + 1).replace(/\.doc$/i, ''));
    let pretty = stem.replace(/^\d+[_\-.\s]*/, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    const names = [stem];
    if (pretty && pretty !== stem && pretty.length >= 2) names.push(pretty);
    const alts = [];
    names.forEach(n => { alts.push({ url: encFolder + encodeURIComponent(n + '.docx'), ext: 'docx' }); alts.push({ url: encFolder + encodeURIComponent(n + '.txt'), ext: 'txt' }); });
    return alts;
  }

  function probeUrl(u, ms) {
    return new Promise(res => {
      const ctrl = new AbortController();
      const t = setTimeout(() => { try { ctrl.abort(); } catch (e) {} res(null); }, ms || 8000);
      fetch(u, { method: 'HEAD', cache: 'no-store', signal: ctrl.signal })
        .then(r => { clearTimeout(t); res(r.ok ? u : null); })
        .catch(() => { clearTimeout(t); res(null); });
    });
  }

  async function tryFetchDocAlt() {
    setLoadText('Ҷустуҷӯи намоиши дохилӣ...');
    setLoadProgress(20);
    // ҳама номҳои эҳтимолӣ ва ҳамаи зеркалҳо — параллельно (HEAD-проба)
    const probes = [];
    docAltCandidates().forEach(alt => {
      mirrorBookUrls(alt.url).forEach(cu => probes.push(probeUrl(cu, 9000).then(hit => hit ? alt : null)));
    });
    const found = await Promise.all(probes);
    const hit = found.filter(Boolean)[0];
    if (!hit) return null;
    setLoadText('Боркунии нусхаи намоишӣ...');
    setLoadProgress(40);
    try {
      const buf = await fetchBookArrayBuffer(hit.url);
      return { buf, ext: hit.ext };
    } catch (e) { return null; }
  }

  async function openDocFormat() {
    hidePdfChrome();

    if (alt && alt.ext === 'docx') {
      setLoadText('Коркардри DOC...');

    slot.appendChild(box);

  async function openBookFormat(fmt) {
    try {
      // DOC: пеш аз ҳама нусхаи намоишӣ (.docx/.txt аз робот) меҷӯем —
      // худи .doc-ро ПЕШ аз ҷавоби корбар НАМЕКАШЕМ (v99).
      if (fmt === 'doc') return await openDocFormat();
      // Библиотекаҳои формат ҲАМЗАМОНА бо боркунии китоб сар мешаванд (тезтар)
      let libsPromise = null;
      if (fmt === 'epub') {
        libsPromise = loadScriptOnce('assets/libs/jszip.min.js')
          .then(() => loadScriptOnce('assets/libs/epub.min.js'));

        libsPromise = loadScriptOnce('assets/libs/mammoth.browser.min.js');

      if (fmt === 'docx') { if (libsPromise) await libsPromise; setLoadText('Коркардри DOCX...'); const parts = await renderDocxContent(buf); return mountScrollReader([bookHeaderHtml(name, 'DOCX')].concat(parts)); }
      if (fmt === 'txt') { const t = escapeHtml(decodeBookText(buf)); const lines = t.split('\n'); const parts = [bookHeaderHtml(name, 'TXT') + '<pre class="btxt">']; for (let li = 0; li < lines.length; li++) parts.push(lines[li] + (li < lines.length - 1 ? '\n' : '')); parts.push('</pre>'); return mountScrollReader(parts); }

      $('loading').classList.remove('on');
