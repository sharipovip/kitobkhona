<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Китобхона — Хондан</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js?v=60"></script>
<script src="cache.js?v=43"></script>
<style>
  
  :root {
    --bg: #0d1b2a;
    --panel: rgba(13, 27, 42, 0.92);
    --page-bg: #f5f0e8;
    --gold: #c9a84c;
    --gold2: #e8c96d;
    --text: #f0ead6;
    --muted: #a8b8cc;
    --border: rgba(201, 168, 76, 0.2);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  .light-reading {
    --bg: #e8e2d5;
    --panel: rgba(245, 240, 232, 0.96);
    --page-bg: #fffef7;
    --text: #1a2d44;
    --muted: #4a5d73;
    --border: rgba(201, 168, 76, 0.25);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    position: fixed;
    inset: 0;
  }

  .reader-wrapper {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 0 60px rgba(0, 0, 0, 0.55);
  }

  
  .reader-top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: calc(8px + var(--safe-top)) 12px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.3s ease;
  }
  .reader-top-bar.hidden { transform: translateY(-110%); }

  .btn-back, .top-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .btn-back:hover, .top-btn:hover { background: rgba(201, 168, 76, 0.15); }
  .btn-back:active, .top-btn:active { transform: scale(0.92); }

  .book-title-block {
    flex: 1;
    min-width: 0;
  }
  .reading-book-title {
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reading-book-author {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .top-actions { display: flex; gap: 6px; }

  
  .reader-main {
    flex: 1;
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, rgba(201, 168, 76, 0.08), transparent 40%), var(--bg);
  }

  .page-stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(58px + var(--safe-top)) 5px calc(100px + var(--safe-bottom));
    touch-action: pan-y;
    overflow: hidden;
  }

  .page-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }

  .page-slot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform, opacity;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.35s ease;
    backface-visibility: hidden;
    border-radius: 6px;
    background: var(--page-bg);
    box-shadow: var(--shadow);
  }

  .page-slot canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .page-slot.current {
    z-index: 2;
    opacity: 1;
    transform: translateX(0) scale(1);
  }

  .page-slot.prev {
    z-index: 1;
    opacity: 0.5;
    transform: translateX(-25%) scale(0.95);
  }

  .page-slot.next {
    z-index: 1;
    opacity: 0.5;
    transform: translateX(25%) scale(0.95);
  }

  .page-slot.hidden {
    opacity: 0;
    transform: translateX(0) scale(0.9);
    pointer-events: none;
  }

  
  .page-nav-area {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28%;
    z-index: 20;
    cursor: pointer;
  }
  .page-nav-left { left: 0; }
  .page-nav-right { right: 0; }

  
  .reader-bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--border);
    padding: 8px 14px calc(10px + var(--safe-bottom));
    transition: transform 0.3s ease;
  }
  .reader-bottom-bar.hidden { transform: translateY(110%); }

  .reading-progress {
    height: 3px;
    background: rgba(255, 255, 255, 0.13);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .reading-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    width: 0;
    transition: width 0.3s ease;
  }

  .reaction-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-top: 2px;
  }
  .reaction-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .reaction-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s, color 0.2s;
    color: var(--muted);
    padding: 2px 4px;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .reaction-btn:hover { transform: scale(1.15); }
  .reaction-btn.active { color: var(--gold); }
  .reaction-btn .cnt {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .reaction-btn.active .cnt { color: var(--gold); }

  .rating-stars {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .rating-stars .star {
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.15s, color 0.2s;
  }
  .rating-stars .star.on { color: var(--gold); }
  .rating-stars .star:hover { transform: scale(1.2); }
  .rating-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-right: 4px;
  }

  .page-info {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: 0.3px;
    min-width: 60px;
    margin: 0 8px;
  }

  
  .panel {
    position: absolute;
    z-index: 160;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.5);
    display: none;
    border-radius: 20px;
    padding: 14px;
    overflow: auto;
    backdrop-filter: blur(18px);
  }
  .panel.open { display: block; }

  .settings-panel {
    top: calc(60px + var(--safe-top));
    right: 10px;
    bottom: calc(80px + var(--safe-bottom));
    width: min(320px, calc(100% - 20px));
  }
  .search-panel {
    left: 10px;
    right: 10px;
    top: calc(64px + var(--safe-top));
    bottom: calc(80px + var(--safe-bottom));
  }

  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .panel-title { font-weight: 900; color: var(--gold2); }
  .close-panel {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .settings-group {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 8px 0;
  }
  .settings-group-title {
    font-size: 11px;
    color: var(--gold2);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 13px;
    padding: 8px;
    margin-bottom: 6px;
  }
  .setting-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--border);
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    padding: 6px 12px;
    font-weight: 800;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.2s, color 0.2s;
  }
  .pill.active { background: var(--gold); color: #1b1202; }
  .pill:hover { background: rgba(201, 168, 76, 0.15); }

  .range { width: 100%; margin: 3px 0; }

  .find-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .find-count {
    flex: 1;
    text-align: center;
    color: var(--gold2);
    font-weight: 900;
    font-size: 12px;
  }
  .find-results {
    margin-top: 10px;
    max-height: 48vh;
    overflow: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .find-item {
    padding: 9px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    cursor: pointer;
  }
  .find-item.on { background: rgba(201, 168, 76, 0.12); border-radius: 10px; }
  .find-page { font-weight: 900; color: var(--gold2); font-size: 12px; }
  .find-snippet { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    z-index: 300;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 10px 15px;
    color: var(--text);
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    max-width: 90%;
    text-align: center;
    backdrop-filter: blur(18px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .error {
    padding: 20px;
    text-align: center;
    color: #fca5a5;
    max-width: 320px;
  }

  .loading {
    position: absolute;
    inset: 0;
    z-index: 90;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, 0.20);
  }
  .loading.on { display: grid; }
  .progress-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(201, 168, 76, 0.16) 0);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
    position: relative;
  }
  .progress-ring::before {
    content: "";
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .progress-ring span {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-weight: 900;
    color: var(--gold2);
  }

  @media (max-width: 430px) {
    .reader-wrapper { max-width: 100%; }
  }
</style>

*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>

<style id="reader-round10-edge-fix">

.page-stage{padding:calc(91px + var(--safe-top)) 0 0!important;inset:0!important}

<style id="reader-round11-final-layout">
.reader-top-bar{height:52px!important}.top-rating .rating-label{font-size:11.5px!important;font-weight:750!important;margin-right:4px!important}.top-rating .star{font-size:15px!important;padding:1px!important}.reader-progress-wrap{display:none!important}
.page-stage{padding:calc(52px + var(--safe-top)) 0 calc(73px + var(--safe-bottom))!important;background:#0C0C0C!important}.page-container,.page-slot{background:#0C0C0C!important}.reader-bottom-bar{z-index:110!important}
.page-entry-box{width:50px;height:38px;border:1px solid rgba(201,168,76,.22);border-radius:11px;background:#171717;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}.page-entry input{width:46px!important;height:20px!important;border:0!important;border-radius:0!important;background:transparent!important;color:#E8C96D!important;font-size:10.5px!important}.page-entry input:focus{box-shadow:none!important}.page-entry-box #quickPagePct{font-size:8px;color:#8A794A;line-height:1}.page-entry small{margin-top:1px}
@media(max-width:380px){.top-rating .rating-label{font-size:10px!important}.top-rating .star{font-size:13px!important}.page-entry-box{width:45px}.page-entry input{width:42px!important}}
@media(max-width:345px){.top-rating .rating-label{display:none}.top-rating .star{font-size:12px!important}}

<style id="reader-paper-colors">
:root{--reader-paper-bg:#0C0C0C;--reader-paper-tint:transparent;--reader-paper-tint-opacity:0}

.paper-color-dot:active{transform:scale(.8)}
.light-reading .page-slot::before{mix-blend-mode:multiply;opacity:calc(var(--reader-paper-tint-opacity) * .42)}

</style>
</head>
<body>
<div class="reader-wrapper">
  
  <div class="reader-top-bar" id="topBar">
    <button class="btn-back" onclick="goBack()" aria-label="Бозгашт">←</button>
    <div class="top-rating rating-stars" id="ratingStars" aria-label="Баҳодиҳӣ"><span class="rating-label">Баҳо диҳед</span><span class="star" data-rating="1">☆</span><span class="star" data-rating="2">☆</span><span class="star" data-rating="3">☆</span><span class="star" data-rating="4">☆</span><span class="star" data-rating="5">☆</span><span class="star" data-rating="6">☆</span><span class="star" data-rating="7">☆</span><span class="star" data-rating="8">☆</span><span class="star" data-rating="9">☆</span><span class="star" data-rating="10">☆</span></div>
    <button class="top-btn" onclick="toggleSearch()" aria-label="Ҷустуҷӯ">⌕</button>
    <button class="top-btn reader-favorite-btn" data-reader-favorite onclick="toggleReaderFavorite()" aria-label="Дӯстдошта"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.9a5.4 5.4 0 0 0-7.6 0L12 6.1l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.5a5.4 5.4 0 0 0 0-7.6z"/></svg></button>
    <div class="size-control" aria-label="Андоза"><button onclick="adjustZoom(-10)">−</button><span>А</span><button onclick="adjustZoom(10)">＋</button></div>
  </div>


  <main class="reader-main" id="readerMain">
    <div class="page-stage" id="stage">
      <div class="page-container" id="pageContainer">
        <div class="page-slot current" id="currentSlot"></div>
        <div class="page-slot hidden" id="nextSlot"></div>
      </div>
    </div>
    <div class="page-nav-area page-nav-left" onclick="turnPage(-1)"></div>
    <div class="page-nav-area page-nav-right" onclick="turnPage(1)"></div>
    <div class="loading on" id="loading">
      <div class="progress-ring" id="progressRing" style="--p:0"><span id="loadPct">0%</span></div>
    </div>
    <aside class="reader-reactions" aria-label="Вокунишҳо">
      <button class="reaction-btn" data-reaction="like" title="Лайк"><span class="reaction-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v10H3V10h4Zm0 9h9.2a2 2 0 0 0 1.9-1.4l2-6A2 2 0 0 0 18.2 9H14l.8-3.2A2.3 2.3 0 0 0 12.6 3L7 10"/></svg></span><span class="cnt" id="likeCount">0</span></button>
      <button class="reaction-btn" data-reaction="love" title="Дӯст доштан"><span class="reaction-symbol heart-reaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.8 4.9a5.4 5.4 0 0 0-7.6 0L12 6.1l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.5a5.4 5.4 0 0 0 0-7.6Z"/></svg></span><span class="cnt" id="loveCount">0</span></button>
      <button class="reaction-btn" data-reaction="dislike" title="Нописанд"><span class="reaction-symbol dislike-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v10H3V10h4Zm0 9h9.2a2 2 0 0 0 1.9-1.4l2-6A2 2 0 0 0 18.2 9H14l.8-3.2A2.3 2.3 0 0 0 12.6 3L7 10"/></svg></span><span class="cnt" id="dislikeCount">0</span></button>
    </aside>
  </main>

  
  <div class="reader-bottom-bar" id="bottomBar">
    <div class="reader-action-nav">
      <label class="reader-nav-item page-entry"><span class="page-entry-box"><input id="quickPageInput" type="number" inputmode="numeric" min="1" placeholder="1/1" onfocus="prepareQuickPage()" onkeydown="if(event.key==='Enter'){event.preventDefault();quickGoPage();this.blur()}" onblur="quickGoPage()"><span id="quickPagePct">0%</span></span><small>Саҳифа</small></label>
      <button class="reader-nav-item" type="button" onclick="toggleReaderTheme()"><span class="ico" id="readerThemeIcon">☀</span><small>Мавзӯъ</small></button>
      <button class="reader-nav-item center brightness-dial" id="brightnessDial" type="button" aria-label="Дурахшонӣ"><span class="ico"><span id="brightnessDialValue">100%</span><span class="paper-color-dot" id="paperColorDot" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();cyclePaperColor()" title="Ранги саҳифа"></span></span><small>Дурахшонӣ</small></button>
      <button class="reader-nav-item" type="button" onclick="shareCurrent()"><span class="ico">↗</span><small>Мубодила</small></button>
      <button class="reader-nav-item" type="button" onclick="downloadCurrent()"><span class="ico">⇩</span><small>Зеркашӣ</small></button>
    </div>
  </div>

  <div class="panel settings-panel" id="settingsPanel">
    <div class="settings-header">
      <div class="panel-title">⚙️ Танзимот</div>
      <button class="close-panel" onclick="toggleSettings(false)">✕</button>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Намуди хондан</div>
      <div class="setting-item">
        <div class="setting-label">🌓 Мавзӯъ</div>
        <div class="row">
          <button class="pill" onclick="setTheme('light')">☀️ Рӯз</button>
          <button class="pill active" onclick="setTheme('dark')">🌙 Шаб</button>
        </div>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Дурахшонӣ</div>
      <div class="setting-item" style="display:block">
        <div class="setting-label">💡 Танзими дурахшонӣ</div>
        <input class="range" id="brightnessRange" type="range" min="45" max="120" value="100" oninput="setBrightness(this.value)">
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Андоза</div>
      <div class="setting-item" style="display:block">
        <div class="setting-label">🔍 Калонсозӣ</div>
        <input class="range" type="range" min="70" max="150" value="100" oninput="setZoom(this.value)">
        <div id="zoomText" style="text-align:center;color:var(--gold2);font-weight:900">100%</div>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-group-title">Имконот</div>
      <div class="setting-item" onclick="downloadCurrent()">
        <div class="setting-label">⬇ Зеркашӣ кардан</div>
        <div>📥</div>
      </div>
    </div>
  </div>

  
  <div class="panel search-panel" id="searchPanel">
    <div class="settings-header">
      <div class="panel-title">🔍 Ҷустуҷӯ</div>
      <button class="close-panel" onclick="toggleSearch(false)">✕</button>
    </div>
    <form onsubmit="event.preventDefault();findText()" class="row">
      <input id="findInput" style="flex:1;min-width:170px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);border-radius:12px;padding:10px;outline:none" placeholder="Калима...">
      <button class="pill">Ёфтан</button>
    </form>
    <div class="find-nav">
      <button class="pill" onclick="prevFind()">↑ Пешина</button>
      <div class="find-count" id="findCount">0 / 0</div>
      <button class="pill" onclick="nextFind()">↓ Баъдӣ</button>
    </div>
    <div id="findResult" class="find-results"></div>
  </div>

  
  <div class="toast" id="toast"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const $ = id => document.getElementById(id);
  const qs = new URL(location.href).searchParams;
  const safeDecode = s => { try { return decodeURIComponent(s) } catch(e) { return s } };

  let url = qs.get('url') || qs.get('open') || '';
  let name = qs.get('name') || 'Китоб';
  let cover = qs.get('cover') || '';
  let pdf = null, page = 1, pages = 0, rendering = false, bars = true, zoom = 1;

  url = canonicalBookUrl(safeDecode(url));
  name = safeDecode(name);
  cover = safeDecode(cover);
  if (/^data:/i.test(String(cover).trim())) cover = '';
  const titleEl=$('bookTitle');if(titleEl)titleEl.textContent=name;

  function getBookId() {
    try {
      const u = new URL(url);
      const path = u.pathname.split('/').filter(Boolean);
      const contentPath = path.slice(3).join('/');
      let clean = contentPath.replace(/^books\//, '');
      if (!clean) {
        const fileName = path.slice(3).pop() || '';
        return fileName;
      }
      return clean;
    } catch(e) {
      return name;
    }
  }

  let sessionInterval=null,sessionStarted=false,segmentStartedAt=0;
  const LOCAL_CHECKPOINT_MS=10*60*1000;

  function readingPayload(duration){
    return {book_id:getBookId(),book_title:name,duration:Math.max(0,Math.round(duration||0)),pages_read:Math.max(0,Number(page)||0),total_pages:Math.max(0,Number(pages)||0),status:(pages>0&&page/pages>=.95)?'completed':'paused'};
  }
  function checkpointReading(force=false){
    if(!sessionStarted||!segmentStartedAt)return;
    const now=Date.now(),duration=Math.floor((now-segmentStartedAt)/1000);
    if(duration<=0||(!force&&now-segmentStartedAt<LOCAL_CHECKPOINT_MS))return;
    if(window.KKReadingSyncV2)KKReadingSyncV2.add(readingPayload(duration));
    segmentStartedAt=now;
  }
  function startReadingSession(){
    if(sessionStarted)return;sessionStarted=true;segmentStartedAt=Date.now();
    if(window.KKReadingSyncV2)KKReadingSyncV2.active();
    sessionInterval=setInterval(()=>{if(document.hidden)return;if(window.KKReadingSyncV2)KKReadingSyncV2.active();checkpointReading(false)},30*1000);
  }
  function stopReadingSession(){
    if(!sessionStarted)return;checkpointReading(true);sessionStarted=false;segmentStartedAt=0;
    if(sessionInterval)clearInterval(sessionInterval);sessionInterval=null;
    if(window.KKReadingSyncV2)KKReadingSyncV2.closed();
  }
  window.addEventListener('load',()=>{setTimeout(startReadingSession,1000)});
  window.addEventListener('online',()=>window.KKReadingSyncV2?.flush());
  window.addEventListener('beforeunload',stopReadingSession);
  window.addEventListener('pagehide',stopReadingSession);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopReadingSession();else startReadingSession()});
  window.goBack=function(){stopReadingSession();if(history.length>1)history.back();else location.href='kitobho.html'};

  let currentReaction = null;
  let currentRating = 0;

  async function loadReactions() {
    const token = localStorage.getItem('kk_token');
    if (!token) return;
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions/' + encodeURIComponent(bookId), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const data = await resp.json();
      if (data.reaction) {
        currentReaction = data.reaction;
        document.querySelectorAll('.reaction-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.reaction === data.reaction);
        });
      }
      if (data.rating) {
        currentRating = data.rating;
        updateStarsUI(data.rating);
      }
      const statsResp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-stats/' + encodeURIComponent(bookId));
      if (!statsResp.ok) throw new Error('HTTP '+statsResp.status);
      const stats = await statsResp.json();
      $('likeCount').textContent = stats.likes || 0;
      $('loveCount').textContent = stats.loves || 0;
      $('dislikeCount').textContent = stats.dislikes || 0;
    } catch(e) {
      console.warn('Failed to load reactions:', e);
    }
  }

  async function saveReaction(reaction) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('Ворид шавед'); return; }
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_id: bookId, reaction })
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const stats = await resp.json();
      $('likeCount').textContent = stats.likes || 0;
      $('loveCount').textContent = stats.loves || 0;
      $('dislikeCount').textContent = stats.dislikes || 0;
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.reaction === reaction);
      });
      currentReaction = reaction;
      toast('Реакция сабт шуд');
    } catch(e) {
      console.error('Save reaction error:', e);
      toast('Хатогӣ: ' + e.message);
    }
  }

  async function saveRating(rating) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('Ворид шавед'); return; }
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_id: bookId, rating })
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      currentRating = rating;
      updateStarsUI(rating);
      toast('Баҳо сабт шуд (⭐ ' + rating + '/10)');
    } catch(e) {
      console.error('Save rating error:', e);
      toast('Хатогӣ: ' + e.message);
    }
  }

  function updateStarsUI(rating) {
    document.querySelectorAll('.rating-stars .star').forEach(el => {
      const val = parseInt(el.dataset.rating);
      el.classList.toggle('on', val <= rating);
      el.textContent = val <= rating ? '★' : '☆';
    });
  }

  document.querySelectorAll('.reaction-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const reaction = this.dataset.reaction;
      if (this.classList.contains('active')) {
        saveReaction(null);
        this.classList.remove('active');
        currentReaction = null;
      } else {
        saveReaction(reaction);
      }
    });
  });

  document.querySelectorAll('.rating-stars .star').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const rating = parseInt(this.dataset.rating);
      if (currentRating === rating) {
        saveRating(0);
      } else {
        saveRating(rating);
      }
    });
  });

  function toast(msg, d = 2200) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), d);
  }

  function setLoadProgress(p) {
    p = Math.max(0, Math.min(100, Math.round(p || 0)));
    $('progressRing')?.style.setProperty('--p', p);
    if ($('loadPct')) $('loadPct').textContent = p + '%';
  }

  function cdnPdfUrl(u) {
    try {
      const x = new URL(u);
      if (x.hostname === 'raw.githubusercontent.com') {
        const parts = x.pathname.split('/').filter(Boolean);
        if (parts.length >= 4) {
          const owner = parts[0], repo = parts[1], branch = parts[2];
          const pathParts = parts.slice(3).map(p => encodeURIComponent(decodeURIComponent(p)));
          const path = pathParts.join('/');
          return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}`;
        }
      }
      return u;
    } catch(e) { return u; }
  }

  function cachedMap() {
    try { return JSON.parse(localStorage.getItem('kk_cached_books') || '{}') } catch(e) { return {} }
  }
  function saveCachedMeta(pdfUrl, bytes = 0) {
    try {
      const m = cachedMap();
      const canonical = canonicalBookUrl(pdfUrl || url);
      const meta = { url: canonical, name, cover, ts: Date.now(), size: bytes };
      m[canonical] = meta;
      localStorage.setItem('kk_cached_books', JSON.stringify(m));
    } catch(e) {}
  }
  async function loadPdfFrom(pdfUrl) {
    setLoadProgress(0);
    const response=await getOrFetchBookResponse(pdfUrl,{onProgress:(loaded,total)=>setLoadProgress(total?loaded/total*100:35)});
    const data=await response.arrayBuffer();saveCachedMeta(pdfUrl,data.byteLength);setLoadProgress(100);
    return await pdfjsLib.getDocument({data}).promise;
  }

  async function openPdf() {
    if (!url) {
      $('currentSlot').innerHTML = '<div class="error">URL-и китоб нест</div>';
      $('loading').classList.remove('on');
      return;
    }
    if (!url.includes('raw.githubusercontent.com') && !url.includes('cdn.jsdelivr.net')) {
      $('currentSlot').innerHTML = '<div class="error">URL-и китоб нодуруст аст</div>';
      $('loading').classList.remove('on');
      return;
    }
    const urls = [...new Set([cdnPdfUrl(url), url].filter(Boolean).map(canonicalBookUrl))];
    try {
      let lastErr = null;
      for (const u of urls) {
        try { pdf = await loadPdfFrom(u); break; } catch(e) { lastErr = e; }
      }
      if (!pdf) throw lastErr || new Error('PDF дастрас нест');
      pages = pdf.numPages;
      const pr = getProgress();
      page = pr ? Math.min(pr.page, pages) : 1;
      await renderPage(page);
    } catch(e) {
      console.error('[Reader] Error:', e);
      $('currentSlot').innerHTML = '<div class="error">Хатогӣ ҳангоми кушодани PDF<br>' + String(e.message || e) + '</div>';
    } finally {
      $('loading').classList.remove('on');
    }
  }

  function getProgress() {
    try { return JSON.parse(localStorage.getItem('kk_reader_progress') || '{}')[url] } catch(e) { return null }
  }
  function saveProgress() {
    try {
      const o = JSON.parse(localStorage.getItem('kk_reader_progress') || '{}');
      o[url] = { name, page, pages, cover, ts: Date.now() };
      localStorage.setItem('kk_reader_progress', JSON.stringify(o));
    } catch(e) {}
  }

  async function renderPage(n, direction) {
    if (!pdf || rendering) return;
    rendering = true;
    try {
      const p = await pdf.getPage(n);
      const st = $('stage');
      const nat = p.getViewport({ scale: 1 });
      const dpr = Math.min(devicePixelRatio || 1, 2);
      // Responsive smartphone fit: always keep the complete PDF page visible.
      const availableWidth = Math.max(1, st.clientWidth);
      const availableHeight = Math.max(1, st.clientHeight);
      const fit = Math.min(availableWidth / nat.width, availableHeight / nat.height) * zoom;
      const vp = p.getViewport({ scale: fit * dpr });

      const cv = document.createElement('canvas');
      cv.width = vp.width;
      cv.height = vp.height;
      cv.style.width = (vp.width / dpr) + 'px';
      cv.style.height = (vp.height / dpr) + 'px';
      const ctx = cv.getContext('2d', { alpha: false });
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--page-bg') || '#f5f0e8';
      ctx.fillRect(0, 0, cv.width, cv.height);
      await p.render({ canvasContext: ctx, viewport: vp }).promise;

      const currentSlot = $('currentSlot');
      const nextSlot = $('nextSlot');

      const oldCanvas = currentSlot.querySelector('canvas');
      if (oldCanvas) {
        nextSlot.innerHTML = '';
        nextSlot.appendChild(oldCanvas.cloneNode(true));
        nextSlot.className = 'page-slot next';
        requestAnimationFrame(() => {
          nextSlot.style.transition = 'transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.4s ease';
          nextSlot.style.transformOrigin=direction===1?'left center':'right center';nextSlot.style.transform=direction===1?'translateX(-12%) rotateY(-22deg) scale(.96)':'translateX(12%) rotateY(22deg) scale(.96)';
          nextSlot.style.opacity = '0.3';
        });
        setTimeout(() => {
          nextSlot.className = 'page-slot hidden';
          nextSlot.style.transform = '';
          nextSlot.style.opacity = '';
          nextSlot.style.transition = '';
        }, 500);
      }

      currentSlot.innerHTML = '';
      currentSlot.appendChild(cv);
      currentSlot.className = 'page-slot current';
      currentSlot.style.transition = 'none';
      currentSlot.style.transformOrigin=direction===1?'right center':'left center';currentSlot.style.transform=direction===1?'translateX(8%) rotateY(13deg) scale(.97)':'translateX(-8%) rotateY(-13deg) scale(.97)';
      currentSlot.style.opacity = '0.5';
      requestAnimationFrame(() => {
        currentSlot.style.transition = 'transform 0.4s cubic-bezier(0.22,0.61,0.36,1), opacity 0.4s ease';
        currentSlot.style.transform = 'translateX(0) scale(1)';
        currentSlot.style.opacity = '1';
      });

      page = n;
      const pct=pages?Math.round(page/pages*100):0;
      if($('pageInfo'))$('pageInfo').textContent=page+' / '+pages;
      if($('quickPageInput')){$('quickPageInput').max=pages;$('quickPageInput').placeholder=page+'/'+pages}
      if($('quickPagePct'))$('quickPagePct').textContent=pct+'%';
      if($('bookSub'))$('bookSub').textContent='PDF · '+pages+' саҳифа';
      saveProgress();
    } catch(e) {
      toast('Хатогӣ: ' + (e.message || e), 3000);
    } finally {
      rendering = false;
    }
  }

  function turnPage(d) {
    if (rendering) return;
    const n = page + d;
    if (n < 1 || n > pages) return;
    renderPage(n, d);
  }

  $('readerMain').addEventListener('click', e => {
    if (e.target.closest('.page-nav-area') || e.target.closest('.reader-reactions')) return;
    bars = !bars;
    $('topBar').classList.toggle('hidden', !bars);
    $('bottomBar').classList.toggle('hidden', !bars);
  });

  let sx = 0, sy = 0, drag = false, startTime = 0;
  const stageEl = $('stage');
  stageEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    startTime = Date.now();
    drag = true;
  }, { passive: true });

  stageEl.addEventListener('touchmove', e => {
    if (!drag || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      const currentSlot = $('currentSlot');
      const pct = Math.min(1, Math.abs(dx) / 200);
      const offset = dx < 0 ? -pct * 40 : pct * 40;
      currentSlot.style.transition = 'none';
      currentSlot.style.transformOrigin=dx<0?'left center':'right center';currentSlot.style.transform=`translateX(${offset*.35}px) rotateY(${dx<0?-pct*16:pct*16}deg) scale(${1-pct*.025})`;
      currentSlot.style.opacity = 1 - pct * 0.3;
    }
  }, { passive: true });

  stageEl.addEventListener('touchend', e => {
    if (!drag) return;
    drag = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dt = Date.now() - startTime;
    const currentSlot = $('currentSlot');
    currentSlot.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    currentSlot.style.transform = 'translateX(0) scale(1)';
    currentSlot.style.opacity = '1';
    setTimeout(() => {
      currentSlot.style.transition = '';
    }, 350);
    if (Math.abs(dx) > 50 || (Math.abs(dx) > 25 && dt < 250)) {
      turnPage(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  function setTheme(t) {
    document.body.classList.toggle('light-reading', t === 'light');
    localStorage.setItem('kk_reader_theme', t);
    if (pdf) renderPage(page);
  }
  const initialReaderTheme=localStorage.getItem('kk_reader_theme')||'dark';
  setTheme(initialReaderTheme);
  if($('readerThemeIcon')) $('readerThemeIcon').textContent=initialReaderTheme==='light'?'🌙':'☀';

  function setZoom(v) {
    zoom = Number(v) / 100;
    const container = $('pageContainer');
    if (container) container.classList.toggle('zoomed', zoom > 1.001);
    if ($('zoomText')) $('zoomText').textContent = v + '%';
    if (pdf) {
      if (rendering) setTimeout(() => { if (!rendering) renderPage(page); }, 180);
      else renderPage(page);
    }
  }

  function setBrightness(v) {
    $('pageContainer').style.filter = 'brightness(' + (Number(v) / 100) + ')';
    localStorage.setItem('kk_reader_brightness', v);
    if ($('brightnessRange')) $('brightnessRange').value = v;
    if ($('brightnessDialValue')) $('brightnessDialValue').textContent = Math.round(Number(v)) + '%';
  }
  setBrightness(localStorage.getItem('kk_reader_brightness') || 100);

  function toggleSettings(force) {
    $('settingsPanel').classList.toggle('open', force === undefined ? !$('settingsPanel').classList.contains('open') : !!force);
    $('searchPanel').classList.remove('open');
  }

  function toggleSearch(force) {
    $('searchPanel').classList.toggle('open', force === undefined ? !$('searchPanel').classList.contains('open') : !!force);
    $('settingsPanel').classList.remove('open');
    setTimeout(() => $('findInput').focus(), 80);
  }

  function adjustZoom(delta){const next=Math.max(70,Math.min(170,Math.round(zoom*100)+delta));setZoom(next);toast('Андоза: '+next+'%')}
  const READER_PAPER_COLORS=[
    {name:'Сиёҳи классикӣ',bg:'#0C0C0C',tint:'transparent',opacity:0},
    {name:'Ангиштӣ',bg:'#111318',tint:'#253047',opacity:.18},
    {name:'Кабуди шаб',bg:'#071526',tint:'#17436A',opacity:.24},
    {name:'Сабзи ҷангал',bg:'#0B1813',tint:'#245C43',opacity:.22},
    {name:'Қаҳваранг',bg:'#19110C',tint:'#754624',opacity:.25},
    {name:'Сепия',bg:'#1B160E',tint:'#8A6A35',opacity:.24},
    {name:'Олуболу',bg:'#1A0D14',tint:'#713751',opacity:.22},
    {name:'Бунафш',bg:'#130E1C',tint:'#553B78',opacity:.22},
    {name:'Хокистарӣ',bg:'#17191B',tint:'#66717A',opacity:.16},
    {name:'Тиллоии нарм',bg:'#19160D',tint:'#8B742D',opacity:.21},
    {name:'Фирӯзагӣ',bg:'#08191A',tint:'#237276',opacity:.20},
    {name:'Гулобии шаб',bg:'#1A1014',tint:'#834C60',opacity:.18}
  ];
  let readerPaperColorIndex=Math.max(0,Math.min(READER_PAPER_COLORS.length-1,Number(localStorage.getItem('kk_reader_paper_color')||0)));
  function applyPaperColor(index,announce=false){
    readerPaperColorIndex=(Number(index)+READER_PAPER_COLORS.length)%READER_PAPER_COLORS.length;
    const color=READER_PAPER_COLORS[readerPaperColorIndex];
    document.documentElement.style.setProperty('--reader-paper-bg',color.bg);
    document.documentElement.style.setProperty('--reader-paper-tint',color.tint);
    document.documentElement.style.setProperty('--reader-paper-tint-opacity',String(color.opacity));
    const dot=$('paperColorDot');if(dot){dot.style.background=color.tint==='transparent'?color.bg:color.tint;dot.title='Ранги саҳифа: '+color.name}
    localStorage.setItem('kk_reader_paper_color',String(readerPaperColorIndex));
    if(announce)toast('Ранги саҳифа: '+color.name);
  }
  function cyclePaperColor(){applyPaperColor(readerPaperColorIndex+1,true)}
  function initPaperColor(){applyPaperColor(readerPaperColorIndex,false)}

  let brightnessValue=Number(localStorage.getItem('kk_reader_brightness')||100),dialStartX=0,dialStartValue=100,dialDragging=false;
  function applyDialBrightness(value){brightnessValue=Math.max(45,Math.min(120,Math.round(value)));setBrightness(brightnessValue);if($('brightnessDialValue'))$('brightnessDialValue').textContent=brightnessValue+'%'}
  function initBrightnessDial(){const dial=$('brightnessDial');if(!dial)return;applyDialBrightness(brightnessValue);dial.addEventListener('pointerdown',e=>{dialDragging=true;dialStartX=e.clientX;dialStartValue=brightnessValue;dial.setPointerCapture?.(e.pointerId)});dial.addEventListener('pointermove',e=>{if(dialDragging)applyDialBrightness(dialStartValue+(e.clientX-dialStartX)/1.5)});const stop=()=>dialDragging=false;dial.addEventListener('pointerup',stop);dial.addEventListener('pointercancel',stop);dial.addEventListener('wheel',e=>{e.preventDefault();applyDialBrightness(brightnessValue+(e.deltaY<0?5:-5))},{passive:false});dial.addEventListener('dblclick',()=>applyDialBrightness(100))}
  function prepareQuickPage(){const input=$('quickPageInput');if(!input||!pages)return;input.value=String(page);setTimeout(()=>input.select(),0)}
  function quickGoPage(){const input=$('quickPageInput');if(!input||!pages)return;const raw=input.value.trim();input.value='';if(!raw)return;const n=Math.max(1,Math.min(pages,parseInt(raw,10)||page));renderPage(n,n>=page?1:-1)}
  function jumpToPagePrompt(){document.getElementById('quickPageInput')?.focus()}
  function toggleReaderTheme(){
    const next=document.body.classList.contains('light-reading')?'dark':'light';setTheme(next);const icon=$('readerThemeIcon');if(icon)icon.textContent=next==='light'?'🌙':'☀'
  }
  let readerFavorite=false,readerFavoriteLoaded=false;
  function canonicalFavoriteId(){try{return decodeURIComponent(getBookId()).replace(/^books\//i,'')}catch(e){return getBookId().replace(/^books\//i,'')}}
  function paintReaderFavorite(){const outline='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.9a5.4 5.4 0 0 0-7.6 0L12 6.1l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.5a5.4 5.4 0 0 0 0-7.6z"/></svg>',filled=outline.replace('fill="none"','fill="currentColor"');document.querySelectorAll('[data-reader-favorite]').forEach(btn=>{btn.classList.toggle('active',readerFavorite);btn.innerHTML=readerFavorite?filled:outline;btn.setAttribute('aria-label',readerFavorite?'Аз дӯстдошта хориҷ кардан':'Ба дӯстдошта илова кардан')})}
  async function loadReaderFavorite(){const token=localStorage.getItem('kk_token');if(!token)return;try{const r=await fetch(KITOB_CONFIG.EDGE_API_BASE+'/api/favorites?scope=reader',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)return;const id=canonicalFavoriteId();readerFavorite=(await r.json()).some(x=>String(x.book_id).replace(/^books\//i,'')===id);readerFavoriteLoaded=true;paintReaderFavorite()}catch(e){}}
  async function toggleReaderFavorite(){if(!readerFavoriteLoaded)await loadReaderFavorite();const token=localStorage.getItem('kk_token');if(!token){toast('Барои дӯстдошта ворид шавед');return}const id=canonicalFavoriteId();try{const r=await fetch(KITOB_CONFIG.EDGE_API_BASE+'/api/favorites'+(readerFavorite?'/'+encodeURIComponent(id):''),{method:readerFavorite?'DELETE':'POST',headers:{Authorization:'Bearer '+token,...(!readerFavorite?{'Content-Type':'application/json'}:{})},body:readerFavorite?undefined:JSON.stringify({book_id:id,book_title:name,book_author:''})});if(!r.ok)throw Error('HTTP '+r.status);readerFavorite=!readerFavorite;paintReaderFavorite();toast(readerFavorite?'Ба дӯстдошта илова шуд':'Аз дӯстдошта хориҷ шуд')}catch(e){toast('Дӯстдошта нигоҳ дошта нашуд')}}

  async function downloadCurrent() {
    await downloadFile(url, name);
  }
  async function shareCurrent() {
    await shareFile(url, name);
  }

  let findHits = [], findIndex = -1;
  async function findText() {
    const q = $('findInput').value.trim();
    if (!q || !pdf) return;
    $('findCount').textContent = 'Ҷустуҷӯ...';
    $('findResult').innerHTML = '<div class="find-item"><div class="find-page">Ҷустуҷӯ...</div><div class="find-snippet">Лутфан интизор шавед</div></div>';
    findHits = []; findIndex = -1;
    const lo = q.toLowerCase();
    for (let i = 1; i <= pages; i++) {
      try {
        const pg = await pdf.getPage(i);
        const tc = await pg.getTextContent();
        const text = tc.items.map(x => x.str).join(' ');
        const pos = text.toLowerCase().indexOf(lo);
        if (pos >= 0) {
          const snip = (pos > 35 ? '…' : '') + text.slice(Math.max(0, pos - 35), Math.min(text.length, pos + q.length + 55)) + (pos + q.length + 55 < text.length ? '…' : '');
          findHits.push({ page: i, snippet: snip });
        }
      } catch(e) {}
      if (i % 8 === 0) await new Promise(r => setTimeout(r, 1));
    }
    renderFindResults();
    if (findHits.length) { findIndex = 0; goFind(0); }
  }
  function renderFindResults() {
    $('findCount').textContent = findHits.length ? `${Math.max(findIndex+1, 1)} / ${findHits.length}` : '0 / 0';
    $('findResult').innerHTML = findHits.length ? findHits.map((h,i) =>
      `<div class="find-item ${i===findIndex?'on':''}" onclick="goFind(${i})">
        <div class="find-page">Саҳифаи ${h.page}</div>
        <div class="find-snippet">${escapeHtml(h.snippet)}</div>
      </div>`
    ).join('') : '<div class="find-item"><div class="find-page">Ёфт нашуд</div><div class="find-snippet">Калимаи дигар нависед</div></div>';
  }
  function goFind(i) {
    if (!findHits.length) return;
    findIndex = (i + findHits.length) % findHits.length;
    const hit = findHits[findIndex];
    renderPage(hit.page);
    renderFindResults();
  }
  function nextFind() { if (findHits.length) goFind(findIndex + 1); }
  function prevFind() { if (findHits.length) goFind(findIndex - 1); }
  function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

  initPaperColor();
  initBrightnessDial();
  openPdf();
</script>
</body>
</html>
