<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0D1B2A;
    --bg2: #142236;
    --card: #1A2D44;
    --card2: #1E3350;
    --gold: #C9A84C;
    --gold2: #E8C96D;
    --text: #F0EAD6;
    --muted: #A8B8CC;
    --dim: #6B7F96;
    --border: rgba(201,168,76,0.18);
    --shadow: rgba(0,0,0,0.4);
    --gold-soft: rgba(201,168,76,0.14);
    --green-soft: rgba(79,157,112,0.16);
    --red-soft: rgba(189,86,80,0.16);
    --teal-soft: rgba(76,146,174,0.16);
    --green: #4F9D70;
    --red: #BD5650;
  }

  .light-theme {
    --bg: #F5F0E8;
    --bg2: #EDE6D6;
    --card: #fff;
    --card2: #FAF7F0;
    --text: #1A2D44;
    --muted: #4A5D73;
    --dim: #8A9AAD;
    --shadow: rgba(0,0,0,0.12);
    --gold-soft: rgba(182,134,58,0.12);
    --green-soft: rgba(63,126,88,0.12);
    --red-soft: rgba(168,70,63,0.12);
    --teal-soft: rgba(56,110,131,0.12);
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    width: 430px;
    height: 100vh;
    max-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border-radius: 0 !important; 
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  
  .top-app-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 8px;
    flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
  }
  .brand-mini {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-mini svg {
    width: 28px;
    height: 28px;
  }
  .brand-mini span {
    font-family: 'Noto Serif', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
  }
  .top-actions {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--gold);
    cursor: pointer;
    transition: 0.15s;
  }
  .icon-btn:hover {
    background: var(--card2);
  }

  
  .screen-area {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
  }
  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(201,168,76,0.2) transparent;
  }
  .screen::-webkit-scrollbar {
    width: 4px;
  }
  .screen::-webkit-scrollbar-track {
    background: transparent;
  }
  .screen::-webkit-scrollbar-thumb {
    background: rgba(201,168,76,0.2);
    border-radius: 2px;
  }

  
  .ornament {
    height: 10px;
    margin: 12px 0 4px;
    background-image: radial-gradient(circle, var(--gold) 1.4px, transparent 1.6px);
    background-size: 14px 10px;
    background-position: center;
    opacity: 0.55;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }

  .search {
    margin: 8px 0 4px 0;
    height: 46px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    flex: none;
  }
  .search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    width: 100%;
  }
  .search input::placeholder {
    color: var(--dim);
  }

  .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 10px 0;
  }
  .section-label .t {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--gold2);
  }
  .section-label .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dim);
  }

  
</style>
</head>

<script>
  function showToast(msg) {
    let t = document.getElementById('chatsToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'chatsToast';
      t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,0.85);color:#fff;border-radius:999px;padding:10px 20px;font-size:13px;z-index:99999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:88%;text-align:center';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2500);
  }
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof CacheManager !== 'undefined') {
      CacheManager.init();
    }
    renderCachedChatsFast();
    loadData();
  });

  (function initTheme() {
    const saved = localStorage.getItem('kk_theme') || 'dark';
    document.body.dataset.theme = saved;
  })();

  const $ = id => document.getElementById(id);

  const clsList = ['c1','c2','c3','c4','c5','c6'];
  const getCls = i => clsList[Math.abs(i) % clsList.length];

  let currentUser = null;
  let friendsCache = [];
  let chatSummary = { total_unread: 0, by_peer: {} };
  let unsubscribeFriends = null;
  let unsubscribeRequests = null;
  let friendsCacheKey = '';
  let requestsCacheKey = '';
  let summaryCacheKey = '';
  let friendDetailsCacheKey = '';
  let friendDetails = [];

  function getInitials(name) {
    if(!name) return 'К';
    const parts = name.trim().split(/\s+/);
    return parts.slice(0,2).map(p => p[0] || '').join('').toUpperCase() || 'К';
  }

  function formatTime(dateStr) {
    if(!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = (now - d) / 1000;
    if(diff < 60) return 'ҳозир';
    if(diff < 3600) return Math.floor(diff/60) + ' дақ';
    if(diff < 86400) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    if(diff < 604800) return ['Якш','Душ','Сеш','Чор','Панҷ','Ҷум','Шанб'][d.getDay()] || '';
    return d.getDate() + ' ' + ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  async function getProfileCached(userId) {
    const key = 'kk_profile_' + userId;
    let profile = (typeof CacheManager !== 'undefined') ? CacheManager.get(key) : null;
    if (!profile) {
      try {
        profile = await AUTH.getProfileFromRailway(userId);
        if (profile && typeof CacheManager !== 'undefined') {
          CacheManager.set(key, profile);
        }
      } catch(e) {
        profile = {};
      }
    }
    return profile;
  }

  function renderCachedChatsFast(){
    try{
      const uid=localStorage.getItem('kk_user_id');if(!uid)return;
      const cachedProfile=CacheManager.get('kk_profile_'+uid)||JSON.parse(localStorage.getItem('kk_profile_cache')||'null')||{id:uid};
      const cachedBirthYear=Number(cachedProfile.birth_year||0);
      const cachedGuest=cachedProfile.is_temporary===true||String(cachedProfile.username||'').startsWith('guest_');
      if(cachedGuest||!cachedBirthYear||cachedBirthYear>new Date().getFullYear()-18)return;
      currentUser=cachedProfile;friendsCacheKey=CacheManager.KEYS.FRIENDS+'_v2_'+uid;requestsCacheKey=CacheManager.KEYS.REQUESTS+'_v2_'+uid;summaryCacheKey='kk_cache_chat_summary_'+uid;friendDetailsCacheKey='kk_cache_friend_details_v1_'+uid;
      const friends=CacheManager.get(friendsCacheKey),requests=CacheManager.get(requestsCacheKey),summary=CacheManager.get(summaryCacheKey);friendDetails=CacheManager.get(friendDetailsCacheKey)||[];
      if(Array.isArray(friends)&&Array.isArray(requests))renderChats(friends,requests,document.getElementById('chatsScroll'),summary&&summary.by_peer?summary:{total_unread:0,by_peer:{}});
    }catch(e){}
  }

  function getChatsCopy() {
    const lang = typeof getAppLanguage === 'function' ? getAppLanguage() : 'tg';
    if (lang === 'ru') return {
      login: 'Войдите, чтобы просмотреть чаты', signIn: 'Войти',
      locked: 'Чат недоступен гостям и пользователям младше 18 лет. Заполните профиль, чтобы пользоваться чатом.',
      editProfile: 'Заполнить профиль', adultsOnly: 'Дружба и сообщения доступны только пользователям от 18 лет.',
      server: 'Сервер пока недоступен.', retry: 'Попробовать снова'
    };
    if (lang === 'en') return {
      login: 'Sign in to view chats', signIn: 'Sign in',
      locked: 'Chat is unavailable to guests and users under 18. Complete your profile to use chat services.',
      editProfile: 'Complete profile', adultsOnly: 'Friendship and messaging are available only to users aged 18 or older.',
      server: 'The server is not available right now.', retry: 'Try again'
    };
    return {
      login: 'Барои дидани чатҳо ворид шавед', signIn: 'Ворид шудан',
      locked: 'Чат барои меҳмонон ва корбарони то 18-сола дастрас нест. Профили худро пурра намуда аз хизматрасониҳои чат истифода намоед.',
      editProfile: 'Таҳрири профил', adultsOnly: 'Дӯстӣ ва паёмак танҳо барои корбарони 18-сола ва калонтар дастрас аст.',
      server: 'Сервер ҳоло дастрас нест.', retry: 'Аз нав кӯшиш кунед'
    };
  }

  async function loadData() {
    const scroll=document.getElementById('chatsScroll');
    // Показываем экран ожидания СРАЗУ, а не только если запрос провалится — потому что
    // чаще всего он просто МЕДЛЕННЫЙ (Edge пробует, потом переключается на Render), а не
    // проваливается полностью. Раньше в эти секунды человек просто смотрел на пустой спиннер.
    let stopQuoteRotation=typeof renderWisdomLoader==='function'?renderWisdomLoader(scroll):null;
    try {
      let {data}=await AUTH.getUser();
      currentUser=data.user;
      if(!currentUser){if(stopQuoteRotation)stopQuoteRotation();const copy=getChatsCopy();scroll.innerHTML=`<div class="empty-hint" style="text-align:center;margin-top:30px">🔒 ${copy.locked}<br><button class="btn btn-primary" style="margin-top:12px" onclick="location.href='login.html'">${copy.signIn}</button></div>`;return}
      // profile_unknown: сервер ещё не ответил на запрос профиля (совсем не удалось, а не просто
      // медленно) — это НЕ значит, что пользователю нет 18 лет. Раньше в этом случае
      // ошибочно показывалась "доступно только 18+". Честно ждём ещё, продолжая показывать
      // цитату, и пробуем ещё несколько раз, прежде чем делать какие-либо выводы о профиле.
      if(currentUser.profile_unknown){
        if(!stopQuoteRotation)stopQuoteRotation=typeof renderWisdomLoader==='function'?renderWisdomLoader(scroll):null;
        let resolved=false;
        for(let attempt=0;attempt<5&&!resolved;attempt++){
          await new Promise(r=>setTimeout(r,2500));
          try{
            const retryRes=await AUTH.getUser();
            if(retryRes.data.user&&!retryRes.data.user.profile_unknown){currentUser=retryRes.data.user;data=retryRes.data;resolved=true}
          }catch(e){}
        }
        if(stopQuoteRotation)stopQuoteRotation();
        if(!resolved){
          const copy=getChatsCopy();scroll.innerHTML=`<div class="empty-hint" style="text-align:center;margin-top:36px">${copy.server}<br><button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">${copy.retry}</button></div>`;
          return;
        }
      }
      if(stopQuoteRotation)stopQuoteRotation();
      const birthYear=Number(currentUser.birth_year||0);
      const adult=!!birthYear&&birthYear<=new Date().getFullYear()-18;
      const guest=currentUser.is_temporary===true||String(currentUser.username||'').startsWith('guest_');
      if(guest||!adult){
        const copy=getChatsCopy();
        scroll.innerHTML=`<div class="empty-hint" style="text-align:center;margin-top:36px">🔒 ${copy.locked}<br><button class="btn btn-primary guest-profile-pulse" style="margin-top:16px" onclick="location.href='profile.html?edit=1'">${copy.editProfile}</button></div>`;
        return;
      }

      friendsCacheKey=CacheManager.KEYS.FRIENDS+'_v2_'+currentUser.id;
      requestsCacheKey=CacheManager.KEYS.REQUESTS+'_v2_'+currentUser.id;
      summaryCacheKey='kk_cache_chat_summary_'+currentUser.id;
      friendDetailsCacheKey='kk_cache_friend_details_v1_'+currentUser.id;
      let friends=CacheManager.get(friendsCacheKey),requests=CacheManager.get(requestsCacheKey),summary=CacheManager.get(summaryCacheKey);
      friendDetails=CacheManager.get(friendDetailsCacheKey)||[];
      const hasCached=Array.isArray(friends)&&Array.isArray(requests);
      friends=Array.isArray(friends)?friends:[];requests=Array.isArray(requests)?requests:[];
      chatSummary=summary&&summary.by_peer?summary:{total_unread:0,by_peer:{}};
      if(hasCached)await renderChats(friends,requests,scroll,chatSummary);

      // Always refresh in the background: cache makes opening instant, server keeps it current.
      const [freshFriends,freshRequests,freshSummary,freshDetails,freshOutgoing]=await Promise.allSettled([
        ChatAPI.getFriends(currentUser.id),ChatAPI.getFriendRequests(currentUser.id),ChatAPI.getChatSummary(),ChatAPI.getFriendDetails(),
        (ChatAPI.getOutgoingFriendRequests ? ChatAPI.getOutgoingFriendRequests(currentUser.id) : Promise.resolve([]))
      ]);
      if(freshOutgoing.status==='fulfilled'&&Array.isArray(freshOutgoing.value)){globalOutgoingRequests=freshOutgoing.value;}
      if(freshFriends.status==='fulfilled'&&Array.isArray(freshFriends.value)){friends=freshFriends.value;CacheManager.set(friendsCacheKey,friends)}
      if(freshRequests.status==='fulfilled'&&Array.isArray(freshRequests.value)){requests=freshRequests.value;CacheManager.set(requestsCacheKey,requests)}
      if(freshSummary.status==='fulfilled'&&freshSummary.value){chatSummary=freshSummary.value;CacheManager.set(summaryCacheKey,chatSummary)}
      if(freshDetails.status==='fulfilled'&&Array.isArray(freshDetails.value)){friendDetails=freshDetails.value;CacheManager.set(friendDetailsCacheKey,friendDetails)}
      if(!hasCached&&freshFriends.status==='rejected'&&freshRequests.status==='rejected')throw(freshFriends.reason||freshRequests.reason||new Error('Маълумот бор нашуд'));
      await renderChats(friends,requests,scroll,chatSummary);

      if(unsubscribeFriends)unsubscribeFriends();
      if(unsubscribeRequests)unsubscribeRequests();
      unsubscribeFriends=CacheManager.subscribe(friendsCacheKey,value=>{if(Array.isArray(value))renderChats(value,requests,scroll,chatSummary)});
      unsubscribeRequests=CacheManager.subscribe(requestsCacheKey,value=>{if(Array.isArray(value))renderChats(friends,value,scroll,chatSummary)});
    } catch(e) {
      console.error(e);
      if(!scroll.querySelector('.chat-item'))scroll.innerHTML=`<div class="empty-hint" style="color:var(--red)">Хатогӣ: ${esc(e.message)}</div>`;
    }
  }

  let summaryRefreshTimer = null;
  window.addEventListener('kitobkhona:new-message', () => {
    if (!currentUser || document.hidden) return;
    clearTimeout(summaryRefreshTimer);
    summaryRefreshTimer = setTimeout(() => loadData(), 250);
  });

  let activeReqTab = 'in';
  window.switchReqTab = function(tab) {
    activeReqTab = tab;
    const inPane = document.getElementById('incomingReqList');
    const outPane = document.getElementById('outgoingReqList');
    const inBtn = document.getElementById('tabIncomingBtn');
    const outBtn = document.getElementById('tabOutgoingBtn');
    if (inPane && outPane) {
      inPane.style.display = tab === 'in' ? 'flex' : 'none';
      outPane.style.display = tab === 'out' ? 'flex' : 'none';
      if (inBtn) inBtn.classList.toggle('active', tab === 'in');
      if (outBtn) outBtn.classList.toggle('active', tab === 'out');
    }
  };

  window.cancelOutgoingRequest = async function(reqId) {
    if (!reqId) return;
    try {
      if (typeof ChatAPI !== 'undefined' && ChatAPI.cancelOutgoingFriendRequest) {
        await ChatAPI.cancelOutgoingFriendRequest(reqId);
        showToast('Дархост бекор карда шуд');
        loadData();
      }
    } catch (e) {
      showToast('Хатогӣ: ' + e.message);
    }
  };

  let globalOutgoingRequests = [];

  async function renderChats(friends, requests, scroll, summary = chatSummary) {
    let html = '';

    const incomingReqs = Array.isArray(requests) ? requests : [];
    const outgoingReqs = Array.isArray(globalOutgoingRequests) ? globalOutgoingRequests : [];

    // v130: Блоки нави муосири дархостҳои дӯстӣ (воридотӣ ва содиротӣ) дар боло
    html += `
      <div class="requests-block-v2">
        <div class="req-header-row">
          <div class="t">🤝 Дархостҳои дӯстӣ</div>
          <div class="req-tabs-switch">
            <button type="button" class="req-tab-btn ${activeReqTab==='in'?'active':''}" id="tabIncomingBtn" onclick="switchReqTab('in')">Воридотӣ (${incomingReqs.length})</button>
            <button type="button" class="req-tab-btn ${activeReqTab==='out'?'active':''}" id="tabOutgoingBtn" onclick="switchReqTab('out')">Фиристодашуда (${outgoingReqs.length})</button>
          </div>
        </div>

        <div id="incomingReqList" class="req-list-items" style="display:${activeReqTab==='in'?'flex':'none'}">
    `;

    if (!incomingReqs.length) {
      html += `<div class="req-empty-card">Ҳоло дархости воридотӣ нест</div>`;
    } else {
      for (const req of incomingReqs) {
        const fromId = req.from_user;
        const profile = await getProfileCached(fromId);
        const name = profile?.display_name || profile?.username || 'Китобхон';
        const initials = getInitials(name);
        const cls = getCls(String(fromId).charCodeAt(0) || 0);
        const avatarHtml = profile?.avatar_url ? `<img src="${esc(profile.avatar_url)}" alt="">` : esc(initials);
        html += `
          <div class="req-v2-item" data-request-id="${req.id}" data-from-user="${fromId}">
            <div class="req-v2-user" onclick="location.href='profile.html?user=${fromId}'">
              <div class="req-v2-avatar ${cls}">${avatarHtml}</div>
              <div class="req-v2-meta">
                <div class="req-v2-name">${esc(name)}${profile?.verified ? verifiedBadgeSvg() : ''}</div>
                <div class="req-v2-sub">Дархост барои дӯстӣ</div>
              </div>
            </div>
            <div class="req-v2-actions">
              <button class="btn-req-act accept" onclick="acceptRequest('${fromId}')">Қабул ✓</button>
              <button class="btn-req-act decline" onclick="declineRequest('${req.id}')">Рад ✕</button>
            </div>
          </div>
        `;
      }
    }
    html += `</div>`;

    html += `
        <div id="outgoingReqList" class="req-list-items" style="display:${activeReqTab==='out'?'flex':'none'}">
    `;
    if (!outgoingReqs.length) {
      html += `<div class="req-empty-card">Ҳоло дархости фиристодашуда нест</div>`;
    } else {
      for (const req of outgoingReqs) {
        const toId = req.to_user;
        const profile = req.display_name ? req : await getProfileCached(toId);
        const name = profile?.display_name || profile?.username || 'Китобхон';
        const initials = getInitials(name);
        const cls = getCls(String(toId).charCodeAt(0) || 0);
        const avatarHtml = profile?.avatar_url ? `<img src="${esc(profile.avatar_url)}" alt="">` : esc(initials);
        html += `
          <div class="req-v2-item" data-request-id="${req.id}">
            <div class="req-v2-user" onclick="location.href='profile.html?user=${toId}'">
              <div class="req-v2-avatar ${cls}">${avatarHtml}</div>
              <div class="req-v2-meta">
                <div class="req-v2-name">${esc(name)}${profile?.verified ? verifiedBadgeSvg() : ''}</div>
                <div class="req-v2-sub" style="color:var(--gold);">Дар интизори тасдиқ ⏳</div>
              </div>
            </div>
            <div class="req-v2-actions">
              <button class="btn-req-act cancel" onclick="cancelOutgoingRequest('${req.id}')">Бекор ✕</button>
            </div>
          </div>
        `;
      }
    }
    html += `</div></div>`;

    html += `
      <div class="section-label">
        <div class="t">Чатҳо</div>
        <div class="count" id="friendCount">${friends.length} дӯст</div>
      </div>
      <div class="chat-list" id="chatList">
    `;

    if (friends.length === 0) {
      html += `<div class="empty-hint">Чати фаъол нест. Аз профили дӯст паём фиристед</div>`;
    } else {
      const hiddenPeers = new Set((summary?.hidden_peer_ids || []).map(String));
      const friendIds = [...friends].filter(id => !hiddenPeers.has(String(id))).sort((a, b) => {
        const ta = new Date(summary?.by_peer?.[String(a)]?.created_at || 0).getTime();
        const tb = new Date(summary?.by_peer?.[String(b)]?.created_at || 0).getTime();
        return tb - ta;
      });
      if (!friendIds.length) html += `<div class="empty-hint">Чати фаъол нест. Аз профили дӯст паём фиристед.</div>`;
      for (const id of friendIds) {
        const profile = await getProfileCached(id);
        const name = profile?.display_name || profile?.username || 'Китобхон';
        const initials = getInitials(name);
        const cls = getCls(String(id).charCodeAt(0) || 0);
        const avatarHtml = profile?.avatar_url ? `<img src="${esc(profile.avatar_url)}" alt="">` : esc(initials);
        const lastMessage = summary?.by_peer?.[String(id)] || null;
        const unreadCount = Number(lastMessage?.unread_count || 0);
        const preview = lastMessage
          ? (String(lastMessage.sender_id) === String(currentUser.id)
              ? 'Шумо: ' + lastMessage.text
              : (lastMessage.sender_name || name) + ': ' + lastMessage.text)
          : 'Паёмҳо баъди навиштан';
        html += `
          <div class="chat-item${unreadCount > 0 ? ' has-unread' : ''}" data-chat-user="${id}" onclick="openChat('${id}','${esc(name)}')">
            <div class="avatar-wrap">
              <div class="avatar ${cls}">${avatarHtml}</div>
            </div>
            <div class="chat-mid">
              <div class="chat-top">
                <div class="chat-name" style="display:flex;align-items:center">${esc(name)}${profile?.verified ? verifiedBadgeSvg() : ''}</div>
                <div class="chat-time">${lastMessage ? formatTime(lastMessage.created_at) : ''}</div>
              </div>
              <div class="chat-bottom">
                <div class="chat-msg">${esc(preview)}</div>
                ${unreadCount > 0 ? `<div class="chat-unread-badge">${unreadCount > 99 ? '99+' : unreadCount}</div>` : ''}
              </div>
            </div>
            <button type="button" class="chat-delete-btn" data-delete-chat="${id}" title="Нест кардани чат" aria-label="Нест кардани чат">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;display:block;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        `;
      }
    }
    html += `</div>`;

    scroll.innerHTML = html;

    scroll.querySelectorAll('[data-delete-chat]').forEach(button => {
      button.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        const peerId = button.dataset.deleteChat;
        if (!await showConfirmDialog('Нест кардани чат ва ҳамаи паёмҳо?', 'Тасдиқ', 'Нест кардан', 'Бекор кардан')) return;
        const actionProgress=beginActionProgress('Чат ва паёмакҳо нест карда мешаванд...');
        try {
          const token = localStorage.getItem('kk_token');
          const r = await fetch(KITOB_CONFIG.NEON_API_BASE + '/api/chats/' + encodeURIComponent(peerId), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.error || 'Нест кардани чат муяссар нашуд');
          if (!data.success) throw new Error('Сервер ҳазфро тасдиқ накард');
          chatSummary.by_peer=chatSummary.by_peer||{};delete chatSummary.by_peer[String(peerId)];
          chatSummary.hidden_peer_ids=[...new Set([...(chatSummary.hidden_peer_ids||[]).map(String),String(peerId)])];
          if (typeof CacheManager !== 'undefined' && summaryCacheKey) CacheManager.set(summaryCacheKey,chatSummary);
          clearConversationCache(peerId);
          button.closest('.chat-item')?.remove();
          actionProgress.done('Чат нест карда шуд');
          showToast(`Чат ва ${data.deleted_messages||0} паёмак нест карда шуд`);
        } catch (e) {
          actionProgress.fail(e.message);
          showToast('Хатогӣ: ' + e.message);
        }
      });
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.removeEventListener('input', handleSearch);
    searchInput.addEventListener('input', handleSearch);
  }

  function handleSearch() {
    const q = this.value.trim().toLowerCase();
    const items = document.querySelectorAll('.chat-item');
    items.forEach(item => {
      const name = item.querySelector('.chat-name')?.textContent?.toLowerCase() || '';
      item.style.display = name.includes(q) ? 'flex' : 'none';
    });
  }

  async function acceptRequest(fromUserId) {
    try {
      await ChatAPI.acceptFriendRequestByUser(fromUserId);
      if (typeof CacheManager !== 'undefined') {
        if(friendsCacheKey) CacheManager.invalidateKey(friendsCacheKey);
        if(requestsCacheKey) CacheManager.invalidateKey(requestsCacheKey);
        if(summaryCacheKey) CacheManager.invalidateKey(summaryCacheKey);
      }
      loadData();
    } catch(e) {
      showToast('Хатогӣ: ' + e.message);
    }
  }
  window.acceptRequest = acceptRequest;

  async function declineRequest(requestId) {
    try {
      await ChatAPI.declineFriendRequest(requestId);
      if (typeof CacheManager !== 'undefined' && requestsCacheKey) CacheManager.invalidateKey(requestsCacheKey);
      loadData();
    } catch(e) {
      showToast('Хатогӣ: ' + e.message);
    }
  }
  window.declineRequest = declineRequest;

  function clearConversationCache(peerId) {
    if (!currentUser || !peerId) return;
    const scope = [String(currentUser.id), String(peerId)].sort().join('_');
    if (typeof CacheManager !== 'undefined') CacheManager.invalidateKey('kk_chat_messages_' + scope);
    try {
      localStorage.removeItem('kk_chat_messages_persist_' + scope);
      localStorage.removeItem('kk_chat_messages_persist_' + peerId);
      localStorage.removeItem('kk_cm_kk_chat_messages_' + peerId);
    } catch (e) {}
  }

  function openChat(userId, name) {
    if (currentUser && userId) {
      if (chatSummary && chatSummary.by_peer && chatSummary.by_peer[String(userId)]) {
        const prevUnread = Number(chatSummary.by_peer[String(userId)].unread_count || 0);
        chatSummary.by_peer[String(userId)].unread_count = 0;
        chatSummary.total_unread = Math.max(0, Number(chatSummary.total_unread || 0) - prevUnread);
        if (typeof CacheManager !== 'undefined' && summaryCacheKey) {
          CacheManager.set(summaryCacheKey, chatSummary);
        }
      }
      ChatAPI.markMessagesRead(userId).catch(() => {});
    }
    location.href = `chat.html?to=${encodeURIComponent(userId)}&name=${encodeURIComponent(name)}`;
  }
  window.openChat = openChat;

  window.addEventListener('pageshow', () => {
    if (currentUser) {
      if (typeof CacheManager !== 'undefined' && summaryCacheKey) {
        CacheManager.invalidateKey(summaryCacheKey);
      }
      void loadData();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && currentUser) {
      if (typeof CacheManager !== 'undefined' && summaryCacheKey) {
        CacheManager.invalidateKey(summaryCacheKey);
      }
      void loadData();
    }
  });

  window.addEventListener('focus', () => {
    if (currentUser) {
      if (typeof CacheManager !== 'undefined' && summaryCacheKey) {
        CacheManager.invalidateKey(summaryCacheKey);
      }
      void loadData();
    }
  });
</script>
</body>
</html>
