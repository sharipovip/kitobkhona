<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<title>Чатҳо — Китобхона</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --bg:#0B1A2E;
    --bg-deep:#081323;
    --card:#142841;
    --card-hi:#1A314E;
    --line: rgba(232,222,199,0.08);
    --gold:#D4A94A;
    --gold-soft:#E8C879;
    --gold-dim: rgba(212,169,74,0.16);
    --cream:#F3EBDA;
    --cream-dim:#9FB0C5;
    --cream-faint:#6E7F97;
    --green:#3F9E63;
    --red:#C85850;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html,body{ height:100%; background:#05090f; }
  body{
    font-family:'Noto Sans', sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .chats-container{
    width:100%; max-width:420px;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    border-radius:32px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(232,222,199,0.08), 0 40px 80px rgba(0,0,0,0.55);
    display:flex; flex-direction:column;
    color: var(--cream);
    padding: 20px 22px 26px;
  }

  .header{
    flex:none; padding: 0 0 10px;
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  .title{
    font-size:30px; font-weight:800; letter-spacing:0.2px; color:var(--cream);
  }
  .icon-btn{
    width:40px; height:40px; border-radius:13px;
    background: var(--card);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .ornament{
    height:10px; margin-top:12px;
    background-image: radial-gradient(circle, var(--gold) 1.4px, transparent 1.6px);
    background-size: 14px 10px;
    background-position: center;
    opacity:0.55;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }

  .search{
    margin: 16px 0 4px 0;
    height:46px; border-radius:16px;
    background: var(--card);
    border:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
    padding: 0 16px;
    flex:none;
  }
  .search input{
    background:none; border:none; outline:none;
    color: var(--cream); font-family:'Noto Sans'; font-size:14.5px;
    width:100%;
  }
  .search input::placeholder{ color: var(--cream-faint); }

  .scroll{
    flex:1; overflow-y:auto; padding-bottom: 14px;
  }
  .scroll::-webkit-scrollbar{ display:none; }

  .section-label{
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 0 10px 0;
  }
  .section-label .t{
    font-size:13px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase;
    color: var(--gold-soft);
  }
  .section-label .count{
    font-family:'JetBrains Mono'; font-size:12px; color: var(--cream-faint);
  }

  .requests-row{
    display:flex; gap:12px; overflow-x:auto; padding: 2px 0 6px 0;
  }
  .requests-row::-webkit-scrollbar{ display:none; }

  .req-card{
    flex:none; width:128px;
    background: var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px 12px 12px 12px;
    display:flex; flex-direction:column; align-items:center;
    gap:8px;
  }
  .req-avatar{
    width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:17px; color: var(--bg-deep);
  }
  .req-name{ font-size:13px; font-weight:600; color:var(--cream); text-align:center; }
  .req-actions{ display:flex; gap:6px; width:100%; }
  .btn-mini{
    flex:1; height:28px; border-radius:9px; border:none;
    font-family:'Noto Sans'; font-size:11.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .btn-mini.accept{ background: var(--gold); color:#1c1404; }
  .btn-mini.decline{ background: rgba(232,222,199,0.07); color: var(--cream-dim); border:1px solid var(--line); }

  .divider-soft{
    height:1px; background: var(--line); margin: 18px 0 4px 0;
  }

  .chat-list{ padding: 6px 0 0 0; }

  .chat-item{
    display:flex; align-items:center; gap:13px;
    padding: 12px 4px;
    margin: 4px 0;
    border-radius:18px;
    cursor:pointer;
  }
  .chat-item:active{ background: var(--card); }

  .avatar-wrap{ position:relative; flex:none; }
  .avatar{
    width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:18px; color:#1c1404;
  }
  .avatar.ring{
    box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 4px var(--gold);
  }
  .online-dot{
    position:absolute; right:1px; bottom:1px;
    width:13px; height:13px; border-radius:50%;
    background: var(--green);
    border:2.5px solid var(--bg);
  }

  .chat-mid{ flex:1; min-width:0; }
  .chat-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .chat-name{ font-size:15.5px; font-weight:700; color:var(--cream); }
  .chat-time{
    font-family:'JetBrains Mono'; font-size:11px; color: var(--cream-faint);
    flex:none;
  }
  .chat-time.unread{ color: var(--gold-soft); font-weight:600; }

  .chat-bottom{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:3px; }
  .chat-msg{
    font-size:13.5px; color: var(--cream-dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chat-msg.unread-text{ color: var(--cream); font-weight:500; }
  .chat-msg .you{ color: var(--cream-faint); }

  .badge{
    flex:none;
    min-width:20px; height:20px; border-radius:10px;
    background: var(--gold);
    color:#1c1404; font-family:'JetBrains Mono'; font-weight:700; font-size:11px;
    display:flex; align-items:center; justify-content:center;
    padding:0 6px;
  }

  .empty-hint{
    margin: 8px 0 0 0;
    padding: 14px 16px;
    border-radius:16px;
    background: var(--gold-dim);
    border: 1px solid rgba(212,169,74,0.28);
    font-size:12.5px; color: var(--gold-soft); line-height:1.5;
  }

  .btn{
    padding:10px 18px;
    border-radius:14px;
    font-family:'Noto Sans';
    font-size:14px;
    font-weight:700;
    border:none;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:linear-gradient(180deg, #E8C778, var(--gold-deep)); color:#1A1206; box-shadow:0 10px 22px -8px rgba(220,181,94,0.55);}
  .btn-outline{background:transparent; color:var(--cream); border:1.4px solid rgba(220,181,94,0.45);}

  .c1{ background: linear-gradient(135deg,#E8C879,#C9933A); }
  .c2{ background: linear-gradient(135deg,#7FB8A0,#3F9E63); }
  .c3{ background: linear-gradient(135deg,#E0958C,#C85850); }
  .c4{ background: linear-gradient(135deg,#9AB6D9,#4E7AA8); }
  .c5{ background: linear-gradient(135deg,#D4A94A,#9C7327); }
  .c6{ background: linear-gradient(135deg,#B79AD9,#7551A8); }

  .loading-spinner{
    display:flex; align-items:center; justify-content:center;
    padding:20px 0;
    color:var(--cream-faint);
    gap:10px;
  }
  .spinner{width:20px; height:20px; border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .bottom-nav{
    flex:none;
    display:flex; justify-content:space-around; align-items:center;
    padding: 14px 0 0;
    border-top:1px solid var(--line);
    margin-top:12px;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--cream-faint);
    font-size:11px; font-weight:600;
    cursor:pointer;
  }
  .nav-item.active{ color: var(--gold-soft); }
  .nav-icon{ font-size:18px; }
</style>
</head>
<body>

<div class="chats-container">
  <div class="header">
    <div class="header-row">
      <div class="title">Чатҳо</div>
      <div class="icon-btn" onclick="location.href='profile.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4A94A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      </div>
    </div>
    <div class="ornament"></div>
  </div>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7F97" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input type="text" id="searchInput" placeholder="Ҷустуҷӯи дӯстон ё чатҳо">
  </div>

  <div class="scroll" id="chatsScroll">
    <!-- контент будет загружаться скриптом -->
    <div class="loading-spinner"><div class="spinner"></div> Боргирӣ...</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🏠</span><span>Хона</span></div>
    <div class="nav-item" onclick="location.href='kitobho.html'"><span class="nav-icon">📚</span><span>Китобҳо</span></div>
    <div class="nav-item active" onclick="location.href='chats.html'"><span class="nav-icon">💬</span><span>Чатҳо</span></div>
    <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span><span>Профил</span></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const clsList = ['c1','c2','c3','c4','c5','c6'];
  const getCls = i => clsList[Math.abs(i) % clsList.length];

  let currentUser = null;
  let friendsCache = [];

  function getInitials(name) {
    if(!name) return 'К';
    const parts = name.trim().split(/\s+/);
    return parts.slice(0,2).map(p => p[0] || '').join('').toUpperCase() || 'К';
  }

  function formatTime(dateStr) {
    if(!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = (now - d) / 1000;
    if(diff < 60) return 'ҳозир';
    if(diff < 3600) return Math.floor(diff/60) + ' дақ';
    if(diff < 86400) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    if(diff < 604800) return ['Якш','Душ','Сеш','Чор','Панҷ','Ҷум','Шанб'][d.getDay()] || '';
    return d.getDate() + ' ' + ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
  }

  async function loadData() {
    const scroll = document.getElementById('chatsScroll');

    try {
      const { data } = await AUTH.getUser();
      currentUser = data.user;
      if(!currentUser) {
        scroll.innerHTML = `
          <div class="empty-hint" style="text-align:center;margin-top:30px;">
            <p>Барои дидани чатҳо ворид шавед</p>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="location.href='login.html'">Ворид шудан</button>
          </div>
        `;
        return;
      }

      // Загрузка друзей
      let friends = [];
      try {
        friends = await ChatAPI.getFriends(currentUser.id);
      } catch(e) { console.warn('Friends load error', e); }

      // Загрузка заявок
      let requests = [];
      try {
        requests = await ChatAPI.getFriendRequests(currentUser.id);
      } catch(e) { console.warn('Requests load error', e); }

      // Получение профилей друзей (из Neon через AUTH)
      const friendProfiles = {};
      await Promise.all(friends.map(async (id) => {
        try {
          const p = await AUTH.getProfileFromRailway(id);
          if(p) friendProfiles[id] = p;
        } catch(e) {}
      }));

      // Сборка данных для отображения
      const friendItems = friends.map(id => {
        const p = friendProfiles[id] || {};
        const name = p.display_name || p.full_name || 'Китобхон';
        const avatarEmoji = p.avatar_emoji || '👤';
        return {
          id,
          name,
          avatarEmoji,
          cls: getCls(id.charCodeAt(0) || 0),
          online: Math.random() > 0.6, // демо, позже через Socket.IO
          lastMsg: 'Паёмҳо баъди навиштан',
          time: ''
        };
      });
      friendsCache = friendItems;

      // Формируем HTML
      let html = '';

      // Заявки
      if(requests.length) {
        html += `
          <div class="section-label">
            <div class="t">Дархостҳо</div>
            <div class="count">${requests.length} нав</div>
          </div>
          <div class="requests-row">
        `;
        for(const req of requests) {
          const fromId = req.from_user;
          let profile = null;
          try { profile = await AUTH.getProfileFromRailway(fromId); } catch(e) {}
          const name = profile?.display_name || profile?.full_name || 'Китобхон';
          const initials = getInitials(name);
          const cls = getCls(fromId.charCodeAt(0) || 0);
          html += `
            <div class="req-card" data-request-id="${req.id}">
              <div class="req-avatar ${cls}">${esc(initials)}</div>
              <div class="req-name">${esc(name)}</div>
              <div class="req-actions">
                <button class="btn-mini accept" onclick="acceptRequest('${req.id}')">Қабул</button>
                <button class="btn-mini decline" onclick="declineRequest('${req.id}')">Рад</button>
              </div>
            </div>
          `;
        }
        html += `</div><div class="divider-soft"></div>`;
      }

      // Друзья
      html += `
        <div class="section-label">
          <div class="t">Дӯстон</div>
          <div class="count" id="friendCount">${friendItems.length} фаъол</div>
        </div>
        <div class="chat-list" id="chatList">
      `;

      if(friendItems.length === 0) {
        html += `<div class="empty-hint">Барои оғози чат аввал дӯст ҷӯед</div>`;
      } else {
        for(const f of friendItems) {
          html += `
            <div class="chat-item" onclick="openChat('${f.id}','${esc(f.name)}')">
              <div class="avatar-wrap">
                <div class="avatar ${f.cls} ${f.online ? 'ring' : ''}">${esc(f.avatarEmoji)}</div>
                ${f.online ? '<div class="online-dot"></div>' : ''}
              </div>
              <div class="chat-mid">
                <div class="chat-top">
                  <div class="chat-name">${esc(f.name)}</div>
                  <div class="chat-time">${f.time}</div>
                </div>
                <div class="chat-bottom">
                  <div class="chat-msg">${esc(f.lastMsg)}</div>
                </div>
              </div>
            </div>
          `;
        }
      }
      html += `</div>`;

      // Поиск
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function() {
        const q = this.value.trim().toLowerCase();
        const items = document.querySelectorAll('.chat-item');
        items.forEach(item => {
          const name = item.querySelector('.chat-name')?.textContent?.toLowerCase() || '';
          item.style.display = name.includes(q) ? 'flex' : 'none';
        });
      });

      scroll.innerHTML = html;

    } catch(e) {
      console.error(e);
      scroll.innerHTML = `<div class="empty-hint" style="color:var(--red);">Хатогӣ: ${esc(e.message)}</div>`;
    }
  }

  // Принять заявку
  async function acceptRequest(requestId) {
    try {
      await ChatAPI.acceptFriendRequest(requestId);
      loadData();
    } catch(e) {
      alert('Хатогӣ: ' + e.message);
    }
  }
  window.acceptRequest = acceptRequest;

  // Отклонить заявку
  async function declineRequest(requestId) {
    try {
      await ChatAPI.declineFriendRequest(requestId);
      loadData();
    } catch(e) {
      alert('Хатогӣ: ' + e.message);
    }
  }
  window.declineRequest = declineRequest;

  // Открыть чат
  function openChat(userId, name) {
    location.href = `chat.html?to=${encodeURIComponent(userId)}&name=${encodeURIComponent(name)}`;
  }
  window.openChat = openChat;

  // Инициализация
  loadData();
</script>
</body>
</html>
