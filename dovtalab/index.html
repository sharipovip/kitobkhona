<style>
:root{color-scheme:dark;--bg:#0d1b2a;--card:#1a2d44;--text:#f0ead6;--muted:#a8b8cc;--gold:#e8c96d;--line:#304054}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}body{display:grid;place-items:center;padding:20px}.box{width:min(480px,100%);padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--card);text-align:center}.icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:#ffffff0b;color:var(--gold);font-size:36px}h1{margin:0 0 10px;font-size:25px}p{margin:0;color:var(--muted);font-size:13px;line-height:1.75}.warn{margin:18px 0;padding:12px;border:1px dashed #e8c96d66;border-radius:13px;color:var(--text);font-size:12px;line-height:1.65}.actions{display:grid;gap:9px;margin-top:18px}a{display:grid;place-items:center;min-height:44px;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px}.primary{background:var(--gold);color:#172016}.secondary{border:1px solid var(--line);color:var(--text);background:#ffffff08}

<body><main class="box"><div class="icon">◇</div><h1>Довталаб</h1><p>Ин бахш дар ин нусха пурра бор карда нашудааст.</p><div class="warn">Барои кори Довталаб папкаи аслии <b>dovtalab</b>-ро аз лоиҳаи пешина ба ҳамин ҷой нусхабардорӣ кунед. Файлҳои холии сохториро бо файлҳои аслӣ иваз намоед.</div><div class="actions"><a class="primary" href="../index.html">Ба саҳифаи асосӣ</a><a class="secondary" href="../MISSING_USER_ASSETS_RU.md">Рӯйхати файлҳои лозим</a></div></main></body></html>
