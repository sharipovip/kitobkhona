<script>
/* Запасной мост: если в приложении AndroidBridge не создался (ошибка в JS-шиме старой сборки),
   подключаемся к нативному каналу KitobkhonaNative напрямую — те же методы, тот же формат. */
(function () {
  try {
    if (!window.KitobkhonaNative || typeof window.KitobkhonaNative.postMessage !== 'function') return;
    var bridge = window.AndroidBridge || {};
    var map = { saveBase64File: 'saveFile', saveFile: 'saveFile', saveSymbolFile: 'saveFile', openFile: 'openFile', shareFile: 'shareFile',
      shareText: 'shareText', shareTextWithWhatsAppChooser: 'shareTextWithWhatsAppChooser', shareImageWithText: 'shareImageWithText',
      shareRemoteImage: 'shareRemoteImage', shareRemoteImages: 'shareRemoteImages', saveUserId: 'saveUserId', saveAuthToken: 'saveAuthToken',
      openExternalUrl: 'openExternalUrl', openOfficialSite: 'openOfficialSite' };
    Object.keys(map).forEach(function (name) {
      if (typeof bridge[name] === 'function') return;
      bridge[name] = function () {
        try { window.KitobkhonaNative.postMessage(JSON.stringify({ method: map[name], args: Array.prototype.slice.call(arguments) })); }
        catch (e) { console.warn('Native feature is unavailable', e); }
      };
    });
    window.AndroidBridge = bridge;
  } catch (e) {}
})();
</script>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = './assets/libs/pdf.worker.min.js';

  const $ = id => document.getElementById(id);
  const qs = new URL(location.href).searchParams;
  const safeDecode = s => { try { return decodeURIComponent(s) } catch(e) { return s } };

  let url = qs.get('url') || qs.get('open') || '';
  let name = qs.get('name') || 'Китоб';
  let cover = qs.get('cover') || '';
  let pdf = null, page = 1, pages = 0, rendering = false, bars = true, zoom = 1;

  url = canonicalBookUrl(safeDecode(url));
  name = safeDecode(name);
  cover = safeDecode(cover);
  if (/^data:/i.test(String(cover).trim())) cover = '';
  const titleEl=$('bookTitle');if(titleEl)titleEl.textContent=name;

  function getBookId() {
    try {
      const u = new URL(url, location.href);
      const path = u.pathname.split('/').filter(Boolean);
      // v127: файлҳои худи барнома (tavsiya/pdf/*.pdf ва ғ.) — ID = роҳи нисбӣ аз решаи барнома,
      // то ки хониши онҳо мисли китобҳои каталог (рейтинг, омор, 50 соат) ҳисоб шавад.
      if (u.origin === location.origin) {
        const base = location.pathname.replace(/[^/]*$/, '');
        let rel = u.pathname.startsWith(base) ? u.pathname.slice(base.length) : u.pathname.replace(/^\/+/, '');
        try { rel = decodeURIComponent(rel); } catch (e2) {}
        return (rel.replace(/^books\//, '') || name || 'Китоб').slice(0, 300);
      }
      const contentPath = path.slice(3).join('/');
      let clean = contentPath.replace(/^books\//, '');
      if (!clean) {
        const fileName = path.slice(3).pop() || path.pop() || '';
        return fileName || name;
      }
      return clean;
    } catch(e) {
      return name;
    }
  }

  let sessionInterval=null,sessionStarted=false,segmentStartedAt=0;
  const LOCAL_CHECKPOINT_MS=10*60*1000;

  function readingPayload(duration){
    return {book_id:getBookId(),book_title:name,duration:Math.max(0,Math.round(duration||0)),pages_read:Math.max(0,Number(page)||0),total_pages:Math.max(0,Number(pages)||0),status:(pages>0&&page/pages>=.95)?'completed':'paused'};
  }
  function checkpointReading(force=false){
    if(!sessionStarted||!segmentStartedAt)return;
    const now=Date.now(),duration=Math.floor((now-segmentStartedAt)/1000);
    if(duration<=0||(!force&&now-segmentStartedAt<LOCAL_CHECKPOINT_MS))return;
    if(window.KKReadingSyncV2)KKReadingSyncV2.add(readingPayload(duration));
    segmentStartedAt=now;
  }
  function startReadingSession(){
    if(sessionStarted)return;sessionStarted=true;segmentStartedAt=Date.now();
    if(window.KKReadingSyncV2)KKReadingSyncV2.active();
    sessionInterval=setInterval(()=>{if(document.hidden)return;if(window.KKReadingSyncV2)KKReadingSyncV2.active();checkpointReading(false)},30*1000);
  }
  function stopReadingSession(){
    if(!sessionStarted)return;checkpointReading(true);sessionStarted=false;segmentStartedAt=0;
    if(sessionInterval)clearInterval(sessionInterval);sessionInterval=null;
    if(window.KKReadingSyncV2)KKReadingSyncV2.closed();
  }
  window.addEventListener('load',()=>{setTimeout(startReadingSession,1000)});
  window.addEventListener('online',()=>window.KKReadingSyncV2?.flush());
  window.addEventListener('beforeunload',stopReadingSession);
  window.addEventListener('pagehide',stopReadingSession);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopReadingSession();else startReadingSession()});
  window.goBack=function(){stopReadingSession();if(history.length>1)history.back();else location.href='kitobho.html'};

  let currentReaction = null;
  let currentRating = 0;

  async function loadReactions() {
    const bookId = getBookId();
    if (!bookId) return;

    // 1. Мгновенный показ из локального кэша (0 мс, 0 запросов к серверу)
    try {
      const cached = JSON.parse(localStorage.getItem('kk_stats_' + bookId) || 'null');
      if (cached) {
        if ($('likeCount')) $('likeCount').textContent = cached.likes || 0;
        if ($('loveCount')) $('loveCount').textContent = cached.loves || 0;
        if ($('dislikeCount')) $('dislikeCount').textContent = cached.dislikes || 0;
        if (cached.myReaction) {
          currentReaction = cached.myReaction;
          document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.reaction === cached.myReaction);
          });
        }
        if (cached.myRating) {
          currentRating = cached.myRating;
          updateStarsUI(cached.myRating);
        }
      }
    } catch(e) {}

    // 2. Фоновый запрос к Edge KV (кэшируется на границе Cloudflare, не нагружает базу Neon)
    try {
      const token = localStorage.getItem('kk_token');
      const reqs = [
        fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-stats/' + encodeURIComponent(bookId))
      ];
      if (token) {
        reqs.push(
          fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions/' + encodeURIComponent(bookId), {
            headers: { 'Authorization': 'Bearer ' + token }
          })
        );
      }

      const results = await Promise.allSettled(reqs);
      const statsRes = results[0];
      const userRes = results[1];

      let likes = parseInt($('likeCount')?.textContent) || 0;
      let loves = parseInt($('loveCount')?.textContent) || 0;
      let dislikes = parseInt($('dislikeCount')?.textContent) || 0;

      if (statsRes && statsRes.status === 'fulfilled' && statsRes.value.ok) {
        const stats = await statsRes.value.json();
        likes = stats.likes || 0;
        loves = stats.loves || 0;
        dislikes = stats.dislikes || 0;
        if ($('likeCount')) $('likeCount').textContent = likes;
        if ($('loveCount')) $('loveCount').textContent = loves;
        if ($('dislikeCount')) $('dislikeCount').textContent = dislikes;
      }

      if (userRes && userRes.status === 'fulfilled' && userRes.value.ok) {
        const data = await userRes.value.json();
        if (data.reaction) {
          currentReaction = data.reaction;
          document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.reaction === data.reaction);
          });
        }
        if (data.rating) {
          currentRating = data.rating;
          updateStarsUI(data.rating);
        }
      }

      // Сохраняем актуальные данные в локальный кэш
      try {
        localStorage.setItem('kk_stats_' + bookId, JSON.stringify({
          likes, loves, dislikes,
          myReaction: currentReaction,
          myRating: currentRating,
          ts: Date.now()
        }));
      } catch(e) {}

    } catch(e) {
      console.warn('Failed to load reactions:', e);
    }
  }

  async function saveReaction(reaction) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('👤 Аввал ба профил ворид шавед', 3200); return; }
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_id: bookId, reaction })
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const stats = await resp.json();
      $('likeCount').textContent = stats.likes || 0;
      $('loveCount').textContent = stats.loves || 0;
      $('dislikeCount').textContent = stats.dislikes || 0;
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.reaction === reaction);
      });
      currentReaction = reaction;
      try {
        localStorage.setItem('kk_stats_' + bookId, JSON.stringify({
          likes: parseInt($('likeCount')?.textContent) || 0,
          loves: parseInt($('loveCount')?.textContent) || 0,
          dislikes: parseInt($('dislikeCount')?.textContent) || 0,
          myReaction: currentReaction,
          myRating: currentRating,
          ts: Date.now()
        }));
      } catch(e) {}
      try { window.invalidateBookStats && window.invalidateBookStats(getBookId()); } catch(e) {}
      toast('Реакция сабт шуд');
    } catch(e) {
      console.error('Save reaction error:', e);
      toast('Хатогӣ: ' + e.message);
    }
  }

  async function saveRating(rating) {
    const token = localStorage.getItem('kk_token');
    if (!token) { toast('👤 Аввал ба профил ворид шавед', 3200); return; }
    const bookId = getBookId();
    if (!bookId) return;
    try {
      const resp = await fetch(KITOB_CONFIG.EDGE_API_BASE + '/api/book-reactions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ book_id: bookId, rating })
      });
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      currentRating = rating;
      updateStarsUI(rating);
      try {
        localStorage.setItem('kk_stats_' + bookId, JSON.stringify({
          likes: parseInt($('likeCount')?.textContent) || 0,
          loves: parseInt($('loveCount')?.textContent) || 0,
          dislikes: parseInt($('dislikeCount')?.textContent) || 0,
          myReaction: currentReaction,
          myRating: currentRating,
          ts: Date.now()
        }));
      } catch(e) {}
      try { window.invalidateBookStats && window.invalidateBookStats(getBookId()); } catch(e) {}
      toast('Баҳо сабт шуд (⭐ ' + rating + '/10)');
    } catch(e) {
      console.error('Save rating error:', e);
      toast('Хатогӣ: ' + e.message);
    }
  }

  function updateStarsUI(rating) {
    document.querySelectorAll('.rating-stars .star').forEach(el => {
      const val = parseInt(el.dataset.rating);
      el.classList.toggle('on', val <= rating);
      el.textContent = val <= rating ? '★' : '☆';
    });
  }

  document.querySelectorAll('.reaction-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const reaction = this.dataset.reaction;
      if (this.classList.contains('active')) {
        saveReaction(null);
        this.classList.remove('active');
        currentReaction = null;
      } else {
        saveReaction(reaction);
      }
    });
  });

  document.querySelectorAll('.rating-stars .star').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const rating = parseInt(this.dataset.rating);
      if (currentRating === rating) {
        saveRating(0);
      } else {
        saveRating(rating);
      }
    });
  });

  function toast(msg, d = 2200) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), d);
  }

  function setLoadProgress(p) {
    p = Math.max(0, Math.min(100, Math.round(p || 0)));
    $('progressRing')?.style.setProperty('--p', p);
    if ($('loadPct')) $('loadPct').textContent = p + '%';
  }

  function cdnPdfUrl(u) {
    try {
      const x = new URL(u);
      if (x.hostname === 'raw.githubusercontent.com') {
        const parts = x.pathname.split('/').filter(Boolean);
        if (parts.length >= 4) {
          const owner = parts[0], repo = parts[1], branch = parts[2];
          const pathParts = parts.slice(3).map(p => encodeURIComponent(decodeURIComponent(p)));
          const path = pathParts.join('/');
          return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}`;
        }
      }
      return u;
    } catch(e) { return u; }
  }

  function cachedMap() {
    try { return JSON.parse(localStorage.getItem('kk_cached_books') || '{}') } catch(e) { return {} }
  }
  function saveCachedMeta(pdfUrl, bytes = 0) {
    try {
      const m = cachedMap();
      const canonical = canonicalBookUrl(pdfUrl || url);
      const oldKey = Object.keys(m).find(k => canonicalBookUrl(m[k]?.url || k) === canonical);
      const previous = oldKey ? m[oldKey] : {};
      const meta = { ...previous, url: canonical, name, cover, ts: Date.now(), size: bytes || previous.size || 0 };
      m[canonical] = meta;
      localStorage.setItem('kk_cached_books', JSON.stringify(m));
    } catch(e) {}

  async function openPdfDocumentWithTimeout(data) {

  async function fetchBookAnyCandidate() {

      } catch (e) {}

    if (cands.length === 1) return fetchBookArrayBuffer(cands[0]);

    // первый кусок — но оно могло качать медленно, и вся книга шла через него
    // (проблема вернулась). Теперь короткий ЗАМЕР: ~1.2с КАЖДОЕ зеркало реально
    // качает (до 384КБ), затем продолжает только САМОЕ БЫСТРОЕ, остальные

      const finish = (buf, i) => {
        if (done) return; done = true; cleanup(); abortOthers(i);

          () => giveUp()

      };

        if (done || decided) return; decided = true;
        const fullIdx = st.findIndex(s => s.full);
        if (fullIdx >= 0) { finish(st[fullIdx].full, fullIdx); return; }

          return;
        }
        let best = -1, bestSpeed = 0;
        st.forEach((s, i) => { if (!s.err && s.speed > bestSpeed) { bestSpeed = s.speed; best = i; } });
        if (best < 0) { giveUp(st.map(s => s.err).filter(Boolean)[0]); return; }

  function decodeBookText(buf) {

      try { text = new TextDecoder('windows-1251').decode(buf); } catch (e) { text = new TextDecoder('utf-8').decode(buf); }

  // ---------- FB2 (XML) ----------
  function renderFb2Content(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('FB2-файл хатогии дорад');
    const ti = doc.querySelector('description > title-info');
    const bookTitle = (ti && ti.querySelector('book-title') ? ti.querySelector('book-title').textContent.trim() : '') || name;
    const authors = Array.from(ti ? ti.querySelectorAll('author') : []).map(a =>
      [a.querySelector('first-name') && a.querySelector('first-name').textContent,
       a.querySelector('last-name') && a.querySelector('last-name').textContent].filter(Boolean).join(' ')).filter(Boolean).join(', ');
    const binaries = {};
    doc.querySelectorAll('binary').forEach(b => {
      binaries['#' + (b.getAttribute('id') || '')] = 'data:' + (b.getAttribute('content-type') || 'image/jpeg') + ';base64,' + (b.textContent || '').replace(/\s+/g, '');
    });
    const inline = node => {
      let s = '';
      node.childNodes.forEach(ch => {
        if (ch.nodeType === 3) s += escapeHtml(ch.nodeValue);
        else if (ch.nodeType === 1) {
          const t = ch.nodeName.replace(/^.*:/, '').toLowerCase();
          if (t === 'emphasis' || t === 'i' || t === 'italic') s += '<em>' + inline(ch) + '</em>';
          else if (t === 'strong' || t === 'b') s += '<strong>' + inline(ch) + '</strong>';
          else if (t === 'strikethrough') s += '<s>' + inline(ch) + '</s>';
          else if (t === 'sub') s += '<sub>' + inline(ch) + '</sub>';
          else if (t === 'sup') s += '<sup>' + inline(ch) + '</sup>';
          else if (t === 'code') s += '<code>' + inline(ch) + '</code>';
          else s += inline(ch);
        }
      });
      return s;
    };
    const blocks = (parent, out, depth) => {
      Array.from(parent.childNodes).forEach(node => {
        if (node.nodeType === 3) { const t = node.nodeValue.trim(); if (t) out.push('<p>' + escapeHtml(t) + '</p>'); return; }
        if (node.nodeType !== 1) return;
        const t = node.nodeName.replace(/^.*:/, '').toLowerCase();
        if (t === 'section') { out.push('<section class="bsec">'); blocks(node, out, depth + 1); out.push('</section>'); }
        else if (t === 'title') { const lv = Math.min(4, Math.max(2, depth + 1)); out.push('<h' + lv + ' class="bhead">' + inline(node) + '</h' + lv + '>'); }
        else if (t === 'subtitle') out.push('<h5 class="bsub">' + inline(node) + '</h5>');
        else if (t === 'p') out.push('<p>' + inline(node) + '</p>');
        else if (t === 'empty-line') out.push('<div class="bspacer"></div>');
        else if (t === 'image') {
          const href = node.getAttribute('l:href') || node.getAttributeNS('http://www.w3.org/1999/xlink', 'href') || '';
          const src = binaries[href];
          if (src) out.push('<img class="bimg" loading="lazy" src="' + src + '" alt="">');
        }
        else if (t === 'poem') { out.push('<div class="bpoem">'); blocks(node, out, depth); out.push('</div>'); }
        else if (t === 'stanza') { out.push('<div class="bstanza">'); blocks(node, out, depth); out.push('</div>'); }
        else if (t === 'v') out.push('<div class="bv">' + inline(node) + '</div>');
        else if (t === 'text-author') out.push('<div class="bta">— ' + inline(node) + '</div>');
        else if (t === 'cite') { out.push('<blockquote class="bcite">'); blocks(node, out, depth); out.push('</blockquote>'); }
        else if (t === 'epigraph') { out.push('<div class="bepi">'); blocks(node, out, depth); out.push('</div>'); }
        else blocks(node, out, depth);
      });
    };
    const out = [];
    Array.from(doc.querySelectorAll('body')).forEach((b, i) => { if (i > 0) out.push('<hr class="bhr">'); blocks(b, out, 0); });
    if (!out.length) throw new Error('FB2: матн ёфт нашуд');
    return { title: bookTitle, parts: out };
  }

  // ---------- DOC (word 97-2003): намоиши дохилӣ (docx/txt нусха) ё пурсиш ----------
  // Робот (build.py v99) дар repo барои ҳар .doc нусхаи .docx (ягон формат)
  // ё .txt (матн) мегузорад. Ридер онро меҷӯяд → китоб ДОХИЛИ барнома намоиш
  // мешавад. Агар нусха набошад — савол медиҳад пеш аз боркунӣ.
  function docAltCandidates() {
    const path = String(url).split('?')[0];
    // папку держим ПЕРЕКОДИРОВАННОЙ (ASCII): URLSearchParams даёт раскодированную
    // кириллицу, а заголовки Cache API принимают только ISO-8859-1.
    // Кодируем ТОЛЬКО сегменты пути (не трогаем scheme/host).
    let encFolder = '';
    try {
      const x = new URL(path);
      const dir = x.pathname.slice(0, x.pathname.lastIndexOf('/') + 1);
      const encDir = dir.split('/')
        .map(seg => { try { return encodeURIComponent(decodeURIComponent(seg)); } catch (e) { return seg; } })
        .join('/');
      encFolder = x.origin + encDir;
    } catch (e) {
      encFolder = path.slice(0, path.lastIndexOf('/') + 1);
    }
    const stem = decodeURIComponent(path.slice(path.lastIndexOf('/') + 1).replace(/\.doc$/i, ''));
    let pretty = stem.replace(/^\d+[_\-.\s]*/, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    const names = [stem];
    if (pretty && pretty !== stem && pretty.length >= 2) names.push(pretty);
    const alts = [];
    names.forEach(n => { alts.push({ url: encFolder + encodeURIComponent(n + '.docx'), ext: 'docx' }); alts.push({ url: encFolder + encodeURIComponent(n + '.txt'), ext: 'txt' }); });
    return alts;
  }

  function probeUrl(u, ms) {
    return new Promise(res => {
      const ctrl = new AbortController();
      const t = setTimeout(() => { try { ctrl.abort(); } catch (e) {} res(null); }, ms || 8000);
      fetch(u, { method: 'HEAD', cache: 'no-store', signal: ctrl.signal })
        .then(r => { clearTimeout(t); res(r.ok ? u : null); })
        .catch(() => { clearTimeout(t); res(null); });
    });
  }

    box.appendChild(v);
    const cap = document.createElement('div');
    cap.className = 'bhead0';
    cap.innerHTML = '<div class="bhead0t">' + escapeHtml(name || 'Видео') + '</div><div class="bhead0s">Формат: ' + ext.toUpperCase() + '</div>';
    box.appendChild(cap);
    slot.appendChild(box);
  }
  async function openBookFormat(fmt) {
    try {
      // DOC: пеш аз ҳама нусхаи намоишӣ (.docx/.txt аз робот) меҷӯем —
      // худи .doc-ро ПЕШ аз ҷавоби корбар НАМЕКАШЕМ (v99).
      if (fmt === 'doc') return await openDocFormat();
      // Библиотекаҳои формат ҲАМЗАМОНА бо боркунии китоб сар мешаванд (тезтар)
      let libsPromise = null;
      if (fmt === 'epub') {
        libsPromise = loadScriptOnce('assets/libs/jszip.min.js')
          .then(() => loadScriptOnce('assets/libs/epub.min.js'));
      } else if (fmt === 'docx') {
        libsPromise = loadScriptOnce('assets/libs/mammoth.browser.min.js');
      }
      setLoadText('Боркунии китоб...');
      const buf = await fetchBookAnyCandidate();
      if (fmt === 'epub') { if (libsPromise) await libsPromise; return await renderEpub(buf); }
      if (fmt === 'fb2') { setLoadText('Коркардри FB2...'); const r = renderFb2Content(decodeBookText(buf)); return mountScrollReader([bookHeaderHtml(r.title, 'FB2')].concat(r.parts)); }
      if (fmt === 'docx') { if (libsPromise) await libsPromise; setLoadText('Коркардри DOCX...'); const parts = await renderDocxContent(buf); return mountScrollReader([bookHeaderHtml(name, 'DOCX')].concat(parts)); }
      if (fmt === 'txt') { const t = escapeHtml(decodeBookText(buf)); const lines = t.split('\n'); const parts = [bookHeaderHtml(name, 'TXT') + '<pre class="btxt">']; for (let li = 0; li < lines.length; li++) parts.push(lines[li] + (li < lines.length - 1 ? '\n' : '')); parts.push('</pre>'); return mountScrollReader(parts); }
      if (fmt === 'mp4' || fmt === 'm4v' || fmt === 'webm') return renderVideo(buf, fmt);
      openPdf();
    } catch (e) {
      $('loading').classList.remove('on');
      setLoadText('');
      $('currentSlot').innerHTML = '<div class="error">Хатогӣ ҳангоми кушодани китоб<br>' + String(e.message || e) + '</div>';
    }
  }

  const BOOK_FMT = bookFormatOf(url);
  if (!BOOK_FMT || BOOK_FMT === 'pdf') openPdf();
  else openBookFormat(BOOK_FMT);
  void loadReactions();
</script>

<script>
document.addEventListener('DOMContentLoaded', function initReaderDesktopAndAliya() {
  // 1. Keyboard Navigation (ПК)
  window.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      turnPage(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
      e.preventDefault();
      turnPage(-1);
    } else if (e.key === 'Home') {
      e.preventDefault();
      if (typeof page !== 'undefined') renderPage(1, -1);
    } else if (e.key === 'End') {
      e.preventDefault();
      if (typeof pages !== 'undefined' && pages) renderPage(pages, 1);
    } else if (e.key === 'f' || e.key === 'F') {
      if (typeof toggleReaderFullscreen === 'function') toggleReaderFullscreen();
    } else if (e.key === 'Escape') {
      document.querySelectorAll('.panel.open').forEach(function (el) { el.classList.remove('open'); });
    }
  });

  // 2. Mouse Wheel Navigation (ПК)
  var wheelTimer = null;
  window.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) < 30) return;
    if (e.target && e.target.closest && e.target.closest('.panel, .at-sheet, .at-dlg-bg')) return; // v159: прокрутка панелей не листает книгу
    if (wheelTimer) return;
    wheelTimer = setTimeout(function () { wheelTimer = null; }, 320);
    turnPage(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  // 3. v159: Алия — саҳифаи алоҳида (aliya/reader-aliya.html); модали кӯҳна ва тугмаи болоии Алия хориҷ шуданд
  var btnOpen = document.getElementById('readerAliyaBtn');
  if (btnOpen) {
    btnOpen.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!url) { if (typeof toast === 'function') toast('Аввал китобро кушоед'); return; }
      openAliyaOverlay();
    });
  }
  // v159: Алия дар болои Reader (iframe) кушода мешавад: китоби аллакай боркардашуда истифода мешавад,
  // ҳеҷ чиз аз нав зеркашӣ намешавад. Бастани қабат саҳифаи Алияро холӣ мекунад — кори ҷорӣ худкор қатъ мешавад.
  function aliyaSrc() {
    return 'aliya/reader-aliya.html?embed=1&url=' + encodeURIComponent(url) +
      '&name=' + encodeURIComponent(typeof name !== 'undefined' ? name : 'Китоб') + '&page=' + (typeof page !== 'undefined' ? page : 1);
  }
  function openAliyaOverlay() {
    var ov = document.getElementById('aliyaOverlay');
    if (!ov) {
      ov = document.createElement('div'); ov.id = 'aliyaOverlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Алия');
      ov.innerHTML = '<iframe title="Алия" allow="clipboard-write"></iframe>';
      document.body.appendChild(ov);
    }
    ov.querySelector('iframe').src = aliyaSrc();
    ov.classList.add('open');
    document.documentElement.classList.add('aliya-open');
    try { history.pushState({ kkAliya: 1 }, ''); } catch (e) {}
  }
  function closeAliyaOverlay(fromPop) {
    var ov = document.getElementById('aliyaOverlay');
    if (!ov || !ov.classList.contains('open')) return false;
    ov.classList.remove('open');
    document.documentElement.classList.remove('aliya-open');
    var fr = ov.querySelector('iframe');
    setTimeout(function () { if (!ov.classList.contains('open')) fr.src = 'about:blank'; }, 260);   // қатъи кори Алия
    if (!fromPop && history.state && history.state.kkAliya) { try { history.back(); } catch (e) {} }
    if (typeof updateNotesBadge === 'function') updateNotesBadge();
    return true;
  }
  window.__kkCloseAliya = function () { closeAliyaOverlay(false); };
  window.__kkReaderGoPage = function (n) {
    closeAliyaOverlay(false);
    n = parseInt(n, 10);
    if (n > 0 && pdf && typeof renderPage === 'function') setTimeout(function () { renderPage(Math.min(n, pages), 0); }, 120);
  };
  window.addEventListener('popstate', function () { closeAliyaOverlay(true); });
});

// v159: Ёддоштҳо — матнҳое, ки дар Алия бо 🔖 сабт шудаанд (танҳо дар ҳамин дастгоҳ, localStorage «kk_aliya_notes»)
function readerNotesCount() {
  try { return window.AliyaTasks ? window.AliyaTasks.notes.count(url) : 0; } catch (e) { return 0; }
}
function updateNotesBadge() {
  var b = document.getElementById('notesBadge'); if (!b) return;
  var n = readerNotesCount();
  b.textContent = n > 99 ? '99+' : String(n);
  b.hidden = !n;
}
function renderReaderNotes() {
  var box = document.getElementById('notesList');
  if (!box || !window.AliyaTasks) return;
  window.AliyaTasks.renderNotesList(box, {
    book: url,
    onChange: updateNotesBadge,
    onGo: function (p) {
      toggleNotes(false);
      var target = Math.max(1, Math.min(Number(p) || 1, pages || 1));
      if (typeof renderPage === 'function') renderPage(target, target >= page ? 1 : -1);
    }
  });
}
function toggleNotes(force) {
  var panel = document.getElementById('notesPanel'); if (!panel) return;
  var open = force === undefined ? !panel.classList.contains('open') : !!force;
  panel.classList.toggle('open', open);
  if (open) {
    document.getElementById('searchPanel').classList.remove('open');
    document.getElementById('settingsPanel').classList.remove('open');
    renderReaderNotes();
  }
}
window.addEventListener('pageshow', updateNotesBadge);
window.addEventListener('storage', function (e) { if (e.key === 'kk_aliya_notes') { updateNotesBadge(); if (document.getElementById('notesPanel').classList.contains('open')) renderReaderNotes(); } });
window.addEventListener('load', function () {
  updateNotesBadge();
  try { if (new URL(location.href).searchParams.get('notes') === '1') toggleNotes(true); } catch (e) {}
});
</script>
