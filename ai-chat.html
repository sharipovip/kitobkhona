<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1726">
<title>SoroLLM AI · Китобхона</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<script src="config.js?v=75"></script>
<style>
  :root {
    --bg: #0B1726;
    --card: #152840;
    --card2: #1B3150;
    --gold: #DCB55E;
    --gold2: #F2D58A;
    --text: #F6EEDB;
    --muted: #9FB0C5;
    --line: rgba(220,181,94,0.18);
    --gold-glow: rgba(220,181,94,0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; background: #05090f; color: var(--text);
    font-family: "Noto Sans", Arial, sans-serif; height: 100vh; height: 100dvh;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
    background: var(--bg); display: flex; flex-direction: column; position: relative;
    box-shadow: 0 0 24px rgba(0,0,0,0.5); overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0) + 12px) 14px 12px;
    background: rgba(11, 23, 38, 0.96);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .btn-back {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 19px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    text-decoration: none; flex-shrink: 0;
  }
  .ai-logo {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #FFE29F 0%, #D8A541 50%, #9C6C16 100%);
    color: #1a1202; font-weight: 900; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(220,181,94,0.4);
    border: 1.5px solid rgba(255,255,255,0.4); flex-shrink: 0;
  }
  .topbar-meta { min-width: 0; line-height: 1.25; }
  .topbar-title { font-size: 15px; font-weight: 800; color: var(--gold2); display: flex; align-items: center; gap: 4px; }
  .topbar-sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btn-clear {
    border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    color: var(--muted); padding: 6px 10px; border-radius: 10px; font-size: 11px;
    cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 700;
  }
  .btn-clear:hover { color: #FF7B79; border-color: rgba(255,75,75,0.3); }

  /* Chips */
  .chips-scroll {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 6px;
    scrollbar-width: none; flex-shrink: 0; background: rgba(0,0,0,0.12);
  }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: all .15s ease;
  }
  .chip-btn:active { background: var(--gold); color: #1a1202; }

  /* Chat stream */
  .chat-stream {
    flex: 1; overflow-y: auto; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 14px;
    scrollbar-width: thin; scrollbar-color: rgba(220,181,94,0.2) transparent;
  }
  .msg-row { display: flex; gap: 10px; max-width: 88%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.ai { align-self: flex-start; }

  .msg-bubble {
    padding: 12px 14px; border-radius: 18px; font-size: 14px; line-height: 1.55;
    position: relative; word-break: break-word; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .msg-row.user .msg-bubble {
    background: linear-gradient(135deg, #24416B, #1B3150);
    border: 1px solid rgba(220,181,94,0.3); color: #FFFFFF;
    border-bottom-right-radius: 4px;
  }
  .msg-row.ai .msg-bubble {
    background: var(--card); border: 1px solid var(--line);
    color: var(--text); border-bottom-left-radius: 4px;
  }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
    margin-top: 4px;
  }
  .msg-row.ai .msg-avatar {
    background: linear-gradient(135deg, #E8C96D, #C9A84C); color: #1a1202;
  }
  .msg-row.user .msg-avatar {
    background: #1B3150; border: 1px solid var(--line); color: var(--gold);
  }
  .msg-time { font-size: 9.5px; opacity: 0.55; margin-top: 4px; text-align: right; }

  .book-card-ai {
    display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.25);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 8px;
    cursor: pointer; text-decoration: none; color: inherit;
  }
  .book-card-ai:hover { border-color: var(--gold); }
  .b-icon { font-size: 22px; }
  .b-title { font-weight: 750; font-size: 13px; color: var(--gold2); }
  .b-meta { font-size: 11px; color: var(--muted); }

  /* Input bar */
  .input-bar {
    padding: 10px 14px 10px;
    background: rgba(11, 23, 38, 0.98); border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
  }
  .chat-input {
    flex: 1; height: 42px; border-radius: 21px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); padding: 0 16px; font-size: 14px;
    outline: none; transition: border-color .15s ease;
  }
  .chat-input:focus { border-color: var(--gold); }
  .chat-input::placeholder { color: var(--muted); opacity: 0.7; }

  .btn-send {
    width: 42px; height: 42px; border-radius: 50%; border: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #1a1202; font-size: 18px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(220,181,94,0.3); transition: transform .1s ease;
  }
  .btn-send:active { transform: scale(0.92); }

  .typing-indicator {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px;
  }
  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%,80%,100%{ transform: scale(0.6); opacity: 0.4; } 40%{ transform: scale(1); opacity: 1; } }

  /* Bottom Nav */
  .nav-bottom {
    position: relative; width: 100%; height: 50px; flex: 0 0 50px;
    background: rgba(14, 25, 40, 0.95);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid rgba(220,181,94,0.15);
    display: flex; justify-content: space-around; align-items: center;
    padding: 0 4px calc(env(safe-area-inset-bottom, 0));
    z-index: 10;
  }
  .kh-nav2 {
    display: flex; justify-content: space-around; align-items: center;
    width: 100%; height: 100%; gap: 1px;
  }
  .nav-item {
    background: none; border: none; cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 2px;
    color: #7FA9A8; padding: 0 2px; text-decoration: none; flex: 1;
    font-family: inherit; font-size: 0;
  }
  .nav-item span {
    font-size: 9px; color: inherit; font-weight: 500; line-height: 1; white-space: nowrap;
  }
  .nav-item svg {
    display: block; width: 20px; height: 20px; color: inherit;
  }
  .nav-item.active { color: #D9B23C; }
  .nav-item.active svg { transform: scale(1.15); color: #D9B23C; }

  .nav-item.nav-item-ai { position: relative; z-index: 5; }
  .nav-ai-bubble {
    width: 25px; height: 25px; border-radius: 50%;
    background: linear-gradient(135deg, #FFE4A0 0%, #D8A541 50%, #946513 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(216, 165, 65, 0.55);
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    transform: scale(1.1);
  }
  .nav-ai-bubble span {
    font-size: 10px; font-weight: 900; color: #1A1206;
    letter-spacing: -0.3px; line-height: 1;
  }
  .nav-ai-label {
    color: #DCB55E !important; font-weight: 800 !important; font-size: 8.5px !important;
  }
</style>
<style id="app-scrollbar-policy">
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>

<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <a class="btn-back" href="index.html" aria-label="Бозгашт">←</a>
      <div class="ai-logo">AI</div>
      <div class="topbar-meta">
        <div class="topbar-title">SoroLLM AI <span>✨</span></div>
        <div class="topbar-sub">Ҳуши сунъии миллии Китобхона</div>
      </div>
    </div>
    <button class="btn-clear" onclick="clearHistory()" title="Тоза кардани таърих">🗑 Тоза кардан</button>

  <div class="chips-scroll">
    <button class="chip-btn" onclick="askPrompt('Дар бораи китобҳои Пешвои миллат маълумот диҳед')">👑 Китобҳои Президент</button>
    <button class="chip-btn" onclick="askPrompt('50 соати хониш дар Китобхона чӣ медиҳад?')">⏱ 50 соати хониш</button>
    <button class="chip-btn" onclick="askPrompt('Дар бораи озмуни «Идеяи ман калиди фардо» маълумот диҳед')">💡 «Идеяи ман калиди фардо»</button>
    <button class="chip-btn" onclick="askPrompt('Озмунҳои ҷумҳуриявӣ кадомҳоянд?')">🏆 Озмунҳо</button>
    <button class="chip-btn" onclick="askPrompt('Чӣ тавр китобро офлайн хонам?')">📥 Хондан бе интернет</button>
    <button class="chip-btn" onclick="askPrompt('Оё китоби Фирдавсӣ дар барнома ҳаст?')">🔍 Санҷиши китоб</button>

  <div class="chat-stream" id="chatStream"></div>

  <div class="input-bar">
    <input type="text" class="chat-input" id="userInput" placeholder="Саволи худро бинависед..." autocomplete="off">

  </div>

  <div class="nav-bottom">
    <div class="kh-nav2">
      <a class="nav-item" href="index.html" aria-label="Асосӣ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span>Асосӣ</span>
      </a>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg><span>Китобҳо</span>
      </a>
      <a class="nav-item" href="winners.html" aria-label="Ғолибон">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg><span>Ғолибон</span>
      </a>
      <a class="nav-item nav-item-ai active" href="ai-chat.html" aria-label="SoroLLM AI">
        <div class="nav-ai-bubble"><span>AI</span></div>
        <span class="nav-ai-label">AITJ</span>
      </a>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg><span>Лента</span>

      </a>
    </div>

<script>
const HISTORY_KEY = 'kk_sorollm_history_v1';
let chatHistory = [];
let allCatalogBooks = [];

// Донишномаи дарунсохти Пешвои миллат ва барнома
const PRESIDENT_BOOKS = [
  { title: "Тоҷикон дар оинаи таърих", vol: "4 ҷилд", desc: "Шоҳасари таърихии Пешвои миллат дар бораи пайдоиш, давлатдории ориёиҳо, давраи Сомониён ва ҳувияти миллии тоҷикон." },
  { title: "Забони миллат — ҳастии миллат", vol: "2 ҷилд", desc: "Тадқиқоти мукаммал роҷеъ ба сарнавишт, таърихи ташаккул ва рушди забони давлатии тоҷикӣ аз давраҳои бостон то имрӯз." },
  { title: "Чеҳраҳои мондагор", vol: "1 ҷилд", desc: "Шарҳи зиндагӣ ва корномаи 25 шахсияти барҷастаи миллати тоҷик, аз ҷумла Исмоили Сомонӣ, Рӯдакӣ, Фирдавсӣ, Сино, Айнӣ ва Бобоҷон Ғафуров." },
  { title: "Нигоҳе ба таърих ва тамаддуни ориёӣ", vol: "1 ҷилд", desc: "Таҳлили арзишҳои умумибашарии тамаддуни ориёӣ, ҷашнҳои бостонӣ ва фарҳанги сулҳофаринии ниёгон." },
  { title: "Истиқлолияти Тоҷикистон ва эҳёи миллат", vol: "Силсила", desc: "Таҳлили раванди барқарорсозии сулҳу ваҳдати миллӣ ва асосҳои давлатдории навини Тоҷикистон." },
  { title: "Аз Ориё то Сомониён", vol: "1 ҷилд", desc: "Давраҳои шукуфоӣ ва дастовардҳои таърихии тамаддуни ориёӣ ва давлати мутамаркази Сомониён." }
];

async function loadCatalog() {
  try {
    const res = await fetch('books.json?v=75');
    if (res.ok) {
      const data = await res.json();
      const items = [];
      (data.categories || []).forEach(cat => {
        (cat.subcategories || []).forEach(sub => {
          items.push({ name: sub.name, category: cat.name, folder: sub.folder });
        });
      });
      allCatalogBooks = items;
    }
  } catch(e) {}
}

function initHistory() {
  try {
    const saved = localStorage.getItem(HISTORY_KEY);
    chatHistory = saved ? JSON.parse(saved) : [];
  } catch(e) { chatHistory = []; }

  if (!chatHistory.length) {
    chatHistory.push({
      role: 'ai',
      text: "Салом! Ман SoroLLM — ёрдамчии ҳушманди Китобхона ҳастам. Шумо метавонед дар бораи китобҳои Пешвои миллат, қоидаҳо ва хусусиятҳои барнома (50 соати хониш, рейтинг, озмунҳои ҷумҳуриявӣ) пурсед, ё мавҷудияти китобҳои дилхоҳро дар китобхона бисанҷед. Чӣ гуна кӯмак расонам?",
      time: new Date().toLocaleTimeString('tg-TJ', { hour: '2-digit', minute: '2-digit' })
    });
    saveHistory();
  }
  renderStream();
}

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory)); } catch(e) {}
}

function clearHistory() {
  if (confirm('Таърихи паёмҳо тоза карда шавад?')) {
    chatHistory = [];
    localStorage.removeItem(HISTORY_KEY);
    initHistory();
  }
}

function renderStream() {
  const stream = document.getElementById('chatStream');
  stream.innerHTML = chatHistory.map(m => {
    const isUser = m.role === 'user';
    const avatar = isUser ? '👤' : '✨';
    let content = escHtml(m.text).replace(/\n/g, '<br>');
    if (m.card) {
      content += `
        <a class="book-card-ai" href="${escHtml(m.card.link)}">
          <div class="b-icon">📖</div>
          <div>
            <div class="b-title">${escHtml(m.card.title)}</div>
            <div class="b-meta">${escHtml(m.card.meta || 'Китоби электронӣ')} · Кушодан дар хонанда ›</div>
          </div>
        </a>
      `;
    }
    return `
      <div class="msg-row ${isUser ? 'user' : 'ai'}">
        <div class="msg-avatar">${avatar}</div>
        <div class="msg-bubble">
          <div>${content}</div>
          <div class="msg-time">${m.time || ''}</div>
        </div>
      </div>
    `;
  }).join('');
  stream.scrollTop = stream.scrollHeight;
}

function askPrompt(p) {
  document.getElementById('userInput').value = p;
  sendMessage();
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const query = input.value.trim();
  if (!query) return;

  const nowTime = new Date().toLocaleTimeString('tg-TJ', { hour: '2-digit', minute: '2-digit' });
  chatHistory.push({ role: 'user', text: query, time: nowTime });
  input.value = '';
  renderStream();

  // Typing indicator
  const stream = document.getElementById('chatStream');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg-row ai';
  typingEl.id = 'typingBubble';
  typingEl.innerHTML = `
    <div class="msg-avatar">✨</div>
    <div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>
  `;
  stream.appendChild(typingEl);
  stream.scrollTop = stream.scrollHeight;

  // Answer resolution: External Soro API or local engine
  setTimeout(async () => {
    let reply = "";
    let card = null;

    // Check if external SoroLLM API configured
    if (window.KITOB_CONFIG && KITOB_CONFIG.SORO_API_URL && KITOB_CONFIG.SORO_API_KEY) {
      try {
        const resp = await fetch(KITOB_CONFIG.SORO_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + KITOB_CONFIG.SORO_API_KEY
          },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Шумо SoroLLM — ёвари ҳушманди барномаи Китобхона мебошед. Ҷавобҳоро бо забони тоҷикӣ, боэҳтиромона ва дақиқ дар бораи асарҳои Пешвои миллат ва қоидаҳои барнома пешниҳод кунед.' },
              ...chatHistory.slice(-6).map(h => ({ role: h.role === 'user' ? 'user' : 'assistant', content: h.text }))
            ]
          })
        });
        if (resp.ok) {
          const apiData = await resp.json();
          reply = apiData.choices?.[0]?.message?.content || apiData.reply || "";
        }
      } catch(e) {}
    }

    // Local Knowledge Engine fallback
    if (!reply) {
      reply = generateSmartAnswer(query);
      card = detectBookCard(query);
    }

    document.getElementById('typingBubble')?.remove();
    chatHistory.push({ role: 'ai', text: reply, card, time: new Date().toLocaleTimeString('tg-TJ', { hour: '2-digit', minute: '2-digit' }) });
    saveHistory();
    renderStream();
  }, 650);
}

function generateSmartAnswer(q) {
  const s = q.toLowerCase();

  // 1. Китобҳои Пешвои миллат
  if (s.includes('президент') || s.includes('пешво') || s.includes('оинаи таърих') || s.includes('забони миллат') || s.includes('чеҳраҳои мондагор')) {
    let res = "👑 Асарҳои бунёдии Асосгузори сулҳу ваҳдати миллӣ — Пешвои миллат, Президенти Ҷумҳурии Тоҷикистон муҳтарам Эмомалӣ Раҳмон дар рушди худшиносии миллӣ ва шинохти таъриху тамаддун нақши беназир доранд:\n\n";
    PRESIDENT_BOOKS.forEach((b, i) => {
      res += `${i+1}. «${b.title}» (${b.vol}): ${b.desc}\n\n`;
    });
    res += "Ҳамаи ин асарҳоро метавонед дар бахши «Китобҳои Пешвои миллат» мутолиа ва сабт намоед.";
    return res;
  }

  // 2. 50 соати хониш ва тасдиқи ҳисоб
  if (s.includes('50') || s.includes('соат') || s.includes('тасдиқ') || s.includes('аватар') || s.includes('verified')) {
    return "⏱ Қоидаи 50 соати хониш дар Китобхона:\n\n1. Вақте ки вақти умумии мутолиаи шумо ба 50 соат (3000 дақиқа) мерасад, ҳисоби шумо ба таври худкор нишони тасдиқи расмӣ (verified badge ✓) мегирад.\n\n2. Барои корбарони тасдиқшуда имконияти гузоштани акси шахсӣ ҳамчун аватар (дар бахши Профил → Аватар) фаъол мегардад.\n\n3. Ҳамчунин шумо соҳиби огоҳиномаи табрикотӣ мегардед ва мавқеи шумо дар рейтинги хонандагон боло меравад!";
  }

  // 3. Озмуни «Идеяи ман калиди фардо»
  if (s.includes('идея') || s.includes('фардо') || s.includes('инноватси')) {
    return "💡 Озмуни ҷумҳуриявии «Идеяи ман калиди фардо»:\n\n• Мақсад: Рушди иқтисоди рақамӣ ва инноватсия байни наврасон ва хонандагони синфҳои 5–11.\n• Даврҳо: \n  - Даври 1 (ноҳиявӣ/шаҳрӣ) — моҳи октябр;\n  - Даври 2 (вилоятӣ/минтақавӣ) — моҳи ноябр;\n  - Даври 3 (ҷумҳуриявӣ) — моҳи феврал.\n• 5 Номинатсия: Экология ва энергетика, технологияи рақамӣ ва барномасозӣ, маориф, соҳибкории сабз, зеҳни сунъӣ (AI).\n• Мукофотҳо: Ҷойи 1 — 7 000 сомонӣ, Ҷойи 2 — 5 000 сомонӣ, Ҷойи 3 — 3 000 сомонӣ + Дипломҳо (барои омӯзгорон: 1000–3000 сомонӣ).";
  }

  // 4. Озмунҳои ҷумҳуриявӣ
  if (s.includes('озмун') || s.includes('фурӯғ') || s.includes('шоҳнома') || s.includes('донанда')) {
    return "🏆 Озмунҳои ҷумҳуриявӣ дар барнома:\n\n1. «Идеяи ман калиди фардо» — лоиҳаҳои инноватсионии хонандагон (октябр, ноябр, феврал).\n2. «Фурӯғи субҳи доноӣ китоб аст» — озмуни бузурги китобхонӣ (даври ҷумҳуриявӣ — ноябр).\n3. «Шоҳномахонӣ» — ҳифз ва таҳлили достонҳои Фирдавсӣ (даври ҷумҳуриявӣ — декабр).\n4. «Илм — фурӯғи маърифат» — фанҳои риёзӣ, табиатшиносӣ ва зеҳни сунъӣ.\n5. «Донандаи беҳтарини асарҳои Пешвои миллат» — омӯзиши осори Президенти кишвар.\n6. «Тоҷикистон — Ватани азизи ман» — оҳангсозӣ, санъат ва дизайн.\n\nТафсилоти ҳар як озмун дар саҳифаи асосии барнома дастрас аст.";
  }

  // 5. Офлайн ва захираи китоб
  if (s.includes('офлайн') || s.includes('интернет') || s.includes('захира') || s.includes('скачат') || s.includes('боргирӣ')) {
    return "📥 Мутолиаи офлайн (бе интернет) дар Китобхона:\n\n• Ҳар китоберо, ки як бор дар хонанда кушоед ё дар корти китоб тугмаи «⬇ Скачать»-ро пахш намоед, ба таври автоматӣ дар хотираи дастгоҳи шумо (кэши офлайн) ҳифз мешавад.\n• Ҳамаи ин китобҳоро метавонед дар саҳифаи асосӣ аз бахши «Китобҳои захирашуда» ҳатто дар вақти хомӯш будани интернет боз намуда, бе мамониат бихонед.";
  }

  // 6. Рейтинг ва ғолибон
  if (s.includes('рейтинг') || s.includes('ғолиб') || s.includes('подиум') || s.includes('пешсаф')) {
    return "🏅 Бахши «Ғолибон» (Рейтинг):\n\n• Дар подиум 3 нафар пешсафони асосӣ бо тоҷ ва медалҳо (тилло, нуқра, биринҷӣ) намоиш дода мешаванд.\n• Дар бахши «Рейтинги пурра» то 100 нафар беҳтарин хонандагон бо нишондоди дақиқи соати хониш ва шумораи китобҳо феҳрист мешаванд.\n• Шумо метавонед рейтингро аз рӯи давра (ҳафта, моҳ, умумӣ) ва аз рӯи синну сол ва минтақа филтр намоед.";
  }

  // 7. Ҷустуҷӯи китоб дар феҳрист
  if (s.includes('китоб') || s.includes('ҳаст') || s.includes('доред') || s.includes('ҷустуҷӯ')) {
    // Ҷустуҷӯи калима дар феҳрист
    const found = searchBookInCatalog(s);
    if (found) {
      return `📚 Китоби «${found.name}» дар феҳристи Китобхона дар бахши «${found.category}» мавҷуд аст! Шумо метавонед онро мустақиман кушода мутолиа намоед.`;
    }
    return "📚 Дар феҳристи миллии Китобхона ҳазорон асар аз адабиёти классикӣ, муосир, ҷаҳон ва китобҳои дарсӣ мавҷуданд. Номи дақиқи асар ё муаллифро бинависед, то мавҷудияти онро санҷам.";
  }

  // Саломи умумӣ
  if (s.includes('салом') || s.includes('ассалом') || s.includes('дархост')) {
    return "Салом ва пазироии гарм! Ман омодаам ба ҳама саволҳои шумо роҷеъ ба китобҳо, Низомномаи озмунҳо, мутолиаи офлайн ва шартҳои истифодаи Китобхона посух гӯям.";
  }

  return "Ташаккур барои муроҷиат! Ман ҳамчун ёвари Китобхона омодаам дар бораи китобҳои Пешвои миллат, озмунҳои ҷумҳуриявии Тоҷикистон, қоидаи 50 соати хониш, ёфтан ва санҷиши китобҳо дар феҳрист кӯмак расонам. Саволи мушаххаси худро бинависед.";
}

function searchBookInCatalog(query) {
  const cleanQ = query.replace(/(оё|китоби|доред|ҳаст|дар|бораи|\?)/g, '').trim().toLowerCase();
  if (cleanQ.length < 3) return null;
  return allCatalogBooks.find(b => b.name.toLowerCase().includes(cleanQ));
}

function detectBookCard(query) {
  const s = query.toLowerCase();
  if (s.includes('оинаи таърих') || s.includes('тоҷикон')) {
    return { title: "Тоҷикон дар оинаи таърих", link: "reader.html?name=Тоҷикон&cat=peshvoi_millat", meta: "Пешвои миллат Эмомалӣ Раҳмон" };
  }
  if (s.includes('забони миллат')) {
    return { title: "Забони миллат — ҳастии миллат", link: "reader.html?name=Забони+миллат&cat=peshvoi_millat", meta: "Пешвои миллат Эмомалӣ Раҳмон" };
  }
  if (s.includes('чеҳраҳои мондагор')) {
    return { title: "Чеҳраҳои мондагор", link: "reader.html?name=Чеҳраҳои+мондагор&cat=peshvoi_millat", meta: "Пешвои миллат Эмомалӣ Раҳмон" };
  }
  return null;
}

document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

loadCatalog();
initHistory();
</script>
