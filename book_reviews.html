<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Баҳодиҳӣ · Китобхона</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">

<script src="config.js?v=54"></script>
<style>
:root{--bg:#0B1726;--card:#152840;--card2:#1B3150;--gold:#DCB55E;--gold2:#F2D58A;--text:#F6EEDB;--muted:#9FB0C5;--line:rgba(220,181,94,.18)}*{box-sizing:border-box}body{margin:0;background:#05090f;color:var(--text);font-family:"Noto Sans",Arial,sans-serif}.app{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--bg);padding:14px}.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px}.title{font-weight:950;font-size:19px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border-radius:18px;padding:14px;margin:12px 0}h3{margin:0 0 12px;color:var(--gold2);font-size:16px}.stars{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.star{font-size:24px;filter:grayscale(1);opacity:.55}.star.on{filter:none;opacity:1}textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--text);padding:11px;outline:none}.btn{width:100%;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1202;padding:12px;font-weight:950}.meta{font-size:12px;color:var(--muted);margin-top:8px}.comment{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.45}.comment:last-child{border-bottom:0}
</style>

<style id="app-scrollbar-policy">
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>
</head>
<body>
<main class="app">
  <div class="top"><button class="back" onclick="history.back()">←</button><div><div class="title">⭐ Баҳодиҳӣ</div><div id="bookName" class="meta"></div></div></div>
  <section class="card"><h3>Ба китоб баҳо диҳед</h3><div class="stars" id="stars"></div><textarea id="comment" placeholder="Фикри худро нависед..."></textarea><button class="btn" onclick="save()">Фиристодан</button><div id="msg" class="meta"></div></section>
  <section class="card"><h3>Шарҳҳо</h3><div id="comments"><div class="meta">Боркунӣ...</div></div></section>
</main>
<script>
const qs=new URL(location.href).searchParams;
const book_url=qs.get('url')||'';
const book_name=qs.get('name')||'Китоб';
let rating=10;
bookName.textContent=book_name;
function renderStars(){stars.innerHTML=Array.from({length:10},(_,i)=>`<span class="star ${i<rating?'on':''}" onclick="rating=${i+1};renderStars()">★</span>`).join('')}
async function save(){
  msg.textContent='⏳';
  try{
    const {data:u}=await AUTH.getUser();
    if(!u?.user){msg.textContent='Аввал ворид шавед';return}
    await apiUpsert('book_ratings',{user_id:u.user.id,book_url,rating},'user_id,book_url');
    const text=comment.value.trim();
    if(text) await apiPost('book_comments',{user_id:u.user.id,book_url,text});
    comment.value='';
    msg.textContent='✓ Захира шуд';
    load();
  }catch(e){msg.textContent='Ҳоло захира нашуд';}
}
async function load(){
  try{
    const rows=await apiGet('book_comments',{eq:{column:'book_url',value:book_url},order:'created_at.desc',limit:50,select:'text,created_at,user_id,status'});
    const visible=(rows||[]).filter(c=>c.status==='visible'||c.status===undefined);
    comments.innerHTML=visible.length?visible.map(c=>`<div class="comment">${esc(c.text)}<div class="meta">${new Date(c.created_at).toLocaleDateString('ru-RU')}</div></div>`).join(''):'<div class="meta">Ҳоло шарҳ нест</div>';
  }catch(_){comments.innerHTML='<div class="meta">Ҳоло шарҳ нест</div>'}
}
renderStars();load();
</script>
</body>
</html>
