<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат</title>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wa-header:#075E54;
    --wa-chat-bg:#ECE5DD;
    --wa-bubble-in:#FFFFFF;
    --wa-bubble-out:#DCF8C6;
    --wa-text:#111B21;
    --wa-muted:#667781;
    --wa-check-grey:#8696A0;
    --wa-check-blue:#34B7F1;
    --wa-compose-bg:#F0F0F0;
    --wa-pill-bg:#FFFFFF;
    --shadow:0 18px 40px -12px rgba(0,0,0,0.55);
  }
  [data-theme="dark"]{
    --wa-header:#1F2C34;
    --wa-chat-bg:#0B141A;
    --wa-bubble-in:#1F2C34;
    --wa-bubble-out:#005C4B;
    --wa-text:#E9EDEF;
    --wa-muted:#8696A0;
    --wa-compose-bg:#1F2C34;
    --wa-pill-bg:#2A3942;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans', sans-serif;
    background:radial-gradient(circle at 20% 0%, #16304a 0%, transparent 45%), radial-gradient(circle at 85% 90%, #0c1c2e 0%, transparent 50%), #0a1320;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:18px; padding:28px 14px 60px; color:#F3ECDD;
  }

  .preview-bar{width:100%; max-width:430px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:10px 14px; backdrop-filter:blur(6px);}
  .preview-bar__label{font-size:11px; letter-spacing:.04em; color:#8CA0B8; text-transform:uppercase;}
  .theme-btn{width:34px; height:34px; border-radius:50%; border:1px solid rgba(220,181,94,0.3); background:transparent; color:#F3ECDD; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;}

  .phone{
    position:relative; width:390px; height:844px; background:var(--wa-chat-bg); border-radius:46px;
    box-shadow:var(--shadow), 0 0 0 10px #050a12, 0 0 0 11px rgba(220,181,94,0.25);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .island{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:108px; height:26px; background:#000; border-radius:20px; z-index:60;}

  .status-bar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 22px 4px; font-size:13px; font-weight:600; color:#fff; background:var(--wa-header);}
  .status-bar .icons{display:flex; gap:5px; font-size:11px;}

  .chat-header{
    flex:0 0 auto; background:var(--wa-header); color:#fff;
    display:flex; align-items:center; gap:10px; padding:8px 12px 12px;
  }
  .back-btn{font-size:24px; line-height:1; padding:2px 4px 2px 0; cursor:pointer;}
  .head-avatar{width:38px; height:38px; border-radius:50%; background:#0a4a42; display:flex; align-items:center; justify-content:center; flex:0 0 auto; overflow:hidden;}
  .head-avatar svg{width:62%; height:62%;}
  .head-info{flex:1; min-width:0;}
  .head-name{font-size:15.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .head-status{font-size:11.5px; color:rgba(255,255,255,0.78); display:flex; align-items:center; gap:5px; margin-top:1px;}
  .online-dot{width:7px; height:7px; border-radius:50%; background:#4ADE80; flex:0 0 auto;}
  .menu-btn{font-size:21px; cursor:pointer; padding:2px 6px; transform:rotate(90deg);}

  .messages{flex:1 1 auto; overflow-y:auto; padding:14px 12px 10px; display:flex; flex-direction:column; gap:3px; scrollbar-width:none;}
  .messages::-webkit-scrollbar{display:none;}

  .date-sep{align-self:center; background:rgba(0,0,0,0.08); color:var(--wa-muted); font-size:11.5px; font-weight:600; padding:4px 12px; border-radius:8px; margin:6px 0 12px;}
  [data-theme="dark"] .date-sep{background:rgba(255,255,255,0.07);}

  .msg-row{display:flex; margin:3px 0;}
  .msg-row.in{justify-content:flex-start;}
  .msg-row.out{justify-content:flex-end;}

  .bubble{
    max-width:78%; padding:6px 9px 7px 9px; font-size:14.5px; line-height:1.35; color:var(--wa-text);
    box-shadow:0 1px 1px rgba(0,0,0,0.12); white-space:pre-wrap; word-break:break-word; position:relative;
  }
  .bubble.in{background:var(--wa-bubble-in); border-radius:9px 9px 9px 2px;}
  .bubble.out{background:var(--wa-bubble-out); border-radius:9px 9px 2px 9px;}

  .bubble-text{margin-right:46px;}
  .bubble-meta{
    position:absolute; right:9px; bottom:5px; display:flex; align-items:center; gap:3px;
    font-size:10.5px; color:var(--wa-muted); white-space:nowrap;
  }
  .check{font-size:13px; line-height:1; color:var(--wa-check-grey);}
  .check.read{color:var(--wa-check-blue);}

  .composer{
    flex:0 0 auto; background:var(--wa-compose-bg);
    display:flex; align-items:flex-end; gap:8px; padding:8px 10px 16px;
  }
  .input-pill{
    flex:1; display:flex; align-items:flex-end; gap:6px;
    background:var(--wa-pill-bg); border-radius:22px; padding:6px 6px 6px 12px;
    min-height:40px;
  }
  .emoji-btn{font-size:20px; cursor:pointer; flex:0 0 auto; padding-bottom:3px; line-height:1;}
  .msg-input{
    flex:1; border:none; outline:none; background:transparent; resize:none;
    font-family:'Noto Sans'; font-size:14.5px; color:var(--wa-text); line-height:1.4;
    max-height:100px; overflow-y:auto; padding:5px 4px; scrollbar-width:none;
  }
  .msg-input::-webkit-scrollbar{display:none;}
  .msg-input::placeholder{color:var(--wa-muted);}
  .send-btn{
    width:40px; height:40px; border-radius:50%; background:var(--wa-header);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer; color:#fff; font-size:17px;
    transition:transform .1s;
  }
  .send-btn:active{transform:scale(.92);}

  .loading-msg{display:flex; align-items:center; justify-content:center; padding:40px 20px; color:var(--wa-muted); font-size:14px;}

  /* Bottom Navigation */
  .bottom-nav{flex:0 0 auto; background:#0B1A2E; border-top:1px solid rgba(232,222,199,0.08); display:flex; justify-content:space-around; padding:10px 0 20px;}
  .bottom-nav .nav-item{display:flex; flex-direction:column; align-items:center; gap:4px; color:#6E7F97; font-size:10px; font-weight:600; cursor:pointer; padding:4px 8px;}
  .bottom-nav .nav-item.active{color:#E8C879;}
  .bottom-nav .nav-icon{font-size:18px;}
  .bottom-nav .nav-label{font-size:10px;}

  @media (max-width:430px){.preview-bar,.island,.status-bar{display:none !important;}body{padding:0 !important;gap:0 !important;}.phone{width:100% !important;max-width:430px !important;height:100dvh !important;max-height:none !important;border-radius:0 !important;box-shadow:none !important;}}
</style>
</head>
<body>

  <div class="preview-bar"><div class="preview-bar__label">Чат</div><button class="theme-btn" id="themeToggle">🌙</button></div>

  <div class="phone">
    <div class="island"></div>
    <div class="status-bar"><span id="clock">9:41</span><span class="icons">📶 📡 🔋</span></div>

    <div class="chat-header">
      <div class="back-btn" id="backBtn">‹</div>
      <div class="head-avatar"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.4" stroke="#fff" stroke-width="1.6"/><path d="M5 19c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div class="head-info">
        <div class="head-name" id="headName">Чат</div>
        <div class="head-status" id="headStatus"><span class="online-dot"></span>Дӯст</div>
      </div>
      <div class="menu-btn" id="menuBtn">⋮</div>
    </div>

    <div class="messages" id="messages"><div class="loading-msg">Боргирӣ...</div></div>

    <div class="composer">
      <div class="input-pill">
        <div class="emoji-btn">😊</div>
        <textarea class="msg-input" id="msgInput" placeholder="Паём нависед..." rows="1"></textarea>
      </div>
      <div class="send-btn" id="sendBtn">➤</div>
    </div>

    <nav class="bottom-nav">
      <div class="nav-item" onclick="location.href='index.html'"><div class="nav-icon">🏠</div><div class="nav-label">Асосӣ</div></div>
      <div class="nav-item" onclick="location.href='kitobho.html'"><div class="nav-icon">📚</div><div class="nav-label">Китобҳо</div></div>
      <div class="nav-item" onclick="location.href='winners.html'"><div class="nav-icon">🏆</div><div class="nav-label">Ғолибон</div></div>
      <div class="nav-item" onclick="location.href='Lenta.html'"><div class="nav-icon">👥</div><div class="nav-label">Лента</div></div>
      <div class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon">👤</div><div class="nav-label">Профил</div></div>
    </nav>
  </div>

<script>
(function(){
  // Clock
  function updateClock(){
    const d = new Date();
    document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Theme
  document.getElementById('themeToggle').onclick = ()=>{
    const dark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = dark ? 'light' : 'dark';
    document.getElementById('themeToggle').textContent = dark ? '☀️' : '🌙';
  };

  // URL params
  const params = new URL(location.href).searchParams;
  const peerId = params.get('to') || '';
  const peerName = decodeURIComponent(params.get('name') || 'Чат');

  document.getElementById('headName').textContent = peerName;
  document.getElementById('backBtn').onclick = ()=> history.length > 1 ? history.back() : location.href = 'chats.html';

  // Report
  let menuShown = false;
  document.getElementById('menuBtn').onclick = async () => {
    if(menuShown) return;
    menuShown = true;
    if(confirm('Барои ин корбар жалоба фиристан?')) {
      try {
        const { data } = await AUTH.getUser();
        if(data.user && peerId) {
          await ChatAPI.sendReport(data.user.id, peerId, 'Жалоба аз чат');
          alert('Жалоба фиристо шуд!');
        }
      } catch(e) { alert('Хато: ' + e.message); }
    }
    setTimeout(()=> menuShown = false, 500);
  };

  // Input
  const input = document.getElementById('msgInput');
  function autoResize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 100) + 'px'; }
  input.addEventListener('input', autoResize);

  const messages = document.getElementById('messages');
  let currentUser = null;

  function nowTime(){ const d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
  function scrollToBottom(){ setTimeout(()=> messages.scrollTop = messages.scrollHeight, 50); }
  function timeLabel(v){ try{return new Date(v).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});}catch(_){return '';} }
  function formatDate(d){
    const today = new Date(), yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const dd = new Date(d);
    if(dd.toDateString() === today.toDateString()) return 'Имрӯз';
    if(dd.toDateString() === yesterday.toDateString()) return 'Дирӯз';
    return dd.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  }

  let lastDate = '';
  function addMessage(text, mine, time, status='✓'){
    const dateLabel = formatDate(new Date().toISOString());
    if(dateLabel !== lastDate){
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.textContent = dateLabel;
      messages.appendChild(sep);
      lastDate = dateLabel;
    }
    const row = document.createElement('div');
    row.className = 'msg-row ' + (mine ? 'out' : 'in');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (mine ? 'out' : 'in');
    const textEl = document.createElement('div');
    textEl.className = 'bubble-text';
    textEl.textContent = text;
    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    meta.innerHTML = mine ? time + ' <span class="check' + (status === '✓✓' ? ' read' : '') + '">' + status + '</span>' : time;
    bubble.appendChild(textEl);
    bubble.appendChild(meta);
    row.appendChild(bubble);
    messages.appendChild(row);
    return meta;
  }

  // Send
  document.getElementById('sendBtn').onclick = sendMessage;
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });

  async function sendMessage(){
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    autoResize();
    
    if(!currentUser || !peerId){
      alert('Логин шавед!');
      return;
    }

    const meta = addMessage(text, true, nowTime(), '✓');
    scrollToBottom();
    const checkEl = meta.querySelector('.check');

    try {
      await ChatAPI.sendMessage(currentUser.id, peerId, text);
      checkEl.textContent = '✓✓';
      checkEl.className = 'check read';
    } catch(e) {
      checkEl.textContent = '⚠';
      console.error(e);
    }
  }

  // Load messages from server
  async function loadMessages(){
    messages.innerHTML = '<div class="loading-msg">Боргирӣ...</div>';
    lastDate = '';

    try {
      const { data } = await AUTH.getUser();
      currentUser = data.user || null;

      if(!currentUser || !peerId){
        messages.innerHTML = '<div class="loading-msg">Логин шавед барои чат</div>';
        return;
      }

      const msgs = await ChatAPI.getMessages(currentUser.id, peerId);
      
      if(!msgs || msgs.length === 0){
        messages.innerHTML = '<div class="loading-msg">Паёмҳо нестанд. Якумро фиристед!</div>';
        return;
      }

      messages.innerHTML = '';
      lastDate = '';
      
      msgs.forEach(m => {
        const isMine = m.sender_id === currentUser.id;
        const time = timeLabel(m.created_at);
        addMessage(m.text, isMine, time, m.status === 'read' ? '✓✓' : '✓');
      });
      
      scrollToBottom();
    } catch(e) {
      console.error(e);
      messages.innerHTML = '<div class="loading-msg">Хато: ' + e.message + '</div>';
    }
  }

  loadMessages();
  
  // Poll every 5 seconds
  setInterval(loadMessages, 5000);
})();
</script>

</body>
</html>
