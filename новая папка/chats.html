<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<title>Чатҳо — Китобхона</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="./config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --bg:#0B1A2E;--bg-deep:#081323;--card:#142841;--card-hi:#1A314E;
    --line: rgba(232,222,199,0.08);--gold:#D4A94A;--gold-soft:#E8C879;
    --gold-dim: rgba(212,169,74,0.16);--cream:#F3EBDA;--cream-dim:#9FB0C5;
    --cream-faint:#6E7F97;--green:#3F9E63;--red:#C85850;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#05090f;}
  body{font-family:'Noto Sans', sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}

  .device{
    width:390px;height:844px;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    border-radius:44px;
    position:relative;overflow:hidden;
    box-shadow:0 0 0 10px #0a0a0c,0 0 0 12px #2b2b2f,0 40px 80px rgba(0,0,0,0.55);
    display:flex;flex-direction:column;color:var(--cream);
  }

  .statusbar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 28px 0 28px;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.3px;color:var(--cream);}
  .statusbar .icons{display:flex;gap:6px;align-items:center;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#000;border-radius:0 0 18px 18px;z-index:30;}

  .header{flex:none;padding:6px 22px 14px 22px;}
  .header-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .title{font-size:30px;font-weight:800;letter-spacing:0.2px;color:var(--cream);}
  .icon-btn{width:40px;height:40px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}

  .ornament{height:10px;margin-top:12px;background-image:radial-gradient(circle, var(--gold) 1.4px, transparent 1.6px);background-size:14px 10px;background-position:center;opacity:0.55;-webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);}

  .search{margin:16px 22px 4px 22px;height:46px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;flex:none;}
  .search input{background:none;border:none;outline:none;color:var(--cream);font-family:'Noto Sans';font-size:14.5px;width:100%;}
  .search input::placeholder{color:var(--cream-faint);}

  .scroll{flex:1;overflow-y:auto;padding-bottom:14px;}
  .scroll::-webkit-scrollbar{display:none;}

  .section-label{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 10px 22px;}
  .section-label .t{font-size:13px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold-soft);}
  .section-label .count{font-family:'JetBrains Mono';font-size:12px;color:var(--cream-faint);}

  .requests-row{display:flex;gap:12px;overflow-x:auto;padding:2px 22px 6px 22px;}
  .requests-row::-webkit-scrollbar{display:none;}

  .req-card{flex:none;width:128px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .req-avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--bg-deep);}
  .req-name{font-size:13px;font-weight:600;color:var(--cream);text-align:center;}
  .req-actions{display:flex;gap:6px;width:100%;}
  .btn-mini{flex:1;height:28px;border-radius:9px;border:none;font-family:'Noto Sans';font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .btn-mini.accept{background:var(--gold);color:#1c1404;}
  .btn-mini.decline{background:rgba(232,222,199,0.07);color:var(--cream-dim);border:1px solid var(--line);}

  .divider-soft{height:1px;background:var(--line);margin:18px 22px 4px 22px;}

  .chat-list{padding:6px 10px 0 10px;}
  .chat-item{display:flex;align-items:center;gap:13px;padding:12px 12px;margin:4px 0;border-radius:18px;position:relative;cursor:pointer;}
  .chat-item:active{background:var(--card);}
  .avatar-wrap{position:relative;flex:none;}
  .avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#1c1404;}
  .avatar.ring{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4px var(--gold);}
  .online-dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--bg);}
  .chat-mid{flex:1;min-width:0;}
  .chat-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .chat-name{font-size:15.5px;font-weight:700;color:var(--cream);}
  .chat-time{font-family:'JetBrains Mono';font-size:11px;color:var(--cream-faint);flex:none;}
  .chat-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px;}
  .chat-msg{font-size:13.5px;color:var(--cream-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-msg.unread-text{color:var(--cream);font-weight:500;}
  .chat-msg .you{color:var(--cream-faint);}
  .badge{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#1c1404;font-family:'JetBrains Mono';font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;}

  .empty-hint{margin:8px 22px 0 22px;padding:14px 16px;border-radius:16px;background:var(--gold-dim);border:1px solid rgba(212,169,74,0.28);font-size:12.5px;color:var(--gold-soft);line-height:1.5;}

  .navbar{flex:none;height:84px;background:var(--bg-deep);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:16px;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cream-faint);font-size:11px;font-weight:600;width:64px;cursor:pointer;}
  .nav-item.active{color:var(--gold-soft);}
  .nav-icon{width:24px;height:24px;}
  .nav-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:-2px;}

  .c1{background:linear-gradient(135deg,#E8C879,#C9933A);}
  .c2{background:linear-gradient(135deg,#7FB8A0,#3F9E63);}
  .c3{background:linear-gradient(135deg,#E0958C,#C85850);}
  .c4{background:linear-gradient(135deg,#9AB6D9,#4E7AA8);}
  .c5{background:linear-gradient(135deg,#D4A94A,#9C7327);}
  .c6{background:linear-gradient(135deg,#B79AD9,#7551A8);}

  .loading{display:flex;align-items:center;justify-content:center;padding:20px;color:var(--cream-faint);}
  .spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:430px){.preview-bar,.island,.statusbar,.notch{display:none !important;}body{padding:0 !important;gap:0 !important;display:flex !important;align-items:stretch !important;justify-content:center !important;background:#05090f !important;}.device{width:100% !important;max-width:430px !important;height:100dvh !important;max-height:none !important;border-radius:0 !important;box-shadow:none !important;}}
</style>
</head>
<body>

<div class="device">
  <div class="notch"></div>
  <div class="statusbar"><span id="clock">9:41</span><div class="icons"><span>•••• LTE</span><span>🔋 100%</span></div></div>

  <div class="header">
    <div class="header-row"><div class="title">Чатҳо</div><div class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4A94A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg></div></div>
    <div class="ornament"></div>
  </div>

  <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7F97" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg><input type="text" id="searchInput" placeholder="Ҷустуҷӯи дӯстон ё чатҳо"></div>

  <div class="scroll">
    <div class="section-label"><div class="t">Дархостҳо</div><div class="count" id="reqCount">0 нав</div></div>
    <div class="requests-row" id="requestsRow"><div class="loading"><div class="spinner"></div>Боргирӣ...</div></div>
    <div class="divider-soft"></div>
    <div class="section-label" style="padding-top:14px;"><div class="t">Дӯстон</div><div class="count" id="friendCount">0 фаъол</div></div>
    <div class="chat-list" id="chatList"><div class="loading"><div class="spinner"></div>Боргирӣ...</div></div>
  </div>

  <div class="navbar">
    <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🏠</span><span>Асосӣ</span></div>
    <div class="nav-item" onclick="location.href='kitobho.html'"><span class="nav-icon">📚</span><span>Китобҳо</span></div>
    <div class="nav-item" onclick="location.href='winners.html'"><span class="nav-icon">🏆</span><span>Ғолибон</span></div>
    <div class="nav-item" onclick="location.href='Lenta.html'"><span class="nav-icon">👥</span><span>Лента</span></div>
    <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span><span>Профил</span></div>
  </div>
</div>

<script>
(function(){
  const reqRow = document.getElementById('requestsRow');
  const chatList = document.getElementById('chatList');
  const reqCount = document.getElementById('reqCount');
  const friendCount = document.getElementById('friendCount');
  const searchInput = document.getElementById('searchInput');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initials = name => (String(name || 'К').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('') || 'К').toUpperCase();
  const clsList = ['c1','c2','c3','c4','c5','c6'];
  const getCls = i => clsList[Math.abs(i) % clsList.length];

  let friendsCache = [];

  function updateClock(){
    const d = new Date();
    document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  function setEmpty(){
    reqRow.innerHTML = '<div class="empty-hint">Дархости нав нест</div>';
    chatList.innerHTML = '<div class="empty-hint">Барои оғози чат аввал дӯст ҷӯед</div>';
    reqCount.textContent = '0 нав';
    friendCount.textContent = '0 фаъол';
  }

  async function getProfileMap(ids){
    const map = new Map();
    const unique = [...new Set(ids.filter(Boolean))];
    await Promise.all(unique.map(async id => {
      try {
        const p = await apiGet('profiles', {eq:{column:'id', value:id}, single:true});
        if(p) map.set(id, p);
      } catch(_) {}
    }));
    return map;
  }

  async function acceptRequest(id){
    try { await apiPatch('friend_requests', 'id', id, {status: 'accepted'}); await loadData(); } catch(e) {}
  }
  async function declineRequest(id){
    try { await apiPatch('friend_requests', 'id', id, {status: 'declined'}); await loadData(); } catch(e) {}
  }
  window.acceptRequest = acceptRequest;
  window.declineRequest = declineRequest;

  function formatTime(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    const mins = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if(mins < 1) return 'Танаффус';
    if(mins < 60) return mins + ' дақ';
    if(hours < 24) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    if(days === 1) return 'Дирӯз';
    if(days < 7) return ['Яш', 'Дш', 'Сш', 'Чш', 'Пш', 'Шб', 'Як'][d.getDay()] || '';
    return d.getDate() + ' ' + ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
  }

  function renderFriends(){
    const q = (searchInput?.value || '').trim().toLowerCase();
    const filtered = friendsCache.filter(x => !q || x.name.toLowerCase().includes(q));
    if(filtered.length === 0){
      chatList.innerHTML = '<div class="empty-hint">Дӯстон ёфт нашуд</div>';
      return;
    }
    chatList.innerHTML = filtered.map(x =>
      '<div class="chat-item" onclick="location.href=\'chat.html?to=' + encodeURIComponent(x.id) + '&name=' + encodeURIComponent(x.name) + '\'">' +
      '<div class="avatar-wrap"><div class="avatar ' + (x.ring ? 'ring' : '') + ' ' + x.cls + '">' + esc(initials(x.name)) + '</div>' +
      (x.online ? '<div class="online-dot"></div>' : '') + '</div>' +
      '<div class="chat-mid"><div class="chat-top"><div class="chat-name">' + esc(x.name) + '</div><div class="chat-time">' + (x.time || '') + '</div></div>' +
      '<div class="chat-bottom"><div class="chat-msg">' + (x.lastMsg || 'Паёмҳо баъди навиштан') + '</div></div></div></div>'
    ).join('');
  }

  async function loadData(){
    setEmpty();
    try {
      const { data } = await AUTH.getUser();
      const user = data.user;
      if(!user){
        reqRow.innerHTML = '<div class="empty-hint">Логин шавед</div>';
        chatList.innerHTML = '<div class="empty-hint">Логин шавед</div>';
        return;
      }

      // Requests from server
      try {
        const requests = await ChatAPI.getFriendRequests(user.id);
        reqCount.textContent = requests.length + ' нав';
        if(requests.length > 0){
          const profiles = await getProfileMap(requests.map(r => r.from_user));
          reqRow.innerHTML = requests.map(r => {
            const p = profiles.get(r.from_user) || {};
            const name = p.display_name || p.full_name || 'Китобхон';
            return '<div class="req-card"><div class="req-avatar ' + getCls(r.from_user?.charCodeAt(0) || 0) + '">' + esc(initials(name)) + '</div>' +
              '<div class="req-name">' + esc(name) + '</div>' +
              '<div class="req-actions"><button class="btn-mini accept" onclick="acceptRequest(\'' + r.id + '\')">Қабул</button>' +
              '<button class="btn-mini decline" onclick="declineRequest(\'' + r.id + '\')">Рад</button></div></div>';
          }).join('');
        } else {
          reqRow.innerHTML = '<div class="empty-hint">Дархости нав нест</div>';
        }
      } catch(e) { reqRow.innerHTML = '<div class="empty-hint">Дархости нав нест</div>'; }

      // Friends from server
      try {
        const friends = await ChatAPI.getFriends(user.id);
        friendCount.textContent = friends.length + ' фаъол';
        const profiles = await getProfileMap(friends);
        
        friendsCache = friends.map((id, i) => {
          const p = profiles.get(id) || {};
          const name = p.display_name || p.full_name || 'Китобхон';
          return { id, name, cls: getCls(i), ring: i % 3 === 0, online: i % 4 === 0, lastMsg: 'Паёмҳо баъди навиштан', time: '' };
        });

        if(friendsCache.length === 0){
          chatList.innerHTML = '<div class="empty-hint">Барои оғози чат аввал дӯст ҷӯед</div>';
        } else {
          renderFriends();
        }
      } catch(e) {
        chatList.innerHTML = '<div class="empty-hint">Барои оғози чат аввал дӯст ҷӯед</div>';
      }
    } catch(e) { setEmpty(); }
  }

  if(searchInput) searchInput.addEventListener('input', renderFriends);
  loadData();
})();
</script>

</body>
</html>
