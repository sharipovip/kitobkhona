<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1726">
<title>Китобҳои серхонандарин · Китобхона</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<script src="config.js?v=75"></script>
<style>
  :root {
    --bg: #0B1726;
    --card: #152840;
    --card2: #1B3150;
    --gold: #DCB55E;
    --gold2: #F2D58A;
    --text: #F6EEDB;
    --muted: #9FB0C5;
    --line: rgba(220,181,94,0.18);
    --gold-glow: rgba(220,181,94,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; background: #05090f; color: var(--text);
    font-family: "Noto Sans", Arial, sans-serif;
  }
  .app {
    max-width: 480px; min-height: 100dvh; margin: 0 auto;
    background: var(--bg); display: flex; flex-direction: column;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0) + 12px) 14px 12px;
    background: rgba(11, 23, 38, 0.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .btn-back {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 19px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    text-decoration: none;
  }
  .top-title { font-size: 17px; font-weight: 800; color: var(--gold2); display: flex; align-items: center; gap: 6px; }

  .period-tabs {
    display: flex; gap: 6px; padding: 12px 14px; background: rgba(0,0,0,0.15);
  }
  .tab-btn {
    flex: 1; padding: 9px 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 700;
    cursor: pointer; text-align: center; transition: all .2s ease;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #1a1303; border-color: transparent;
  }

  .content-list {
    flex: 1; padding: 10px 14px 80px; display: flex; flex-direction: column; gap: 10px;
  }
  .book-item {
    display: flex; gap: 12px; align-items: center;
    background: linear-gradient(145deg, rgba(21,40,64,0.85), rgba(27,49,80,0.65));
    border: 1px solid var(--line); border-radius: 16px; padding: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); position: relative;
    cursor: pointer; transition: transform .15s ease;
  }
  .book-item:active { transform: scale(0.985); }
  .rank-badge {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px;
    font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    color: #fff; background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2);
  }
  .rank-1 { background: linear-gradient(135deg, #F3D896, #B68B33); color: #241a05; border-color: #F3D896; }
  .rank-2 { background: linear-gradient(135deg, #EDEFF1, #8B919B); color: #1c1f22; border-color: #EDEFF1; }
  .rank-3 { background: linear-gradient(135deg, #E9C09A, #8A5B33); color: #241404; border-color: #E9C09A; }

  .book-cover {
    width: 64px; height: 86px; border-radius: 10px; flex-shrink: 0;
    overflow: hidden; background: #0b1420; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; }
  .book-cover .placeholder { font-size: 26px; }

  .book-info { flex: 1; min-width: 0; }
  .book-title {
    font-size: 14.5px; font-weight: 750; color: #FFFFFF; line-height: 1.35;
    margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .book-author {
    font-size: 12px; color: var(--gold); margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-stats {
    display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted);
  }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px;
  }

  .btn-read {
    align-self: center; flex-shrink: 0;
    padding: 9px 14px; border-radius: 12px; border: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #1b1202; font-weight: 800; font-size: 12px; cursor: pointer;
  }

  .empty-box {
    text-align: center; padding: 48px 16px; color: var(--muted);
    font-size: 14px; line-height: 1.6;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid rgba(220,181,94,0.25);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 30px auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<style id="app-scrollbar-policy">
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <a class="btn-back" href="index.html" aria-label="Бозгашт">←</a>
      <div class="top-title">🔥 Китобҳои серхонандарин</div>
    </div>
  </div>

  <div class="period-tabs">
    <button class="tab-btn active" data-period="all" onclick="changePeriod('all', this)">Ҳама вақт</button>
    <button class="tab-btn" data-period="month" onclick="changePeriod('month', this)">Ин моҳ</button>
    <button class="tab-btn" data-period="week" onclick="changePeriod('week', this)">Ин ҳафта</button>
  </div>

  <div class="content-list" id="booksList">
    <div class="spinner"></div>
  </div>
</div>

<script>
let currentPeriod = 'all';

function formatHours(mins) {
  const m = Math.max(0, Math.round(Number(mins || 0)));
  if (m < 60) return m + ' дақ';
  const h = Math.floor(m / 60), rem = m % 60;
  return h + ' соат' + (rem ? ' ' + rem + ' дақ' : '');
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function loadBooks(period = 'all') {
  const listEl = document.getElementById('booksList');
  const cacheKey = 'kk_cache_popular_' + period;
  let cached = null;
  try {
    cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (Array.isArray(cached) && cached.length) {
      renderBooks(cached);
    }
  } catch(e) {}

  if (!cached) {
    listEl.innerHTML = '<div class="spinner"></div>';
  }

  try {
    const url = KITOB_CONFIG.EDGE_API_BASE + '/api/popular-books?period=' + encodeURIComponent(period) + '&_t=' + Date.now();
    const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) throw new Error('Хатогӣ дар пайвастшавӣ');
    const data = await resp.json();
    if (Array.isArray(data)) {
      try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch(e) {}
      renderBooks(data);
    }
  } catch (err) {
    console.warn('Load popular books error:', err);
    if (!cached) {
      listEl.innerHTML = '<div class="empty-box">⚠️ Китобҳои серхонандарин муваққатан дастрас нестанд.<br>Лутфан пайвасти худро санҷед.</div>';
    }
  }
}

function renderBooks(books) {
  const listEl = document.getElementById('booksList');
  if (!books || !books.length) {
    listEl.innerHTML = '<div class="empty-box">Дар ин давра ҳоло маълумот нест.</div>';
    return;
  }

  listEl.innerHTML = books.map((b, idx) => {
    const rank = idx + 1;
    const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const title = b.book_title || b.title || 'Китоб';
    const author = b.book_author || b.author || 'Муаллиф номаълум';
    const cover = b.cover_url || '';
    const readingTime = formatHours(b.total_minutes);
    const sessions = Number(b.sessions_count || 0);
    const pdfUrl = b.pdf_url || '';

    return `
      <div class="book-item" onclick="openBook('${esc(pdfUrl)}', '${esc(title)}', '${esc(cover)}')">
        <div class="rank-badge ${rankClass}">${medal}</div>
        <div class="book-cover">
          ${cover ? `<img src="${esc(cover)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><div class="placeholder" style="display:none;">📖</div>` : `<div class="placeholder">📖</div>`}
        </div>
        <div class="book-info">
          <div class="book-title">${esc(title)}</div>
          <div class="book-author">${esc(author)}</div>
          <div class="book-stats">
            <span class="stat-pill">⏱ ${readingTime}</span>
            <span class="stat-pill">👥 ${sessions} хониш</span>
          </div>
        </div>
        <button class="btn-read" onclick="event.stopPropagation();openBook('${esc(pdfUrl)}', '${esc(title)}', '${esc(cover)}')">Хондан</button>
      </div>
    `;
  }).join('');
}

function openBook(url, title, cover) {
  if (!url) {
    location.href = 'kitobho.html';
    return;
  }
  const params = new URLSearchParams();
  params.set('url', url);
  params.set('name', title || 'Китоб');
  if (cover) params.set('cover', cover);
  location.href = 'reader.html?' + params.toString();
}

function changePeriod(period, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = period;
  loadBooks(period);
}

loadBooks('all');
</script>
</body>
</html>
