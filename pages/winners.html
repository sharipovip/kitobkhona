<!DOCTYPE html>
<html lang="tg" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ғолибон · Китобхона</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07101d;--card:#101b2d;--card2:#16243a;--border:#24344d;--text:#eadfc8;--muted:#8da0b8;--gold:#c8962e;--green:#10b981;--red:#dc2626;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(200,150,46,.12),transparent 32%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100dvh}.app{max-width:720px;margin:0 auto;padding:14px 12px 88px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px}.title{font-size:22px;font-weight:900;letter-spacing:.3px}.sub{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:9px 13px;font-weight:700}.tab.on{background:linear-gradient(135deg,var(--gold),#e2ac42);color:#1b1202;border-color:var(--gold)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-weight:900;color:var(--gold)}.rank.r1{background:#fbbf24;color:#1b1202}.rank.r2{background:#cbd5e1;color:#111827}.rank.r3{background:#d97706;color:#fff}.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e2ac42);display:grid;place-items:center;font-size:24px;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:2px}.score{text-align:right}.hours{font-weight:900;color:var(--gold);font-size:18px}.books{font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:40px 15px}.loader{width:28px;height:28px;border-radius:50%;border:3px solid rgba(200,150,46,.2);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}button,.card{transition:transform .12s ease}button:active,.card:active{transform:scale(.97)}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(16,27,45,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bn{color:var(--muted);text-decoration:none;text-align:center;font-size:10px;font-weight:700}.bn span{display:block;font-size:20px;margin-bottom:2px}.bn.on{color:var(--gold)}
</style></head>
<body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><div><div class="title">🏆 Ғолибон</div><div class="sub">Китобхонҳои фаъол аз рӯйи соатҳои ҳақиқии хондан</div></div></div><div class="tabs"><button class="tab on" onclick="setRange('all',this)">Ҳама</button><button class="tab" onclick="setRange('week',this)">Ҳафта</button><button class="tab" onclick="setRange('month',this)">Моҳ</button><button class="tab" onclick="setRange('age',this)">Синну сол</button><button class="tab" onclick="setRange('region',this)">Вилоят</button></div><section id="list"><div class="loader"></div></section></main><nav class="bottom"><a class="bn" href="../index.html"><span>🏠</span>Асосӣ</a><a class="bn" href="../index.html#search"><span>🔍</span>Ҷустуҷӯ</a><a class="bn" href="../index.html#books"><span>📚</span>Китобҳо</a><a class="bn on" href="winners.html"><span>🏆</span>Ғолибон</a><a class="bn" href="profile.html"><span>👤</span>Профил</a></nav><script>
const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true}});let RANGE='all';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setRange(r,btn){RANGE=r;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===btn));load()}
async function load(){const root=document.getElementById('list');root.innerHTML='<div class="loader"></div>';try{let q=supa.from('v_winners').select('*').order('valid_seconds',{ascending:false}).limit(100);const {data,error}=await q;if(error)throw error;if(!data?.length){root.innerHTML='<div class="empty">Ҳоло маълумот нест. Вақте корбарон 10+ дақиқа китоб мехонанд, натиҷаҳо пайдо мешаванд.</div>';return}root.innerHTML=data.map((u,i)=>`<div class="card"><div class="rank ${i==0?'r1':i==1?'r2':i==2?'r3':''}">${i+1}</div><div class="av">${u.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc(u.avatar_emoji||'👤')}</div><div class="info"><div class="name">${esc(u.display_name)}</div><div class="meta">${esc([u.city,u.region,u.age_group].filter(Boolean).join(' · '))}</div></div><div class="score"><div class="hours">${Number(u.valid_hours||0).toFixed(1)}с</div><div class="books">${u.books_read||0} китоб</div></div></div>`).join('')}catch(e){root.innerHTML='<div class="empty">Хатогӣ: '+esc(e.message||e)+'</div>'}}
load();
</script></body></html>
