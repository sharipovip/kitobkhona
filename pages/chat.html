<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Чат · Китобхона</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b141a;--head:#075e54;--head2:#064d45;--me:#dcf8c6;--them:#fff;--text:#111827;--muted:#6b7280;--line:#d8d8d8;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;color:var(--text);font-family:'Segoe UI',Arial,sans-serif}.phone{max-width:430px;margin:0 auto;height:100dvh;background:#efe7da;display:flex;flex-direction:column;position:relative}.phone:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(0,0,0,.03) 0 2px,transparent 3px),radial-gradient(circle at 80% 70%,rgba(0,0,0,.025) 0 2px,transparent 3px);background-size:38px 38px;pointer-events:none}.top{height:58px;background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.25)}.back{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:25px}.avatar{width:40px;height:40px;border-radius:50%;background:#e2f3ee;display:grid;place-items:center;font-size:21px;color:#064d45}.info{flex:1;min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;opacity:.85;margin-top:1px}.hbtn{width:34px;height:34px;border:0;background:transparent;color:#fff;font-size:20px}.day{align-self:center;margin:10px 0 4px;background:rgba(255,255,255,.75);border-radius:9px;padding:5px 10px;font-size:11px;color:#667085;box-shadow:0 1px 2px rgba(0,0,0,.08)}.messages{flex:1;overflow-y:auto;padding:8px 9px 8px;display:flex;flex-direction:column;z-index:1}.msg{max-width:82%;margin:3px 0;padding:7px 8px 5px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:14px;line-height:1.35;position:relative;word-wrap:break-word}.msg.them{align-self:flex-start;background:var(--them);border-top-left-radius:2px}.msg.me{align-self:flex-end;background:var(--me);border-top-right-radius:2px}.time{display:inline-block;margin-left:8px;float:right;font-size:10px;color:#667085;transform:translateY(4px)}.ticks{font-size:11px;color:#34b7f1;margin-left:2px}.composer{display:flex;align-items:flex-end;gap:6px;padding:7px 7px calc(7px + var(--safe));background:#f0f0f0;z-index:2}.inputbox{flex:1;background:#fff;border-radius:22px;display:flex;align-items:center;gap:6px;padding:5px 8px;box-shadow:0 1px 2px rgba(0,0,0,.08)}.emoji,.attach{border:0;background:transparent;color:#667085;font-size:22px;width:30px;height:30px}.text{flex:1;min-height:30px;max-height:100px;border:0;outline:0;resize:none;font:inherit;padding:6px 2px;background:transparent}.send{width:44px;height:44px;border:0;border-radius:50%;background:#128c7e;color:#fff;font-size:19px;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.2)}.notice{margin:8px auto;color:#5b6678;font-size:12px;background:rgba(255,255,255,.68);border-radius:10px;padding:7px 10px;text-align:center;max-width:92%}.menu{position:absolute;top:56px;right:8px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:5;overflow:hidden}.menu.on{display:block}.menu button{display:block;width:180px;border:0;background:#fff;text-align:left;padding:12px;font-size:14px}.menu button:active{background:#eee}@media(min-width:700px){.phone{box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 60px rgba(0,0,0,.55)}}
</style>
</head>
<body>
<div class="phone">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="avatar" id="peerAvatar">👤</div><div class="info"><div class="name" id="peerName">Китобхона чат</div><div class="status" id="peerStatus">онлайн барои тест</div></div><button class="hbtn" onclick="callSoon()">☎</button><button class="hbtn" onclick="toggleMenu()">⋮</button></header>
<div class="menu" id="menu"><button onclick="clearChat()">Тоза кардани чат</button><button onclick="location.href='../profile.html'">Профил</button></div>
<main class="messages" id="messages"><div class="day">ИМРӮЗ</div></main>
<footer class="composer"><div class="inputbox"><button class="emoji" onclick="insertEmoji('😊')">☺</button><textarea class="text" id="text" placeholder="Паём нависед..." rows="1"></textarea><button class="attach" onclick="attachSoon()">📎</button></div><button class="send" onclick="sendMsg()">➤</button></footer>
</div>
<script>
const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';
const supa=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;const $=id=>document.getElementById(id);const qs=new URL(location.href).searchParams;const receiver=qs.get('to')||'test';let USER=null,LOCAL_KEY='kk_chat_'+receiver;
function now(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localProfile(){try{return JSON.parse(localStorage.getItem('kk_local_profile')||'{}')}catch(e){return {}}}
function getLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch(e){return []}}function setLocal(a){localStorage.setItem(LOCAL_KEY,JSON.stringify(a))}
function render(list=getLocal()){const box=$('messages');box.innerHTML='<div class="day">ИМРӮЗ</div>';if(!list.length)box.innerHTML+='<div class="notice">Чат барои тест кушода аст. Паём нависед.</div>';list.forEach(m=>{box.innerHTML+=`<div class="msg ${m.me?'me':'them'}">${esc(m.text)} <span class="time">${m.time||''}${m.me?'<span class="ticks"> ✓✓</span>':''}</span></div>`});box.scrollTop=box.scrollHeight}
async function init(){const lp=localProfile();if(lp.display_name){$('peerName').textContent=qs.get('name')||'Чат · '+lp.display_name;$('peerAvatar').textContent=lp.avatar_emoji||'👤'}try{if(supa){const {data}=await supa.auth.getUser();USER=data.user||null}}catch(e){}render();loadRemote()}
async function loadRemote(){if(!supa||!USER||receiver==='test')return;try{const {data}=await supa.from('chat_messages').select('*').or(`and(sender_id.eq.${USER.id},receiver_id.eq.${receiver}),and(sender_id.eq.${receiver},receiver_id.eq.${USER.id})`).order('created_at');if(data&&data.length){render(data.map(m=>({text:m.text,me:m.sender_id===USER.id,time:new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})})))}}catch(e){}}
async function sendMsg(){const t=$('text').value.trim();if(!t)return;$('text').value='';const arr=getLocal();arr.push({text:t,me:true,time:now()});setLocal(arr);render(arr);if(supa&&USER&&receiver!=='test'){try{await supa.functions.invoke('send_message',{body:{receiver_id:receiver,text:t}})}catch(e){}}setTimeout(()=>{const a=getLocal();if(receiver==='test'){a.push({text:'Паём қабул шуд. Ин ҷавоби тестӣ аст.',me:false,time:now()});setLocal(a);render(a)}},600)}
function insertEmoji(e){$('text').value+=e;$('text').focus()}function toggleMenu(){$('menu').classList.toggle('on')}function clearChat(){if(confirm('Чат тоза шавад?')){setLocal([]);render();toggleMenu()}}function callSoon(){alert('Занг баъдтар илова мешавад.')}function attachSoon(){alert('Файлҳо баъдтар илова мешаванд.')}$('text').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'});init();
</script>
</body></html>
