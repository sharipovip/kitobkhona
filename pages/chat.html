<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Чат · Китобхона</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101d;--card:#101b2d;--card2:#16243a;--border:#24344d;--text:#eadfc8;--muted:#8da0b8;--gold:#c8962e;--red:#ef4444;--green:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100dvh}.app{max-width:720px;margin:0 auto;padding:12px 12px 92px}.top{display:flex;gap:10px;align-items:center}.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px}.title{font-size:22px;font-weight:900}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin:12px 0}.req{display:grid;gap:8px}.row{display:flex;justify-content:space-between;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px}.ok{color:var(--green)}.no{color:var(--red)}.chatbox{height:50vh;overflow:auto;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:10px}.msg{padding:9px 11px;border-radius:14px;background:var(--card);margin:6px 0;max-width:82%}.me{margin-left:auto;background:rgba(200,150,46,.16);border:1px solid rgba(200,150,46,.25)}.send{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:flex;gap:6px;background:rgba(16,27,45,.96);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:12px}button{transition:transform .12s}button:active{transform:scale(.97)}.btn{border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),#e2ac42);color:#1a1202;font-weight:900;padding:0 16px}.wait{display:none;align-items:center;gap:8px;color:var(--muted);font-size:12px}.wait span{width:18px;height:18px;border-radius:50%;border:2px solid rgba(200,150,46,.25);border-top-color:var(--gold);animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.small{font-size:12px;color:var(--muted);line-height:1.5}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><div class="title">💬 Чат</div></div><section id="gate" class="card" style="display:none"></section><section id="chat"><div class="chatbox" id="messages"></div></section></main><div class="send" id="sendBar" style="display:flex"><input id="text" placeholder="Паём..."><button class="btn" id="sendBtn" onclick="sendMsg()">➤</button><div id="wait" class="wait"><span></span></div></div><script>const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true}});const receiver_id=new URL(location.href).searchParams.get('to');function row(t,ok,sub=''){return `<div class="row"><span>${t}</span><b class="${ok?'ok':'no'}">${ok?'✓':'×'}</b></div>${sub?`<div class="small">${sub}</div>`:''}`}async function init(){let cfg={test_open:true};try{const{data}=await supa.from('app_settings').select('value').eq('key','chat').maybeSingle();if(data?.value)cfg=data.value}catch(e){}if(cfg.test_open===false){gate.style.display='block';chat.style.display='none';sendBar.style.display='none';elig.innerHTML='<div class="small">Чат ҳоло аз тарафи админ маҳдуд шудааст.</div>';return}gate.style.display='none';chat.style.display='';sendBar.style.display='flex';loadMessages()}async function loadMessages(){const{data}= receiver_id ? await supa.from('chat_messages').select('*').or(`sender_id.eq.${receiver_id},receiver_id.eq.${receiver_id}`).order('created_at') : {data:[]};messages.innerHTML=(data||[]).map(m=>`<div class="msg ${m.receiver_id==receiver_id?'me':''}">${m.text}</div>`).join('')}async function sendMsg(){const text=document.getElementById('text').value.trim();if(!text)return;wait.style.display='flex';sendBtn.style.display='none';try{const{data,error}=await supa.functions.invoke('send_message',{body:{receiver_id,text}});if(error||!data?.ok){alert(data?.message||data?.error||error?.message||'Хатогӣ');return}document.getElementById('text').value='';loadMessages()}finally{wait.style.display='none';sendBtn.style.display=''}}init();</script></body></html>
