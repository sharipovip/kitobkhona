<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Баҳодиҳӣ · Китобхона</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101d;--card:#101b2d;--card2:#16243a;--border:#24344d;--text:#eadfc8;--muted:#8da0b8;--gold:#c8962e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}.app{max-width:720px;margin:0 auto;padding:14px 12px 80px}.top{display:flex;gap:10px;align-items:center}.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px}.title{font-size:22px;font-weight:900}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin:12px 0}.stars{display:flex;gap:7px;font-size:34px}.star{filter:grayscale(1);opacity:.5}.star.on{filter:none;opacity:1;color:var(--gold)}textarea{width:100%;min-height:90px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:12px;font:inherit}.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),#e2ac42);color:#1a1202;font-weight:900;padding:12px;margin-top:10px}.comment{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px;margin:8px 0}.meta{font-size:11px;color:var(--muted);margin-top:5px}button,.star{transition:transform .12s}button:active,.star:active{transform:scale(.94)}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><div><div class="title">⭐ Баҳодиҳӣ</div><div id="bookName" style="color:var(--muted);font-size:12px"></div></div></div><section class="card"><h3>Ба китоб баҳо диҳед</h3><div class="stars" id="stars"></div><textarea id="comment" placeholder="Фикри худро нависед..."></textarea><button class="btn" onclick="save()">Фиристодан</button><div id="msg" class="meta"></div></section><section class="card"><h3>Шарҳҳо</h3><div id="comments"><div class="meta">Боркунӣ...</div></div></section></main><script>const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true}});const qs=new URL(location.href).searchParams;const book_url=qs.get('url')||'';const book_name=qs.get('name')||'Китоб';let rating=5;bookName.textContent=book_name;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderStars(){stars.innerHTML=[1,2,3,4,5].map(i=>`<span class="star ${i<=rating?'on':''}" onclick="rating=${i};renderStars()">⭐</span>`).join('')}async function save(){msg.textContent='⏳';const{data:u}=await supa.auth.getUser();if(!u.user){msg.textContent='Аввал ворид шавед';return}let e1=await supa.from('book_ratings').upsert({user_id:u.user.id,book_url,rating});if(e1.error){msg.textContent=e1.error.message;return}let text=comment.value.trim();if(text){let e2=await supa.from('book_comments').insert({user_id:u.user.id,book_url,text});if(e2.error){msg.textContent=e2.error.message;return}}comment.value='';msg.textContent='✓ Захира шуд';load()}async function load(){let{data,error}=await supa.from('book_comments').select('text,created_at,user_id').eq('book_url',book_url).eq('status','visible').order('created_at',{ascending:false}).limit(50);if(error){comments.innerHTML='<div class="meta">'+esc(error.message)+'</div>';return}comments.innerHTML=(data||[]).map(c=>`<div class="comment">${esc(c.text)}<div class="meta">${new Date(c.created_at).toLocaleDateString('ru-RU')}</div></div>`).join('')||'<div class="meta">Ҳоло шарҳ нест</div>'}renderStars();load();</script></body></html>
