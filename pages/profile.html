<!DOCTYPE html><html lang="tg" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Профил · Китобхона</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101d;--card:#101b2d;--card2:#16243a;--border:#24344d;--text:#eadfc8;--muted:#8da0b8;--gold:#c8962e;--green:#10b981;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100dvh}.app{max-width:720px;margin:0 auto;padding:14px 12px 88px}.top{display:flex;gap:10px;align-items:center}.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px}.title{font-size:22px;font-weight:900}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin:12px 0}.hero{text-align:center;background:linear-gradient(135deg,rgba(200,150,46,.14),rgba(16,185,129,.06)),var(--card)}.av{width:88px;height:88px;margin:0 auto 9px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e2ac42);display:grid;place-items:center;font-size:42px;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.name{font-size:20px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px;color:var(--gold)}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px}input,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:900;background:linear-gradient(135deg,var(--gold),#e2ac42);color:#1a1202;margin-top:12px}.btn.sec{background:var(--card2);border:1px solid var(--border);color:var(--text)}.msg{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(16,27,45,.96);border-top:1px solid var(--border);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bn{color:var(--muted);text-decoration:none;text-align:center;font-size:10px;font-weight:700}.bn span{display:block;font-size:20px}.bn.on{color:var(--gold)}button,.card{transition:transform .12s}button:active,.card:active{transform:scale(.97)}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><div class="title">👤 Профил</div></div><section id="auth" class="card"><h3>Воридшавӣ</h3><label>Email</label><input id="email" type="email" placeholder="you@example.com"><label>Парол</label><input id="pass" type="password" placeholder="••••••••"><button class="btn" onclick="login()">Ворид шудан</button><button class="btn sec" onclick="signup()">Сабти ном</button><div class="msg" id="authMsg"></div></section><section id="profile" style="display:none"><div class="card hero"><div class="av" id="avatar">👤</div><div class="name" id="pName">Китобхон</div><div class="sub" id="pSub">—</div></div><div class="grid"><div class="stat"><b id="hours">0</b>соат</div><div class="stat"><b id="books">0</b>китоб</div></div><div class="card"><h3>Маълумот</h3><label>Ном</label><input id="display_name"><label>Ному насаб</label><input id="full_name"><label>Соли таваллуд</label><input id="birth_year" type="number" min="1900" max="2026"><label>Вилоят/шаҳр</label><select id="region"></select><label>Шаҳр/ноҳия</label><input id="city" placeholder="Душанбе, Хуҷанд..."><label>Деҳа/ҷамоат</label><input id="village"><button class="btn" onclick="saveProfile()">Захира</button><button class="btn sec" onclick="logout()">Баромадан</button><div class="msg" id="pMsg"></div></div></section></main><nav class="bottom"><a class="bn" href="../index.html"><span>🏠</span>Асосӣ</a><a class="bn" href="../index.html#search"><span>🔍</span>Ҷустуҷӯ</a><a class="bn" href="../index.html#books"><span>📚</span>Китобҳо</a><a class="bn" href="winners.html"><span>🏆</span>Ғолибон</a><a class="bn on" href="profile.html"><span>👤</span>Профил</a></nav><script>const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true}});let USER=null;function $(id){return document.getElementById(id)}function msg(id,t){$(id).textContent=t||''}async function loadRegions(){try{let j=await fetch('../data/tajikistan_locations.json').then(r=>r.json());$('region').innerHTML='<option value="">—</option>'+j.regions.map(r=>`<option>${r.name}</option>`).join('')}catch(e){$('region').innerHTML='<option>Душанбе</option><option>Суғд</option><option>Хатлон</option><option>ВМКБ</option><option>НТҶ</option>'}}async function login(){msg('authMsg','⏳');const{data,error}=await supa.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)return msg('authMsg',error.message);USER=data.user;await show()}async function signup(){msg('authMsg','⏳');const{data,error}=await supa.auth.signUp({email:$('email').value.trim(),password:$('pass').value});if(error)return msg('authMsg',error.message);msg('authMsg','Почтаро санҷед ё ворид шавед');}async function logout(){await supa.auth.signOut();location.reload()}async function show(){if(!USER){const{data}=await supa.auth.getUser();USER=data.user}if(!USER)return;$('auth').style.display='none';$('profile').style.display='';let{data:p}=await supa.from('profiles').select('*').eq('id',USER.id).maybeSingle();if(!p){await supa.from('profiles').insert({id:USER.id,display_name:'Китобхон'});p={display_name:'Китобхон'}}$('pName').textContent=p.display_name||p.full_name||'Китобхон';$('avatar').textContent=p.avatar_emoji||'👤';$('pSub').textContent=[p.city,p.region].filter(Boolean).join(' · ')||USER.email;$('display_name').value=p.display_name||'';$('full_name').value=p.full_name||'';$('birth_year').value=p.birth_year||'';$('region').value=p.region||'';$('city').value=p.city||'';$('village').value=p.village||'';let{data:w}=await supa.from('v_winners').select('valid_hours,books_read').eq('user_id',USER.id).maybeSingle();$('hours').textContent=Number(w?.valid_hours||0).toFixed(1);$('books').textContent=w?.books_read||0}async function saveProfile(){if(!USER)return;msg('pMsg','⏳');let patch={id:USER.id,display_name:$('display_name').value.trim(),full_name:$('full_name').value.trim(),birth_year:+$('birth_year').value||null,region:$('region').value,city:$('city').value.trim(),village:$('village').value.trim()};let{error}=await supa.from('profiles').upsert(patch);msg('pMsg',error?error.message:'✓ Захира шуд');await show()}loadRegions().then(show);</script></body></html>
