<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Хонандагон · Китобхона</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101d;--card:#101b2d;--card2:#16243a;--border:#24344d;--text:#eadfc8;--muted:#8da0b8;--gold:#c8962e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}.app{max-width:720px;margin:0 auto;padding:14px 12px 80px}.top{display:flex;gap:10px;align-items:center}.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px}.title{font-size:22px;font-weight:900}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center}.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e2ac42);display:grid;place-items:center;font-size:26px}.info{flex:1}.name{font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:12px;padding:9px 12px;font-weight:800}.loader{width:28px;height:28px;border-radius:50%;border:3px solid rgba(200,150,46,.2);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:30px auto}@keyframes spin{to{transform:rotate(360deg)}}button,.card{transition:transform .12s}button:active,.card:active{transform:scale(.97)}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><div><div class="title">👥 Хонандагон</div><div style="color:var(--muted);font-size:12px">Профилҳои ҷамъиятии китобхонҳо</div></div></div><section id="list"><div class="loader"></div></section></main><script>const SUPA_URL='https://dwkdzfqooprxytlepaoo.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2R6ZnFvb3ByeHl0bGVwYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5ODIsImV4cCI6MjA5NjQ3ODk4Mn0.4rV_7yN5Urx5WHgb9kAxWo_VmrPWGlbFYN4Ij7DcuyI';const supa=window.supabase.createClient(SUPA_URL,KEY,{auth:{persistSession:true}});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const{data,error}=await supa.from('v_winners').select('*').order('valid_seconds',{ascending:false}).limit(100);if(error)throw error;list.innerHTML=(data||[]).map(u=>`<div class="card"><div class="av">${esc(u.avatar_emoji||'👤')}</div><div class="info"><div class="name">${esc(u.display_name)}</div><div class="meta">${esc([u.city,u.region,u.age_group].filter(Boolean).join(' · '))}<br>⏱ ${Number(u.valid_hours||0).toFixed(1)} соат · 📚 ${u.books_read||0} китоб</div></div><button class="btn" onclick="location.href='profile.html?user=${u.user_id}'">Профил</button></div>`).join('')||'<p style="color:var(--muted);text-align:center">Ҳоло корбаре нест</p>'}catch(e){list.innerHTML='<p style="color:var(--muted);text-align:center">Аввал SQL-ро дар Supabase насб кунед: '+esc(e.message)+'</p>'}}load();</script></body></html>
