<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Китобхона — Лента</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700;900&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1726;
    --bg-2: #0E2034;
    --card: #152840;
    --card-2: #1B3150;
    --card-soft: #10233A;
    --gold: #DCB55E;
    --gold-deep: #B68B33;
    --gold-soft: rgba(220,181,94,0.14);
    --green: #4F9D70;
    --green-soft: rgba(79,157,112,0.14);
    --red: #BD5650;
    --red-soft: rgba(189,86,80,0.14);
    --teal: #4C92AE;
    --teal-soft: rgba(76,146,174,0.14);
    --cream: #F3ECDD;
    --cream-dim: #C9C0AC;
    --muted: #8CA0B8;
    --line: rgba(220,181,94,0.16);
    --shadow: 0 18px 40px -12px rgba(0,0,0,0.55);
    --border: rgba(220,181,94,0.12);
    --glass: rgba(13,27,42,0.85);
  }
  [data-theme="light"] {
    --bg: #F3EEE2;
    --bg-2: #EAE2D2;
    --card: #FFFFFF;
    --card-2: #FBF7EE;
    --card-soft: #F4EEE0;
    --gold: #B6863A;
    --gold-deep: #8F6A28;
    --gold-soft: rgba(182,134,58,0.12);
    --green: #3F7E58;
    --green-soft: rgba(63,126,88,0.12);
    --red: #A8463F;
    --red-soft: rgba(168,70,63,0.12);
    --teal: #386E83;
    --teal-soft: rgba(56,110,131,0.12);
    --cream: #23211B;
    --cream-dim: #5C5749;
    --muted: #7B7563;
    --line: rgba(182,134,58,0.22);
    --shadow: 0 14px 30px -10px rgba(60,50,30,0.25);
    --border: rgba(182,134,58,0.18);
    --glass: rgba(243,238,226,0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Noto Sans', sans-serif;
  }

  /* ============ PHONE WRAPPER (как index.html) ============ */
  .phone-wrapper {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ============ TOP HEADER ============ */
  .top-header {
    flex: 0 0 auto;
    padding: 12px 16px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--cream);
  }
  .header-actions { display: flex; gap: 8px; }
  .header-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }

  /* ============ MAIN CONTENT ============ */
  .main-content {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .main-content::-webkit-scrollbar { display: none; }

  /* ============ STORIES RAIL ============ */
  .stories-rail {
    display: flex;
    gap: 14px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .stories-rail::-webkit-scrollbar { display: none; }
  .story-item {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .story-ring {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(var(--gold), var(--red), var(--green), var(--gold));
  }
  .story-ring.seen { background: var(--line); }
  .story-ring.add { background: transparent; border: 2px dashed var(--gold); display: flex; align-items: center; justify-content: center; }
  .story-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--card-2);
    border: 3px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .story-name { font-size: 10px; color: var(--cream-dim); max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ============ FEED ============ */
  .feed {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 12px 16px;
  }

  /* Post card */
  .post-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .post-card.achieve { border-color: rgba(220,181,94,0.4); }

  .post-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .av {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 2px;
    background: conic-gradient(var(--gold), var(--teal), var(--green), var(--gold));
    flex: 0 0 auto;
  }
  .av-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--card-2);
    border: 2px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .post-head-text { flex: 1; min-width: 0; }
  .post-name { font-size: 14px; font-weight: 700; color: var(--cream); }
  .post-time { font-size: 11px; color: var(--muted); }

  .post-caption { font-size: 13px; color: var(--cream-dim); line-height: 1.45; margin-bottom: 12px; }

  /* Book block */
  .book-block {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .thumb {
    width: 50px;
    height: 70px;
    border-radius: 6px;
    flex: 0 0 auto;
    overflow: hidden;
    box-shadow: 0 4px 12px -4px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12%; background: rgba(0,0,0,0.2); }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-family: 'Noto Serif', serif; font-size: 14px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
  .book-author { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .chip-reading { color: var(--teal); background: var(--teal-soft); }
  .chip-finished { color: var(--green); background: var(--green-soft); }
  .chip-achieve { color: var(--gold); background: var(--gold-soft); }
  .progress-track { height: 4px; background: var(--line); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: 4px; }

  /* Book colors */
  .c1 { background: linear-gradient(160deg, #3a5f4f, #1d342b); }
  .c2 { background: linear-gradient(160deg, #7a5a28, #3e2c10); }
  .c3 { background: linear-gradient(160deg, #5d2f31, #2c1314); }
  .c4 { background: linear-gradient(160deg, #2b4a63, #142535); }
  .c5 { background: linear-gradient(160deg, #6e5a2e, #3a2d10); }

  /* Actions */
  .post-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .action-group { display: flex; gap: 16px; }
  .action-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .action-btn .ic { font-size: 18px; }
  .action-btn.liked { color: var(--red); }
  .save-btn { color: var(--muted); font-size: 20px; cursor: pointer; }
  .save-btn.saved { color: var(--gold); }

  /* Comments */
  .post-comments { margin-top: 8px; }
  .comment-line { font-size: 12px; color: var(--cream-dim); margin-bottom: 4px; }
  .comment-line b { color: var(--cream); font-weight: 700; }
  .view-comments { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 4px; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; color: var(--cream); margin-bottom: 8px; }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  /* ============ BOTTOM NAV ============ */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 12px 16px;
    background: linear-gradient(transparent, var(--bg) 30%);
    z-index: 80;
  }
  .bottom-nav-inner {
    max-width: 430px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px;
    backdrop-filter: blur(18px);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 2px;
    border-radius: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
  }
  .nav-item .ic { font-size: 20px; }
  .nav-item.active { background: rgba(220,181,94,0.12); color: var(--gold); }

  .content-spacer { height: 80px; }
</style>
</head>
<body>
<div class="phone-wrapper">
  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="header-title">📰 Лента</div>
    <div class="header-actions">
      <div class="header-btn" id="themeBtn">🌙</div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">
    <!-- Feed will be loaded here -->
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <div class="nav-item" onclick="location.href='index.html'">
        <div class="ic">🏠</div>
        <div>Асосӣ</div>
      </div>
      <div class="nav-item" onclick="location.href='kitobho.html'">
        <div class="ic">📚</div>
        <div>Китобҳо</div>
      </div>
      <div class="nav-item" onclick="location.href='winners.html'">
        <div class="ic">🏆</div>
        <div>Ғолибон</div>
      </div>
      <div class="nav-item active">
        <div class="ic">📰</div>
        <div>Лента</div>
      </div>
      <div class="nav-item" onclick="location.href='profile.html'">
        <div class="ic">👤</div>
        <div>Профил</div>
      </div>
    </div>
  </nav>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>'']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] || c));

// Theme toggle
document.getElementById('themeBtn')?.addEventListener('click', () => {
  const isDark = document.body.dataset.theme !== 'light';
  document.body.dataset.theme = isDark ? 'light' : 'dark';
  localStorage.setItem('kk_theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
});
if (localStorage.getItem('kk_theme') === 'light') {
  document.body.dataset.theme = 'light';
  document.getElementById('themeBtn').textContent = '☀️';
}

// Like/save toggle
function toggleLike(btn) {
  const icon = btn.querySelector('.ic');
  const liked = btn.classList.toggle('liked');
  icon.textContent = liked ? '♥' : '♡';
}
function toggleSave(btn) {
  btn.classList.toggle('saved');
}
function openBook(url, name) {
  if (url) location.href = `reader.html?url=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}`;
}

// Render feed from real data
function renderFeed(posts) {
  const colors = ['c1','c2','c3','c4','c5'];
  
  if (!posts || !posts.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="icon">📰</div>
        <h3>Лента холӣ аст</h3>
        <p>Вақте ки шумо ё дӯстонатон китобе хонед, он дар ин ҷо намоён мешавад</p>
      </div>
      <div class="content-spacer"></div>
    `;
    return;
  }
  
  let html = '';
  
  // Stories (always show "add your own")
  html += `
    <div class="stories-rail">
      <div class="story-item" onclick="location.href='kitobho.html'">
        <div class="story-ring add"><div class="story-inner">+</div></div>
        <div class="story-name">Нав</div>
      </div>
    </div>
  `;
  
  // Posts
  html += '<div class="feed">';
  posts.forEach(post => {
    const bookColor = colors[Math.abs(post.book_name?.charCodeAt(0) || 0) % colors.length];
    const timeAgo = formatTime(post.created_at);
    
    html += `
      <div class="post-card ${post.type === 'achievement' ? 'achieve' : ''}">
        <div class="post-head">
          <div class="av">
            <div class="av-inner">${post.avatar_emoji || '👤'}</div>
          </div>
          <div class="post-head-text">
            <div class="post-name">${esc(post.display_name || 'Китобхон')}</div>
            <div class="post-time">${timeAgo}</div>
          </div>
        </div>
        
        ${post.caption ? `<div class="post-caption">${esc(post.caption)}</div>` : ''}
        
        <div class="book-block" onclick="openBook('${encodeURIComponent(post.book_url || '')}', '${encodeURIComponent(post.book_name || '')}')">
          <div class="thumb ${bookColor}">
            ${post.book_cover ? `<img src="${esc(post.book_cover)}" alt="${esc(post.book_name)}">` : '📖'}
          </div>
          <div class="book-info">
            <div class="book-title">${esc(post.book_name || 'Китоб')}</div>
            <div class="book-author">${esc(post.book_author || '')}</div>
            <div class="status-chip ${post.status === 'finished' ? 'chip-finished' : post.type === 'achievement' ? 'chip-achieve' : 'chip-reading'}">
              ${post.status === 'finished' ? '✅ Хатм кард' : post.type === 'achievement' ? '🏆 ' + (post.achievement_name || 'Дастовард') : '📖 Дар ҳоли хондан'}
            </div>
            ${post.progress > 0 ? `<div class="progress-track"><div class="progress-fill" style="width:${post.progress}%"></div></div>` : ''}
          </div>
        </div>
        
        <div class="post-actions">
          <div class="action-group">
            <div class="action-btn" onclick="toggleLike(this)"><span class="ic">♡</span><span>${post.likes || 0}</span></div>
            <div class="action-btn"><span class="ic">💬</span><span>${post.comments || 0}</span></div>
            <div class="action-btn"><span class="ic">↗</span></div>
          </div>
          <div class="save-btn" onclick="toggleSave(this)">🔖</div>
        </div>
        
        ${post.comments_list?.length ? `
          <div class="post-comments">
            ${post.comments_list.slice(0, 2).map(c => `<div class="comment-line"><b>${esc(c.user_name)}:</b> ${esc(c.text)}</div>`).join('')}
            ${post.comments > 2 ? `<div class="view-comments">Боз ${post.comments - 2} шарҳ</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  });
  html += '</div>';
  html += '<div class="content-spacer"></div>';
  
  document.getElementById('mainContent').innerHTML = html;
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);
  if (diff < 60) return 'ҳозир';
  if (diff < 3600) return Math.floor(diff / 60) + ' дақиқа пеш';
  if (diff < 86400) return Math.floor(diff / 3600) + ' соат пеш';
  if (diff < 604800) return Math.floor(diff / 86400) + ' рӯз пеш';
  return date.toLocaleDateString('tg');
}

// Load feed
async function loadFeed() {
  try {
    const session = await AUTH.getSession();
    let posts = [];
    
    // Get reading sessions (user's reading activity)
    if (session?.user) {
      const sessions = await apiGet('reading_sessions', {
        eq: { column: 'user_id', value: session.user.id },
        order: 'created_at.desc',
        limit: 20
      });
      
      // Also get posts from friends
      const allPosts = [];
      
      if (sessions && sessions.length) {
        sessions.forEach(s => {
          if (s.book_name) {
            allPosts.push({
              user_id: s.user_id,
              display_name: 'Шумо',
              avatar_emoji: '👤',
              book_name: s.book_name,
              book_author: s.book_author,
              book_url: s.book_url,
              book_cover: s.book_cover,
              status: s.finished ? 'finished' : 'reading',
              progress: s.pages ? Math.round((s.current_page / s.pages) * 100) : 0,
              created_at: s.updated_at || s.created_at,
              likes: 0,
              comments: 0
            });
          }
        });
      }
      
      posts = allPosts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }
    
    renderFeed(posts);
    
  } catch(e) {
    console.log('Error:', e);
    renderFeed([]);
  }
}

// Init
loadFeed();
</script>
</body>
</html>
