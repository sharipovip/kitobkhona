<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Китобхона — Профил</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700;900&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1726;
    --bg-2: #0E2034;
    --card: #152840;
    --card-2: #1B3150;
    --card-soft: #10233A;
    --gold: #DCB55E;
    --gold-deep: #B68B33;
    --gold-soft: rgba(220,181,94,0.14);
    --green: #4F9D70;
    --red: #BD5650;
    --white-mot: #EDE7D6;
    --cream: #F3ECDD;
    --cream-dim: #C9C0AC;
    --muted: #8CA0B8;
    --line: rgba(220,181,94,0.16);
    --shadow: 0 18px 40px -12px rgba(0,0,0,0.55);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --border: rgba(220,181,94,0.12);
    --glass: rgba(13,27,42,0.85);
  }
  [data-theme="light"] {
    --bg: #F3EEE2;
    --bg-2: #EAE2D2;
    --card: #FFFFFF;
    --card-2: #FBF7EE;
    --card-soft: #F4EEE0;
    --gold: #B6863A;
    --gold-deep: #8F6A28;
    --gold-soft: rgba(182,134,58,0.12);
    --green: #3F7E58;
    --red: #A8463F;
    --white-mot: #FFFFFF;
    --cream: #23211B;
    --cream-dim: #5C5749;
    --muted: #7B7563;
    --line: rgba(182,134,58,0.22);
    --shadow: 0 14px 30px -10px rgba(60,50,30,0.25);
    --border: rgba(182,134,58,0.18);
    --glass: rgba(243,238,226,0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Noto Sans', sans-serif;
    overflow-x: hidden;
  }
  [data-theme="light"] body {
    background: var(--bg);
  }

  /* ============ PHONE WRAPPER (как index.html) ============ */
  .phone-wrapper {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ============ TOP HEADER ============ */
  .top-header {
    flex: 0 0 auto;
    padding: 12px 16px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--cream);
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .header-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }

  /* ============ MAIN CONTENT ============ */
  .main-content {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .main-content::-webkit-scrollbar { display: none; }

  /* ============ PROFILE HEADER ============ */
  .profile-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .avatar-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), var(--green), var(--red), var(--gold));
    padding: 3px;
    flex: 0 0 auto;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--card-2);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid var(--bg);
  }
  .avatar-inner svg { width: 36px; height: 36px; }
  .avatar-inner img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  .stats-row {
    flex: 1;
    display: flex;
    justify-content: space-around;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat b { font-size: 18px; font-weight: 800; color: var(--cream); }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat-divider { width: 1px; background: var(--line); margin: 2px 0; }

  .profile-meta h3 {
    font-family: 'Noto Serif', serif;
    font-size: 18px;
    color: var(--cream);
    margin-bottom: 6px;
  }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .meta-loc { font-size: 13px; color: var(--muted); }

  /* ============ ACTION BUTTONS ============ */
  .action-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-family: 'Noto Sans';
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(180deg, #E8C778, var(--gold-deep));
    color: #1A1206;
    box-shadow: 0 8px 20px -6px rgba(220,181,94,0.4);
  }
  .btn-outline {
    background: transparent;
    color: var(--cream);
    border: 1.4px solid var(--line);
  }
  .btn-ghost {
    background: var(--gold-soft);
    color: var(--gold);
    border: 1px solid var(--line);
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    transition: .15s;
    border: none;
    background: transparent;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--gold);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  /* ============ BOOK GRID ============ */
  .book-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .book-cover {
    position: relative;
    aspect-ratio: 3/4.2;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: 0 8px 16px -6px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 8px 6px;
    cursor: pointer;
  }
  .book-cover::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 12%;
    background: rgba(0,0,0,0.25);
  }
  .book-cover::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 12px 12px 0;
    border-color: transparent rgba(255,255,255,0.15) transparent transparent;
  }
  .book-cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .book-title {
    font-family: 'Noto Serif', serif;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    position: relative;
    z-index: 2;
  }
  .book-author {
    font-size: 8px;
    color: rgba(255,255,255,0.7);
    margin-top: 2px;
    position: relative;
    z-index: 2;
  }

  .c1 { background: linear-gradient(160deg, #3a5f4f, #1d342b); }
  .c2 { background: linear-gradient(160deg, #7a5a28, #3e2c10); }
  .c3 { background: linear-gradient(160deg, #5d2f31, #2c1314); }
  .c4 { background: linear-gradient(160deg, #2b4a63, #142535); }
  .c5 { background: linear-gradient(160deg, #6e5a2e, #3a2d10); }
  .c6 { background: linear-gradient(160deg, #3f3e63, #1d1c33); }
  .c7 { background: linear-gradient(160deg, #4d6b3c, #23331a); }
  .c8 { background: linear-gradient(160deg, #724237, #321c17); }
  .c9 { background: linear-gradient(160deg, #395a6b, #152832); }

  /* ============ ACHIEVEMENTS ============ */
  .ach-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ach-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px;
  }
  .ach-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--gold-soft);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex: 0 0 auto;
  }
  .ach-text b { font-size: 13px; color: var(--cream); display: block; }
  .ach-text span { font-size: 12px; color: var(--muted); }
  .ach-card.locked { opacity: 0.5; }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; color: var(--cream); margin-bottom: 8px; }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  /* ============ BOTTOM NAV ============ */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 12px 16px;
    background: linear-gradient(transparent, var(--bg) 30%);
    z-index: 80;
  }
  .bottom-nav-inner {
    max-width: 430px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px;
    backdrop-filter: blur(18px);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 2px;
    border-radius: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    transition: .15s;
  }
  .nav-item .ic { font-size: 20px; line-height: 1; }
  .nav-item.active {
    background: rgba(220,181,94,0.12);
    color: var(--gold);
  }

  /* ============ EDIT SHEET ============ */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%;
    max-height: 85%;
    background: var(--bg-2);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .26s cubic-bezier(.32,.72,0,1);
  }
  .sheet-overlay.open .sheet { transform: translateY(0%); }
  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
    margin: 10px auto 6px;
  }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 6px;
  }
  .sheet-head h3 { font-size: 16px; font-family: 'Noto Serif', serif; color: var(--cream); }
  .sheet-body { padding: 8px 16px 16px; overflow-y: auto; flex: 1; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    color: var(--cream);
    font-family: 'Noto Sans';
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .sheet-foot {
    padding: 10px 16px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
  }
  .sheet-foot .btn { flex: 1; }

  /* Spacer for bottom nav */
  .content-spacer { height: 80px; }
</style>
</head>
<body>
<div class="phone-wrapper">
  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="header-title">👤 Профил</div>
    <div class="header-actions">
      <div class="header-btn" id="themeBtn">🌙</div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">
    <!-- Profile content will be loaded here -->
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <div class="nav-item" onclick="location.href='index.html'">
        <div class="ic">🏠</div>
        <div>Асосӣ</div>
      </div>
      <div class="nav-item" onclick="location.href='kitobho.html'">
        <div class="ic">📚</div>
        <div>Китобҳо</div>
      </div>
      <div class="nav-item" onclick="location.href='winners.html'">
        <div class="ic">🏆</div>
        <div>Ғолибон</div>
      </div>
      <div class="nav-item" onclick="location.href='Lenta.html'">
        <div class="ic">📰</div>
        <div>Лента</div>
      </div>
      <div class="nav-item active">
        <div class="ic">👤</div>
        <div>Профил</div>
      </div>
    </div>
  </nav>
</div>

<!-- EDIT SHEET -->
<div class="sheet-overlay" id="editOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3>Таҳрири профил</h3>
      <div class="header-btn" id="closeEdit">✕</div>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>Ном</label>
        <input type="text" id="editName" placeholder="Номи шумо">
      </div>
      <div class="field">
        <label>Вилоят</label>
        <select id="editRegion">
          <option value="">Интихоб кунед...</option>
          <option value="dushanbe">Шаҳри Душанбе</option>
          <option value="sughd">Вилояти Суғд</option>
          <option value="khatlon">Вилояти Хатлон</option>
          <option value="gbao">ВМКБ</option>
          <option value="markaz">Ноҳияҳои тобеи марказ</option>
        </select>
      </div>
      <div class="field">
        <label>Шаҳр/Ноҳия</label>
        <input type="text" id="editCity" placeholder="Шаҳр ё ноҳия">
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-outline" id="cancelEdit">Бекор</button>
      <button class="btn btn-primary" id="saveEdit">Захира</button>
    </div>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>'']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] || c));
const $ = id => document.getElementById(id);

// Theme toggle
$('themeBtn')?.addEventListener('click', () => {
  const isDark = document.body.dataset.theme !== 'light';
  document.body.dataset.theme = isDark ? 'light' : 'dark';
  localStorage.setItem('kk_theme', isDark ? 'light' : 'dark');
  $('themeBtn').textContent = isDark ? '☀️' : '🌙';
});
const savedTheme = localStorage.getItem('kk_theme');
if (savedTheme === 'light') {
  document.body.dataset.theme = 'light';
  $('themeBtn').textContent = '☀️';
}

// Render profile
function renderProfile(data) {
  const colors = ['c1','c2','c3','c4','c5','c6','c7','c8','c9'];
  
  let html = `
    <div class="profile-card">
      <div class="profile-row">
        <div class="avatar-ring">
          <div class="avatar-inner">
            ${data.avatar_url 
              ? `<img src="${esc(data.avatar_url)}" alt="Аватар">` 
              : `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.4" stroke="var(--gold)" stroke-width="1.6"/><path d="M5 19c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round"/></svg>`
            }
          </div>
        </div>
        <div class="stats-row">
          <div class="stat"><b>${data.books_count || 0}</b><span>китобҳо</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><b>${data.friends_count || 0}</b><span>дӯстон</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><b>${data.marks_count || 0}</b><span>хатбаракҳо</span></div>
        </div>
      </div>
      <div class="profile-meta">
        <h3>${esc(data.display_name || data.full_name || 'Китобхон')}</h3>
        <div class="status-chip">Китобхон 📚</div>
        <div class="meta-loc">${esc([data.city, data.region].filter(Boolean).join(' · ')) || 'Тоҷикистон'}</div>
      </div>
    </div>
    
    <div class="action-row">
      <button class="btn btn-ghost" onclick="location.href='chats.html'">Чатҳо 💬</button>
      <button class="btn btn-outline" onclick="openEdit()">Таҳрир ✏️</button>
    </div>
    
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="books">📚 Китобҳо</button>
      <button class="tab-btn" data-tab="marks">🔖 Избран</button>
      <button class="tab-btn" data-tab="ach">🏆 Дастовардҳо</button>
    </div>
  `;
  
  // Books tab
  const books = data.books || [];
  html += `<div class="tab-content" data-tab="books">
    ${books.length 
      ? `<div class="book-grid">${books.map((b, i) => `
        <div class="book-cover ${colors[i % colors.length]}" onclick="openBook('${encodeURIComponent(b.url || '')}', '${encodeURIComponent(b.name || '')}')">
          ${b.cover_url ? `<img src="${esc(b.cover_url)}" alt="${esc(b.name)}">` : ''}
          <div class="book-title">${esc(b.name || 'Китоб')}</div>
          <div class="book-author">${esc(b.author || '')}</div>
        </div>
      `).join('')}</div>`
      : `<div class="empty-state"><div class="icon">📚</div><h3>Китобҳо нестанд</h3><p>Шумо ҳангоми хондан китобҳо ба ин ҷо илова карда мешаванд</p></div>`
    }
  </div>`;
  
  // Marks tab
  const marks = data.marks || [];
  html += `<div class="tab-content" data-tab="marks" style="display:none">
    ${marks.length 
      ? `<div class="book-grid">${marks.map((b, i) => `
        <div class="book-cover ${colors[i % colors.length]}">
          <div class="book-title">${esc(b.name || 'Китоб')}</div>
          <div class="book-author">${esc(b.author || '')}</div>
        </div>
      `).join('')}</div>`
      : `<div class="empty-state"><div class="icon">🔖</div><h3>Избран холӣ</h3><p>Китобҳоеро, ки ба шумо писанд аст, сақ кунед</p></div>`
    }
  </div>`;
  
  // Achievements tab
  const achievements = data.achievements || [];
  html += `<div class="tab-content" data-tab="ach" style="display:none">
    ${achievements.length 
      ? `<div class="ach-list">${achievements.map(a => `
        <div class="ach-card ${a.locked ? 'locked' : ''}">
          <div class="ach-icon">${a.icon || '🏆'}</div>
          <div class="ach-text">
            <b>${esc(a.name)}</b>
            <span>${esc(a.description || '')}</span>
          </div>
        </div>
      `).join('')}</div>`
      : `<div class="empty-state"><div class="icon">🏆</div><h3>Дастовардҳо нестанд</h3><p>Боварӣ шавед, ки аввал китобҳо мехонед</p></div>`
    }
  </div>`;
  
  html += '<div class="content-spacer"></div>';
  $('mainContent').innerHTML = html;
  
  // Tab functionality
  $('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.querySelector(`.tab-content[data-tab="${btn.dataset.tab}"]`).style.display = 'block';
  });
}

function openBook(url, name) {
  if (url) location.href = `reader.html?url=${url}&name=${name}`;
}

// Guest / not logged in
function renderGuest() {
  $('mainContent').innerHTML = `
    <div class="empty-state" style="margin-top: 60px;">
      <div class="icon">👤</div>
      <h3>Ба профил ворид шавед</h3>
      <p>Барои дидани профили худ ва китобҳои хондаатон логин ё регистрация кунед</p>
      <div class="action-row" style="margin-top: 20px;">
        <button class="btn btn-primary" onclick="location.href='login.html'">Ворид шудан</button>
        <button class="btn btn-outline" onclick="location.href='login.html?register=true'">Регистрация</button>
      </div>
    </div>
  `;
}

// Edit sheet
const overlay = $('editOverlay');
window.openEdit = () => overlay.classList.add('open');
window.closeEdit = () => overlay.classList.remove('open');
$('closeEdit').addEventListener('click', closeEdit);
$('cancelEdit').addEventListener('click', closeEdit);
$('saveEdit').addEventListener('click', async () => {
  const name = $('editName').value.trim();
  const region = $('editRegion').value;
  const city = $('editCity').value.trim();
  
  try {
    const session = await AUTH.getSession();
    if (session?.user) {
      await apiPatch('profiles', {display_name: name, region, city}, session.user.id);
    }
    closeEdit();
    loadProfile();
  } catch(e) {
    alert('Хато: ' + e.message);
  }
});
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeEdit(); });

// Load profile
async function loadProfile() {
  try {
    const session = await AUTH.getSession();
    if (!session?.user) {
      renderGuest();
      return;
    }
    
    // Get profile
    const profiles = await apiGet('profiles', {eq:{column:'id', value:session.user.id}, limit:1});
    const profile = profiles?.[0] || {};
    
    // Get reading sessions (books)
    const sessions = await apiGet('reading_sessions', {eq:{column:'user_id', value:session.user.id}, limit:50});
    const booksMap = new Map();
    sessions?.forEach(s => {
      if (s.book_name && !booksMap.has(s.book_url)) {
        booksMap.set(s.book_url, {
          name: s.book_name,
          author: s.book_author || '',
          cover_url: s.book_cover || '',
          url: s.book_url || ''
        });
      }
    });
    const books = Array.from(booksMap.values()).slice(0, 18);
    
    // Get achievements
    const achs = await apiGet('achievements', {eq:{column:'user_id', value:session.user.id}});
    const achievements = (achs || []).map(a => ({
      name: a.name || 'Дастовард',
      description: a.description || '',
      icon: a.icon || '🏆',
      locked: false
    }));
    
    renderProfile({
      ...profile,
      books_count: books.length,
      friends_count: profile.friends_count || 0,
      marks_count: 0,
      books,
      achievements
    });
    
  } catch(e) {
    console.log('Error:', e);
    renderGuest();
  }
}

// Init
loadProfile();
</script>
